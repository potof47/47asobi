// ---- 物理 -------------------------------------------------------------
function overlap(b, cx, cy, r) { return Math.hypot(b.x - cx, b.y - cy) < R + r; }

// 円との衝突と反射。重なっていたら true
function bounce(b, cx, cy, r) {
  const dx = b.x - cx, dy = b.y - cy;
  const d = Math.hypot(dx, dy);
  const min = R + r;
  if (d >= min || d === 0) return false;
  const nx = dx / d, ny = dy / d;
  b.x = cx + nx * min;
  b.y = cy + ny * min;
  const vn = b.vx * nx + b.vy * ny;
  if (vn < 0) { b.vx -= 2 * vn * nx; b.vy -= 2 * vn * ny; }
  return true;
}

function walls(b) {
  if (b.x < R)          { b.x = R;          b.vx = Math.abs(b.vx); }
  if (b.x > W - R)      { b.x = W - R;      b.vx = -Math.abs(b.vx); }
  if (b.y < TOP + R)    { b.y = TOP + R;    b.vy = Math.abs(b.vy); }
  if (b.y > FB - R)     { b.y = FB - R;     b.vy = -Math.abs(b.vy); }
}

// 停止位置が他の物体と重ならないよう押し出す
function resolveOverlap(a) {
  for (let k = 0; k < 12; k++) {
    let moved = false;
    const objs = [...enemies.filter(e => !e.dead), ...rocks, ...allies.filter(o => o !== a).map(o => ({ x: o.x, y: o.y, r: R }))];
    for (const o of objs) {
      const dx = a.x - o.x, dy = a.y - o.y, d = Math.hypot(dx, dy) || 0.01, min = R + o.r + 1;
      if (d < min) { a.x = o.x + dx / d * min; a.y = o.y + dy / d * min; moved = true; }
    }
    a.x = Math.min(W - R, Math.max(R, a.x));
    a.y = Math.min(FB - R, Math.max(TOP + R, a.y));
    if (!moved) break;
  }
}

function segDist(px, py, x1, y1, x2, y2) {
  const vx = x2 - x1, vy = y2 - y1;
  const t = Math.max(0, Math.min(1, ((px - x1) * vx + (py - y1) * vy) / (vx * vx + vy * vy)));
  return Math.hypot(px - (x1 + vx * t), py - (y1 + vy * t));
}

function weakPos(e) {
  return { x: e.x + Math.cos(e.weak) * e.r * 0.62, y: e.y + Math.sin(e.weak) * e.r * 0.62, r: e.r * 0.34 };
}

// ---- ダメージ ---------------------------------------------------------
function damageEnemy(e, base, el, weak) {
  if (e.dead) return;
  const m = elemMult(el, e.el) * (weak ? 3 : 1);
  const dmg = Math.round(base * m * rand(0.92, 1.08));
  e.hp -= dmg;
  e.flash = 6;
  hitCount++;
  addStat("hits");
  if (weak) addStat("weak");
  const col = m >= 2 ? "#ffe066" : m < 1 ? "#9aa3b8" : "#ffffff";
  addText(e.x + rand(-12, 12), e.y - e.r * 0.3 + rand(-6, 6), dmg.toLocaleString(), col, weak ? 19 : 15);
  if (weak) addText(e.x, e.y - e.r - 16, "弱点!", "#ffef5c", 14);
  burst(e.x, e.y, EL[el].l, weak ? 10 : 5);
  if (e.boss) shake = Math.max(shake, weak ? 5 : 2);
  if (e.hp <= 0) {
    e.hp = 0;
    e.dead = true;
    burst(e.x, e.y, EL[e.el].c, e.boss ? 60 : 24, e.boss ? 6 : 4);
    addText(e.x, e.y, e.boss ? "撃破!!" : "撃破!", "#ffd35c", e.boss ? 24 : 17);
    shake = Math.max(shake, e.boss ? 12 : 4);
    addStat("kills");
  }
}

function damageParty(dmg, x, y) {
  hp = Math.max(0, hp - dmg);
  addText(x, y - 26, "-" + dmg.toLocaleString(), "#ff6b6b", 16);
  shake = Math.max(shake, 6);
  if (hp <= 0) {
    events = [];
    schedule(40, () => { state = "over"; lastResult = null; });
  }
}

function healParty(v, x, y) {
  hp = Math.min(maxHp, hp + v);
  addText(x, y - 26, "+" + v.toLocaleString(), "#7dffa0", 15);
}

function addBolt(x, y, vx, vy, base, el, size = 4) {
  bolts.push({ x, y, vx, vy, target: null, base, el, color: EL[el].l, size, life: 140 });
}

// ---- 友情コンボ ---------------------------------------------------------
function triggerCombo(a) {
  a.glow = 20;
  const col = EL[a.el].l;
  addText(a.x, a.y - 30, a.comboName, col, 13);
  switch (a.combo) {
    case "blast": {
      const rad = 95;
      fx.push({ kind: "ring", x: a.x, y: a.y, r0: 10, r1: rad, life: 22, max: 22, color: EL[a.el].c, w: 8 });
      for (const e of alive()) if (Math.hypot(e.x - a.x, e.y - a.y) < rad + e.r) damageEnemy(e, a.atk * 1.7, a.el, false);
      break;
    }
    case "laser": {
      fx.push({ kind: "line", x1: 0, y1: a.y, x2: W, y2: a.y, w: 10, life: 18, max: 18, color: col });
      fx.push({ kind: "line", x1: a.x, y1: TOP, x2: a.x, y2: FB, w: 10, life: 18, max: 18, color: col });
      for (const e of alive()) {
        if (Math.abs(e.y - a.y) < e.r + 8 || Math.abs(e.x - a.x) < e.r + 8) damageEnemy(e, a.atk * 1.5, a.el, false);
      }
      break;
    }
    case "homing": {
      for (let i = 0; i < 8; i++) {
        const ang = (i / 8) * Math.PI * 2;
        addBolt(a.x, a.y, Math.cos(ang) * 5, Math.sin(ang) * 5, a.atk * 0.45, a.el);
      }
      break;
    }
    case "thunder": {
      // 近い敵へ順に連鎖する雷（最大4体）
      let from = { x: a.x, y: a.y };
      const hit = new Set();
      for (let k = 0; k < 4; k++) {
        const next = alive().filter(e => !hit.has(e))
          .sort((p, q) => Math.hypot(p.x - from.x, p.y - from.y) - Math.hypot(q.x - from.x, q.y - from.y))[0];
        if (!next) break;
        hit.add(next);
        fx.push({ kind: "bolt", x1: from.x, y1: from.y, x2: next.x, y2: next.y, life: 18, max: 18, color: col });
        damageEnemy(next, a.atk * 1.1, a.el, false);
        from = next;
      }
      break;
    }
    case "smilestar": {
      // 虹色の星12発（追尾）＋回復
      fx.push({ kind: "ring", x: a.x, y: a.y, r0: 8, r1: 80, life: 24, max: 24, color: "#ffe066", w: 6 });
      for (let i = 0; i < 12; i++) {
        const ang = (i / 12) * Math.PI * 2;
        addBolt(a.x, a.y, Math.cos(ang) * 6, Math.sin(ang) * 6, a.atk * 0.6, a.el, 6);
        bolts[bolts.length - 1].star = true;
      }
      healParty(Math.round(a.hp * 0.08), a.x, a.y);
      break;
    }
    case "heal": {
      fx.push({ kind: "ring", x: a.x, y: a.y, r0: 8, r1: 60, life: 24, max: 24, color: "#9dffb0", w: 5 });
      healParty(Math.round(a.hp * 0.15), a.x, a.y);
      break;
    }
  }
}

// ---- ストライクショット -----------------------------------------------------
function judgeLaser(a, dx, dy) {
  let t = Infinity;
  if (dx > 0) t = Math.min(t, (W - a.x) / dx);
  if (dx < 0) t = Math.min(t, -a.x / dx);
  if (dy > 0) t = Math.min(t, (FB - a.y) / dy);
  if (dy < 0) t = Math.min(t, (TOP - a.y) / dy);
  const x2 = a.x + dx * t, y2 = a.y + dy * t;
  fx.push({ kind: "line", x1: a.x, y1: a.y, x2, y2, w: 30, life: 34, max: 34, color: EL[a.el].l });
  for (const e of alive()) {
    if (segDist(e.x, e.y, a.x, a.y, x2, y2) < e.r + 14) damageEnemy(e, a.atk * 8, a.el, false);
  }
  shake = Math.max(shake, 8);
}

// ---- ターン進行 ---------------------------------------------------------
function fire(dx, dy) {
  const a = allies[cur];
  let sp = a.spd;
  shot = { ally: a, cool: new Map(), touched: new Set(), atkMul: 1, stopped: false, needle: 0, needleT: 0, trail: [] };
  hitCount = 0;
  if (ssArmed) {
    ssArmed = false;
    a.ssLeft = a.ssTurns;
    addStat("ss");
    showBanner(a.ssName, "ストライクショット!", EL[a.el].c);
    burst(a.x, a.y, EL[a.el].l, 30, 5);
    switch (a.ss) {
      case "burst":  shot.atkMul = 3; sp *= 1.3; break;
      case "wave":   fx.push({ kind: "wave", y: FB, life: 45, max: 45, hit: new Set(), base: a.atk * 3.5, el: a.el }); break;
      case "needle": shot.needle = 30; break;
      case "judge":  judgeLaser(a, dx, dy); break;
      case "meteor":
        for (let i = 0; i < 8; i++) addBolt(rand(30, W - 30), TOP - 20 - i * 25, 0, 6, a.atk * 2.2, a.el, 9);
        break;
      case "smileburst":
        // フィールド全体に笑顔の光 → 全体ダメージ・攻撃遅延・回復・自己強化
        fx.push({ kind: "smile", life: 60, max: 60 });
        for (const e of alive()) {
          damageEnemy(e, a.atk * 6, a.el, false);
          if (!e.dead) { e.cd++; addText(e.x, e.y + e.r + 10, "攻撃+1T", "#9ad5ff", 12); }
        }
        healParty(Math.round(maxHp * 0.3), W / 2, FB - 20);
        shot.atkMul = 3;
        sp *= 1.3;
        shake = Math.max(shake, 10);
        break;
    }
  }
  a.vx = dx * sp;
  a.vy = dy * sp;
  state = "shoot";
}

function updateShot() {
  const s = shot, a = s.ally;
  if (!s.stopped) {
    for (let k = 0; k < SUB; k++) {
      a.x += a.vx / SUB;
      a.y += a.vy / SUB;
      walls(a);
      for (const o of rocks) bounce(a, o.x, o.y, o.r);
      for (const e of enemies) {
        if (e.dead) continue;
        const hit = a.type === "reflect" ? bounce(a, e.x, e.y, e.r) : overlap(a, e.x, e.y, e.r);
        if (hit && !s.cool.has(e.id)) {
          s.cool.set(e.id, a.type === "reflect" ? 6 : 10);
          let weak = false;
          if (e.weak !== null) { const w = weakPos(e); weak = Math.hypot(a.x - w.x, a.y - w.y) < R + w.r; }
          damageEnemy(e, a.atk * s.atkMul, a.el, weak);
        }
      }
      for (const o of allies) {
        if (o !== a && !s.touched.has(o) && overlap(a, o.x, o.y, R)) { s.touched.add(o); triggerCombo(o); }
      }
      for (const h of hearts) {
        if (!h.taken && overlap(a, h.x, h.y, h.r)) {
          h.taken = true;
          healParty(Math.round(maxHp * 0.15), h.x, h.y);
          burst(h.x, h.y, "#ff8fb1", 16);
        }
      }
    }
    hearts = hearts.filter(h => !h.taken);
    for (const [k, v] of s.cool) { if (v <= 1) s.cool.delete(k); else s.cool.set(k, v - 1); }
    a.vx *= FRICTION;
    a.vy *= FRICTION;
    s.trail.push({ x: a.x, y: a.y });
    if (s.trail.length > 12) s.trail.shift();

    if (s.needle > 0 && --s.needleT <= 0 && alive().length) {
      s.needle--;
      s.needleT = 4;
      const ang = Math.random() * Math.PI * 2;
      addBolt(a.x, a.y, Math.cos(ang) * 6, Math.sin(ang) * 6, a.atk * 0.8, a.el);
    }

    if (Math.hypot(a.vx, a.vy) < STOP) {
      s.stopped = true;
      a.vx = a.vy = 0;
      s.trail = [];
      resolveOverlap(a);
    }
  }
  if (s.stopped && !bolts.length && !fx.some(f => f.kind === "wave")) endShot();
}

function endShot() {
  shot = null;
  if (!alive().length) { waveClear(); return; }
  enemyPhase();
}

function enemyPhase() {
  state = "enemy";
  let delay = 12;
  for (const e of alive()) {
    if (--e.cd > 0) continue;
    e.cd = e.maxCd;
    schedule(delay, () => enemyAttack(e));
    delay += 26;
  }
  schedule(delay + 6, startTurn);
}

function enemyAttack(e) {
  if (e.dead || hp <= 0) return;
  e.flash = 10;
  if (e.atkType === "all") {
    fx.push({ kind: "ring", x: e.x, y: e.y, r0: e.r, r1: 560, life: 30, max: 30, color: "#ff4d6d", w: 12 });
    for (const a of allies) a.hurt = 16;
    addText(e.x, e.y + e.r + 12, "全体攻撃", "#ff8b9b", 14);
    damageParty(e.atk, W / 2, FB - 10);
  } else {
    const t = pick(allies);
    fx.push({ kind: "line", x1: e.x, y1: e.y, x2: t.x, y2: t.y, w: 5, life: 16, max: 16, color: "#ff5b6b" });
    t.hurt = 16;
    burst(t.x, t.y, "#ff5b6b", 10);
    damageParty(e.atk, t.x, t.y);
  }
}

function startTurn() {
  if (hp <= 0) return;
  turn++;
  cur = (cur + 1) % allies.length;
  for (const a of allies) a.ssLeft = Math.max(0, a.ssLeft - 1);
  ssArmed = false;
  for (const e of alive()) if (e.roam && e.weak !== null) e.weak = Math.random() * Math.PI * 2;
  if (hearts.length === 0 && Math.random() < 0.3) spawnHeart();
  state = "aim";
}

function spawnHeart() {
  for (let k = 0; k < 30; k++) {
    const h = { x: rand(40, W - 40), y: rand(TOP + 60, FB - 60), r: 11, taken: false };
    const blocked = [...alive(), ...rocks].some(o => Math.hypot(o.x - h.x, o.y - h.y) < o.r + 24)
      || allies.some(a => Math.hypot(a.x - h.x, a.y - h.y) < R + 24);
    if (!blocked) { hearts.push(h); return; }
  }
}

function waveClear() {
  state = "wave";
  const last = waveIdx === quest.waves.length - 1;
  showBanner(last ? "QUEST CLEAR!" : "WAVE CLEAR", "", "#7dffa0");
  schedule(last ? 80 : 60, () => {
    if (last) { finishQuest(); return; }
    waveIdx++;
    loadWave();
    startTurn();
  });
}

// クリア報酬
function finishQuest() {
  const q = quest, first = !save.cleared[questIdx];
  const best = save.best[questIdx];
  const isBest = best === undefined || turn < best;
  if (isBest) save.best[questIdx] = turn;
  const rank = turn <= q.par ? "S" : turn <= q.par * 1.4 ? "A" : "B";
  const coin = Math.round(q.coin * (rank === "S" ? 1.5 : rank === "A" ? 1.2 : 1));
  const crEl = q.crEl || pick(EL_KEYS);
  const crN = q.crN + Math.floor(Math.random() * 3);
  const gem = first ? q.gem : 0;
  let drop = null;
  if (questIdx === QUESTS.length - 1 && first) {
    drop = acquire(LIMITED);                  // 最難関の初回クリアで★6限定キャラ
  } else if (Math.random() < 0.35) {
    const pool = FAM.filter(f => f.rar === 3 && f.el === crEl);
    drop = acquire(pick(pool.length ? pool : FAM.filter(f => f.rar === 3)).idx);
  }
  save.coins += coin;
  save.gems += gem;
  save.cr[crEl] += crN;
  save.cleared[questIdx] = true;
  if (q.kind === "tower") save.towerMax = Math.max(save.towerMax || 0, q.floor);
  addStat("clears");
  if (rank === "S") addStat("srank");
  const up = addExp(q.exp || 30);
  if (up.ranks) showToast(`ランクアップ! ランク${save.rank}  ジェム+${up.gems}`);
  persist();
  lastResult = { turn, rank, best: isBest ? turn : best, isBest, coin, gem, crEl, crN, drop, netRank: undefined,
    exp: q.exp || 30, kind: q.kind };
  if (q.kind !== "special") { state = "clear"; return; }
  // ランキングに記録（スペシャルクエストのみ）
  const leader = displayName(save.party[0]);
  addLocalRecord(questIdx, turn, leader);
  persist();
  if (onlineRanking()) {
    const res = lastResult, q = questIdx, t = turn;
    (save.name ? Promise.resolve() : askName())
      .then(() => submitScore(q, t, leader))
      .then(r => { res.netRank = r; });
  }
  state = "clear";
}

// ---- 育成 -------------------------------------------------------------
function levelUp(fi, toMax) {
  const u = save.box[fi], cap = MAXLV[u.rar];
  if (u.lv >= cap) { showToast("レベルが上限です。進化させよう!"); return; }
  let n = 0;
  while (u.lv < cap && save.coins >= lvCost(u.lv)) {
    save.coins -= lvCost(u.lv);
    u.lv++;
    n++;
    if (!toMax) break;
  }
  if (!n) { showToast("コインが足りません"); return; }
  addStat("lvups", n);
  burst(180, 170, "#ffe066", 20, 4);
  addText(180, 120, `Lv UP! → ${u.lv}`, "#ffe066", 20);
  persist();
}
function maxCost(fi) {
  const u = save.box[fi], cap = MAXLV[u.rar];
  let c = 0;
  for (let lv = u.lv; lv < cap; lv++) c += lvCost(lv);
  return c;
}
function evolve(fi) {
  const u = save.box[fi], f = FAM[fi];
  if (u.rar >= 6) return;
  if (u.lv < MAXLV[u.rar]) { showToast(`Lv${MAXLV[u.rar]}にすると進化できます`); return; }
  if (save.cr[f.el] < EVO_CR[u.rar]) { showToast(`${EL[f.el].n}の結晶が足りません`); return; }
  if (save.coins < EVO_COIN[u.rar]) { showToast("コインが足りません"); return; }
  save.cr[f.el] -= EVO_CR[u.rar];
  save.coins -= EVO_COIN[u.rar];
  u.rar++;
  addStat("evos");
  persist();
  burst(180, 170, EL[f.el].l, 70, 6);
  burst(180, 170, "#ffffff", 30, 4);
  showBanner("進化成功!", `${displayName(fi)}  ★${u.rar}`, RCOL[u.rar]);
}

// ---- ガチャ -----------------------------------------------------------
function rollOne(guarantee4) {
  const r = Math.random();
  if (r < RATE6) return LIMITED;
  let rar = r < RATE6 + RATE5 ? 5 : r < RATE6 + RATE5 + RATE4 ? 4 : 3;
  if (guarantee4 && rar === 3) rar = 4;
  return pick(FAM.filter(f => f.rar === rar)).idx;
}
function pullGacha(n) {
  const cost = n === 10 ? GACHA_10 : GACHA_1;
  if (save.gems < cost) { showToast("ジェムが足りません"); return; }
  save.gems -= cost;
  const res = [];
  for (let i = 0; i < n; i++) {
    const guarantee = n === 10 && i === 9 && !res.some(r => FAM[r.fi].rar >= 4);
    res.push(acquire(rollOne(guarantee)));
  }
  addStat("pulls", n);
  persist();
  gacha = { res, i: 0, t: 0, opened: false };
  go("gachaAnim");
}
function gachaTap() {
  if (!gacha.opened) {
    if (gacha.t < 30) return;
    gacha.opened = true;
    gacha.t = 0;
    const f = FAM[gacha.res[gacha.i].fi];
    burst(W / 2, 300, RCOL[f.rar], f.rar >= 5 ? 80 : 40, 6);
    return;
  }
  if (gacha.t < 15) return;
  gacha.i++;
  gacha.opened = false;
  gacha.t = 0;
  if (gacha.i >= gacha.res.length) go("gachaResult");
}

// ---- 更新ループ -------------------------------------------------------
function updateBolts() {
  for (const b of bolts) {
    if (!b.target || b.target.dead) {
      const list = alive();
      b.target = list.length ? pick(list) : null;
    }
    b.life--;
    if (!b.target) { b.life = 0; continue; }
    const dx = b.target.x - b.x, dy = b.target.y - b.y, d = Math.hypot(dx, dy) || 1;
    b.vx += (dx / d * 11 - b.vx) * 0.16;
    b.vy += (dy / d * 11 - b.vy) * 0.16;
    b.x += b.vx;
    b.y += b.vy;
    if (d < b.target.r) {
      damageEnemy(b.target, b.base, b.el, false);
      if (b.size > 6) burst(b.x, b.y, b.color, 14, 4);
      b.life = 0;
    }
  }
  bolts = bolts.filter(b => b.life > 0);
}

function updateFx() {
  for (const f of fx) {
    f.life--;
    if (f.kind === "wave") {
      f.y = FB - (FB - TOP + 40) * (1 - f.life / f.max);
      for (const e of alive()) {
        if (!f.hit.has(e.id) && e.y + e.r > f.y) { f.hit.add(e.id); damageEnemy(e, f.base, f.el, false); }
      }
    }
  }
  fx = fx.filter(f => f.life > 0);
}

function update() {
  frameNo++;
  for (const t of texts) { t.y -= 0.55; t.life--; }
  texts = texts.filter(t => t.life > 0);
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vx *= 0.94; p.vy *= 0.94; p.life--; }
  particles = particles.filter(p => p.life > 0);
  if (banner && --banner.life <= 0) banner = null;
  if (toast && --toast.life <= 0) toast = null;
  if (shake > 0) shake *= 0.85;
  if (shake < 0.3) shake = 0;
  if (gacha) gacha.t++;

  if (!BATTLE.has(state) || state === "clear" || state === "over") return;

  for (const a of allies) { if (a.hurt > 0) a.hurt--; if (a.glow > 0) a.glow--; }
  for (const e of enemies) if (e.flash > 0) e.flash--;
  updateBolts();
  updateFx();
  if (state === "shoot") updateShot();
  enemies = enemies.filter(e => !e.dead);

  const due = events.filter(ev => --ev.t <= 0);
  events = events.filter(ev => ev.t > 0);
  for (const ev of due) ev.fn();
}

// ---- 入力 -------------------------------------------------------------
function toLogical(ev) {
  const r = canvas.getBoundingClientRect();
  return { x: (ev.clientX - r.left) / r.width * W, y: (ev.clientY - r.top) / r.height * H };
}

function computeAim(from, to) {
  const vx = from.x - to.x, vy = from.y - to.y, len = Math.hypot(vx, vy);
  if (len < MIN_DRAG) return null;
  return { dx: vx / len, dy: vy / len };
}

canvas.addEventListener("pointerdown", ev => {
  ev.preventDefault();
  const p = toLogical(ev);
  for (let i = ui.length - 1; i >= 0; i--) {
    const b = ui[i];
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { b.onTap(); return; }
  }
  if (state !== "aim") return;
  dragging = true;
  dragStart = dragNow = p;
  canvas.setPointerCapture(ev.pointerId);
});

canvas.addEventListener("pointermove", ev => {
  if (dragging) dragNow = toLogical(ev);
});

canvas.addEventListener("pointerup", ev => {
  if (!dragging) return;
  dragging = false;
  const a = computeAim(dragStart, toLogical(ev));
  if (a && state === "aim") fire(a.dx, a.dy);
});
canvas.addEventListener("pointercancel", () => { dragging = false; });

// ---- 描画: 部品 ---------------------------------------------------------
function button(x, y, w, h, label, onTap, opt = {}) {
  ui.push({ x, y, w, h, onTap });
  if (opt.hidden) return;
  ctx.save();
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, opt.disabled ? "#59607a" : opt.c1 || "#ffcf4a");
  g.addColorStop(1, opt.disabled ? "#3a3f55" : opt.c2 || "#ff8f1f");
  ctx.fillStyle = g;
  roundRect(x, y, w, h, 10);
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.6)";
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = opt.disabled ? "#c4c8d8" : opt.fg || "#3a1c00";
  ctx.font = `bold ${opt.size || 16}px system-ui, sans-serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  if (opt.sub) {
    ctx.fillText(label, x + w / 2, y + h / 2 - 7);
    ctx.font = `bold 11px system-ui, sans-serif`;
    ctx.fillText(opt.sub, x + w / 2, y + h / 2 + 11);
  } else {
    ctx.fillText(label, x + w / 2, y + h / 2 + 1);
  }
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function outlinedText(text, x, y, color, size, stroke = "#000") {
  ctx.font = `900 ${size}px system-ui, sans-serif`;
  ctx.lineWidth = Math.max(3, size / 6);
  ctx.strokeStyle = stroke;
  ctx.strokeText(text, x, y);
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}

function txt(text, x, y, size, color, align = "left", weight = "bold") {
  ctx.font = `${weight} ${size}px system-ui, sans-serif`;
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = "middle";
  ctx.fillText(text, x, y);
}

function starPath(x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
    ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.closePath();
}

function drawStars(n, x, y, s) {
  const w = s * 1.9, sx = x - (n - 1) * w / 2;
  ctx.save();
  for (let i = 0; i < n; i++) {
    starPath(sx + i * w, y, s);
    ctx.fillStyle = n >= 6 ? `hsl(${(frameNo * 3 + i * 50) % 360},90%,70%)` : "#ffd23f";
    ctx.fill();
    ctx.strokeStyle = "#5a3a00";
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  ctx.restore();
}

function rarityStroke(rar, x, y, w, h) {
  if (rar < 6) return RCOL[rar];
  const g = ctx.createLinearGradient(x, y, x + w, y + h);
  for (let i = 0; i <= 5; i++) g.addColorStop(i / 5, `hsl(${(frameNo * 2 + i * 60) % 360},90%,65%)`);
  return g;
}

function gemIcon(x, y, s) {
  ctx.save();
  ctx.fillStyle = "#5ef0ff";
  ctx.beginPath();
  ctx.moveTo(x, y - s); ctx.lineTo(x + s * 0.8, y - s * 0.2); ctx.lineTo(x, y + s);
  ctx.lineTo(x - s * 0.8, y - s * 0.2); ctx.closePath();
  ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.6)";
  ctx.beginPath();
  ctx.moveTo(x, y - s); ctx.lineTo(x + s * 0.3, y - s * 0.2); ctx.lineTo(x - s * 0.3, y - s * 0.2); ctx.closePath();
  ctx.fill();
  ctx.restore();
}
function coinIcon(x, y, s) {
  ctx.save();
  ctx.fillStyle = "#ffcf3f";
  ctx.beginPath(); ctx.arc(x, y, s, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#a87400";
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(x, y, s * 0.65, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}
function crystalIcon(el, x, y, s) {
  ctx.save();
  ctx.fillStyle = EL[el].c;
  ctx.strokeStyle = EL[el].l;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x, y - s); ctx.lineTo(x + s * 0.55, y - s * 0.3); ctx.lineTo(x + s * 0.4, y + s);
  ctx.lineTo(x - s * 0.4, y + s); ctx.lineTo(x - s * 0.55, y - s * 0.3); ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

// キャラ（すべてコードで描くオリジナルデザイン）
// k: { shape, el, acc, eye, rar, evo }
function drawChar(k, x, y, r) {
  if (k.shape && k.shape !== "blob") { drawCreature(k, x, y, r); return; }
  const c = EL[k.el];
  ctx.save();
  drawAura(k, x, y, r);
  drawAngelWings(k, x, y, r);
  // 頭の飾り（後ろ側）
  switch (k.acc) {
    case "flame":
      for (const [ox, h, col] of [[-0.42, 0.75, "#ff7a2e"], [0, 1.05, "#ff7a2e"], [0.42, 0.75, "#ff7a2e"], [0, 0.7, "#ffd34a"]]) {
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.moveTo(x + (ox - 0.3) * r, y - r * 0.55);
        ctx.quadraticCurveTo(x + (ox - 0.1) * r, y - r * (0.6 + h * 0.6), x + ox * r, y - r * (0.55 + h));
        ctx.quadraticCurveTo(x + (ox + 0.1) * r, y - r * (0.6 + h * 0.6), x + (ox + 0.3) * r, y - r * 0.55);
        ctx.fill();
      }
      break;
    case "fin":
      ctx.fillStyle = c.d;
      ctx.beginPath();
      ctx.moveTo(x - r * 0.45, y - r * 0.75);
      ctx.quadraticCurveTo(x + r * 0.05, y - r * 1.75, x + r * 0.55, y - r * 0.7);
      ctx.fill();
      break;
    case "leaf":
      ctx.strokeStyle = "#2d7a3c";
      ctx.lineWidth = r * 0.12;
      ctx.beginPath(); ctx.moveTo(x, y - r * 0.9); ctx.lineTo(x, y - r * 1.25); ctx.stroke();
      ctx.fillStyle = "#5fd36e";
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.ellipse(x + s * r * 0.3, y - r * 1.25, r * 0.36, r * 0.16, s * -0.5, 0, Math.PI * 2);
        ctx.fill();
      }
      break;
    case "horns":
      ctx.fillStyle = "#f3e9d2";
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(x + s * r * 0.3, y - r * 0.8);
        ctx.quadraticCurveTo(x + s * r * 0.9, y - r * 1.1, x + s * r * 0.85, y - r * 1.55);
        ctx.quadraticCurveTo(x + s * r * 0.75, y - r * 1.0, x + s * r * 0.65, y - r * 0.6);
        ctx.fill();
      }
      break;
    case "ears":
      for (const s of [-1, 1]) {
        ctx.fillStyle = c.c;
        ctx.beginPath();
        ctx.moveTo(x + s * r * 0.2, y - r * 0.85);
        ctx.lineTo(x + s * r * 0.75, y - r * 1.35);
        ctx.lineTo(x + s * r * 0.85, y - r * 0.45);
        ctx.fill();
        ctx.fillStyle = "#ffb3c8";
        ctx.beginPath();
        ctx.moveTo(x + s * r * 0.35, y - r * 0.8);
        ctx.lineTo(x + s * r * 0.7, y - r * 1.15);
        ctx.lineTo(x + s * r * 0.75, y - r * 0.6);
        ctx.fill();
      }
      break;
    case "bunny":
      for (const s of [-1, 1]) {
        ctx.fillStyle = c.c;
        ctx.beginPath(); ctx.ellipse(x + s * r * 0.35, y - r * 1.3, r * 0.2, r * 0.6, s * 0.2, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#ffd0dc";
        ctx.beginPath(); ctx.ellipse(x + s * r * 0.35, y - r * 1.28, r * 0.09, r * 0.42, s * 0.2, 0, Math.PI * 2); ctx.fill();
      }
      break;
    case "antenna":
      ctx.strokeStyle = c.d;
      ctx.lineWidth = Math.max(1.5, r * 0.08);
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(x + s * r * 0.25, y - r * 0.9);
        ctx.quadraticCurveTo(x + s * r * 0.3, y - r * 1.4, x + s * r * 0.6, y - r * 1.5);
        ctx.stroke();
        ctx.fillStyle = c.l;
        ctx.beginPath(); ctx.arc(x + s * r * 0.6, y - r * 1.5, r * 0.15, 0, Math.PI * 2); ctx.fill();
      }
      break;
    case "spikes":
      ctx.fillStyle = c.d;
      for (let i = -2; i <= 2; i++) {
        const a = -Math.PI / 2 + i * 0.42;
        ctx.beginPath();
        ctx.moveTo(x + Math.cos(a - 0.17) * r * 0.9, y + Math.sin(a - 0.17) * r * 0.9);
        ctx.lineTo(x + Math.cos(a) * r * 1.45, y + Math.sin(a) * r * 1.45);
        ctx.lineTo(x + Math.cos(a + 0.17) * r * 0.9, y + Math.sin(a + 0.17) * r * 0.9);
        ctx.fill();
      }
      break;
  }
  // 体（bowlcut は肌色の顔）
  const skin = k.acc === "bowlcut";
  const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
  g.addColorStop(0, skin ? "#fff1e6" : c.l);
  g.addColorStop(1, skin ? "#f2c2a0" : c.c);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.35)";
  ctx.lineWidth = Math.max(1, r * 0.1);
  ctx.stroke();
  // 進化済み: 額の宝石
  if (k.evo) {
    ctx.fillStyle = RCOL[k.rar] === undefined ? "#fff" : (k.rar >= 6 ? `hsl(${(frameNo * 3) % 360},90%,65%)` : RCOL[k.rar]);
    ctx.beginPath();
    ctx.moveTo(x, y - r * 0.72); ctx.lineTo(x + r * 0.12, y - r * 0.56);
    ctx.lineTo(x, y - r * 0.4); ctx.lineTo(x - r * 0.12, y - r * 0.56); ctx.closePath();
    ctx.fill();
  }
  drawFace(k, x, y, r, c.c);
  // 頭の飾り（前側）
  drawFrontAcc(k, x, y, r);
  if (k.rar >= 6 && k.acc !== "hat") drawCrown(x - r * 0.55, y - r * 0.95, r, -0.4);
  ctx.restore();
}

// 目と口（lid: 眠そうな目のまぶたの色、noMouth: くちばし等で口を描かない）
function drawFace(k, x, y, r, lid, noMouth = false) {
  const pupil = "#1b1b2a";
  if (k.eye === "smile") {
    // にっこり目と大きな笑顔
    ctx.strokeStyle = pupil;
    ctx.lineWidth = Math.max(1.4, r * 0.08);
    ctx.lineCap = "round";
    for (const s of [-1, 1]) {
      ctx.beginPath(); ctx.arc(x + s * r * 0.36, y + r * 0.04, r * 0.12, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
      ctx.fillStyle = "rgba(255,120,130,0.4)";
      ctx.beginPath(); ctx.ellipse(x + s * r * 0.62, y + r * 0.3, r * 0.14, r * 0.09, 0, 0, Math.PI * 2); ctx.fill();
    }
    if (!noMouth) {
      ctx.fillStyle = "#8a2a2a";
      ctx.beginPath(); ctx.arc(x, y + r * 0.3, r * 0.3, 0, Math.PI); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.fillRect(x - r * 0.24, y + r * 0.3, r * 0.48, r * 0.09);
    }
  } else if (k.eye === "mono") {
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.ellipse(x, y - r * 0.05, r * 0.32, r * 0.3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = pupil;
    ctx.beginPath(); ctx.arc(x, y, r * 0.17, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(x - r * 0.06, y - r * 0.07, r * 0.06, 0, Math.PI * 2); ctx.fill();
  } else {
    for (const s of [-1, 1]) {
      const ex = x + s * r * 0.33, ey = y - r * 0.05;
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.ellipse(ex, ey, r * 0.2, r * 0.25, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = pupil;
      ctx.beginPath(); ctx.arc(ex, ey + r * 0.05, r * 0.12, 0, Math.PI * 2); ctx.fill();
      if (k.eye === "sparkle") {
        ctx.fillStyle = "#fff";
        starPath(ex - r * 0.04, ey, r * 0.08);
        ctx.fill();
      } else {
        ctx.fillStyle = "#fff";
        ctx.beginPath(); ctx.arc(ex - r * 0.04, ey, r * 0.045, 0, Math.PI * 2); ctx.fill();
      }
      if (k.eye === "sleepy") {
        // まぶた
        ctx.fillStyle = lid;
        ctx.beginPath(); ctx.ellipse(ex, ey - r * 0.08, r * 0.23, r * 0.17, 0, Math.PI, Math.PI * 2); ctx.fill();
        ctx.fillRect(ex - r * 0.23, ey - r * 0.1, r * 0.46, r * 0.04);
      }
      if (k.eye === "sharp") {
        ctx.strokeStyle = pupil;
        ctx.lineWidth = Math.max(1.2, r * 0.08);
        ctx.beginPath();
        ctx.moveTo(x + s * r * 0.13, y - r * 0.2);
        ctx.lineTo(x + s * r * 0.55, y - r * 0.33);
        ctx.stroke();
      }
      ctx.fillStyle = "rgba(255,120,150,0.45)";
      ctx.beginPath(); ctx.ellipse(x + s * r * 0.6, y + r * 0.28, r * 0.13, r * 0.08, 0, 0, Math.PI * 2); ctx.fill();
    }
  }
  if (k.eye !== "smile" && !noMouth) {
    ctx.strokeStyle = pupil;
    ctx.lineWidth = Math.max(1.2, r * 0.08);
    ctx.beginPath(); ctx.arc(x, y + r * 0.3, r * 0.16, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  }
}

// 頭の飾り（前側）
function drawFrontAcc(k, x, y, r) {
  const c = EL[k.el];
  switch (k.acc) {
    case "bowlcut": {
      // マッシュルームカット
      ctx.fillStyle = "#2b211c";
      ctx.beginPath();
      ctx.moveTo(x - r * 1.06, y + r * 0.1);
      ctx.lineTo(x - r * 1.06, y - r * 0.3);
      ctx.ellipse(x, y - r * 0.3, r * 1.06, r * 0.9, 0, Math.PI, 0);
      ctx.lineTo(x + r * 1.06, y + r * 0.1);
      ctx.lineTo(x + r * 0.82, y - r * 0.18);
      for (let i = 0; i <= 8; i++) {
        ctx.lineTo(x + r * 0.82 - i * (r * 1.64 / 8), y - r * 0.3 + (i % 2 ? r * 0.07 : 0));
      }
      ctx.lineTo(x - r * 0.82, y - r * 0.18);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.18)";
      ctx.beginPath(); ctx.ellipse(x - r * 0.3, y - r * 0.85, r * 0.35, r * 0.12, -0.3, 0, Math.PI * 2); ctx.fill();
      // 丸メガネ
      ctx.strokeStyle = "#5a4636";
      ctx.lineWidth = Math.max(1.2, r * 0.07);
      for (const s of [-1, 1]) {
        ctx.beginPath(); ctx.arc(x + s * r * 0.36, y, r * 0.25, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.beginPath(); ctx.moveTo(x - r * 0.11, y - r * 0.02); ctx.lineTo(x + r * 0.11, y - r * 0.02); ctx.stroke();
      break;
    }
    case "halo":
      ctx.strokeStyle = "#ffe66b";
      ctx.lineWidth = r * 0.13;
      ctx.beginPath(); ctx.ellipse(x, y - r * 1.15, r * 0.5, r * 0.16, 0, 0, Math.PI * 2); ctx.stroke();
      break;
    case "star":
      starPath(x + r * 0.15, y - r * 1.05, r * 0.42);
      ctx.fillStyle = "#ffe066";
      ctx.fill();
      ctx.strokeStyle = "#a87400";
      ctx.lineWidth = Math.max(1, r * 0.06);
      ctx.stroke();
      break;
    case "bow":
      ctx.fillStyle = "#ff6fa8";
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(x + r * 0.5, y - r * 0.85);
        ctx.lineTo(x + r * 0.5 + s * r * 0.45, y - r * 0.85 - r * 0.28);
        ctx.lineTo(x + r * 0.5 + s * r * 0.45, y - r * 0.85 + r * 0.28);
        ctx.fill();
      }
      ctx.fillStyle = "#ffd0e4";
      ctx.beginPath(); ctx.arc(x + r * 0.5, y - r * 0.85, r * 0.12, 0, Math.PI * 2); ctx.fill();
      break;
    case "hat":
      ctx.fillStyle = "#2a1846";
      ctx.beginPath(); ctx.ellipse(x, y - r * 0.75, r * 0.85, r * 0.18, -0.1, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x - r * 0.5, y - r * 0.8);
      ctx.quadraticCurveTo(x + r * 0.1, y - r * 1.4, x + r * 0.55, y - r * 1.85);
      ctx.lineTo(x + r * 0.5, y - r * 0.85);
      ctx.fill();
      ctx.fillStyle = c.c;
      ctx.fillRect(x - r * 0.48, y - r * 0.95, r * 0.98, r * 0.12);
      break;
  }
}

// ★6の冠（cx, cy が中心、r は持ち主の大きさ）
function drawCrown(cx, cy, r, rot) {
  {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    ctx.fillStyle = "#ffd23f";
    ctx.strokeStyle = "#8a6a00";
    ctx.lineWidth = Math.max(1, r * 0.05);
    const cw = r * 0.55, ch = r * 0.35;
    ctx.beginPath();
    ctx.moveTo(-cw / 2, ch / 2); ctx.lineTo(-cw / 2, -ch / 2); ctx.lineTo(-cw / 4, 0);
    ctx.lineTo(0, -ch / 2 - ch * 0.2); ctx.lineTo(cw / 4, 0); ctx.lineTo(cw / 2, -ch / 2); ctx.lineTo(cw / 2, ch / 2);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }
}

// ★6: 回転するオーラ
function drawAura(k, x, y, r) {
  if (k.rar < 6) return;
  ctx.save();
  ctx.globalAlpha = 0.55;
  ctx.strokeStyle = `hsl(${(frameNo * 3) % 360},90%,70%)`;
  ctx.lineWidth = Math.max(2, r * 0.1);
  ctx.setLineDash([r * 0.3, r * 0.2]);
  ctx.lineDashOffset = -frameNo * 0.8;
  ctx.beginPath(); ctx.arc(x, y, r * 1.35, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

// ★5以上: 天使の翼
function drawAngelWings(k, x, y, r) {
  if (k.rar < 5) return;
  ctx.fillStyle = k.rar >= 6 ? "rgba(255,240,200,0.92)" : "rgba(255,255,255,0.85)";
  for (const s of [-1, 1]) {
    for (let j = 0; j < 3; j++) {
      ctx.beginPath();
      ctx.ellipse(x + s * r * (0.95 + j * 0.12), y - r * (0.15 - j * 0.22), r * (0.55 - j * 0.1), r * 0.18, s * (0.5 - j * 0.35), 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

const SKIN = "#ffdcc4", SKIN_D = "#f0b896";
const HAIR = { fire: "#c2381a", water: "#1d5aa8", wood: "#2f7a36", light: "#e3b93c", dark: "#3b2452" };

function shade(x, y, r, c1, c2) {
  const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r);
  g.addColorStop(0, c1);
  g.addColorStop(1, c2);
  return g;
}

// 人型・獣・鳥・竜・魚（すべてオリジナルデザイン）
function drawCreature(k, x, y, r) {
  ctx.save();
  drawAura(k, x, y, r);
  const winged = k.shape === "bird" || k.shape === "dragon";
  if (!winged) drawAngelWings(k, x, y + r * (k.shape === "human" ? 0.45 : 0.1), k.shape === "human" ? r * 0.85 : r);
  switch (k.shape) {
    case "human":  drawHuman(k, x, y, r); break;
    case "beast":  drawBeast(k, x, y, r); break;
    case "bird":   drawBird(k, x, y, r); break;
    case "dragon": drawDragon(k, x, y, r); break;
    case "fish":   drawFish(k, x, y, r); break;
  }
  if (k.rar >= 6) {
    if (k.shape === "human") drawCrown(x + r * 0.32, y - r * 0.98, r, 0.35);
    else drawCrown(x - r * 0.45, y - r * 0.92, r, -0.4);
  }
  ctx.restore();
}

function drawHuman(k, x, y, r) {
  const c = EL[k.el], hair = HAIR[k.el];
  const hx = x, hy = y - r * 0.28, hr = r * 0.6;
  // マント（騎士）
  if (k.acc === "helmet") {
    ctx.fillStyle = c.d;
    ctx.beginPath();
    ctx.moveTo(x - r * 0.45, y + r * 0.15); ctx.lineTo(x + r * 0.45, y + r * 0.15);
    ctx.lineTo(x + r * 0.7, y + r * 1.0); ctx.lineTo(x - r * 0.7, y + r * 1.0);
    ctx.fill();
  }
  // 後ろ髪
  ctx.fillStyle = hair;
  if (k.acc === "long") {
    roundRect(hx - hr * 1.05, hy - hr * 0.3, hr * 2.1, hr * 2.0, hr * 0.5);
    ctx.fill();
  } else if (k.acc === "twin") {
    for (const s of [-1, 1]) {
      ctx.beginPath(); ctx.ellipse(hx + s * hr * 1.15, hy + hr * 0.5, hr * 0.32, hr * 0.85, s * -0.25, 0, Math.PI * 2); ctx.fill();
    }
  }
  // 足
  ctx.fillStyle = "#3a2f2a";
  for (const s of [-1, 1]) { roundRect(x + s * r * 0.22 - r * 0.13, y + r * 0.72, r * 0.26, r * 0.3, r * 0.08); ctx.fill(); }
  // 胴体（服）
  ctx.fillStyle = shade(x, y + r * 0.5, r * 0.6, c.l, c.c);
  ctx.beginPath();
  ctx.moveTo(x - r * 0.32, y + r * 0.2); ctx.lineTo(x + r * 0.32, y + r * 0.2);
  ctx.lineTo(x + r * 0.48, y + r * 0.82); ctx.lineTo(x - r * 0.48, y + r * 0.82);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = c.d;
  ctx.fillRect(x - r * 0.46, y + r * 0.55, r * 0.92, r * 0.09);
  // 手と武器
  ctx.fillStyle = SKIN;
  for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(x + s * r * 0.5, y + r * 0.52, r * 0.12, 0, Math.PI * 2); ctx.fill(); }
  if (k.acc === "helmet" || k.acc === "spiky") {
    // 剣
    ctx.save();
    ctx.translate(x + r * 0.55, y + r * 0.5);
    ctx.rotate(-0.5);
    ctx.fillStyle = "#e6ecf5";
    ctx.fillRect(-r * 0.05, -r * 0.85, r * 0.1, r * 0.8);
    ctx.fillStyle = "#c9a227";
    ctx.fillRect(-r * 0.18, -r * 0.08, r * 0.36, r * 0.08);
    ctx.restore();
  } else if (k.acc === "mage" || k.acc === "long") {
    // 杖
    ctx.strokeStyle = "#7a5230";
    ctx.lineWidth = Math.max(1.5, r * 0.08);
    ctx.beginPath(); ctx.moveTo(x - r * 0.55, y + r * 0.95); ctx.lineTo(x - r * 0.55, y - r * 0.1); ctx.stroke();
    ctx.fillStyle = c.l;
    ctx.shadowColor = c.c;
    ctx.shadowBlur = r * 0.5;
    ctx.beginPath(); ctx.arc(x - r * 0.55, y - r * 0.15, r * 0.13, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
  }
  // 顔
  ctx.fillStyle = shade(hx, hy, hr, "#fff3ea", SKIN);
  ctx.beginPath(); ctx.arc(hx, hy, hr, 0, Math.PI * 2); ctx.fill();
  drawFace(k, hx, hy + hr * 0.12, hr * 0.92, SKIN);
  // 前髪・かぶりもの
  switch (k.acc) {
    case "spiky":
      ctx.fillStyle = hair;
      ctx.beginPath();
      ctx.moveTo(hx - hr * 1.0, hy);
      for (let i = 0; i <= 6; i++) {
        const a = Math.PI + i * Math.PI / 6;
        const rr = i % 2 ? hr * 1.45 : hr * 1.0;
        ctx.lineTo(hx + Math.cos(a) * rr, hy - hr * 0.1 + Math.sin(a) * rr);
      }
      ctx.lineTo(hx + hr * 1.0, hy);
      ctx.lineTo(hx + hr * 0.6, hy - hr * 0.35);
      ctx.lineTo(hx + hr * 0.2, hy - hr * 0.2);
      ctx.lineTo(hx - hr * 0.2, hy - hr * 0.4);
      ctx.lineTo(hx - hr * 0.6, hy - hr * 0.2);
      ctx.closePath();
      ctx.fill();
      break;
    case "long":
    case "twin":
      ctx.fillStyle = hair;
      ctx.beginPath();
      ctx.arc(hx, hy - hr * 0.05, hr * 1.04, Math.PI * 1.02, Math.PI * 1.98);
      ctx.quadraticCurveTo(hx + hr * 0.5, hy - hr * 0.55, hx, hy - hr * 0.3);
      ctx.quadraticCurveTo(hx - hr * 0.5, hy - hr * 0.55, hx - hr * 1.02, hy - hr * 0.1);
      ctx.fill();
      if (k.acc === "twin") {
        ctx.fillStyle = "#ff6fa8";
        for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(hx + s * hr * 0.95, hy - hr * 0.3, hr * 0.16, 0, Math.PI * 2); ctx.fill(); }
      } else {
        // エルフ耳
        ctx.fillStyle = SKIN_D;
        for (const s of [-1, 1]) {
          ctx.beginPath();
          ctx.moveTo(hx + s * hr * 0.9, hy - hr * 0.05);
          ctx.lineTo(hx + s * hr * 1.45, hy - hr * 0.45);
          ctx.lineTo(hx + s * hr * 0.95, hy + hr * 0.25);
          ctx.fill();
        }
      }
      break;
    case "helmet":
      ctx.fillStyle = shade(hx, hy - hr * 0.4, hr, "#ffffff", "#9aa6b8");
      ctx.beginPath(); ctx.arc(hx, hy - hr * 0.05, hr * 1.06, Math.PI, 0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#7d889a";
      ctx.fillRect(hx - hr * 1.06, hy - hr * 0.12, hr * 2.12, hr * 0.16);
      ctx.fillStyle = c.c;
      ctx.beginPath();
      ctx.moveTo(hx - hr * 0.1, hy - hr * 1.05);
      ctx.quadraticCurveTo(hx + hr * 0.6, hy - hr * 1.6, hx + hr * 1.0, hy - hr * 0.9);
      ctx.quadraticCurveTo(hx + hr * 0.5, hy - hr * 1.1, hx + hr * 0.1, hy - hr * 0.95);
      ctx.fill();
      break;
    case "hood":
      // 忍者ずきん（目元以外を覆う）
      ctx.fillStyle = "#2a2838";
      ctx.beginPath(); ctx.arc(hx, hy, hr * 1.06, Math.PI * 0.98, Math.PI * 2.02); ctx.fill();
      ctx.fillRect(hx - hr * 1.06, hy + hr * 0.3, hr * 2.12, hr * 0.5);
      ctx.beginPath(); ctx.arc(hx, hy + hr * 0.3, hr * 1.06, 0, Math.PI); ctx.fill();
      ctx.fillStyle = c.c;
      ctx.fillRect(hx - hr * 1.06, hy - hr * 0.42, hr * 2.12, hr * 0.14);
      ctx.beginPath();
      ctx.moveTo(hx + hr * 0.9, hy - hr * 0.4);
      ctx.lineTo(hx + hr * 1.6, hy - hr * 0.6);
      ctx.lineTo(hx + hr * 1.5, hy - hr * 0.2);
      ctx.fill();
      break;
    case "mage":
      ctx.fillStyle = hair;
      ctx.beginPath(); ctx.arc(hx, hy - hr * 0.05, hr * 1.04, Math.PI * 1.05, Math.PI * 1.95); ctx.lineTo(hx, hy - hr * 0.35); ctx.fill();
      ctx.fillStyle = c.d;
      ctx.beginPath(); ctx.ellipse(hx, hy - hr * 0.7, hr * 1.4, hr * 0.28, -0.08, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(hx - hr * 0.75, hy - hr * 0.75);
      ctx.quadraticCurveTo(hx + hr * 0.1, hy - hr * 1.6, hx + hr * 0.9, hy - hr * 2.1);
      ctx.lineTo(hx + hr * 0.75, hy - hr * 0.8);
      ctx.fill();
      ctx.fillStyle = c.l;
      starPath(hx + hr * 0.2, hy - hr * 1.05, hr * 0.2);
      ctx.fill();
      break;
  }
}

function drawBeast(k, x, y, r) {
  const c = EL[k.el];
  const fur = k.el === "light" ? "#fff8e0" : c.c, furL = k.el === "light" ? "#ffffff" : c.l;
  // しっぽ
  const wag = Math.sin(frameNo * 0.12) * 0.15;
  ctx.save();
  ctx.translate(x + r * 0.55, y + r * 0.55);
  ctx.rotate(-0.7 + wag);
  ctx.fillStyle = fur;
  ctx.beginPath(); ctx.ellipse(0, -r * 0.45, r * (k.acc === "bear" ? 0.2 : 0.3), r * (k.acc === "bear" ? 0.2 : 0.6), 0, 0, Math.PI * 2); ctx.fill();
  if (k.acc === "fox") {
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.ellipse(0, -r * 0.9, r * 0.17, r * 0.22, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  // 体
  ctx.fillStyle = shade(x, y + r * 0.5, r * 0.6, furL, fur);
  ctx.beginPath(); ctx.ellipse(x, y + r * 0.55, r * 0.58, r * 0.42, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.55)";
  ctx.beginPath(); ctx.ellipse(x, y + r * 0.62, r * 0.3, r * 0.28, 0, 0, Math.PI * 2); ctx.fill();
  // 前足
  ctx.fillStyle = fur;
  for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(x + s * r * 0.3, y + r * 0.92, r * 0.16, r * 0.1, 0, 0, Math.PI * 2); ctx.fill(); }
  // 耳
  const hx = x, hy = y - r * 0.15, hr = r * 0.66;
  for (const s of [-1, 1]) {
    ctx.fillStyle = fur;
    if (k.acc === "bear") {
      ctx.beginPath(); ctx.arc(hx + s * hr * 0.72, hy - hr * 0.72, hr * 0.32, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ffc9a8";
      ctx.beginPath(); ctx.arc(hx + s * hr * 0.72, hy - hr * 0.72, hr * 0.16, 0, Math.PI * 2); ctx.fill();
    } else {
      const tall = k.acc === "wolf" ? 1.55 : 1.4;
      ctx.beginPath();
      ctx.moveTo(hx + s * hr * 0.25, hy - hr * 0.75);
      ctx.lineTo(hx + s * hr * 0.75, hy - hr * tall);
      ctx.lineTo(hx + s * hr * 0.92, hy - hr * 0.4);
      ctx.fill();
      ctx.fillStyle = k.el === "dark" ? "#6a4a8a" : "#ffd0dc";
      ctx.beginPath();
      ctx.moveTo(hx + s * hr * 0.42, hy - hr * 0.7);
      ctx.lineTo(hx + s * hr * 0.72, hy - hr * (tall - 0.25));
      ctx.lineTo(hx + s * hr * 0.8, hy - hr * 0.5);
      ctx.fill();
    }
  }
  // 頭
  ctx.fillStyle = shade(hx, hy, hr, furL, fur);
  ctx.beginPath(); ctx.arc(hx, hy, hr, 0, Math.PI * 2); ctx.fill();
  // マズル
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  ctx.beginPath(); ctx.ellipse(hx, hy + hr * 0.42, hr * 0.42, hr * 0.3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#2a1c1c";
  ctx.beginPath(); ctx.ellipse(hx, hy + hr * 0.3, hr * 0.12, hr * 0.08, 0, 0, Math.PI * 2); ctx.fill();
  drawFace(k, hx, hy - hr * 0.08, hr * 0.85, fur, true);
  ctx.strokeStyle = "#2a1c1c";
  ctx.lineWidth = Math.max(1, hr * 0.06);
  ctx.beginPath();
  ctx.moveTo(hx, hy + hr * 0.36);
  ctx.quadraticCurveTo(hx - hr * 0.1, hy + hr * 0.52, hx - hr * 0.2, hy + hr * 0.45);
  ctx.moveTo(hx, hy + hr * 0.36);
  ctx.quadraticCurveTo(hx + hr * 0.1, hy + hr * 0.52, hx + hr * 0.2, hy + hr * 0.45);
  ctx.stroke();
  // 額の模様
  ctx.fillStyle = c.d;
  ctx.beginPath();
  ctx.moveTo(hx, hy - hr * 0.95); ctx.lineTo(hx + hr * 0.12, hy - hr * 0.62); ctx.lineTo(hx - hr * 0.12, hy - hr * 0.62);
  ctx.fill();
}

function drawBird(k, x, y, r) {
  const c = EL[k.el];
  const flap = Math.sin(frameNo * 0.18) * 0.35;
  const wingCol = k.rar >= 5 ? "#ffe9a8" : c.d;
  // 翼
  for (const s of [-1, 1]) {
    ctx.save();
    ctx.translate(x + s * r * 0.55, y + r * 0.05);
    ctx.rotate(s * (-0.5 + flap));
    ctx.fillStyle = wingCol;
    ctx.beginPath(); ctx.ellipse(s * r * 0.4, 0, r * 0.55, r * 0.26, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = c.c;
    ctx.beginPath(); ctx.ellipse(s * r * 0.25, r * 0.05, r * 0.35, r * 0.18, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  // 尾羽
  ctx.fillStyle = c.d;
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath(); ctx.ellipse(x + i * r * 0.2, y + r * 0.85, r * 0.12, r * 0.3, i * 0.4, 0, Math.PI * 2); ctx.fill();
  }
  // 冠羽
  ctx.fillStyle = k.acc === "crest" ? c.c : c.d;
  if (k.acc === "crest") {
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath(); ctx.ellipse(x + i * r * 0.18, y - r * 0.85, r * 0.1, r * 0.35, i * 0.35, 0, Math.PI * 2); ctx.fill();
    }
  } else {
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(x + s * r * 0.25, y - r * 0.6);
      ctx.lineTo(x + s * r * 0.55, y - r * 1.05);
      ctx.lineTo(x + s * r * 0.55, y - r * 0.5);
      ctx.fill();
    }
  }
  // 体
  ctx.fillStyle = shade(x, y, r * 0.82, c.l, c.c);
  ctx.beginPath(); ctx.arc(x, y + r * 0.05, r * 0.82, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.6)";
  ctx.beginPath(); ctx.ellipse(x, y + r * 0.4, r * 0.45, r * 0.38, 0, 0, Math.PI * 2); ctx.fill();
  drawFace(k, x, y - r * 0.12, r * 0.78, c.c, true);
  // くちばし
  ctx.fillStyle = "#ffb02e";
  ctx.beginPath();
  ctx.moveTo(x - r * 0.16, y + r * 0.08); ctx.lineTo(x + r * 0.16, y + r * 0.08); ctx.lineTo(x, y + r * 0.3);
  ctx.fill();
  // 足
  ctx.strokeStyle = "#ffb02e";
  ctx.lineWidth = Math.max(1, r * 0.07);
  for (const s of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(x + s * r * 0.25, y + r * 0.82); ctx.lineTo(x + s * r * 0.25, y + r * 1.0); ctx.stroke();
  }
}

function drawDragon(k, x, y, r) {
  const c = EL[k.el];
  const wingCol = k.rar >= 5 ? "#ffe9a8" : c.d;
  const flap = Math.sin(frameNo * 0.1) * 0.15;
  // コウモリ型の翼
  for (const s of [-1, 1]) {
    ctx.save();
    ctx.translate(x + s * r * 0.45, y - r * 0.1);
    ctx.rotate(s * flap);
    ctx.fillStyle = wingCol;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(s * r * 0.75, -r * 0.75);
    ctx.lineTo(s * r * 1.05, -r * 0.2);
    ctx.quadraticCurveTo(s * r * 0.85, -r * 0.05, s * r * 0.8, r * 0.2);
    ctx.quadraticCurveTo(s * r * 0.6, r * 0.05, s * r * 0.5, r * 0.35);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  // しっぽ
  ctx.fillStyle = c.c;
  ctx.beginPath();
  ctx.moveTo(x + r * 0.3, y + r * 0.6);
  ctx.quadraticCurveTo(x + r * 1.0, y + r * 0.9, x + r * 1.05, y + r * 0.35);
  ctx.lineTo(x + r * 0.85, y + r * 0.55);
  ctx.quadraticCurveTo(x + r * 0.7, y + r * 0.55, x + r * 0.4, y + r * 0.35);
  ctx.fill();
  ctx.fillStyle = c.d;
  ctx.beginPath();
  ctx.moveTo(x + r * 1.05, y + r * 0.35); ctx.lineTo(x + r * 1.2, y + r * 0.2); ctx.lineTo(x + r * 0.95, y + r * 0.22);
  ctx.fill();
  // 角
  ctx.fillStyle = "#f3e9d2";
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(x + s * r * 0.3, y - r * 0.6);
    ctx.quadraticCurveTo(x + s * r * 0.55, y - r * 1.1, x + s * r * 0.35, y - r * 1.25);
    ctx.quadraticCurveTo(x + s * r * 0.75, y - r * 0.95, x + s * r * 0.55, y - r * 0.45);
    ctx.fill();
  }
  // 体
  ctx.fillStyle = shade(x, y, r * 0.85, c.l, c.c);
  ctx.beginPath(); ctx.arc(x, y + r * 0.05, r * 0.85, 0, Math.PI * 2); ctx.fill();
  // おなか（しま模様）
  ctx.fillStyle = "#fff1c8";
  ctx.beginPath(); ctx.ellipse(x, y + r * 0.5, r * 0.42, r * 0.36, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "rgba(160,110,40,0.4)";
  ctx.lineWidth = Math.max(1, r * 0.04);
  for (let i = 0; i < 3; i++) {
    ctx.beginPath(); ctx.moveTo(x - r * 0.3, y + r * (0.35 + i * 0.13)); ctx.lineTo(x + r * 0.3, y + r * (0.35 + i * 0.13)); ctx.stroke();
  }
  // 鼻先
  ctx.fillStyle = c.l;
  ctx.beginPath(); ctx.ellipse(x, y + r * 0.12, r * 0.36, r * 0.22, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = c.d;
  for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(x + s * r * 0.11, y + r * 0.1, r * 0.04, 0, Math.PI * 2); ctx.fill(); }
  ctx.strokeStyle = c.d;
  ctx.lineWidth = Math.max(1, r * 0.05);
  ctx.beginPath(); ctx.arc(x, y + r * 0.16, r * 0.18, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
  drawFace(k, x, y - r * 0.32, r * 0.72, c.c, true);
}

function drawFish(k, x, y, r) {
  const c = EL[k.el];
  const sway = Math.sin(frameNo * 0.15) * 0.25;
  // 尾びれ
  ctx.save();
  ctx.translate(x + r * 0.75, y);
  ctx.rotate(sway);
  ctx.fillStyle = c.d;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(r * 0.3, -r * 0.2, r * 0.45, -r * 0.6);
  ctx.quadraticCurveTo(r * 0.3, 0, r * 0.45, r * 0.6);
  ctx.quadraticCurveTo(r * 0.3, r * 0.2, 0, 0);
  ctx.fill();
  ctx.restore();
  // 背びれ
  ctx.fillStyle = c.d;
  ctx.beginPath();
  ctx.moveTo(x - r * 0.35, y - r * 0.55);
  ctx.quadraticCurveTo(x, y - r * 1.15, x + r * 0.45, y - r * 0.5);
  ctx.fill();
  // ちょうちん（アンコウ風）
  if (k.acc === "angler") {
    ctx.strokeStyle = c.d;
    ctx.lineWidth = Math.max(1.2, r * 0.06);
    ctx.beginPath(); ctx.moveTo(x - r * 0.4, y - r * 0.6); ctx.quadraticCurveTo(x - r * 0.6, y - r * 1.2, x - r * 1.0, y - r * 0.95); ctx.stroke();
    ctx.fillStyle = "#fff6a8";
    ctx.shadowColor = "#fff6a8";
    ctx.shadowBlur = r * 0.6;
    ctx.beginPath(); ctx.arc(x - r * 1.0, y - r * 0.92, r * 0.14 + Math.sin(frameNo * 0.2) * r * 0.03, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
  }
  // 体
  ctx.fillStyle = shade(x - r * 0.2, y, r * 0.9, c.l, c.c);
  ctx.beginPath(); ctx.ellipse(x, y, r * 0.9, r * 0.68, 0, 0, Math.PI * 2); ctx.fill();
  // うろこ
  ctx.strokeStyle = "rgba(255,255,255,0.35)";
  ctx.lineWidth = Math.max(1, r * 0.04);
  for (let i = 0; i < 3; i++) {
    for (let j = -1; j <= 1; j++) {
      ctx.beginPath(); ctx.arc(x + r * (0.05 + i * 0.22), y + j * r * 0.24, r * 0.12, -0.5 * Math.PI, 0.5 * Math.PI); ctx.stroke();
    }
  }
  // 胸びれ
  ctx.fillStyle = c.l;
  ctx.beginPath(); ctx.ellipse(x - r * 0.05, y + r * 0.28, r * 0.22, r * 0.1, 0.6 + sway, 0, Math.PI * 2); ctx.fill();
  // 目と口（横向き）
  const ex = x - r * 0.45, ey = y - r * 0.12;
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(ex, ey, r * 0.22, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#1b1b2a";
  ctx.beginPath(); ctx.arc(ex - r * 0.03, ey + r * 0.02, r * 0.13, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(ex - r * 0.07, ey - r * 0.04, r * 0.05, 0, Math.PI * 2); ctx.fill();
  if (k.eye === "sleepy") {
    ctx.fillStyle = c.c;
    ctx.beginPath(); ctx.arc(ex, ey, r * 0.24, Math.PI, Math.PI * 2); ctx.fill();
  }
  ctx.strokeStyle = "#1b1b2a";
  ctx.lineWidth = Math.max(1, r * 0.05);
  ctx.beginPath(); ctx.arc(x - r * 0.78, y + r * 0.2, r * 0.1, -0.3 * Math.PI, 0.5 * Math.PI); ctx.stroke();
  ctx.fillStyle = "rgba(255,120,150,0.45)";
  ctx.beginPath(); ctx.ellipse(x - r * 0.3, y + r * 0.2, r * 0.1, r * 0.06, 0, 0, Math.PI * 2); ctx.fill();
}

// キャラアイコン（左上 x,y・サイズ s）
function drawIcon(fi, x, y, s, opt = {}) {
  const f = FAM[fi], u = save.box[fi], rar = u ? u.rar : f.rar;
  ctx.save();
  const g = ctx.createLinearGradient(0, y, 0, y + s);
  g.addColorStop(0, u || !opt.silhouette ? EL[f.el].d : "#22263a");
  g.addColorStop(1, "#0b0e22");
  ctx.fillStyle = g;
  roundRect(x, y, s, s, s * 0.15);
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = u || !opt.silhouette ? rarityStroke(rar, x, y, s, s) : "#3a3f55";
  ctx.stroke();
  if (!u && opt.silhouette) {
    txt("?", x + s / 2, y + s / 2, s * 0.45, "#5a6080", "center", "900");
    ctx.restore();
    return;
  }
  ctx.save();
  roundRect(x, y, s, s, s * 0.15);
  ctx.clip();
  drawChar(u ? look(fi) : { shape: f.shape, el: f.el, acc: f.acc, eye: f.eye, rar, evo: false }, x + s / 2, y + s * 0.56, s * 0.25);
  ctx.restore();
  drawStars(rar, x + s / 2, y + s - 6, s * 0.065);
  if (opt.lv && u) {
    ctx.textAlign = "left";
    outlinedText(`Lv${u.lv}`, x + 3, y + 8, "#fff", 9);
  }
  ctx.restore();
}

function drawEnemy(e) {
  const c = EL[e.el], r = e.r;
  const x = e.x, y = e.y + Math.sin(frameNo * 0.05 + e.wob) * 1.5;
  ctx.save();
  if (e.boss) {
    ctx.fillStyle = c.d;
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(x + s * r * 0.6, y - r * 0.2);
      ctx.lineTo(x + s * r * 1.65, y - r * 0.9);
      ctx.lineTo(x + s * r * 1.45, y - r * 0.2);
      ctx.lineTo(x + s * r * 1.7, y + r * 0.25);
      ctx.lineTo(x + s * r * 0.7, y + r * 0.4);
      ctx.fill();
    }
  }
  ctx.fillStyle = e.boss ? "#f0e6d0" : c.d;
  const hl = e.boss ? 1.55 : 1.3;
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(x + s * r * 0.25, y - r * 0.8);
    ctx.lineTo(x + s * r * 0.65, y - r * hl);
    ctx.lineTo(x + s * r * 0.7, y - r * 0.55);
    ctx.fill();
  }
  ctx.shadowColor = c.c;
  ctx.shadowBlur = e.boss ? 18 : 8;
  const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.4, r * 0.1, x, y, r);
  g.addColorStop(0, c.c);
  g.addColorStop(1, c.d);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  for (const s of [-1, 1]) {
    ctx.fillStyle = "#fff8d6";
    ctx.beginPath(); ctx.ellipse(x + s * r * 0.34, y - r * 0.1, r * 0.2, r * 0.15, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = e.boss ? "#ff2a2a" : "#1a0a0a";
    ctx.beginPath(); ctx.arc(x + s * r * 0.32, y - r * 0.08, r * 0.08, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#140808";
    ctx.lineWidth = Math.max(2, r * 0.08);
    ctx.beginPath();
    ctx.moveTo(x + s * r * 0.12, y - r * 0.24);
    ctx.lineTo(x + s * r * 0.55, y - r * 0.36);
    ctx.stroke();
  }
  ctx.fillStyle = "#1a0a0a";
  ctx.beginPath(); ctx.ellipse(x, y + r * 0.35, r * 0.32, r * 0.13, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#fff";
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(x + s * r * 0.18, y + r * 0.25);
    ctx.lineTo(x + s * r * 0.1, y + r * 0.42);
    ctx.lineTo(x + s * r * 0.02, y + r * 0.25);
    ctx.fill();
  }
  if (e.flash > 0) {
    ctx.globalAlpha = e.flash / 10;
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  if (e.weak !== null) {
    const w = weakPos(e);
    const pulse = 1 + Math.sin(frameNo * 0.2) * 0.15;
    ctx.strokeStyle = "#ffef5c";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(w.x, w.y, w.r * pulse, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "rgba(255,239,92,0.35)";
    ctx.beginPath(); ctx.arc(w.x, w.y, w.r * 0.55 * pulse, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(w.x - w.r * 1.3, w.y); ctx.lineTo(w.x + w.r * 1.3, w.y);
    ctx.moveTo(w.x, w.y - w.r * 1.3); ctx.lineTo(w.x, w.y + w.r * 1.3);
    ctx.stroke();
  }
  if (!e.boss) {
    const bw = r * 2, bx = x - r, by = y + r + 5, ratio = e.hp / e.maxHp;
    ctx.fillStyle = "#000b";
    ctx.fillRect(bx, by, bw, 5);
    ctx.fillStyle = ratio > 0.5 ? "#7ee07e" : ratio > 0.25 ? "#ffd35c" : "#ff6b6b";
    ctx.fillRect(bx, by, bw * ratio, 5);
  }
  const cx = x - r * 0.8, cy = y - r * 0.8;
  ctx.fillStyle = e.cd <= 1 ? "#ff3b4e" : "#fff";
  ctx.beginPath(); ctx.arc(cx, cy, 10, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#000";
  ctx.lineWidth = 1.5;
  ctx.stroke();
  txt(String(e.cd), cx, cy + 1, 13, e.cd <= 1 ? "#fff" : "#111", "center", "900");
  drawElemIcon(e.el, x + r * 0.8, y + r * 0.75, 8);
  ctx.restore();
}

function drawElemIcon(el, x, y, r) {
  ctx.fillStyle = EL[el].c;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 1.5;
  ctx.stroke();
  txt(EL[el].n, x, y + 1, Math.round(r * 1.2), "#fff", "center", "900");
}

function drawHeart(x, y, s) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s / 10, s / 10);
  ctx.fillStyle = "#ff5c8a";
  ctx.shadowColor = "#ff5c8a";
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.moveTo(0, 8);
  ctx.bezierCurveTo(-12, 0, -9, -11, 0, -4);
  ctx.bezierCurveTo(9, -11, 12, 0, 0, 8);
  ctx.fill();
  ctx.restore();
}

// ---- 描画: バトル -------------------------------------------------------
function drawField() {
  const bg = quest.bg;
  const g = ctx.createLinearGradient(0, TOP, 0, FB);
  g.addColorStop(0, bg[0]);
  g.addColorStop(1, bg[1]);
  ctx.fillStyle = g;
  ctx.fillRect(0, TOP, W, FB - TOP);
  ctx.strokeStyle = "rgba(255,255,255,0.05)";
  ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 30) { ctx.beginPath(); ctx.moveTo(x, TOP); ctx.lineTo(x, FB); ctx.stroke(); }
  for (let y = TOP; y <= FB; y += 30) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.strokeStyle = "rgba(255,255,255,0.25)";
  ctx.lineWidth = 2;
  ctx.strokeRect(1, TOP + 1, W - 2, FB - TOP - 2);
}

function drawRocks() {
  for (const o of rocks) {
    const g = ctx.createRadialGradient(o.x - 4, o.y - 4, 2, o.x, o.y, o.r);
    g.addColorStop(0, "#b8bfd8");
    g.addColorStop(1, "#4a5170");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2); ctx.fill();
  }
}

function drawFxUnder() {
  for (const f of fx) {
    if (f.kind !== "wave") continue;
    ctx.save();
    const c = EL[f.el];
    const g = ctx.createLinearGradient(0, f.y - 30, 0, f.y + 60);
    g.addColorStop(0, c.l);
    g.addColorStop(0.3, c.c + "99");
    g.addColorStop(1, c.c + "00");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, f.y + 60);
    for (let x = 0; x <= W; x += 20) ctx.lineTo(x, f.y + Math.sin(x * 0.06 + frameNo * 0.3) * 8);
    ctx.lineTo(W, f.y + 60);
    ctx.fill();
    ctx.restore();
  }
}

function drawFx() {
  for (const f of fx) {
    const t = f.life / f.max;
    ctx.save();
    if (f.kind === "ring") {
      ctx.globalAlpha = t;
      ctx.strokeStyle = f.color;
      ctx.lineWidth = f.w * t + 1;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r0 + (f.r1 - f.r0) * (1 - t), 0, Math.PI * 2); ctx.stroke();
    } else if (f.kind === "line") {
      ctx.globalAlpha = t;
      ctx.lineCap = "round";
      ctx.strokeStyle = f.color;
      ctx.lineWidth = f.w * t + 2;
      ctx.shadowColor = f.color;
      ctx.shadowBlur = 16;
      ctx.beginPath(); ctx.moveTo(f.x1, f.y1); ctx.lineTo(f.x2, f.y2); ctx.stroke();
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = (f.w * t + 2) * 0.35;
      ctx.stroke();
    } else if (f.kind === "smile") {
      // 画面いっぱいの丸メガネと笑顔
      const cx = W / 2, cy = (TOP + FB) / 2 - 20, grow = 0.7 + (1 - t) * 0.5;
      if (t > 0.85) {
        ctx.fillStyle = `rgba(255,240,170,${(t - 0.85) / 0.15 * 0.8})`;
        ctx.fillRect(0, TOP, W, FB - TOP);
      }
      ctx.globalAlpha = Math.min(1, t * 1.5) * 0.85;
      ctx.strokeStyle = "#ffe066";
      ctx.shadowColor = "#ffd23f";
      ctx.shadowBlur = 24;
      ctx.lineWidth = 10 * grow;
      for (const s of [-1, 1]) {
        ctx.beginPath(); ctx.arc(cx + s * 70 * grow, cy, 52 * grow, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.beginPath(); ctx.moveTo(cx - 18 * grow, cy - 4); ctx.lineTo(cx + 18 * grow, cy - 4); ctx.stroke();
      ctx.lineWidth = 12 * grow;
      ctx.beginPath(); ctx.arc(cx, cy + 70 * grow, 80 * grow, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
    } else if (f.kind === "bolt") {
      // ジグザグの雷
      ctx.globalAlpha = t;
      ctx.strokeStyle = f.color;
      ctx.shadowColor = f.color;
      ctx.shadowBlur = 12;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(f.x1, f.y1);
      const n = 6, nx = -(f.y2 - f.y1), ny = f.x2 - f.x1, nl = Math.hypot(nx, ny) || 1;
      for (let i = 1; i < n; i++) {
        const o = (i % 2 ? 1 : -1) * 9;
        ctx.lineTo(f.x1 + (f.x2 - f.x1) * i / n + nx / nl * o, f.y1 + (f.y2 - f.y1) * i / n + ny / nl * o);
      }
      ctx.lineTo(f.x2, f.y2);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawAllies() {
  const shooter = shot ? shot.ally : null;
  for (let i = 0; i < allies.length; i++) {
    const a = allies[i];
    if (a === shooter) continue;
    ctx.save();
    if (i === cur && state === "aim") {
      ctx.strokeStyle = ssArmed ? EL[a.el].l : "#ffffff";
      ctx.lineWidth = 3;
      ctx.setLineDash([6, 5]);
      ctx.lineDashOffset = -frameNo * 0.6;
      ctx.beginPath(); ctx.arc(a.x, a.y, R + 7, 0, Math.PI * 2); ctx.stroke();
      if (ssArmed) {
        ctx.setLineDash([]);
        ctx.globalAlpha = 0.35 + Math.sin(frameNo * 0.2) * 0.15;
        ctx.fillStyle = EL[a.el].c;
        ctx.beginPath(); ctx.arc(a.x, a.y, R + 12, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.restore();
    if (a.glow > 0) {
      ctx.save();
      ctx.globalAlpha = a.glow / 20;
      ctx.fillStyle = EL[a.el].l;
      ctx.beginPath(); ctx.arc(a.x, a.y, R + 8, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    const hx = a.hurt > 0 ? Math.sin(a.hurt * 2) * 3 : 0;
    drawChar(a.look, a.x + hx, a.y, R);
    if (a.hurt > 0) {
      ctx.save();
      ctx.globalAlpha = a.hurt / 16 * 0.6;
      ctx.fillStyle = "#ff3b4e";
      ctx.beginPath(); ctx.arc(a.x + hx, a.y, R, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }
  if (shooter) {
    ctx.save();
    shot.trail.forEach((p, k) => {
      ctx.globalAlpha = (k / shot.trail.length) * 0.5;
      ctx.fillStyle = EL[shooter.el].c;
      ctx.beginPath(); ctx.arc(p.x, p.y, R * (k / shot.trail.length), 0, Math.PI * 2); ctx.fill();
    });
    ctx.restore();
    if (shot.atkMul > 1) {
      ctx.save();
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = EL[shooter.el].c;
      ctx.beginPath(); ctx.arc(shooter.x, shooter.y, R + 8 + Math.sin(frameNo) * 2, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    drawChar(shooter.look, shooter.x, shooter.y, R);
  }
}

function drawBolts() {
  for (const b of bolts) {
    ctx.save();
    ctx.fillStyle = b.color;
    ctx.shadowColor = b.color;
    ctx.shadowBlur = b.size > 6 ? 18 : 10;
    if (b.star) {
      ctx.fillStyle = `hsl(${(frameNo * 6 + b.x) % 360},95%,72%)`;
      starPath(b.x, b.y, b.size * 1.5);
      ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life / p.max;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawTexts() {
  ctx.save();
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  for (const t of texts) {
    ctx.globalAlpha = Math.min(1, t.life / 14);
    outlinedText(t.text, t.x, t.y, t.color, t.size);
  }
  ctx.restore();
}

// 予測線（壁と岩のみ考慮）
function drawAim() {
  if (!dragging || state !== "aim") return;
  const aim = computeAim(dragStart, dragNow);
  if (!aim) return;
  const a = allies[cur];
  const p = { x: a.x, y: a.y, vx: aim.dx * 6, vy: aim.dy * 6 };
  ctx.save();
  const n = 55;
  for (let i = 0; i < n; i++) {
    p.x += p.vx; p.y += p.vy;
    walls(p);
    for (const o of rocks) bounce(p, o.x, o.y, o.r);
    if (i % 3 === 0) {
      ctx.globalAlpha = 0.9 * (1 - i / n);
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  const ang = Math.atan2(aim.dy, aim.dx);
  ctx.translate(a.x, a.y);
  ctx.rotate(ang);
  ctx.fillStyle = ssArmed ? EL[a.el].l : "#ffd35c";
  ctx.beginPath();
  ctx.moveTo(R + 26, 0);
  ctx.lineTo(R + 8, -10);
  ctx.lineTo(R + 8, 10);
  ctx.fill();
  ctx.restore();
}

function drawHud() {
  ctx.fillStyle = "#0b0e22";
  ctx.fillRect(0, 0, W, TOP);
  ctx.save();
  txt(quest.name, 10, 13, 12, "#cfd6ff");
  txt(`WAVE ${waveIdx + 1}/${quest.waves.length}`, 10, 29, 13, "#ffd35c", "left", "900");
  txt(`TURN ${turn}`, W / 2, TOP / 2, 16, "#fff", "center", "900");
  ctx.restore();
  button(W - 62, 8, 54, 24, "やめる", () => go("quests"), { size: 11, c1: "#4a5280", c2: "#2b3158", fg: "#fff" });

  const b = enemies.find(e => e.boss && !e.dead);
  if (b) {
    ctx.save();
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.fillRect(8, TOP + 6, W - 16, 22);
    txt(b.name, 14, TOP + 13, 11, "#fff");
    txt(`${b.hp.toLocaleString()} / ${b.maxHp.toLocaleString()}`, W - 14, TOP + 13, 11, "#fff", "right");
    ctx.fillStyle = "#300";
    ctx.fillRect(14, TOP + 20, W - 28, 5);
    ctx.fillStyle = "#ff3b4e";
    ctx.fillRect(14, TOP + 20, (W - 28) * (b.hp / b.maxHp), 5);
    ctx.restore();
  }

  if (state === "shoot" && hitCount > 0) {
    ctx.save();
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    outlinedText(`${hitCount}`, W - 46, TOP + 50, "#ffef5c", 28);
    outlinedText("HIT", W - 12, TOP + 54, "#fff", 14);
    ctx.restore();
  }
}

function drawPanel() {
  ctx.fillStyle = "#0e1230";
  ctx.fillRect(0, FB, W, H - FB);
  const ratio = hp / maxHp;
  ctx.fillStyle = "#000";
  roundRect(10, FB + 8, W - 20, 14, 7);
  ctx.fill();
  const g = ctx.createLinearGradient(0, FB + 8, 0, FB + 22);
  const hc = ratio > 0.5 ? ["#9dff8a", "#38c43c"] : ratio > 0.2 ? ["#ffe58a", "#e0a020"] : ["#ff9a9a", "#d02a2a"];
  g.addColorStop(0, hc[0]);
  g.addColorStop(1, hc[1]);
  ctx.fillStyle = g;
  if (ratio > 0) { roundRect(10, FB + 8, Math.max(14, (W - 20) * ratio), 14, 7); ctx.fill(); }
  ctx.save();
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  outlinedText(`HP ${hp.toLocaleString()} / ${maxHp.toLocaleString()}`, W / 2, FB + 15.5, "#fff", 11);
  ctx.restore();

  const sw = W / allies.length;
  for (let i = 0; i < allies.length; i++) {
    const a = allies[i], x = sw * (i + 0.5), y = FB + 52;
    ctx.save();
    if (i === cur) {
      ctx.fillStyle = "rgba(255,211,92,0.18)";
      roundRect(x - 40, FB + 28, 80, 58, 10);
      ctx.fill();
      ctx.strokeStyle = "#ffd35c";
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    drawChar(a.look, x - 12, y + 2, 14);
    const ready = a.ssLeft === 0;
    ctx.lineWidth = 3;
    ctx.strokeStyle = "rgba(255,255,255,0.15)";
    ctx.beginPath(); ctx.arc(x - 12, y + 2, 21, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = ready ? EL[a.el].l : "#7f8bd0";
    ctx.beginPath();
    ctx.arc(x - 12, y + 2, 21, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - a.ssLeft / a.ssTurns));
    ctx.stroke();
    txt(a.type === "reflect" ? "反射" : "貫通", x + 13, y - 12, 10, "#e8ecff");
    if (ready) {
      ctx.globalAlpha = 0.7 + Math.sin(frameNo * 0.15) * 0.3;
      ctx.textAlign = "left";
      outlinedText("SS", x + 13, y + 4, EL[a.el].l, 15);
      ctx.globalAlpha = 1;
    } else {
      txt(`あと${a.ssLeft}`, x + 13, y + 4, 11, "#9aa3d8");
    }
    ctx.restore();
    button(x - 40, FB + 28, 80, 58, "", () => {
      if (state === "aim" && i === cur && a.ssLeft === 0) ssArmed = !ssArmed;
    }, { hidden: true });
  }

  if (state === "aim") {
    const a = allies[cur];
    let msg = `${a.name}のターン　引っ張って離すと発射`;
    if (ssArmed) msg = `SS「${a.ssName}」: ${a.ssDesc}`;
    else if (a.ssLeft === 0) msg = `SS使用可能! 下のアイコンをタップ`;
    ctx.fillStyle = "rgba(0,0,0,0.45)";
    ctx.fillRect(0, FB - 22, W, 20);
    txt(msg, W / 2, FB - 12, 12, ssArmed ? EL[a.el].l : "#dfe4ff", "center");
  }
}

function drawBanner() {
  if (!banner) return;
  const t = banner.life / banner.max;
  const inT = Math.min(1, (1 - t) * 6);
  const alpha = Math.min(1, t * 4);
  ctx.save();
  ctx.globalAlpha = alpha;
  const y = (TOP + FB) / 2 - 20;
  ctx.fillStyle = "rgba(0,0,0,0.55)";
  ctx.fillRect(0, y - 34, W, 68);
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  const x = W / 2 + (1 - inT) * 200;
  outlinedText(banner.text, x, y - 6, banner.color, 30);
  if (banner.sub) outlinedText(banner.sub, x, y + 22, "#fff", 13);
  ctx.restore();
}

function drawResult() {
  ctx.save();
  ctx.fillStyle = "rgba(5,7,15,0.82)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  if (state === "clear") {
    const r = lastResult;
    outlinedText("QUEST CLEAR!", W / 2, 110, "#ffd35c", 34, "#5a2200");
    txt(`クリアターン: ${r.turn}`, W / 2, 158, 17, "#fff", "center");
    ctx.textAlign = "center";
    outlinedText(r.rank, W / 2, 215, r.rank === "S" ? "#ffef5c" : r.rank === "A" ? "#ff9ad5" : "#9ad5ff", 64);
    let net = "";
    if (onlineRanking()) net = r.netRank === undefined ? "  ランキング送信中…" : r.netRank === null ? "  (ランキング送信失敗)" : `  全国 ${r.netRank}位!`;
    txt((r.isBest ? "ベスト記録更新!" : `ベスト ${r.best}ターン`) + net, W / 2, 262, 13, "#cfd6ff", "center");
    // 報酬
    ctx.fillStyle = "rgba(255,255,255,0.08)";
    roundRect(40, 285, W - 80, r.drop ? 150 : 100, 12);
    ctx.fill();
    txt("獲得報酬", W / 2, 302, 13, "#ffd35c", "center");
    coinIcon(110, 328, 8);
    txt(`${r.coin.toLocaleString()}`, 124, 328, 14, "#fff");
    crystalIcon(r.crEl, 220, 328, 9);
    txt(`${EL[r.crEl].n}の結晶 ×${r.crN}`, 234, 328, 13, "#fff");
    if (r.gem) { gemIcon(110, 356, 9); txt(`${r.gem} (初回クリア)`, 124, 356, 13, "#fff"); }
    txt(`EXP +${r.exp}`, 234, 356, 13, "#ffd35c");
    if (r.drop) {
      drawIcon(r.drop.fi, 70, 372, 52);
      txt(`${FAM[r.drop.fi].name} をゲット!`, 132, 390, 13, "#fff");
      txt(r.drop.kind === "new" ? "NEW!" : r.drop.kind === "awk" ? "覚醒+1" : `コイン+${r.drop.coins}`, 132, 410, 12, "#ffd35c");
    }
  } else {
    outlinedText("全滅…", W / 2, 220, "#ff6b6b", 40);
    txt(`WAVE ${waveIdx + 1} / ${quest.waves.length}  ・  ${turn}ターン`, W / 2, 270, 14, "#cfd6ff", "center");
    txt("BOXでキャラを強化・進化しよう!", W / 2, 300, 13, "#ffd35c", "center");
  }
  ctx.restore();
  // ストーリー・塔は「次へ」で続けて遊べる
  let next = null;
  if (state === "clear" && quest.kind === "story") {
    const n = Number(questIdx.slice(1)) + 1;
    if (n < STORY_COUNT) next = "s" + n;
  } else if (state === "clear" && quest.kind === "tower") {
    next = "t" + (quest.floor + 1);
  }

function drawGachaAnim() {
  ctx.fillStyle = "#06040f";
  ctx.fillRect(0, 0, W, H);
  const r = gacha.res[gacha.i], f = FAM[r.fi], rar = f.rar;
  const cy = 300, t = gacha.t;
  // 光線
  ctx.save();
  const rays = rar >= 5 ? 16 : 8;
  for (let i = 0; i < rays; i++) {
    const a = frameNo * 0.01 + i * Math.PI * 2 / rays;
    ctx.fillStyle = rar >= 5 ? `hsla(${(i * 40 + frameNo * 2) % 360},90%,65%,0.18)` : `rgba(255,255,255,${rar >= 4 ? 0.08 : 0.04})`;
    ctx.beginPath();
    ctx.moveTo(W / 2, cy);
    ctx.lineTo(W / 2 + Math.cos(a) * 500, cy + Math.sin(a) * 500);
    ctx.lineTo(W / 2 + Math.cos(a + 0.12) * 500, cy + Math.sin(a + 0.12) * 500);
    ctx.fill();
  }
  ctx.restore();
  if (!gacha.opened) {
    // タマゴが落ちてきて揺れる（色でレア度を予告）
    const y = Math.min(cy, -60 + t * 14) - (t > 26 && t < 34 ? Math.sin((t - 26) / 8 * Math.PI) * 20 : 0);
    const rot = t > 34 ? Math.sin(t * 0.5) * 0.18 : 0;
    const col = rar >= 5 ? `hsl(${(frameNo * 4) % 360},90%,62%)` : rar >= 4 ? "#d8e0f0" : "#d39a5a";
    ctx.save();
    ctx.translate(W / 2, y + 50);
    ctx.rotate(rot);
    ctx.translate(0, -50);
    ctx.shadowColor = col;
    ctx.shadowBlur = rar >= 4 ? 30 : 12;
    const eg = ctx.createRadialGradient(-14, -20, 4, 0, 0, 60);
    eg.addColorStop(0, "#ffffff");
    eg.addColorStop(1, col);
    ctx.fillStyle = eg;
    ctx.beginPath(); ctx.ellipse(0, 0, 40, 52, 0, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    // 模様（星と水玉）
    ctx.fillStyle = "rgba(255,255,255,0.7)";
    starPath(-12, -18, 9); ctx.fill();
    for (const [px, py, pr] of [[16, -6, 6], [-18, 16, 5], [12, 26, 7]]) {
      ctx.beginPath(); ctx.arc(px, py, pr, 0, Math.PI * 2); ctx.fill();
    }
    // ひび
    if (t > 34) {
      ctx.strokeStyle = "rgba(40,20,0,0.6)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-30, 2); ctx.lineTo(-16, -6); ctx.lineTo(-4, 4); ctx.lineTo(8, -6); ctx.lineTo(20, 3); ctx.lineTo(32, -4);
      ctx.stroke();
    }
    ctx.restore();
    if (t > 30) txt("タップで孵化!", W / 2, 420, 15, `rgba(255,255,255,${0.6 + Math.sin(frameNo * 0.15) * 0.4})`, "center");
  } else {
    if (t < 20) {
      ctx.fillStyle = `rgba(255,255,255,${1 - t / 20})`;
      ctx.fillRect(0, 0, W, H);
    }
    const s = Math.min(1, t / 12);
    drawChar({ shape: f.shape, el: f.el, acc: f.acc, eye: f.eye, rar, evo: false }, W / 2, cy, 64 * s);
    ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    outlinedText(f.name, W / 2, 420, "#fff", 26);
    ctx.restore();
    drawStars(rar, W / 2, 452, 11);
    drawElemIcon(f.el, W / 2 - 40, 482, 10);
    txt(f.type === "reflect" ? "反射" : "貫通", W / 2 - 24, 482, 13, "#cfd6ff");
    txt(COMBO[f.combo].name, W / 2 + 16, 482, 13, "#cfd6ff");
    const tag = r.kind === "new" ? "NEW!" : r.kind === "awk" ? "覚醒+1!" : `コイン+${r.coins}`;
    ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    outlinedText(tag, W / 2, 200, r.kind === "new" ? "#ff5c8a" : "#ffd35c", 24);
    ctx.restore();
    if (t > 15) txt("タップで次へ", W / 2, 540, 13, "rgba(255,255,255,0.7)", "center");

let gifts = [];
async function loadGifts() {
  try {
    const res = await fetch("gifts.json?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) return;
    const data = await res.json();
    const now = Date.now();
    gifts = (Array.isArray(data.gifts) ? data.gifts : []).filter(g => g && g.id && g.title
      && (!g.from || now >= new Date(g.from + "T00:00:00").getTime())
      && (!g.until || now <= new Date(g.until + "T23:59:59").getTime()));
  } catch (e) { /* オフライン等 */ }
}
const unclaimed = () => gifts.filter(g => !(save.claimed || []).includes(g.id));
const giftNum = (v, max) => Math.max(0, Math.min(max, Math.floor(Number(v) || 0)));

function claimGift(g) {
  save.claimed = save.claimed || [];
  if (save.claimed.includes(g.id)) return;
  save.gems += giftNum(g.gems, 100000);
  save.coins += giftNum(g.coins, 100000);
  const cr = giftNum(g.crystals, 999);
  for (const k of EL_KEYS) save.cr[k] += cr;
  save.claimed.push(g.id);
  persist();
}

function giftText(g) {
  const parts = [];
  if (giftNum(g.gems, 100000)) parts.push(`ジェム${giftNum(g.gems, 100000)}`);
  if (giftNum(g.coins, 100000)) parts.push(`コイン${giftNum(g.coins, 100000)}`);
  if (giftNum(g.crystals, 999)) parts.push(`結晶 各${giftNum(g.crystals, 999)}`);
  return parts.join(" + ");
}

// ---- データ引き継ぎコード ---------------------------------------------------
// 形式: MF1Z-<圧縮データ(base64url)>-<チェック用の値>（圧縮できない環境では MF1-）
function codeCheck(s) {
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h.toString(36);
}
function toB64url(bytes) {
  let bin = "";
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function fromB64url(s) {
  const bin = atob(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4));
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function pipeBytes(bytes, stream) {
  return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer());
}
async function encodeSave() {
  let bytes = new TextEncoder().encode(JSON.stringify(save)), tag = "MF1";
  if (window.CompressionStream) {
    bytes = await pipeBytes(bytes, new CompressionStream("deflate-raw"));
    tag = "MF1Z";
  }
  const body = toB64url(bytes);
  return `${tag}-${body}-${codeCheck(body)}`;
}
async function decodeSave(code) {
  const m = code.replace(/\s+/g, "").match(/^(MF1Z?)-([A-Za-z0-9_-]+)-([a-z0-9]+)$/);
  if (!m) throw new Error("引き継ぎコードの形ではありません");
  if (codeCheck(m[2]) !== m[3]) throw new Error("コードが途中で切れているか、間違っています");
  let bytes = fromB64url(m[2]);
  if (m[1] === "MF1Z") {
    if (!window.DecompressionStream) throw new Error("このブラウザでは読み込めません。新しいブラウザで試してください");
    bytes = await pipeBytes(bytes, new DecompressionStream("deflate-raw"));
  }
  const s = JSON.parse(new TextDecoder().decode(bytes));
  if (!s || !s.box || !s.party) throw new Error("セーブデータが入っていません");
  return normalizeSave(s);
}

function openCodeBox(title, text, readOnly, note, mainLabel, onMain) {
  const box = document.getElementById("codeBox"), area = document.getElementById("codeText");
  document.getElementById("codeTitle").textContent = title;
  area.value = text;
  area.readOnly = readOnly;
  area.placeholder = readOnly ? "" : "ここに引き継ぎコードを貼り付け";
  setCodeNote(note);
  const main = document.getElementById("codeMain");
  main.textContent = mainLabel;
  main.onclick = onMain;
  document.getElementById("codeClose").onclick = () => { box.hidden = true; };
  box.hidden = false;
  if (!readOnly) setTimeout(() => area.focus(), 50);
}
function setCodeNote(text, err = false) {
  const n = document.getElementById("codeNote");
  n.textContent = text;
  n.className = err ? "err" : "";
}

async function showExportCode() {
  const code = await encodeSave();
  openCodeBox("あなたの引き継ぎコード", code, true,

    "コピーする", async () => {

        setCodeNote("コピーしました! メモ帳やLINEの自分あてに保存しておくと安心です");
      } catch (e) {
        const area = document.getElementById("codeText");
        area.focus();
        area.select();
        setCodeNote("コピーできなかったので、選択された文字を長押ししてコピーしてね", true);
      }
    });
}

function showImportCode() {
  let pending = null;
  openCodeBox("引き継ぎコードを入力", "", false, "前の端末で発行したコードを貼り付けてね", "確認する", async () => {
    const main = document.getElementById("codeMain");
    if (pending) {
      // 2回目の押下で上書き
      save = pending;
      persist();
      document.getElementById("codeBox").hidden = true;
      go("home");
      showToast("データを引き継ぎました!");
      return;
    }
    try {
      const s = await decodeSave(document.getElementById("codeText").value);
      const chars = Object.keys(s.box).length, clears = Object.keys(s.cleared).length;
      setCodeNote(`ジェム${s.gems.toLocaleString()}・キャラ${chars}体・クリア${clears}個のデータです。今のデータは上書きされます`, false);
      pending = s;
      main.textContent = "上書きして引き継ぐ";
    } catch (e) {
      setCodeNote(e.message || "読み込めませんでした", true);
    }
  });
  document.getElementById("codeText").oninput = () => {
    pending = null;
    document.getElementById("codeMain").textContent = "確認する";
  };
}
