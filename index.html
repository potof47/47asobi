<!doctype html>
<html lang="ja">

<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #05070f;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    touch-action: none;
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(90, 120, 255, 0.25);
  }
  /* ランキング用の名前入力 */
  #nameBox {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.6);
    z-index: 10;
  }
  #nameBox[hidden] { display: none; }
  #nameForm {
    width: min(300px, 86vw);
    padding: 18px;
    border: 2px solid #ffd35c;
    border-radius: 14px;
    background: #1b1f3e;
    color: #fff;
    font: bold 15px system-ui, sans-serif;
    text-align: center;
  }
  #nameForm input {
    width: 100%;
    box-sizing: border-box;
    margin: 12px 0;
    padding: 10px;
    border: none;
    border-radius: 8px;
    font-size: 18px;
  }
  #nameForm button {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(#ffcf4a, #ff8f1f);
    color: #3a1c00;
    font: bold 16px system-ui, sans-serif;
  }
  /* データ引き継ぎコード */
  #codeBox {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.7);
    z-index: 10;
  }
  #codeBox[hidden] { display: none; }
  #codePanel {
    width: min(330px, 90vw);
    padding: 18px;
    border: 2px solid #5ef0ff;
    border-radius: 14px;
    background: #1b1f3e;
    color: #fff;
    font: bold 15px system-ui, sans-serif;
    text-align: center;
  }
  #codeText {
    width: 100%;
    height: 110px;
    box-sizing: border-box;
    margin: 12px 0 6px;
    padding: 8px;
    border: none;
    border-radius: 8px;
    font: 12px/1.4 ui-monospace, monospace;
    word-break: break-all;
    resize: none;
  }
  #codeNote { min-height: 1.4em; margin-bottom: 10px; color: #cfd6ff; font-size: 12px; font-weight: normal; }
  #codeNote.err { color: #ff9a9a; font-weight: bold; }
  #codePanel button {
    width: 100%;
    margin-top: 6px;
    padding: 10px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(#7cf0ff, #2a9fd6);
    color: #06283a;
    font: bold 16px system-ui, sans-serif;
  }
  #codePanel button.sub { background: #3a4170; color: #fff; }

</head>
<body>
<canvas id="c"></canvas>
<div id="nameBox" hidden>
  <form id="nameForm">
    <div>ランキングに表示する名前</div>
    <input id="nameInput" maxlength="12" autocomplete="off" placeholder="12文字まで">
    <button type="submit">決定</button>
  </form>
</div>
<div id="codeBox" hidden>
  <div id="codePanel">
    <div id="codeTitle"></div>
    <textarea id="codeText" spellcheck="false" autocomplete="off"></textarea>
    <div id="codeNote"></div>
    <button id="codeMain" type="button"></button>
    <button id="codeClose" class="sub" type="button">閉じる</button>
  </div>
</div>
<script>
"use strict";

// ---- 定数 -------------------------------------------------------------
const W = 360, H = 640;      // 論理解像度
const TOP = 40, FB = 550;    // バトルフィールドの上端・下端（下はパネル）
const NAV_Y = H - 56;        // メニュー画面の下部ナビ
const R = 17;                // 味方キャラの半径
const FRICTION = 0.989;      // 摩擦（毎フレーム減速）
const STOP = 0.45;           // これ未満で停止
const SUB = 3;               // 衝突判定のサブステップ数
const MIN_DRAG = 14;         // 発射に必要な引っ張り距離

// ---- 属性 -------------------------------------------------------------
// p: 進化後の名前の接頭語（★4 / ★5 / ★6）、w: ストライクショット名の接頭語
const EL = {
  fire:  { n: "火", c: "#ff5b3a", l: "#ffb199", d: "#8a1f0e", p: ["炎獣", "紅蓮", "煉獄神"], w: "紅蓮" },
  water: { n: "水", c: "#3aa0ff", l: "#a6d4ff", d: "#0d3f7a", p: ["水精", "蒼海", "深淵神"], w: "激流" },
  wood:  { n: "木", c: "#46c46a", l: "#aef0bf", d: "#165a2a", p: ["森精", "翠樹", "大樹神"], w: "翠緑" },
  light: { n: "光", c: "#ffd23f", l: "#fff3b8", d: "#8a6a00", p: ["聖", "光輝", "天光神"], w: "聖光" },
  dark:  { n: "闇", c: "#9b5cff", l: "#d6bcff", d: "#3a1670", p: ["影", "冥夜", "魔神"], w: "冥闇" },
};
const EL_KEYS = Object.keys(EL);
// 有利属性: 火→木→水→火、光⇄闇
const ADV = { fire: "wood", wood: "water", water: "fire", light: "dark", dark: "light" };
function elemMult(atk, def) {
  if (ADV[atk] === def) return 2;
  if (ADV[def] === atk && atk !== "light" && atk !== "dark") return 0.5;
  return 1;
}

// ---- キャラクター ---------------------------------------------------------
// 友情コンボ（他のキャラに触れると発動）
const COMBO = {
  blast:   { name: "爆発",           desc: "周りの敵を巻き込む爆発" },
  laser:   { name: "十字レーザー",   desc: "縦横にレーザー" },
  homing:  { name: "ホーミング8",    desc: "追尾弾8発" },
  heal:    { name: "ヒール",         desc: "HP回復" },
  thunder: { name: "チェインサンダー", desc: "近い敵へ連鎖する雷" },
  // ikesaki 専用
  smilestar: { name: "スマイルスター", desc: "追尾する星12発＋HP回復" },
};
// ストライクショット（ターン経過で使用可能）。fixed: 属性名を付けない専用SS
const SS = {
  burst:  { name: "突撃",     turns: 7,  desc: "攻撃力3倍＆スピードアップ" },
  wave:   { name: "大波動",   turns: 9,  desc: "大波で敵全体に大ダメージ" },
  needle: { name: "レイン",   turns: 8,  desc: "移動中に追尾弾を連射" },
  judge:  { name: "レーザー", turns: 10, desc: "発射方向に極太レーザー" },
  meteor: { name: "メテオ",   turns: 11, desc: "隕石8発を敵に落とす" },
  // ikesaki 専用
  smileburst: { name: "フルスマイル・バースト", turns: 8, fixed: true,
    desc: "全体大ダメージ＋敵の攻撃1T遅延＋HP30%回復＋攻撃3倍" },
};

// 名前, 属性, 初期レア度, タイプ(reflect 反射 / pierce 貫通), 頭の飾り, 目, 友情コンボ, SS
const FAM = [
  ["ヒノコ",   "fire",  3, "pierce",  "spikes",  "round",   "homing",  "needle"],
  ["ボルカ",   "fire",  3, "reflect", "horns",   "sharp",   "thunder", "burst"],
  ["ブレイズ", "fire",  4, "reflect", "flame",   "round",   "blast",   "burst"],
  ["フレア",   "fire",  4, "pierce",  "bow",     "sparkle", "laser",   "judge"],
  ["ヒバナ",   "fire",  4, "reflect", "ears",    "round",   "heal",    "wave"],
  ["エンラ",   "fire",  5, "reflect", "horns",   "sharp",   "blast",   "meteor"],
  ["シズク",   "water", 3, "reflect", "bow",     "sleepy",  "heal",    "needle"],
  ["アクアン", "water", 3, "pierce",  "antenna", "round",   "homing",  "burst"],
  ["マリン",   "water", 4, "pierce",  "fin",     "round",   "laser",   "wave"],
  ["ナミ",     "water", 4, "reflect", "bunny",   "sparkle", "thunder", "judge"],
  ["セイラ",   "water", 4, "pierce",  "ears",    "round",   "blast",   "wave"],
  ["ルリハ",   "water", 5, "reflect", "star",    "sharp",   "laser",   "meteor"],
  ["モリノ",   "wood",  3, "pierce",  "leaf",    "sleepy",  "heal",    "burst"],
  ["ツタマル", "wood",  3, "reflect", "spikes",  "round",   "blast",   "needle"],
  ["ソーン",   "wood",  4, "reflect", "leaf",    "round",   "homing",  "needle"],
  ["フローラ", "wood",  4, "pierce",  "bow",     "sparkle", "heal",    "judge"],
  ["コケット", "wood",  4, "reflect", "ears",    "sleepy",  "laser",   "wave"],
  ["ジュカ",   "wood",  5, "reflect", "antenna", "sharp",   "thunder", "meteor"],
  ["ピカリ",   "light", 3, "reflect", "star",    "round",   "thunder", "burst"],
  ["ハロ",     "light", 3, "pierce",  "halo",    "sleepy",  "laser",   "needle"],
  ["ルクス",   "light", 4, "pierce",  "halo",    "round",   "heal",    "judge"],
  ["ソレイユ", "light", 4, "reflect", "spikes",  "sharp",   "blast",   "wave"],
  ["ルミナ",   "light", 4, "pierce",  "bunny",   "round",   "homing",  "judge"],
  ["セラフィ", "light", 5, "pierce",  "halo",    "sparkle", "laser",   "meteor"],
  ["カゲボウ", "dark",  3, "pierce",  "hat",     "sleepy",  "homing",  "needle"],
  ["ヤミネコ", "dark",  3, "reflect", "ears",    "sharp",   "thunder", "burst"],
  ["ノクス",   "dark",  4, "reflect", "horns",   "sharp",   "blast",   "burst"],
  ["ルナリア", "dark",  4, "pierce",  "bunny",   "sparkle", "heal",    "wave"],
  ["グリム",   "dark",  4, "reflect", "spikes",  "mono",    "thunder", "judge"],
  ["ヘクセ",   "dark",  5, "pierce",  "hat",     "sharp",   "homing",  "meteor"],
  // ★6限定キャラ
  ["ikesaki",  "light", 6, "pierce",  "bowlcut", "smile",   "smilestar", "smileburst"],
  // 人型・獣・鳥・竜・魚（9番目が体の形）
  ["アカネ",   "fire",  4, "reflect", "spiky",   "sharp",   "blast",   "burst",  "human"],
  ["カエン",   "fire",  5, "pierce",  "mage",    "sparkle", "laser",   "meteor", "human"],
  ["ヒギツネ", "fire",  3, "pierce",  "fox",     "round",   "homing",  "needle", "beast"],
  ["ホムラ",   "fire",  4, "reflect", "crest",   "sharp",   "thunder", "wave",   "bird"],
  ["イグニドラ", "fire", 5, "reflect", "horns",  "sharp",   "blast",   "judge",  "dragon"],
  ["ミナト",   "water", 4, "pierce",  "helmet",  "round",   "laser",   "wave",   "human"],
  ["シオン",   "water", 3, "reflect", "twin",    "sparkle", "heal",    "needle", "human"],
  ["ルーヴ",   "water", 4, "reflect", "wolf",    "sharp",   "thunder", "burst",  "beast"],
  ["ペンタ",   "water", 3, "reflect", "tuft",    "round",   "homing",  "needle", "bird"],
  ["アクアフィン", "water", 5, "pierce", "angler", "round", "laser",   "meteor", "fish"],
  ["リーフィ", "wood",  3, "pierce",  "long",    "sleepy",  "heal",    "judge",  "human"],
  ["タケル",   "wood",  5, "reflect", "hood",    "sharp",   "homing",  "burst",  "human"],
  ["モリグマ", "wood",  4, "reflect", "bear",    "round",   "blast",   "wave",   "beast"],
  ["フクロン", "wood",  3, "pierce",  "tuft",    "sleepy",  "thunder", "needle", "bird"],
  ["グリンドラ", "wood", 4, "pierce", "horns",   "round",   "laser",   "meteor", "dragon"],
  ["ユウキ",   "light", 4, "reflect", "helmet",  "sharp",   "blast",   "judge",  "human"],
  ["ステラ",   "light", 5, "pierce",  "twin",    "sparkle", "laser",   "meteor", "human"],
  ["ハクコ",   "light", 3, "reflect", "fox",     "sparkle", "homing",  "burst",  "beast"],
  ["コハク",   "light", 4, "pierce",  "crest",   "round",   "heal",    "wave",   "bird"],
  ["ソルドラ", "light", 4, "reflect", "horns",   "round",   "thunder", "burst",  "dragon"],
  ["クロウ",   "dark",  4, "pierce",  "hood",    "sharp",   "homing",  "needle", "human"],
  ["マオ",     "dark",  5, "reflect", "mage",    "sharp",   "blast",   "meteor", "human"],
  ["シャドウルフ", "dark", 4, "reflect", "wolf",  "sharp",   "thunder", "judge",  "beast"],
  ["カラスケ", "dark",  3, "reflect", "tuft",    "sharp",   "laser",   "burst",  "bird"],
  ["ヤミウオ", "dark",  3, "pierce",  "angler",  "sleepy",  "heal",    "wave",   "fish"],
].map((a, i) => ({ idx: i, name: a[0], el: a[1], rar: a[2], type: a[3], acc: a[4], eye: a[5], combo: a[6], ss: a[7], shape: a[8] || "blob" }));
// 図鑑の並び順（属性 → レア度）
const ORDER = FAM.map(f => f.idx).sort((a, b) =>
  EL_KEYS.indexOf(FAM[a].el) - EL_KEYS.indexOf(FAM[b].el) || FAM[a].rar - FAM[b].rar || a - b);
const SHAPE_NAME = { blob: "モンスター", human: "人型", beast: "獣", bird: "鳥", dragon: "竜", fish: "魚" };
const STARTERS = [2, 8, 14, 20];   // ブレイズ・マリン・ソーン・ルクス
const LIMITED = FAM.find(f => f.name === "ikesaki").idx;
FAM[LIMITED].boost = 1.35;      // 限定キャラは能力1.35倍

const RBASE = {
  3: { atk: 1600, hp: 11000, spd: 13.5 },
  4: { atk: 2000, hp: 14000, spd: 14 },
  5: { atk: 2450, hp: 17000, spd: 14.8 },
  6: { atk: 3000, hp: 21000, spd: 15.5 },
};
const MAXLV = { 3: 30, 4: 50, 5: 70, 6: 99 };
const MAX_AWK = 5;                                  // 覚醒（ガチャで被ると上がる）
const EVO_CR = { 3: 5, 4: 12, 5: 25 };              // 進化に必要な結晶
const EVO_COIN = { 3: 2000, 4: 6000, 5: 15000 };    // 進化に必要なコイン
const RCOL = { 3: "#d39a5a", 4: "#d8e0f0", 5: "#ffd23f", 6: "#ff8ae6" };
const lvCost = lv => 20 + lv * 8;

// ---- ガチャ -----------------------------------------------------------
const GACHA_1 = 50, GACHA_10 = 450;
const RATE6 = 0.01, RATE5 = 0.06, RATE4 = 0.30;

// ---- セーブデータ -------------------------------------------------------
const SAVE_KEY = "mflick-save-v1";
let save = null;

function newSave() {
  const box = {};
  for (const fi of STARTERS) box[fi] = { rar: FAM[fi].rar, lv: 1, awk: 0 };
  const cr = {};
  for (const k of EL_KEYS) cr[k] = 0;
  return { gems: 500, coins: 3000, cr, box, party: [...STARTERS], cleared: {}, best: {}, daily: "",
    rank: 1, exp: 0, stats: {}, ach: {}, towerMax: 0 };
}
function loadSave() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (s && s.box && s.party) { save = normalizeSave(s); return; }
  } catch (e) { /* 読み込めない環境 */ }
  save = newSave();
}
// 古いセーブや引き継ぎコードを読み込む時に、足りない項目を補い、おかしな値を直す
function normalizeSave(s) {
  const d = newSave();
  const int = (v, lo, hi, def) => Number.isFinite(Number(v)) ? Math.max(lo, Math.min(hi, Math.floor(Number(v)))) : def;
  const out = { ...d, ...s };
  out.gems = int(s.gems, 0, 1e9, d.gems);
  out.coins = int(s.coins, 0, 1e10, d.coins);
  out.cr = {};
  for (const k of EL_KEYS) out.cr[k] = int(s.cr && s.cr[k], 0, 1e6, 0);
  out.box = {};
  for (const [k, u] of Object.entries(s.box || {})) {
    const f = FAM[k];
    if (!f || !u) continue;
    const rar = int(u.rar, f.rar, 6, f.rar);
    out.box[k] = { rar, lv: int(u.lv, 1, MAXLV[rar], 1), awk: int(u.awk, 0, MAX_AWK, 0) };
  }
  if (!Object.keys(out.box).length) out.box = d.box;
  out.party = (Array.isArray(s.party) ? s.party : []).map(Number).filter((fi, i, a) => out.box[fi] && a.indexOf(fi) === i).slice(0, 4);
  if (!out.party.length) out.party = [Number(Object.keys(out.box)[0])];
  out.cleared = s.cleared && typeof s.cleared === "object" ? s.cleared : {};
  out.best = s.best && typeof s.best === "object" ? s.best : {};
  out.claimed = Array.isArray(s.claimed) ? s.claimed.map(String) : [];
  out.name = typeof s.name === "string" ? s.name.slice(0, 12) : undefined;
  out.rank = int(s.rank, 1, 1e6, 1);
  out.exp = int(s.exp, 0, 1e9, 0);
  out.towerMax = int(s.towerMax, 0, 1e6, 0);
  const nums = o => Object.fromEntries(Object.entries(o && typeof o === "object" ? o : {}).map(([k, v]) => [k, int(v, 0, 1e12, 0)]));
  out.stats = nums(s.stats);
  out.ach = nums(s.ach);
  return out;
}

// ---- プレイヤーランク・ミッション（遊ぶほどジェムがもらえる） ---------------------
const expNeed = rank => 100 + rank * 20;
// 経験値を足してランクアップ分のジェムを渡す（ランクに上限なし）
function addExp(n) {
  save.exp += n;
  let ranks = 0, gems = 0;
  while (save.exp >= expNeed(save.rank)) {
    save.exp -= expNeed(save.rank);
    save.rank++;
    ranks++;
    const g = 10 + (save.rank % 10 === 0 ? 50 : 0);
    gems += g;
  }
  save.gems += gems;
  return { ranks, gems };
}

// 実績（何回でももらえる）: step ごとに gem ジェム
const ACH = [
  { key: "kills",  name: "敵を倒す",          step: 100,  gem: 15 },
  { key: "clears", name: "クエストをクリア",   step: 10,   gem: 20 },
  { key: "srank",  name: "Sランクでクリア",    step: 5,    gem: 25 },
  { key: "hits",   name: "合計ヒット",         step: 1000, gem: 10 },
  { key: "weak",   name: "弱点に当てる",       step: 100,  gem: 10 },
  { key: "ss",     name: "SSを使う",           step: 20,   gem: 10 },
  { key: "pulls",  name: "ガチャを引く",       step: 10,   gem: 20 },
  { key: "lvups",  name: "キャラを強化",       step: 50,   gem: 10 },
  { key: "evos",   name: "キャラを進化",       step: 1,    gem: 30 },
  { key: "dex",    name: "図鑑のキャラを集める", step: 1,  gem: 10 },
];
// デイリーミッション（毎日リセット）
const DAILY = [
  { key: "clears", name: "クエストを3回クリア", goal: 3,  gem: 20 },
  { key: "kills",  name: "敵を30体倒す",       goal: 30, gem: 15 },
  { key: "ss",     name: "SSを2回使う",        goal: 2,  gem: 10 },
  { key: "pulls",  name: "ガチャを1回引く",     goal: 1,  gem: 10 },
  { key: "lvups",  name: "キャラを5回強化",     goal: 5,  gem: 10 },
];
const DAILY_ALL_GEM = 30;

function dailyState() {
  if (!save.dm || save.dm.date !== today()) save.dm = { date: today(), prog: {}, claimed: [], all: false };
  return save.dm;
}
function addStat(key, n = 1) {
  save.stats[key] = (save.stats[key] || 0) + n;
  const d = dailyState();
  d.prog[key] = (d.prog[key] || 0) + n;
}
const statValue = key => key === "dex" ? Object.keys(save.box).length : (save.stats[key] || 0);
// まだ受け取っていない実績の段数
const achReady = a => Math.max(0, Math.floor(statValue(a.key) / a.step) - (save.ach[a.key] || 0));
const dailyDone = m => (dailyState().prog[m.key] || 0) >= m.goal;
const dailyReady = m => dailyDone(m) && !dailyState().claimed.includes(m.key);
const dailyAllReady = () => DAILY.every(m => dailyState().claimed.includes(m.key)) && !dailyState().all;
function missionBadge() {
  return ACH.filter(a => achReady(a) > 0).length + DAILY.filter(dailyReady).length + (dailyAllReady() ? 1 : 0);
}
function claimAch(a) {
  const n = achReady(a);
  if (!n) return 0;
  save.ach[a.key] = (save.ach[a.key] || 0) + n;
  save.gems += n * a.gem;
  return n * a.gem;
}
function claimDaily(m) {
  if (!dailyReady(m)) return 0;
  dailyState().claimed.push(m.key);

}
function claimDailyAll() {
  if (!dailyAllReady()) return 0;

}
function claimEverything() {
  let g = 0;
  for (const m of DAILY) g += claimDaily(m);
  g += claimDailyAll();
  for (const a of ACH) g += claimAch(a);
  return g;
}

// 同じ番号なら毎回同じ配置になるよう、番号から乱数を作る
function seeded(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// 1つのWAVEを作る（r: 乱数, m/s: メイン/サブ属性, n: 雑魚の数, mul: 強さ倍率）
function genWave(r, m, s, n, mul, bossOpt) {
  const enemies = [], rocks = [];
  const place = rad => {
    for (let k = 0; k < 40; k++) {
      const x = 40 + r() * (W - 80), y = TOP + 70 + r() * 300;
      if ([...enemies, ...rocks].every(o => Math.hypot(o.x - x, o.y - y) > o.r + rad + 20)) return { x, y };
    }
    return { x: 40 + r() * (W - 80), y: TOP + 70 + r() * 300 };
  };
  const atkMul = Math.pow(mul, 0.9);
  if (bossOpt) {
    enemies.push(boss(W / 2, TOP + 150, m, Math.round(160000 * mul * bossOpt.hpMul), Math.round(8000 * atkMul),
      bossOpt.cd || 3, bossOpt.name, { r: bossOpt.r || 46 }));
  }
  for (let i = 0; i < n; i++) {
    const el = r() < 0.7 ? m : s, big = r() < 0.15, rad = big ? 28 : 22;
    const p = place(rad);
    enemies.push(mob(p.x, p.y, el, Math.round((14000 + r() * 8000) * mul * (big ? 1.6 : 1)),
      Math.round((1800 + r() * 800) * atkMul), 2 + Math.floor(r() * 3),
      { r: rad, weak: r() < 0.45 ? (r() < 0.6 ? DOWN : r() * Math.PI * 2) : undefined, roam: big && r() < 0.5 }));
  }
  const nr = Math.floor(r() * 3.2);
  for (let i = 0; i < nr; i++) { const p = place(13); rocks.push(rock(p.x, p.y)); }
  return { boss: !!bossOpt, enemies, rocks };
}

// ストーリーの n 番目（0始まり）のステージ
function storyStage(n) {
  const ch = Math.floor(n / STAGES_PER_CHAPTER), k = n % STAGES_PER_CHAPTER;
  const [chName, m, s] = CHAPTERS[ch];
  const mul = 0.5 * (1 + n * 0.055);
  const bossStage = k === STAGES_PER_CHAPTER - 1, midBoss = k === 4;
  const waveCount = bossStage ? 3 : k >= 5 ? 3 : 2;
  const mobs = Math.min(6, 2 + Math.floor(n / 25));
  const rn = seeded(n * 7919 + 13);
  const bossName = `${EL[m].w}の${BOSS_TITLE[Math.floor(rn() * BOSS_TITLE.length)]}`;
  const waves = [];
  for (let w = 0; w < waveCount; w++) {
    const last = w === waveCount - 1;
    const bossOpt = last && bossStage ? { name: bossName, hpMul: 1.6, r: 52 }
      : last && midBoss ? { name: bossName, hpMul: 0.8 } : null;
    const seed = n * 1000 + w;
    waves.push(() => genWave(seeded(seed), m, s, bossOpt ? Math.max(1, mobs - 2) : mobs, mul, bossOpt));
  }
  return {
    id: "s" + n, kind: "story",
    name: `${ch + 1}-${k + 1} ${chName}`, sub: `${EL[m].n}属性中心 / ${EL[ADV_BY[m]].n}属性が有利`,
    boss: bossStage || midBoss, diff: diffStars(mul), mul: 1, par: waveCount * 3 + 1,
    bg: EL_BG[m], coin: 300 + n * 40, gem: bossStage ? 20 : midBoss ? 10 : 5, crEl: m, crN: 1 + Math.floor(n / 40),
    exp: 20 + Math.floor(n / 2), waves,
  };
}
