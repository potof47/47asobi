// ---- ランキング ---------------------------------------------------------
// オンラインランキング（Supabase）。url と key（anon public キー）を入れると全国ランキングになる。
// 空のままなら「この端末の記録」だけを表示する。設定方法は README を参照。
const RANKING = { url: "", key: "" };
const onlineRanking = () => !!(RANKING.url && RANKING.key);
let rankQuest = 0, rankCache = {};   // { [クエスト番号]: { status: "loading"|"ok"|"error", rows } }

function localRecords(q) { return (save.records && save.records[q]) || []; }
function addLocalRecord(q, turns, leader) {
  save.records = save.records || {};
  const list = save.records[q] = save.records[q] || [];
  list.push({ name: save.name || "あなた", turns, leader, at: Date.now() });
  list.sort((a, b) => a.turns - b.turns || a.at - b.at);
  list.length = Math.min(list.length, 10);
}

function rankHeaders(extra = {}) {
  return { apikey: RANKING.key, Authorization: `Bearer ${RANKING.key}`, ...extra };
}
async function fetchRanking(q) {
  if (!onlineRanking()) return;
  rankCache[q] = { status: "loading", rows: [] };
  try {
    const res = await fetch(`${RANKING.url}/rest/v1/scores?select=name,turns,leader,created_at&quest=eq.${q}&order=turns.asc,created_at.asc&limit=15`,
      { headers: rankHeaders() });
    if (!res.ok) throw new Error(String(res.status));
    rankCache[q] = { status: "ok", rows: await res.json() };
  } catch (e) {
    rankCache[q] = { status: "error", rows: [] };
  }
}
// 送信して順位（自分より少ないターンの記録数 + 1）を返す。失敗時は null
async function submitScore(q, turns, leader) {
  if (!onlineRanking() || !save.name) return null;
  try {
    const res = await fetch(`${RANKING.url}/rest/v1/scores`, {
      method: "POST",
      headers: rankHeaders({ "Content-Type": "application/json", Prefer: "return=minimal" }),
      body: JSON.stringify({ name: save.name, quest: q, turns, leader }),
    });
    if (!res.ok) throw new Error(String(res.status));
    delete rankCache[q];
    const cnt = await fetch(`${RANKING.url}/rest/v1/scores?select=id&quest=eq.${q}&turns=lt.${turns}`,
      { headers: rankHeaders({ Prefer: "count=exact", Range: "0-0" }) });
    const total = Number((cnt.headers.get("content-range") || "").split("/")[1]);
    return Number.isFinite(total) ? total + 1 : null;
  } catch (e) {
    return null;
  }
}

function askName() {
  return new Promise(resolve => {
    const box = document.getElementById("nameBox"), input = document.getElementById("nameInput");
    input.value = save.name || "";
    box.hidden = false;
    setTimeout(() => input.focus(), 50);
    document.getElementById("nameForm").onsubmit = e => {
      e.preventDefault();
      const v = input.value.trim().slice(0, 12);
      if (!v) return;
      save.name = v;
      persist();
      box.hidden = true;
      resolve(v);
    };
  });
}

function drawRanking() {
  drawMenuBg("#2a1a3a", "#08060f");
  drawTopBar();
  header("ランキング", "");
  button(W - 140, 48, 128, 26, save.name ? `名前: ${save.name}` : "名前を決める", () => askName(),
    { size: 11, c1: "#4a5280", c2: "#2b3158", fg: "#fff" });
  // クエスト選択（3列×2段）
  const tw = (W - 28) / 3;
  QUESTS.forEach((q, i) => {
    const x = 14 + (i % 3) * tw, y = 84 + Math.floor(i / 3) * 30, active = rankQuest === i;
    ctx.fillStyle = active ? "#ffd35c" : "rgba(255,255,255,0.08)";
    roundRect(x + 2, y, tw - 4, 26, 8);
    ctx.fill();
    txt(q.name, x + tw / 2, y + 13, 11, active ? "#1a1030" : "#cfd6ff", "center");
    button(x, y, tw, 26, "", () => { rankQuest = i; }, { hidden: true });
  });
  const q = QUESTS[rankQuest];
  txt(onlineRanking() ? "全国ランキング TOP15（少ないターン順）" : "この端末の記録（少ないターン順）", 16, 160, 12, "#ffd35c");
  txt(`S: ${q.par}T以内`, W - 16, 160, 11, "#9aa3d8", "right");

  let rows;
  if (onlineRanking()) {
    const cache = rankCache[rankQuest];
    if (!cache) { fetchRanking(rankQuest); rows = []; }
    else rows = cache.rows.map(r => ({ name: r.name, turns: r.turns, leader: r.leader }));
    if (cache && cache.status === "loading") txt("読み込み中…", W / 2, 240, 13, "#cfd6ff", "center");
    if (cache && cache.status === "error") {
      txt("ランキングを読み込めませんでした", W / 2, 230, 13, "#ff9a9a", "center");
      button(W / 2 - 60, 250, 120, 34, "再読み込み", () => fetchRanking(rankQuest), { size: 13 });
    }
  } else {
    rows = localRecords(rankQuest);
  }
  if (rows.length === 0 && (!onlineRanking() || (rankCache[rankQuest] && rankCache[rankQuest].status === "ok"))) {
    txt("まだ記録がありません。クリアして記録を残そう!", W / 2, 240, 13, "#cfd6ff", "center");
  }
  rows.slice(0, 15).forEach((r, i) => {
    const y = 178 + i * 26;
    const mine = r.name === (save.name || "あなた");
    ctx.fillStyle = mine ? "rgba(255,211,92,0.16)" : i % 2 ? "rgba(255,255,255,0.03)" : "rgba(255,255,255,0.07)";
    roundRect(12, y, W - 24, 23, 6);
    ctx.fill();
    const medal = ["#ffd23f", "#d8e0f0", "#d39a5a"][i];
    if (medal) {
      ctx.fillStyle = medal;
      ctx.beginPath(); ctx.arc(30, y + 11.5, 9, 0, Math.PI * 2); ctx.fill();
      txt(String(i + 1), 30, y + 12, 11, "#1a1030", "center", "900");
    } else {
      txt(String(i + 1), 30, y + 12, 12, "#cfd6ff", "center");
    }
    txt(r.name, 48, y + 12, 13, "#fff");
    txt(r.leader || "", 176, y + 12, 10, "#9aa3d8", "left", "normal");
    txt(`${r.turns}T`, W - 22, y + 12, 14, "#ffd35c", "right", "900");
  });
  drawNav();
}

function drawToast() {
  if (!toast) return;
  ctx.save();
  ctx.globalAlpha = Math.min(1, toast.life / 15);
  ctx.font = "bold 13px system-ui, sans-serif";
  const w = Math.min(W - 20, ctx.measureText(toast.text).width + 32);
  ctx.fillStyle = "rgba(0,0,0,0.85)";
  roundRect((W - w) / 2, H / 2 - 22, w, 44, 12);
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.3)";
  ctx.lineWidth = 1;
  ctx.stroke();
  txt(toast.text, W / 2, H / 2, 13, "#fff", "center");
  ctx.restore();
}

    default: drawBattle();
  }

  drawToast();
}

// ---- 初期化・メインループ ----------------------------------------------
function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  const dpr = window.devicePixelRatio || 1;
  canvas.style.width = W * s + "px";
  canvas.style.height = H * s + "px";
  canvas.width = Math.round(W * s * dpr);
  canvas.height = Math.round(H * s * dpr);
  ctx.setTransform(s * dpr, 0, 0, s * dpr, 0, 0);
}
window.addEventListener("resize", resize);

const STEP = 1000 / 60;
let acc = 0, last = performance.now();
function frame(t) {
  acc += Math.min(t - last, 100);
  last = t;
  while (acc >= STEP) { update(); acc -= STEP; }
  draw();
  requestAnimationFrame(frame);
}

loadSave();
loadGifts();
resize();
// オフライン対応・ホーム画面に追加のためのサービスワーカー
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => { /* 対応していない環境 */ });
}
requestAnimationFrame(t => { last = t; frame(t); });
</script>
