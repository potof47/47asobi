// ---- サウンド（BGM・効果音）。音はすべてその場で合成する（音声ファイルなし） -------------
let actx = null, masterGain = null, bgmGain = null, seGain = null, noiseBuf = null;
let bgmName = null, bgmStep = 0, bgmNext = 0, bgmTimer = null;
const seLast = {};
function audioUnlock() {
  if (!save || !save.sound) return;
  try {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      actx = new AC();
      masterGain = actx.createGain(); masterGain.gain.value = 0.5; masterGain.connect(actx.destination);
      bgmGain = actx.createGain(); bgmGain.gain.value = 0.3; bgmGain.connect(masterGain);
      seGain = actx.createGain(); seGain.gain.value = 0.6; seGain.connect(masterGain);
      bgmTimer = setInterval(bgmTick, 50);
    }
    if (actx.state === "suspended") actx.resume();
  } catch (e) { actx = null; }
}
function setSound(on) {
  save.sound = on;
  persist();
  if (on) audioUnlock(); else bgmName = null;
}
const soundOk = () => !!(actx && save && save.sound && actx.state === "running");
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
// 1音: 波形・周波数・長さ・音量・開始時刻・（変化先の周波数）・（出力先）
function tone(type, freq, dur, vol, t0, freq2, dest) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  if (freq2) o.frequency.exponentialRampToValueAtTime(freq2, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g);
  g.connect(dest || seGain);
  o.start(t0);
  o.stop(t0 + dur + 0.02);
}
function noise(dur, vol, t0, hp = 800, dest) {
  if (!noiseBuf) {
    noiseBuf = actx.createBuffer(1, actx.sampleRate * 0.5, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = noiseBuf;
  f.type = "highpass";
  f.frequency.value = hp;
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(dest || seGain);
  s.start(t0);
  s.stop(t0 + dur + 0.02);
}
function playSe(name) {
  if (!soundOk()) return;
  const now = actx.currentTime;
  // 同じ音の連打は間引く
  const gap = { hit: 0.05, weak: 0.06, kill: 0.06, tap: 0.04, damage: 0.08 }[name] || 0.02;
  if (seLast[name] && now - seLast[name] < gap) return;
  seLast[name] = now;
  const seq = (notes, type, len, vol, step) => notes.forEach((m, i) => tone(type, mtof(m), len, vol, now + i * step));
  switch (name) {
    case "tap":     tone("square", 880, 0.05, 0.06, now); break;
    case "shot":    noise(0.18, 0.22, now, 1200); tone("triangle", 300, 0.18, 0.18, now, 700); break;
    case "ss":      tone("sawtooth", 200, 0.5, 0.15, now, 1200); seq([72, 76, 79, 84], "square", 0.25, 0.07, 0.06); break;
    case "hit":     tone("square", 520 + Math.random() * 200, 0.06, 0.06, now, 260); break;
    case "weak":    tone("square", 1100, 0.08, 0.08, now, 600); tone("triangle", 1650, 0.08, 0.06, now); break;
    case "kill":    noise(0.25, 0.25, now, 300); tone("sawtooth", 220, 0.25, 0.1, now, 60); break;
    case "combo":   seq([76, 80, 83, 88], "triangle", 0.12, 0.09, 0.04); break;
    case "damage":  tone("sawtooth", 140, 0.25, 0.18, now, 50); noise(0.15, 0.18, now, 200); break;
    case "heal":    seq([84, 89, 93], "sine", 0.18, 0.08, 0.05); break;
    case "warp":    tone("sine", 300, 0.3, 0.14, now, 1500); break;
    case "mine":    noise(0.35, 0.35, now, 150); tone("square", 90, 0.3, 0.16, now, 40); break;
    case "wave":    seq([67, 72, 76], "square", 0.12, 0.08, 0.08); break;
    case "clear":   seq([72, 76, 79, 84, 79], "square", 0.14, 0.1, 0.11); tone("square", mtof(84), 0.6, 0.1, now + 0.55); break;
    case "lose":    seq([67, 63, 60, 55], "triangle", 0.3, 0.1, 0.18); break;
    case "gacha":   tone("triangle", 660, 0.15, 0.1, now, 1320); break;
    case "rare":    seq([79, 83, 86, 91], "square", 0.2, 0.08, 0.07); break;
    case "fanfare": [72, 72, 72, 76, 79, 84].forEach((m, i) => tone("square", mtof(m), i === 5 ? 0.7 : 0.12, 0.1, now + [0, 0.1, 0.2, 0.35, 0.5, 0.7][i]));
                    noise(0.6, 0.12, now + 0.7, 3000); break;
    case "coin":    tone("square", 988, 0.07, 0.08, now); tone("square", 1319, 0.2, 0.08, now + 0.07); break;
  }
}
// BGM（オリジナル曲）: 8分音符 32コマ（4小節）を繰り返す。chords は小節ごとのベースの音
const SONGS = {
  home: { bpm: 100, lead: "triangle", chords: [48, 45, 41, 43], bass: [0, null, 7, null, 12, null, 7, null], drums: false,
    mel: [72, 0, 76, 79, 0, 76, 74, 72,  69, 0, 72, 76, 0, 74, 72, 69,  65, 69, 72, 0, 74, 72, 69, 0,  67, 71, 74, 0, 79, 0, 77, 74] },
  battle: { bpm: 140, lead: "square", chords: [45, 41, 43, 40], bass: [0, 0, 12, 0, 0, 0, 12, 7], drums: true,
    mel: [69, 72, 76, 72, 69, 72, 76, 77,  77, 76, 72, 69, 65, 69, 72, 0,  74, 0, 71, 74, 79, 77, 76, 74,  76, 80, 83, 80, 76, 0, 0, 0] },
  boss: { bpm: 152, lead: "sawtooth", chords: [38, 46, 48, 45], bass: [0, 12, 0, 12, 0, 12, 7, 12], drums: true,
    mel: [74, 0, 74, 77, 74, 72, 70, 69,  70, 0, 74, 77, 82, 81, 77, 74,  72, 0, 76, 79, 84, 82, 81, 79,  81, 0, 73, 76, 81, 0, 79, 0] },
};
function wantBgm() {
  if (BATTLE.has(state)) {
    if (state === "clear" || state === "over") return null;
    return enemies.some(e => e.boss && !e.dead) ? "boss" : "battle";
  }
  return state === "gachaAnim" ? null : "home";
}
function bgmTick() {
  if (!soundOk()) return;
  const want = wantBgm();
  if (want !== bgmName) {
    bgmName = want;
    bgmStep = 0;
    bgmNext = actx.currentTime + 0.1;
  }
  if (!bgmName) return;
  const song = SONGS[bgmName], step = 60 / song.bpm / 2;
  if (bgmNext < actx.currentTime - 0.3) bgmNext = actx.currentTime + 0.05;   // 裏に回っていた時など
  while (bgmNext < actx.currentTime + 0.2) {
    const i = bgmStep % 32, root = song.chords[Math.floor(i / 8)];
    const m = song.mel[i];
    if (m) tone(song.lead, mtof(m), step * 0.85, song.lead === "sawtooth" ? 0.05 : 0.08, bgmNext, null, bgmGain);
    const b = song.bass[i % 8];
    if (b !== null) tone("triangle", mtof(root + b), step * 0.9, 0.16, bgmNext, null, bgmGain);
    if (song.drums) {
      if (i % 4 === 0) tone("sine", 150, 0.15, 0.3, bgmNext, 45, bgmGain);
      if (i % 4 === 2) noise(0.1, 0.12, bgmNext, 1500, bgmGain);
      noise(0.03, 0.04, bgmNext, 7000, bgmGain);
    } else if (i % 8 === 0) {
      // 小節の頭にやわらかい和音
      for (const d of [12, 19, 24]) tone("sine", mtof(root + d), step * 7, 0.03, bgmNext, null, bgmGain);
    }
    bgmNext += step;
    bgmStep++;

}

function saState() {
  const wk = weekIdx();
  if (!save.sa || save.sa.week !== wk) save.sa = { week: wk, best: 0, tiers: 0, rec: [] };
  return save.sa;
}
// スコア = クリア100000 + 早さ + 残りHP + ヒット・弱点・撃破・友情コンボ・最大ヒット数
function calcScore() {
  return 100000 + Math.max(0, 30 - turn) * 8000 + Math.round(hp / maxHp * 100000)
    + bstat.hits * 60 + bstat.weak * 400 + bstat.kills * 3000 + bstat.combos * 1500 + bstat.maxHit * 800;
}
function scoreFinish(q, r) {
  const sc = calcScore(), sa = saState(), leader = leaderLabel();
  r.score = sc;
  r.scoreBest = sc > sa.best;
  if (r.scoreBest) sa.best = sc;
  r.best = sa.best;
  let g = 0;
  while (sa.tiers < SA_TIERS.length && sa.best >= SA_TIERS[sa.tiers].s) { g += SA_TIERS[sa.tiers].gem; sa.tiers++; }
  save.gems += g;
  r.tierGem = g;
  sa.rec = (sa.rec || []).concat({ name: save.name || "あなた", score: sc, leader, at: Date.now() })
    .sort((a, b) => b.score - a.score).slice(0, 10);
  persist();
  if (onlineRanking()) {
    (save.name ? Promise.resolve() : askName())
      .then(() => submitEventScore(q.week, sc, leader))
      .then(rank => { r.netRank = rank; });
  }
}

  { name: "深海王クラーケン",   el: "water" },
  { name: "世界樹の魔神",       el: "wood" },
  { name: "天空神ソラリオン",   el: "light" },
  { name: "虚無竜ヴォイド",     el: "dark" },
];
const raidOnline = () => onlineRanking();
const raidId = () => "r" + weekIdx();
const raidBoss = wk => RAID_BOSSES[wk % RAID_BOSSES.length];
const raidMaxHp = () => raidOnline()
  ? cfgNum(CFG.raid && CFG.raid.hp, 1e5, 1e13, 500000000)
  : cfgNum(CFG.raid && CFG.raid.soloHp, 1e5, 1e12, 30000000);

}
function raidRemain() {
  raidInfo.maxHp = raidMaxHp();
  const live = raidBattle.done ? 0 : raidBattle.dmg;
  const used = raidOnline() ? (raidInfo.id === raidId() ? raidInfo.total : 0) : raidState().dmg;
  return Math.max(0, raidInfo.maxHp - used - live);

async function fetchRaid(id) {
  if (!raidOnline()) return;
  raidBattle.busy = true;
  if (raidInfo.id !== id) raidInfo = { ...raidInfo, id, total: 0, players: 0, top: [] };
  raidInfo.status = "loading";
  try {
    const t = await sbGet(`raid_totals?select=total,players&raid=eq.${id}`);
    const top = await sbGet(`raid_top?select=name,dmg&raid=eq.${id}&order=dmg.desc&limit=8`);
    raidInfo = { ...raidInfo, id, total: Number((t[0] && t[0].total) || 0), players: Number((t[0] && t[0].players) || 0),
      top, status: "ok" };

function raidQuest(wk) {
  const B = raidBoss(wk), m = B.el, s = ADV_BY[ADV_BY[m]] || EL_KEYS[(wk + 1) % 5];
  const gims = [GIM_KEYS[(wk + 2) % GIM_KEYS.length]];
  return {
    id: "r" + wk, kind: "raid", week: wk, name: `協力レイド ${B.name}`, turnLimit: RAID_TURNS,
    sub: `${EL[m].n}属性 / ${EL[ADV_BY[m]].n}属性が有利`, boss: true, diff: 7, mul: 1, par: RAID_TURNS,
    bg: ["#3a1020", "#0c0206"], coin: 0, gem: 0, crEl: m, crN: 0, exp: 0, gims,
    waves: [() => {
      const r = seeded(440000 + wk);
      const w = genWave(r, m, s, 2, 2, null, false, gims);
      const e = boss(W / 2, TOP + 175, m, 1e10, 9000, 2, B.name, { r: 64 });
      e.raid = true;
      // ボスと重なる敵・ギミックは置かない
      const far = o => Math.hypot(o.x - e.x, o.y - e.y) > e.r + (o.r || 10) + 12;
      w.enemies = w.enemies.filter(far);
      w.rocks = w.rocks.filter(far);
      w.gim.warps = w.gim.warps.filter(far);
      w.gim.mines = w.gim.mines.filter(far);
      w.gim.gbars = w.gim.gbars.filter(g => w.enemies.some(o => o.x === g.x && o.y === g.y));
      w.enemies.unshift(e);
      w.boss = true;

}
function raidBattleStart(q) {

function raidPoll() {
  if (!raidOnline() || raidBattle.done || raidBattle.busy) return;
  if (++raidBattle.pollT % 600 !== 0) return;
  fetchRaid(quest.id).then(() => {

function guestHelpers() {
  const r = seeded(Math.floor(Date.now() / DAY) * 13 + 7);
  const pool = [...PERM6, ...EVENT_CHARS, ...FAM.filter(f => f.rar === 5 && !f.event && !f.drop).map(f => f.idx)];
  return GUEST_NAMES.map(name => {
    const fi = pool.splice(Math.floor(r() * pool.length), 1)[0], six = FAM[fi].rar >= 6 || r() < 0.6;   // 同じキャラは出さない
    return { name, guest: true, title: "", fi, rar: six ? 6 : FAM[fi].rar, lv: six ? 70 + Math.floor(r() * 30) : 50 + Math.floor(r() * 20),
      awk: Math.floor(r() * 6), luck: Math.floor(r() * 60), trial: FAM[fi].rar >= 6 && r() < 0.3 ? 1 : 0 };
  });
}
async function fetchHelpers() {
  if (!onlineRanking()) { helperStatus = "offline"; return; }
  helperStatus = "loading";
  try {
    const cols = "select=name,title,fi,rar,lv,awk,luck,trial";
    let rows = await sbGet(`helpers?${cols}&order=created_at.desc&limit=80`);
    // フレンドは古い登録でも必ず取ってくる
    if (save.friends.length) {
      const names = save.friends.map(n => `"${n.replace(/["\\]/g, "")}"`).join(",");
      rows = (await sbGet(`helpers?${cols}&name=in.(${encodeURIComponent(names)})&order=created_at.desc&limit=100`)).concat(rows);
    }
    const seen = new Set(), list = [];
    for (const h of rows) {
      if (seen.has(h.name) || h.name === save.name || !FAM[h.fi] || !RBASE[h.rar]) continue;
      seen.add(h.name);
      list.push({ ...h, lv: Math.min(MAXLV[h.rar], h.lv) });
    }
    const near = n => isFriend(n) * 2 + isMate(n);
    list.sort((a, b) => near(b.name) - near(a.name));   // フレンド → チームの仲間 の順に上
    helperList = list.slice(0, 8);
    helperStatus = "ok";
  } catch (e) {
    helperStatus = "error";   // まだ表がない時など
  }
  helperAt = Date.now();
}

    let tx = x + s / 2 - (ws.reduce((a, b) => a + b, 0) + (ab.length - 1) * 3) / 2;
    ab.forEach((k, j) => { txt(ABIL[k].s, tx, py + s + 9, 8, need.includes(k) ? "#7cf0ff" : "#8088b0", "left", "900"); tx += ws[j] + 3; });
    txt(i === 0 ? "リーダー" : `${i + 1}番手`, x + s / 2, py + s + 21, 9, i === 0 ? "#ffd35c" : "#cfd6ff", "center", "normal");
    button(x, py, s, s, "", () => {
      if (save.party.length <= 1) { showToast("1体以上必要です"); return; }
      save.party.splice(i, 1);
      persist();
    }, { hidden: true });
  }
  // 5枠目: 助っ人（タップでえらぶ）
  {
    const x = x0 + 4 * (s + gap), h = prepHelper;
    if (h) {
      const f = FAM[h.fi];
      ctx.save();
      roundRect(x, py, s, s, 9);
      ctx.fillStyle = EL[f.el].d;
      ctx.fill();
      ctx.strokeStyle = "#7cf0ff";
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.clip();
      drawChar({ shape: f.shape, el: f.el, acc: f.acc, eye: f.eye, rar: h.rar, evo: h.rar > f.rar }, x + s / 2, py + s * 0.56, s * 0.25);
      ctx.restore();
      const ab = abilOf(h.fi, h.rar);
      if (ab.some(k => need.includes(k))) ok++;
      txt(ab.map(k => ABIL[k].s).join(" "), x + s / 2, py + s + 9, 8, ab.some(k => need.includes(k)) ? "#7cf0ff" : "#8088b0", "center", "900");
      txt(h.name.slice(0, 6), x + s / 2, py + s + 21, 9, "#7cf0ff", "center", "normal");
    } else {
      ctx.strokeStyle = "#7cf0ff";
      ctx.setLineDash([5, 4]);
      ctx.lineWidth = 2;
      roundRect(x, py, s, s, 10);
      ctx.stroke();
      ctx.setLineDash([]);
      txt("＋", x + s / 2, py + s / 2 - 6, 20, "#7cf0ff", "center", "900");
      txt("助っ人", x + s / 2, py + s / 2 + 14, 10, "#7cf0ff", "center");
      txt("えらぶ", x + s / 2, py + s + 21, 9, "#7cf0ff", "center", "normal");
    }
    button(x, py, s, s, "", () => { helperPickOpen = true; }, { hidden: true });
  }
  const total = save.party.reduce((t, fi) => t + unitStats(fi).hp, 0);
  const members = save.party.length + (prepHelper ? 1 : 0);
  txt(need.length ? `対策できるキャラ ${ok} / ${members}` : "ギミックなし", 16, 226, 12, need.length ? (ok ? "#7cf0ff" : "#ff9ab8") : "#9aa3d8");
  txt(`合計HP ${total.toLocaleString()}`, W - 16, 226, 12, "#7dffa0", "right");
  // キャラ一覧（対策キャラに水色の帯、タップで入れる/外す）
  drawGrid(238, fi => {
    if (!owned(fi)) { showToast(`${FAM[fi].name}: ${howToGet(FAM[fi])}`); return; }
    const k = save.party.indexOf(fi);
    if (k >= 0) {
      if (save.party.length <= 1) { showToast("1体以上必要です"); return; }
      save.party.splice(k, 1);
    } else if (save.party.length >= 4) {
      showToast("4体まで。上の枠をタップして外そう");
      return;
    } else {
      save.party.push(fi);
    }
    persist();
  }, {
    mark: fi => { const k = save.party.indexOf(fi); return k >= 0 ? (k === 0 ? "L" : String(k + 1)) : ""; },
    badge: fi => abilOf(fi).filter(k => need.includes(k)).map(k => ABIL[k].s).join("・"),
    dim: fi => q.kind === "typed" && FAM[fi].type !== q.ptype,
  });
  if (ng) txt(ng, W / 2, 596, 12, "#ff9ab8", "center");
  button(40, ng ? 606 : 592, W - 80, ng ? 30 : 42, "出撃!", () => startQuest(prepId),
    { size: ng ? 13 : 18, c1: "#ff9a5a", c2: "#d64a2a", fg: "#fff", disabled: !!ng });
  if (helperPickOpen) drawHelperPick(q, need);
}

// ---- 初期化・メインループ ----------------------------------------------
function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  const dpr = window.devicePixelRatio || 1;
  canvas.style.width = W * s + "px";
  canvas.style.height = H * s + "px";
  canvas.width = Math.round(W * s * dpr);
  canvas.height = Math.round(H * s * dpr);
  ctx.setTransform(s * dpr, 0, 0, s * dpr, 0, 0);
}
window.addEventListener("resize", resize);

const STEP = 1000 / 60;
let acc = 0, last = performance.now();
function frame(t) {
  acc += Math.min(t - last, 100);
  last = t;
  while (acc >= STEP) { update(); acc -= STEP; }
  draw();
  requestAnimationFrame(frame);
}

loadSave();
loadGifts();
loadConfig();
resize();
// オフライン対応・ホーム画面に追加のためのサービスワーカー
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => { /* 対応していない環境 */ });
}
requestAnimationFrame(t => { last = t; frame(t); });
</script>
