<style>

    display: flex;

  }
  canvas {
    display: block;
    touch-action: none;
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(90, 120, 255, 0.25);
  }
  /* ランキング用の名前入力 */
  #nameBox {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.6);
    z-index: 10;
  }
  #nameBox[hidden] { display: none; }
  #nameForm {
    width: min(300px, 86vw);
    padding: 18px;
    border: 2px solid #ffd35c;
    border-radius: 14px;
    background: #1b1f3e;
    color: #fff;

    margin: 12px 0;
    padding: 10px;
    border: none;
    border-radius: 8px;
    font-size: 18px;

  #nameForm button {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(#ffcf4a, #ff8f1f);
    color: #3a1c00;
    font: bold 16px system-ui, sans-serif;

  #nameForm button.sub { margin-top: 8px; background: #3a4170; color: #fff; }

    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.7);
    z-index: 10;

    padding: 18px;
    border: 2px solid #5ef0ff;
    border-radius: 14px;
    background: #1b1f3e;
    color: #fff;
    font: bold 15px system-ui, sans-serif;
    text-align: center;
  }
  #codeText {
    width: 100%;
    height: 110px;
    box-sizing: border-box;
    margin: 12px 0 6px;
    padding: 8px;
    border: none;
    border-radius: 8px;
    font: 12px/1.4 ui-monospace, monospace;
    word-break: break-all;
    resize: none;

    margin-top: 6px;
    padding: 10px;
    border: none;
    border-radius: 10px;

    <button type="submit">決定</button>
    <button type="button" id="nameCancel" class="sub">やめる</button>
  </form>
</div>
<div id="codeBox" hidden>
  <div id="codePanel">
    <div id="codeTitle"></div>
    <textarea id="codeText" spellcheck="false" autocomplete="off"></textarea>
    <div id="codeNote"></div>
    <button id="codeMain" type="button"></button>
    <button id="codeClose" class="sub" type="button">閉じる</button>
  </div>

// 古いセーブや引き継ぎコードを読み込む時に、足りない項目を補い、おかしな値を直す
function normalizeSave(s) {
  const d = newSave();

  out.gems = int(s.gems, 0, 1e9, d.gems);
  out.coins = int(s.coins, 0, 1e10, d.coins);
  out.cr = {};
  for (const k of EL_KEYS) out.cr[k] = int(s.cr && s.cr[k], 0, 1e6, 0);

const expNeed = rank => 100 + rank * 20;
// 経験値を足してランクアップ分のジェムを渡す（ランクに上限なし）
function addExp(n) {
  save.exp += n;
  let ranks = 0, gems = 0;
  while (save.exp >= expNeed(save.rank)) {
    save.exp -= expNeed(save.rank);
    save.rank++;
    ranks++;
    const g = 10 + (save.rank % 10 === 0 ? 50 : 0);
    gems += g;
  }
  save.gems += gems;
  return { ranks, gems };
}

  // タイプ補正 [攻撃力, HP]: 反射は攻撃力1.8倍・HP1.1倍

  const pb = (isLimited(fi) ? 1 : PERM_BONUS) * TRIAL_MUL[tt];   // 恒常キャラの底上げ × 試練の強化
  return {
    atk: Math.round(b.atk * v * tm[0] * lvm * am * bo * pb),
    hp: Math.round(b.hp * (2 - v) * tm[1] * lvm * am * bo * pb),

// ---- 自動生成ステージ（ストーリー200ステージ・無限の塔） ---------------------------
// 同じ番号なら毎回同じ配置になるよう、番号から乱数を作る
function seeded(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// 1つのWAVEを作る（r: 乱数, m/s: メイン/サブ属性, n: 雑魚の数, mul: 強さ倍率）
// hard: ガード（弱点以外1/4）・再生持ちの敵が出る高難度モード
function genWave(r, m, s, n, mul, bossOpt, hard = false, gims = []) {
  const enemies = [], rocks = [];
  const place = rad => {
    for (let k = 0; k < 40; k++) {
      const x = 40 + r() * (W - 80), y = TOP + 70 + r() * 300;
      if ([...enemies, ...rocks].every(o => Math.hypot(o.x - x, o.y - y) > o.r + rad + 20)) return { x, y };
    }
    return { x: 40 + r() * (W - 80), y: TOP + 70 + r() * 300 };
  };
  const atkMul = Math.pow(mul, 0.9);
  if (bossOpt) {
    enemies.push(boss(W / 2, TOP + 150, m, Math.round(160000 * mul * bossOpt.hpMul), Math.round(8000 * atkMul),
      bossOpt.cd || 3, bossOpt.name, { r: bossOpt.r || 46, guard: hard, regen: hard ? 0.04 : 0 }));
  }
  for (let i = 0; i < n; i++) {
    const el = r() < 0.7 ? m : s, big = r() < 0.15, rad = big ? 28 : 22;
    const p = place(rad);
    // ガード持ちは必ず弱点を持つ（弱点を狙えば倒せる）
    const guard = hard && r() < 0.45;
    const weak = guard || r() < 0.45 ? (r() < 0.6 ? DOWN : r() * Math.PI * 2) : undefined;
    enemies.push(mob(p.x, p.y, el, Math.round((14000 + r() * 8000) * mul * (big ? 1.6 : 1)),
      Math.round((1800 + r() * 800) * atkMul), 2 + Math.floor(r() * 3),
      { r: rad, weak, roam: big && r() < 0.5, guard, regen: hard && r() < 0.25 ? 0.06 : 0 }));
  }
  const nr = Math.floor(r() * 3.2);
  for (let i = 0; i < nr; i++) { const p = place(13); rocks.push(rock(p.x, p.y)); }
  const gim = makeGimmicks(r, gims, place, enemies, rocks);
  // 特殊な敵（強いステージほど多い）。配置は変えずに種類だけ決める
  const kr = seeded(Math.floor(r() * 1e9));
  const p = hard ? 0.45 : mul >= 1.6 ? 0.3 : mul >= 0.8 ? 0.15 : 0;
  for (const e of enemies) {
    if (e.boss || kr() >= p) continue;
    e.kind = ENEMY_KINDS[Math.floor(kr() * ENEMY_KINDS.length)];
    if (e.kind === "turret") e.weak = e.weak === null ? DOWN : e.weak;
  }
  return { boss: !!bossOpt, enemies, rocks, gim };
}

// warp: ワープ（AWがないと別のワープへ飛ばされる） / mine: 地雷（地雷回収がないとダメージ）
// dwall: ダメージウォール（ADWがないと壁に当たるとダメージ） / gbar: 重力バリア（AGBがないと大きく減速）
// block: 左右に動くブロック
const GIM = {
  warp:  { n: "ワープ",           abil: "AW" },
  mine:  { n: "地雷",             abil: "MK" },
  dwall: { n: "ダメージウォール", abil: "ADW" },
  gbar:  { n: "重力バリア",       abil: "AGB" },
  block: { n: "動くブロック",     abil: "AB" },
};
const GIM_KEYS = Object.keys(GIM);
const emptyGim = () => ({ warps: [], mines: [], dwall: [], gbars: [] });
const MAX_GIMS = 3;   // 1つのステージに同時に出るギミックは3つまで
function makeGimmicks(r, gims, place, enemies, rocks) {
  const g = emptyGim();
  gims = gims.slice(0, MAX_GIMS);
  if (gims.includes("warp")) {
    const n = 2 + Math.floor(r() * 2);
    for (let i = 0; i < n; i++) { const p = place(16); g.warps.push({ x: p.x, y: p.y, r: 16 }); }
  }
  if (gims.includes("mine")) {
    const n = 4 + Math.floor(r() * 3);
    for (let i = 0; i < n; i++) { const p = place(9); g.mines.push({ x: p.x, y: p.y, r: 9, taken: false }); }
  }
  if (gims.includes("dwall")) {
    const sides = ["left", "right", "top"];
    const skip = Math.floor(r() * 3);
    g.dwall = sides.filter((_, i) => i !== skip);
  }
  if (gims.includes("gbar")) {
    // 敵のまわりに重力バリア（2〜3個）
    const targets = [...enemies].sort(() => r() - 0.5).slice(0, 2 + Math.floor(r() * 2));
    for (const e of targets) g.gbars.push({ x: e.x, y: e.y, r: e.r + 30 });
  }
  if (gims.includes("block")) {
    for (let i = 0; i < 2; i++) {
      const p = place(14);
      rocks.push({ x: p.x, y: p.y, r: 14, x0: p.x, amp: 40 + r() * 50, spd: 0.02 + r() * 0.02, ph: r() * 6, block: true });
    }
  }
  return g;
}
// ストーリー・塔のギミック（序盤はなし、だんだん増える）
function storyGims(n) {
  const ch = Math.floor(n / STAGES_PER_CHAPTER);
  if (ch < 2) return [];
  const a = GIM_KEYS[(ch - 2) % GIM_KEYS.length];
  if (ch < 8) return [a];
  return [a, GIM_KEYS[(ch + 1) % GIM_KEYS.length]].filter((k, i, l) => l.indexOf(k) === i);
}
function floorGims(f, two) {
  if (f < 10 && !two) return [];
  const a = GIM_KEYS[f % GIM_KEYS.length], b = GIM_KEYS[(f * 3 + 1) % GIM_KEYS.length];
  return two || f >= 50 ? [a, b].filter((k, i, l) => l.indexOf(k) === i) : [a];
}
const gimText = gims => gims.map(k => GIM[k].n).join("・");
const gimCounter = gims => gims.filter(k => GIM[k].abil).map(k => ABIL[GIM[k].abil].s).join("・");

const diffStars = mul => Math.max(1, Math.min(6, Math.round(1 + Math.log2(mul / 0.5) * 1.4)));

// ストーリーの n 番目（0始まり）のステージ
function storyStage(n) {
  const ch = Math.floor(n / STAGES_PER_CHAPTER), k = n % STAGES_PER_CHAPTER;
  const [chName, m, s] = CHAPTERS[ch];
  const mul = 0.5 * (1 + n * 0.055);
  const bossStage = k === STAGES_PER_CHAPTER - 1, midBoss = k === 4;
  const waveCount = bossStage ? 3 : k >= 5 ? 3 : 2;
  const mobs = Math.min(6, 2 + Math.floor(n / 25));
  const rn = seeded(n * 7919 + 13);
  const bossName = `${EL[m].w}の${BOSS_TITLE[Math.floor(rn() * BOSS_TITLE.length)]}`;
  const gims = storyGims(n);
  const waves = [];
  for (let w = 0; w < waveCount; w++) {
    const last = w === waveCount - 1;
    const bossOpt = last && bossStage ? { name: bossName, hpMul: 1.6, r: 52 }
      : last && midBoss ? { name: bossName, hpMul: 0.8 } : null;
    const seed = n * 1000 + w;
    waves.push(() => genWave(seeded(seed), m, s, bossOpt ? Math.max(1, mobs - 2) : mobs, mul, bossOpt, false, gims));
  }
  return {
    id: "s" + n, kind: "story",
    name: `${ch + 1}-${k + 1} ${chName}`, sub: `${EL[m].n}属性中心 / ${EL[ADV_BY[m]].n}属性が有利`,
    boss: bossStage || midBoss, diff: diffStars(mul), mul: 1, par: waveCount * 3 + 1,
    bg: EL_BG[m], coin: 300 + n * 40, gem: bossStage ? 20 : midBoss ? 10 : 5, crEl: m, crN: 1 + Math.floor(n / 40),
    exp: 20 + Math.floor(n / 2), waves, gims, bossName, chapter: ch, stage: k,
  };
}

// 反射専用・貫通専用ステージ（そのタイプのキャラだけで編成して挑戦。各10ステージ）
const TYPE_STAGES = 10;
const TYPE_NAME = { reflect: "反射", pierce: "貫通" };
const typeId = (type, i) => `y${type === "reflect" ? "r" : "p"}${i}`;

// 反射: 敵を壁ぎわに置き、前に岩（壁と岩の間で何度も跳ね返る）
// 貫通: 敵を縦2列に並べる（まとめて貫ける）
function typeWave(r, type, m, s, n, mul, bossOpt, gims, hard) {
  const w = genWave(r, m, s, n, mul, bossOpt, hard);
  const mobs = w.enemies.filter(e => !e.boss);
  w.rocks = [];
  if (type === "pierce") {
    mobs.forEach((e, k) => { e.x = k % 2 ? W - 66 : 66; e.y = TOP + 70 + Math.floor(k / 2) * 66; });
  } else {
    const spots = [[44, TOP + 60], [W - 44, TOP + 60], [44, TOP + 300], [W - 44, TOP + 300], [44, TOP + 180], [W - 44, TOP + 180]];
    mobs.forEach((e, k) => {
      const [x, y] = spots[k % spots.length];
      e.x = x; e.y = y;
      w.rocks.push(rock(x < W / 2 ? x + 66 : x - 66, y + 34, 14));
    });
  }
  addGimmicks(w, gims, r);
  return w;
}
// できあがったWAVEに、敵や岩と重ならないようギミックを置く
function addGimmicks(w, gims, r) {
  w.rocks = w.rocks || [];
  const place = rad => {
    for (let k = 0; k < 40; k++) {
      const x = 40 + r() * (W - 80), y = TOP + 70 + r() * 300;
      if ([...w.enemies, ...w.rocks].every(o => Math.hypot(o.x - x, o.y - y) > o.r + rad + 20)) return { x, y };
    }
    return { x: 40 + r() * (W - 80), y: TOP + 70 + r() * 300 };
  };
  w.gim = makeGimmicks(r, gims, place, w.enemies, w.rocks);
}
function typeStage(type, i) {
  const t = type === "reflect" ? 0 : 1;
  const m = EL_KEYS[(i * 2 + t) % 5], s = EL_KEYS[(i * 3 + 2) % 5];
  const mul = 1.2 * Math.pow(1.38, i), hard = i >= 5;
  const gims = i < 2 ? [] : i < 6 ? [GIM_KEYS[(i + t * 2) % GIM_KEYS.length]]
    : [GIM_KEYS[(i + t) % GIM_KEYS.length], GIM_KEYS[(i + t + 2) % GIM_KEYS.length]];
  const waves = [0, 1, 2].map(w => () => typeWave(seeded(970000 + t * 1000 + i * 10 + w), type, m, s,
    w === 2 ? 3 : 4 + (i >= 5 ? 1 : 0), mul, w === 2 ? { name: `${TYPE_NAME[type]}の番人`, hpMul: 1.5 + i * 0.1, r: 50 } : null, gims, hard));
  return {
    id: typeId(type, i), kind: "typed", ptype: type, idx: i, name: `${TYPE_NAME[type]}専用 ${i + 1}`,
    sub: `${TYPE_NAME[type]}タイプだけで挑戦 / ${EL[m].n}属性中心${hard ? " / ガード・再生" : ""}`, boss: true,
    diff: Math.min(12, 2 + i), mul: 1, par: 10,
    bg: type === "reflect" ? ["#0f2a3a", "#040c12"] : ["#3a2a0f", "#120c04"],
    coin: 2000 + i * 1500, gem: 30 + i * 20, crEl: m, crN: 2 + i, exp: 60 + i * 30, waves, gims,
  };
}

function partyProblem(q) {

  if ((q.kind === "trial" || q.kind === "super") && !party.includes(q.fi)) return `${FAM[q.fi].name}を編成に入れて挑戦しよう`;
  if (q.kind === "typed" && party.some(fi => FAM[fi].type !== q.ptype)) return `${TYPE_NAME[q.ptype]}タイプのキャラだけで編成しよう`;
  if (q.kind === "typed" && prepHelper && prepHelperFor === q.id && FAM[prepHelper.fi].type !== q.ptype) return `助っ人も${TYPE_NAME[q.ptype]}タイプにしよう`;

// クエストID: 数字=スペシャル、"s番号"=ストーリー、"t階"=無限の塔、"u階"=深淵の塔、"xキャラ_段階"=試練
function getQuest(id) {
  if (typeof id === "number") return { ...QUESTS[id], id, kind: "special", exp: 60 * QUESTS[id].diff };
  if (id[0] === "s") return storyStage(Number(id.slice(1)));
  if (id[0] === "u") return abyssFloor(Number(id.slice(1)));
  if (id[0] === "x") { const [fi, tier] = id.slice(1).split("_").map(Number); return trialQuest(fi, tier); }
  // "e降臨_難易度"=降臨、"a週"=スコアアタック、"r週"=協力レイド
  if (id[0] === "e") { const [b, lv] = id.slice(1).split("_").map(Number); return eventQuest(b, lv); }
  if (id[0] === "a") return scoreQuest(Number(id.slice(1)));
  if (id[0] === "h") return extremeStage(Number(id.slice(1)));
  if (id[0] === "v") return superQuest(Number(id.slice(1)));
  if (id[0] === "b") return rushQuest(Number(id.slice(1)));
  if (id[0] === "c") return coopQuest(Number(id.slice(1)));
  if (id[0] === "d") return dropStage(Number(id.slice(1)));
  if (id[0] === "g") { const [d, sl] = id.slice(1).split("_").map(Number); return guerrillaQuest(d, sl); }
  if (id[0] === "w") { const [k, lv] = id.slice(1).split("_").map(Number); return weekdayQuest(EL_KEYS[k], lv); }
  if (id[0] === "y") return typeStage(id[1] === "r" ? "reflect" : "pierce", Number(id.slice(2)));
  if (id[0] === "r") return raidQuest(Number(id.slice(1)));
  return towerFloor(Number(id.slice(1)));
}

    combo: f.combo, comboName: COMBO[f.combo].name,
    ss: f.ss, ssName: ssName(fi), ssTurns: t, ssDesc: SS[f.ss].desc, ssLeft: t,
    look: { shape: f.shape, el: f.el, acc: f.acc, eye: f.eye, rar: h.rar, evo: h.rar > f.rar },
    x, y, vx: 0, vy: 0, hurt: 0, glow: 0,
    shin: h.trial >= TRIAL_TIERS, abil: abilOf(fi, h.rar),
  };
}

function startQuest(i) {
  if (maintenanceOn()) { showToast("メンテナンス中です"); return; }
  const q = getQuest(i);
  // 試練はそのキャラ入り、タイプ専用ステージはそのタイプだけで挑戦する
  const ng = partyProblem(q);
  if (ng) { showToast(ng); return; }
  questIdx = i;
  quest = q;
  waveIdx = 0;
  // 出撃前に選んだ助っ人は5体目（最後の順番）
  const hl = prepHelper && prepHelperFor === i ? prepHelper : null;
  const n = save.party.length + (hl ? 1 : 0);
  allies = save.party.map((fi, k) => makeAlly(fi, W / (n + 1) * (k + 1), 505));
  if (hl) allies.push(makeHelperAlly(hl, W / (n + 1) * n, 505));
  maxHp = hp = allies.reduce((s, a) => s + a.hp, 0);
  turn = 1;
  cur = 0;
  ssArmed = false;
  shot = null;
  bolts = []; fx = []; particles = []; texts = []; events = [];
  bstat = { hits: 0, weak: 0, kills: 0, combos: 0, maxHit: 0, dmg: 0 };
  if (q.kind === "raid") raidBattleStart(q);
  if (q.kind === "rush") rushDone = false;
  loadWave();
  state = "aim";
  if (q.kind === "story") storyTalk(q, "s");   // 章の最初のステージで会話
  battleHints();
}

function loadWave() {
  const w = quest.waves[waveIdx]();
  // 手作りのステージ（スペシャル）はここでギミックを置く（毎回同じ場所）
  if (!w.gim && quest.gims && quest.gims.length) {
    addGimmicks(w, quest.gims, seeded(990000 + (typeof questIdx === "number" ? questIdx : 0) * 10 + waveIdx));
  }
  for (const e of w.enemies) {
    e.hp = e.maxHp = Math.round(e.hp * quest.mul * cfgDifficulty());
    e.atk = Math.round(e.atk * Math.pow(quest.mul, quest.atkPow || 1) * cfgDifficulty());
  }
  enemies = w.enemies;
  rocks = w.rocks || [];
  gim = w.gim || emptyGim();
  hearts = [];
  for (const a of allies) resolveOverlap(a);
  const last = waveIdx === quest.waves.length - 1;
  const gl = waveGims();
  const gsub = gl.length ? `ギミック: ${gimText(gl)}` : "";
  if (w.boss) showBanner(last ? "BOSS BATTLE" : "BOSS 出現", gsub || enemies[0].name, "#ff5b6b");
  else showBanner(`WAVE ${waveIdx + 1}`, gsub || `${waveIdx + 1} / ${quest.waves.length}`, "#ffd35c");
  battleHints();
}
// 今のWAVEにあるギミック
function waveGims() {
  if (!gim) return [];
  return GIM_KEYS.filter(k => k === "warp" ? gim.warps.length : k === "mine" ? gim.mines.length
    : k === "dwall" ? gim.dwall.length : k === "gbar" ? gim.gbars.length : rocks.some(o => o.block));
}

function schedule(t, fn) { events.push({ t, fn }); }
function showBanner(text, sub, color) { banner = { text, sub, color, life: 70, max: 70 }; }
function addText(x, y, text, color, size = 15) {
  texts.push({ x, y, text: String(text), color, size, life: 42 });
}
function burst(x, y, color, n, spd = 3) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * spd + 0.5;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 30, max: 30, color, size: 1.5 + Math.random() * 2.5 });
  }
}
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const alive = () => enemies.filter(e => !e.dead);

// ---- 物理 -------------------------------------------------------------
function overlap(b, cx, cy, r) { return Math.hypot(b.x - cx, b.y - cy) < R + r; }

// 円との衝突と反射。重なっていたら true
function bounce(b, cx, cy, r) {
  const dx = b.x - cx, dy = b.y - cy;
  const d = Math.hypot(dx, dy);
  const min = R + r;
  if (d >= min || d === 0) return false;
  const nx = dx / d, ny = dy / d;
  b.x = cx + nx * min;
  b.y = cy + ny * min;
  const vn = b.vx * nx + b.vy * ny;
  if (vn < 0) { b.vx -= 2 * vn * nx; b.vy -= 2 * vn * ny; }
  return true;
}

// 壁で跳ね返す。当たった壁（left / right / top / bottom）を返す
function walls(b) {
  let side = null;
  if (b.x < R)          { b.x = R;          b.vx = Math.abs(b.vx);  side = "left"; }
  if (b.x > W - R)      { b.x = W - R;      b.vx = -Math.abs(b.vx); side = "right"; }
  if (b.y < TOP + R)    { b.y = TOP + R;    b.vy = Math.abs(b.vy);  side = "top"; }
  if (b.y > FB - R)     { b.y = FB - R;     b.vy = -Math.abs(b.vy); side = "bottom"; }
  return side;
}

// 1サブステップ分のギミック判定（ショット中のキャラ a）
function gimmickStep(a, s) {
  if (!gim) return;
  // ワープ: AWがないと別のワープへ
  if (gim.warps.length > 1 && !(s.warpCd > 0)) {
    const w = gim.warps.find(w => Math.hypot(a.x - w.x, a.y - w.y) < w.r + R * 0.5);
    if (w) {
      if (hasAbil(a, "AW")) {
        if (!s.awShown) { s.awShown = true; addText(a.x, a.y - 24, "アンチワープ", "#7cf0ff", 12); }
      } else {
        const to = pick(gim.warps.filter(o => o !== w));
        burst(a.x, a.y, "#c58aff", 12, 3);
        a.x = to.x; a.y = to.y;
        burst(a.x, a.y, "#c58aff", 12, 3);
        s.warpCd = 25;
        playSe("warp");
      }
    }
  }
  // 地雷: 地雷回収なら攻撃アップ、なければダメージ
  for (const m of gim.mines) {
    if (m.taken || Math.hypot(a.x - m.x, a.y - m.y) >= R + m.r) continue;
    m.taken = true;
    if (hasAbil(a, "MK")) {
      s.mineMul = (s.mineMul || 1) + 0.3;
      addText(m.x, m.y - 14, "地雷回収! 攻撃UP", "#ffe066", 12);
      burst(m.x, m.y, "#ffe066", 10, 3);
      playSe("heal");
    } else {
      fx.push({ kind: "ring", x: m.x, y: m.y, r0: 6, r1: 40, life: 16, max: 16, color: "#ff5b3a", w: 6 });
      burst(m.x, m.y, "#ff8a3c", 18, 4);
      a.hurt = 16;
      damageParty(Math.round(maxHp * 0.07), m.x, m.y);
      playSe("mine");
    }
  }
  // 重力バリア: AGBがないと大きく減速
  if (!hasAbil(a, "AGB")) {
    for (const g of gim.gbars) {
      if (Math.hypot(a.x - g.x, a.y - g.y) < g.r) { a.vx *= 0.975; a.vy *= 0.975; s.inGrav = true; }
    }
  }
}
// ダメージウォールに当たった時
function hitWall(a, s, side) {
  if (!side || !gim || !gim.dwall.includes(side) || s.wallCd > 0) return;
  s.wallCd = 8;
  if (hasAbil(a, "ADW")) {
    if (!s.adwShown) { s.adwShown = true; addText(a.x, a.y - 24, "ADW", "#7cf0ff", 12); }
    return;
  }
  burst(a.x, a.y, "#ff4d6d", 8, 3);
  damageParty(Math.round(maxHp * 0.03), a.x, a.y);
}

// 停止位置が他の物体と重ならないよう押し出す
function resolveOverlap(a) {
  for (let k = 0; k < 12; k++) {
    let moved = false;
    const objs = [...enemies.filter(e => !e.dead), ...rocks, ...allies.filter(o => o !== a).map(o => ({ x: o.x, y: o.y, r: R }))];
    for (const o of objs) {
      const dx = a.x - o.x, dy = a.y - o.y, d = Math.hypot(dx, dy) || 0.01, min = R + o.r + 1;
      if (d < min) { a.x = o.x + dx / d * min; a.y = o.y + dy / d * min; moved = true; }
    }
    a.x = Math.min(W - R, Math.max(R, a.x));
    a.y = Math.min(FB - R, Math.max(TOP + R, a.y));
    if (!moved) break;
  }
}

function segDist(px, py, x1, y1, x2, y2) {
  const vx = x2 - x1, vy = y2 - y1;
  const t = Math.max(0, Math.min(1, ((px - x1) * vx + (py - y1) * vy) / (vx * vx + vy * vy)));
  return Math.hypot(px - (x1 + vx * t), py - (y1 + vy * t));
}

function weakPos(e) {
  return { x: e.x + Math.cos(e.weak) * e.r * 0.62, y: e.y + Math.sin(e.weak) * e.r * 0.62, r: e.r * 0.34 };
}

// ---- ダメージ ---------------------------------------------------------
// 今ダメージを出しているキャラ（体当たり・友情コンボ・SS・追尾弾のもとになったキャラ）
let dmgSrc = null;
const SHIN_BOSS_MUL = 1.5;   // 真の力: ボスへのダメージ倍率

function damageEnemy(e, base, el, weak) {
  if (e.dead) return;
  const shin = !!(dmgSrc && dmgSrc.shin);   // 試練Ⅲクリアの「真の力」
  const guarded = e.guard && !weak && !shin;   // ガード持ちは弱点以外 1/4（真の力なら無効）
  // 盾持ち: 下（正面）から当たると大きく減る（真の力なら無効）
  const shielded = e.kind === "shield" && !weak && !shin && dmgSrc && dmgSrc.y > e.y + e.r * 0.2;
  const m = elemMult(el, e.el) * (weak ? 3 : 1) * (guarded ? 0.25 : 1) * (shielded ? 0.2 : 1) * (shin && e.boss ? SHIN_BOSS_MUL : 1) * (dmgSrc && dmgSrc.killer === e.el ? 1.3 : 1);   // キラーの紋章
  const dmg = Math.round(base * m * rand(0.92, 1.08));
  if (guarded && Math.random() < 0.25) addText(e.x, e.y + e.r + 8, "ガード", "#9ad5ff", 11);
  if (shielded && Math.random() < 0.3) addText(e.x, e.y + e.r + 8, "シールド", "#9ad5ff", 11);
  e.hp -= dmg;
  e.flash = 6;
  hitCount++;
  addStat("hits");
  if (weak) addStat("weak");
  bstat.hits++;
  bstat.dmg += dmg;
  if (weak) bstat.weak++;
  playSe(weak ? "weak" : "hit");
  // 協力レイドのボスは倒れない（与えたダメージをみんなのHPから引く）
  if (e.raid) { raidHit(dmg); e.hp = e.maxHp; }
  const col = m >= 2 ? "#ffe066" : m < 1 ? "#9aa3b8" : "#ffffff";
  addText(e.x + rand(-12, 12), e.y - e.r * 0.3 + rand(-6, 6), dmg.toLocaleString(), col, weak ? 19 : 15);
  if (weak) addText(e.x, e.y - e.r - 16, "弱点!", "#ffef5c", 14);
  burst(e.x, e.y, EL[el].l, weak ? 10 : 5);
  if (e.boss) shake = Math.max(shake, weak ? 5 : 2);
  if (e.hp <= 0) {
    e.hp = 0;
    e.dead = true;
    burst(e.x, e.y, EL[e.el].c, e.boss ? 60 : 24, e.boss ? 6 : 4);
    addText(e.x, e.y, e.boss ? "撃破!!" : "撃破!", "#ffd35c", e.boss ? 24 : 17);
    shake = Math.max(shake, e.boss ? 12 : 4);
    addStat("kills");
    bstat.kills++;
    playSe("kill");
    onEnemyDeath(e);
  }
}

function damageParty(dmg, x, y) {
  if (hp <= 0) return;
  hp = Math.max(0, hp - dmg);
  addText(x, y - 26, "-" + dmg.toLocaleString(), "#ff6b6b", 16);
  shake = Math.max(shake, 6);
  playSe("damage");
  if (hp <= 0) {
    events = [];
    // 協力レイドは全滅しても与えたダメージは記録される
    if (coop.inBattle && !coop.host) return;   // 協力プレイはホストが結果を決める
    if (quest && quest.kind === "coop") { coopSend("end", { clear: false }); coop.inBattle = false; }
    if (quest && quest.kind === "raid") schedule(40, finishRaid);
    else if (quest && quest.kind === "rush") schedule(40, () => finishRush(false));
    else schedule(40, () => { state = "over"; lastResult = null; playSe("lose"); });
  }
}

function healParty(v, x, y) {
  hp = Math.min(maxHp, hp + v);
  addText(x, y - 26, "+" + v.toLocaleString(), "#7dffa0", 15);
  playSe("heal");
}

function addBolt(x, y, vx, vy, base, el, size = 4) {
  bolts.push({ x, y, vx, vy, target: null, base, el, color: EL[el].l, size, life: 140, src: dmgSrc });
}

// ---- 友情コンボ ---------------------------------------------------------
function triggerCombo(a) {
  const prevSrc = dmgSrc;
  dmgSrc = a;   // 試練Ⅲの「真の力」を友情コンボにも乗せる
  a.glow = 20;
  const cm = a.comboMul || 1;   // 友情の紋章
  a.atk *= cm;
  bstat.combos++;
  playSe("combo");
  const col = EL[a.el].l;
  addText(a.x, a.y - 30, a.comboName, col, 13);
  switch (a.combo) {
    case "blast": {
      const rad = 95;
      fx.push({ kind: "ring", x: a.x, y: a.y, r0: 10, r1: rad, life: 22, max: 22, color: EL[a.el].c, w: 8 });
      for (const e of alive()) if (Math.hypot(e.x - a.x, e.y - a.y) < rad + e.r) damageEnemy(e, a.atk * 1.7, a.el, false);
      break;
    }
    case "laser": {
      fx.push({ kind: "line", x1: 0, y1: a.y, x2: W, y2: a.y, w: 10, life: 18, max: 18, color: col });
      fx.push({ kind: "line", x1: a.x, y1: TOP, x2: a.x, y2: FB, w: 10, life: 18, max: 18, color: col });
      for (const e of alive()) {
        if (Math.abs(e.y - a.y) < e.r + 8 || Math.abs(e.x - a.x) < e.r + 8) damageEnemy(e, a.atk * 1.5, a.el, false);
      }
      break;
    }
    case "homing": {
      for (let i = 0; i < 8; i++) {
        const ang = (i / 8) * Math.PI * 2;
        addBolt(a.x, a.y, Math.cos(ang) * 5, Math.sin(ang) * 5, a.atk * 0.45, a.el);
      }
      break;
    }
    case "thunder": {
      // 近い敵へ順に連鎖する雷（最大4体）
      let from = { x: a.x, y: a.y };
      const hit = new Set();
      for (let k = 0; k < 4; k++) {
        const next = alive().filter(e => !hit.has(e))
          .sort((p, q) => Math.hypot(p.x - from.x, p.y - from.y) - Math.hypot(q.x - from.x, q.y - from.y))[0];
        if (!next) break;
        hit.add(next);
        fx.push({ kind: "bolt", x1: from.x, y1: from.y, x2: next.x, y2: next.y, life: 18, max: 18, color: col });
        damageEnemy(next, a.atk * 1.1, a.el, false);
        from = next;
      }
      break;
    }
    case "clap": {
      // 拍手: 猫に触れた味方（今飛んでいるキャラ）の攻撃力を3ターン1.3倍＋HP回復
      fx.push({ kind: "ring", x: a.x, y: a.y, r0: 6, r1: 60, life: 20, max: 20, color: "#d6bcff", w: 6 });
      fx.push({ kind: "ring", x: a.x, y: a.y, r0: 20, r1: 80, life: 26, max: 26, color: "#9b5cff", w: 4 });
      const t = shot && shot.ally;
      if (t) applyClap(t);
      healParty(Math.round(a.hp * 0.2), a.x, a.y);
      break;
    }
    case "ssboom": {
      // フィールドの約1/4（半径120）の大爆発＋味方全員のSSを1ターン短縮
      const rad = 120;
      fx.push({ kind: "ring", x: a.x, y: a.y, r0: 10, r1: rad, life: 26, max: 26, color: "#ff8a3c", w: 14 });
      fx.push({ kind: "ring", x: a.x, y: a.y, r0: 4, r1: rad * 0.7, life: 20, max: 20, color: "#ffe066", w: 8 });
      burst(a.x, a.y, "#ffb04a", 40, 6);
      for (const e of alive()) if (Math.hypot(e.x - a.x, e.y - a.y) < rad + e.r) damageEnemy(e, a.atk * 1.8, a.el, false);
      for (const o of allies) o.ssLeft = Math.max(0, o.ssLeft - 1);
      addText(a.x, a.y + 26, "SS -1ターン", "#ffe066", 13);
      shake = Math.max(shake, 6);
      break;
    }
    case "kikou": {
      // 敵を追いかけるレーザー10本
      fx.push({ kind: "ring", x: a.x, y: a.y, r0: 6, r1: 70, life: 20, max: 20, color: "#bfffd0", w: 6 });
      for (let i = 0; i < 10; i++) {
        const ang = (i / 10) * Math.PI * 2;
        addBolt(a.x, a.y, Math.cos(ang) * 8, Math.sin(ang) * 8, a.atk * 0.55, a.el, 4);
        bolts[bolts.length - 1].beam = true;
      }
      break;
    }
    case "smilestar": {
      // 虹色の星12発（追尾）＋回復
      fx.push({ kind: "ring", x: a.x, y: a.y, r0: 8, r1: 80, life: 24, max: 24, color: "#ffe066", w: 6 });
      for (let i = 0; i < 12; i++) {
        const ang = (i / 12) * Math.PI * 2;
        addBolt(a.x, a.y, Math.cos(ang) * 6, Math.sin(ang) * 6, a.atk * 0.8, a.el, 6);
        bolts[bolts.length - 1].star = true;
      }
      healParty(Math.round(a.hp * 0.12), a.x, a.y);
      break;
    }
    case "heal": {
      fx.push({ kind: "ring", x: a.x, y: a.y, r0: 8, r1: 60, life: 24, max: 24, color: "#9dffb0", w: 5 });
      healParty(Math.round(a.hp * 0.15), a.x, a.y);
      break;
    }
    case "tornado": {
      // 竜巻: 半径110の敵に2回ダメージ
      const rad = 110;
      fx.push({ kind: "ring", x: a.x, y: a.y, r0: rad, r1: 12, life: 24, max: 24, color: "#aef0bf", w: 8 });
      fx.push({ kind: "ring", x: a.x, y: a.y, r0: 12, r1: rad, life: 30, max: 30, color: "#46c46a", w: 5 });
      for (let n = 0; n < 2; n++) for (const e of alive()) if (Math.hypot(e.x - a.x, e.y - a.y) < rad + e.r) damageEnemy(e, a.atk * 1.4, a.el, false);
      break;
    }
    case "raigeki": {
      // 雷撃: 近い敵へ6回連鎖（同じ敵にも当たる）
      let from = { x: a.x, y: a.y };
      for (let k = 0; k < 6; k++) {
        const list = alive();
        if (!list.length) break;
        const next = list.sort((p, q) => Math.hypot(p.x - from.x, p.y - from.y) - Math.hypot(q.x - from.x, q.y - from.y))[k % list.length];
        fx.push({ kind: "bolt", x1: from.x, y1: from.y, x2: next.x, y2: next.y, life: 18, max: 18, color: "#fff3b8" });
        damageEnemy(next, a.atk * 1.5, a.el, false);
        from = next;
      }
      break;
    }
    case "hyouso": {
      // 氷槍: 追尾する槍6本
      fx.push({ kind: "ring", x: a.x, y: a.y, r0: 6, r1: 60, life: 18, max: 18, color: "#a6d4ff", w: 5 });
      for (let i = 0; i < 6; i++) {
        const ang = (i / 6) * Math.PI * 2;
        addBolt(a.x, a.y, Math.cos(ang) * 7, Math.sin(ang) * 7, a.atk * 1.1, a.el, 6);
        bolts[bolts.length - 1].beam = true;
      }
      break;
    }
  }
  a.atk /= cm;
  dmgSrc = prevSrc;
}

// ---- ストライクショット -----------------------------------------------------
function judgeLaser(a, dx, dy) {
  let t = Infinity;
  if (dx > 0) t = Math.min(t, (W - a.x) / dx);
  if (dx < 0) t = Math.min(t, -a.x / dx);
  if (dy > 0) t = Math.min(t, (FB - a.y) / dy);
  if (dy < 0) t = Math.min(t, (TOP - a.y) / dy);
  const x2 = a.x + dx * t, y2 = a.y + dy * t;
  const big = a.ss === "haou";      // 覇王天翔波は特大・大ダメージ
  const w = big ? 64 : 30;
  fx.push({ kind: "line", x1: a.x, y1: a.y, x2, y2, w, life: big ? 50 : 34, max: big ? 50 : 34, color: big ? "#bfffd0" : EL[a.el].l });
  if (big) fx.push({ kind: "ring", x: a.x, y: a.y, r0: 70, r1: 10, life: 20, max: 20, color: "#ffffff", w: 6 });
  for (const e of alive()) {
    if (segDist(e.x, e.y, a.x, a.y, x2, y2) < e.r + w / 2) damageEnemy(e, a.atk * (big ? 50 : 8), a.el, false);
  }
  shake = Math.max(shake, big ? 16 : 8);
}

// 撃ったターンから5ターン、能力2.5倍（攻撃力・HP・スピード）。重ねがけはせず残りターンだけ戻す
function applyBuff(a) {
  if (!a.buff) {
    a.buffHp = Math.round(a.hp * 1.5);
    a.atk *= 2.5;
    a.spd *= 2.5;
    maxHp += a.buffHp;
    hp += a.buffHp;
    addText(a.x, a.y - 34, "能力2.5倍!", EL[a.el].l, 16);
  }
  a.buff = 5;
}

// 拍手する猫のSS: 触れた敵の場所で爆発（半径70・攻撃力の6倍）＋触れるたびに加速してまた動き出す
const HANDSHAKE_MAX_BOOST = 15;   // 1回のSSで加速する上限回数（止まらなくなるのを防ぐ）
function handshakeHit(a, e) {
  const rad = 70;
  fx.push({ kind: "ring", x: e.x, y: e.y, r0: 8, r1: rad, life: 20, max: 20, color: "#b07aff", w: 10 });
  burst(e.x, e.y, "#d6bcff", 22, 5);
  for (const o of alive()) if (Math.hypot(o.x - e.x, o.y - e.y) < rad + o.r) damageEnemy(o, a.atk * 6, a.el, false);
  shake = Math.max(shake, 5);
  const s = shot;
  if (s && (s.boosts || 0) < HANDSHAKE_MAX_BOOST) {
    s.boosts = (s.boosts || 0) + 1;
    const cur = Math.hypot(a.vx, a.vy) || 1;
    const target = Math.min(40, Math.max(cur * 1.25, s.launchSpd || 0));
    a.vx *= target / cur;
    a.vy *= target / cur;
    addText(a.x, a.y - 26, "加速!", "#ffe066", 13);
  }
}

// 拍手する猫の友情コンボ: 攻撃力を3ターン1.3倍。重ねがけはせず残りターンだけ戻す
function applyClap(o) {
  if (!o.clap) {
    o.atk *= 1.3;
    addText(o.x, o.y - 30, "拍手! 攻撃1.3倍", "#d6bcff", 13);
  }
  o.clap = 3;
}

// パニパニのSS: 攻撃力（＝友情コンボの威力も）を3ターン2.5倍。重ねがけはせず残りターンだけ戻す
function applyRally(o) {
  if (!o.rally) {
    o.atk *= 2.5;
    addText(o.x, o.y - 30, "応援! 攻撃2.5倍", "#ffb04a", 13);
    burst(o.x, o.y, "#ffb04a", 16, 4);
  }
  o.rally = 3;
}

// ---- ターン進行 ---------------------------------------------------------
function fire(dx, dy) {
  const a = allies[cur];
  let sp = a.spd;
  shot = { ally: a, cool: new Map(), touched: new Set(), atkMul: 1, stopped: false, needle: 0, needleT: 0, trail: [] };
  hitCount = 0;
  playSe(ssArmed ? "ss" : "shot");
  if (ssArmed) {
    ssArmed = false;
    a.ssLeft = a.ssTurns;
    addStat("ss");
    showBanner(a.ssName, "ストライクショット!", EL[a.el].c);
    burst(a.x, a.y, EL[a.el].l, 30, 5);
    dmgSrc = a;
    switch (a.ss) {
      case "burst":  shot.atkMul = 3; sp *= 1.3; break;
      case "wave":   fx.push({ kind: "wave", y: FB, life: 45, max: 45, hit: new Set(), base: a.atk * 3.5, el: a.el, src: a }); break;
      case "needle": shot.needle = 30; break;
      case "judge":  judgeLaser(a, dx, dy); break;
      case "handshake":
        // 握手: 触れた敵が爆発、敵に触れるたびにたまにスピードアップ
        shot.handshake = true;
        fx.push({ kind: "ring", x: a.x, y: a.y, r0: 10, r1: 80, life: 22, max: 22, color: "#d6bcff", w: 8 });
        break;
      case "rally":
        // このショットで触れた味方の攻撃力・友情コンボを3ターン2.5倍
        shot.rally = true;
        fx.push({ kind: "ring", x: a.x, y: a.y, r0: 10, r1: 90, life: 24, max: 24, color: "#ffb04a", w: 8 });
        break;
      case "haou":
        judgeLaser(a, dx, dy);
        applyBuff(a);
        sp *= 2.5;
        break;
      case "meteor":
        for (let i = 0; i < 8; i++) addBolt(rand(30, W - 30), TOP - 20 - i * 25, 0, 6, a.atk * 2.2, a.el, 9);
        break;
      case "storm":
        // 嵐の翼: 攻撃力3.5倍で突撃＋追尾する風の刃12発
        shot.atkMul = 3.5;
        sp *= 1.4;
        for (let i = 0; i < 12; i++) {
          const ang = (i / 12) * Math.PI * 2;
          addBolt(a.x, a.y, Math.cos(ang) * 7, Math.sin(ang) * 7, a.atk * 1.5, a.el, 6);
        }
        break;
      case "raijin":
      case "blizzard": {
        // 轟雷招来 / 絶対零度: 敵全体に大ダメージ＋攻撃を1ターン遅らせる
        const ice = a.ss === "blizzard";
        fx.push({ kind: "ring", x: W / 2, y: (TOP + FB) / 2, r0: 20, r1: 420, life: 34, max: 34, color: ice ? "#a6d4ff" : "#fff3b8", w: 16 });
        for (const e of alive()) {
          if (!ice) fx.push({ kind: "bolt", x1: e.x + rand(-20, 20), y1: TOP, x2: e.x, y2: e.y, life: 22, max: 22, color: "#fff3b8" });
          else burst(e.x, e.y, "#e6f4ff", 14, 3);
          damageEnemy(e, a.atk * (ice ? 10 : 12), a.el, false);
          if (!e.dead) { e.cd++; addText(e.x, e.y + e.r + 10, "攻撃+1T", "#9ad5ff", 12); }
        }
        if (ice) healParty(Math.round(maxHp * 0.15), W / 2, FB - 20);
        shake = Math.max(shake, 10);
        break;
      }
      case "smileburst":
        // フィールド全体に笑顔の光 → 全体に攻撃力30倍・攻撃遅延・回復・5ターン能力2.5倍
        fx.push({ kind: "smile", life: 60, max: 60 });
        for (const e of alive()) {
          damageEnemy(e, a.atk * 30, a.el, false);
          if (!e.dead) { e.cd++; addText(e.x, e.y + e.r + 10, "攻撃+1T", "#9ad5ff", 12); }
        }
        healParty(Math.round(maxHp * 0.3), W / 2, FB - 20);
        applyBuff(a);
        sp *= 2.5;
        shake = Math.max(shake, 14);
        break;
    }
    dmgSrc = null;
  }
  a.vx = dx * sp;
  a.vy = dy * sp;
  shot.launchSpd = sp;
  state = "shoot";
}

function updateShot() {
  const s = shot, a = s.ally;
  if (!s.stopped) {
    // 速いほど細かく刻んで、すり抜けを防ぐ
    const steps = Math.max(SUB, Math.ceil(Math.hypot(a.vx, a.vy) / 6));
    for (let k = 0; k < steps; k++) {
      a.x += a.vx / steps;
      a.y += a.vy / steps;
      hitWall(a, s, walls(a));
      for (const o of rocks) if (!(o.block && hasAbil(a, "AB"))) bounce(a, o.x, o.y, o.r);   // AB は動くブロックをすり抜ける
      gimmickStep(a, s);
      if (hp <= 0) break;
      for (const e of enemies) {
        if (e.dead) continue;
        const hit = a.type === "reflect" ? bounce(a, e.x, e.y, e.r) : overlap(a, e.x, e.y, e.r);
        if (hit && !s.cool.has(e.id)) {
          s.cool.set(e.id, a.type === "reflect" ? 6 : 10);
          let weak = false;
          if (e.weak !== null) { const w = weakPos(e); weak = Math.hypot(a.x - w.x, a.y - w.y) < R + w.r; }
          dmgSrc = a;
          damageEnemy(e, a.atk * s.atkMul * (s.mineMul || 1), a.el, weak);
          if (s.handshake) handshakeHit(a, e);
          dmgSrc = null;
        }
      }
      for (const o of allies) {
        if (o !== a && !s.touched.has(o) && overlap(a, o.x, o.y, R)) {
          s.touched.add(o);
          if (s.rally) applyRally(o);   // 応援を受けてから友情コンボ
          triggerCombo(o);
        }
      }
      for (const h of hearts) {
        if (!h.taken && overlap(a, h.x, h.y, h.r)) {
          h.taken = true;
          healParty(Math.round(maxHp * 0.15), h.x, h.y);
          burst(h.x, h.y, "#ff8fb1", 16);
        }
      }
    }
    hearts = hearts.filter(h => !h.taken);
    for (const [k, v] of s.cool) { if (v <= 1) s.cool.delete(k); else s.cool.set(k, v - 1); }
    if (s.warpCd > 0) s.warpCd--;
    if (s.wallCd > 0) s.wallCd--;
    a.vx *= FRICTION;
    a.vy *= FRICTION;
    s.trail.push({ x: a.x, y: a.y });
    if (s.trail.length > 12) s.trail.shift();

    if (s.needle > 0 && --s.needleT <= 0 && alive().length) {
      s.needle--;
      s.needleT = 4;
      const ang = Math.random() * Math.PI * 2;
      dmgSrc = a;
      addBolt(a.x, a.y, Math.cos(ang) * 6, Math.sin(ang) * 6, a.atk * 0.8, a.el);
      dmgSrc = null;
    }

    if (Math.hypot(a.vx, a.vy) < STOP) {
      s.stopped = true;
      a.vx = a.vy = 0;
      s.trail = [];
      resolveOverlap(a);
    }
  }
  if (s.stopped && !bolts.length && !fx.some(f => f.kind === "wave")) endShot();
}

function endShot() {
  shot = null;
  bstat.maxHit = Math.max(bstat.maxHit, hitCount);
  if (hp <= 0) return;
  if (!alive().length) { waveClear(); return; }
  enemyPhase();
}

function enemyPhase() {
  state = "enemy";
  let delay = 12;
  for (const e of alive()) {
    if (--e.cd > 0) continue;
    e.cd = e.maxCd;
    schedule(delay, () => enemyAttack(e));
    delay += 26;
  }
  schedule(delay + 6, startTurn);
}

function enemyAttack(e) {
  if (e.dead || hp <= 0) return;
  e.flash = 10;
  if (e.kind === "healer") {
    // 攻撃のかわりに仲間を回復
    fx.push({ kind: "ring", x: e.x, y: e.y, r0: e.r, r1: 140, life: 24, max: 24, color: "#7dffa0", w: 6 });
    for (const o of alive()) {
      if (o.raid) continue;
      const v = Math.round(o.maxHp * 0.15);
      o.hp = Math.min(o.maxHp, o.hp + v);
      addText(o.x, o.y - o.r - 6, `+${v.toLocaleString()}`, "#7dffa0", 12);
    }
    playSe("heal");
    return;
  }
  if (e.kind === "bomb") {
    // 自爆: 大ダメージ
    fx.push({ kind: "ring", x: e.x, y: e.y, r0: e.r, r1: 300, life: 26, max: 26, color: "#ff8a3c", w: 14 });
    burst(e.x, e.y, "#ffb04a", 40, 7);
    addText(e.x, e.y + e.r + 12, "自爆!", "#ff8b5b", 16);
    for (const a of allies) a.hurt = 16;
    e.dead = true;
    playSe("mine");
    damageParty(Math.round(e.atk * 2.5), W / 2, FB - 10);
    return;
  }
  if (e.kind === "turret") {
    // 横一直線のレーザー
    fx.push({ kind: "line", x1: 0, y1: e.y, x2: W, y2: e.y, w: 16, life: 22, max: 22, color: "#ff5b6b" });
    fx.push({ kind: "line", x1: 0, y1: FB - 40, x2: W, y2: FB - 40, w: 22, life: 22, max: 22, color: "#ff8b9b" });
    for (const a of allies) a.hurt = 16;
    addText(e.x, e.y + e.r + 12, "レーザー", "#ff8b9b", 14);
    damageParty(Math.round(e.atk * 1.6), W / 2, FB - 10);
    return;
  }
  if (e.atkType === "all") {
    fx.push({ kind: "ring", x: e.x, y: e.y, r0: e.r, r1: 560, life: 30, max: 30, color: "#ff4d6d", w: 12 });
    for (const a of allies) a.hurt = 16;
    addText(e.x, e.y + e.r + 12, "全体攻撃", "#ff8b9b", 14);
    damageParty(e.atk, W / 2, FB - 10);
  } else {
    const t = pick(allies);
    fx.push({ kind: "line", x1: e.x, y1: e.y, x2: t.x, y2: t.y, w: 5, life: 16, max: 16, color: "#ff5b6b" });
    t.hurt = 16;
    burst(t.x, t.y, "#ff5b6b", 10);
    damageParty(e.atk, t.x, t.y);
  }
}

function startTurn() {
  if (hp <= 0) return;
  if (coop.inBattle && !coop.host) { state = "enemy"; return; }   // 協力プレイの次の手番はホストから届く
  // 協力レイドはターン制限で終了
  if (quest.kind === "raid" && turn >= quest.turnLimit) { finishRaid(); return; }
  if (!alive().length) { waveClear(); return; }   // 爆弾の自爆などで敵がいなくなった時
  turn++;
  cur = (cur + 1) % allies.length;
  for (const a of allies) a.ssLeft = Math.max(0, a.ssLeft - 1);
  // 拍手（猫の友情コンボ）の残りターンを減らし、切れたら元に戻す
  for (const a of allies) {
    if (!a.clap) continue;
    a.clap--;
    if (!a.clap) a.atk /= 1.3;
  }
  // 応援（パニパニのSS）の残りターンを減らし、切れたら元に戻す
  for (const a of allies) {
    if (!a.rally) continue;
    a.rally--;
    if (!a.rally) { a.atk /= 2.5; addText(a.x, a.y - 30, "応援終了", "#9aa3b8", 12); }
  }
  // 能力アップの残りターンを減らし、切れたら元に戻す
  for (const a of allies) {
    if (!a.buff) continue;
    a.buff--;
    if (!a.buff) {
      a.atk /= 2.5;
      a.spd /= 2.5;
      maxHp -= a.buffHp;
      hp = Math.max(1, Math.min(hp, maxHp));
      addText(a.x, a.y - 30, "能力アップ終了", "#9aa3b8", 12);
    }
  }
  ssArmed = false;
  for (const e of alive()) if (e.roam && e.weak !== null) e.weak = Math.random() * Math.PI * 2;
  // 再生持ちの敵は毎ターン回復
  for (const e of alive()) {
    if (!e.regen || e.hp >= e.maxHp) continue;
    const v = Math.round(e.maxHp * e.regen);
    e.hp = Math.min(e.maxHp, e.hp + v);
    addText(e.x, e.y - e.r - 6, `+${v.toLocaleString()} 再生`, "#7dffa0", 12);
    burst(e.x, e.y, "#7dffa0", 8, 2);
  }
  if (hearts.length === 0 && Math.random() < 0.3) spawnHeart();
  state = "aim";
  if (coop.inBattle && coop.host) coopSendState();   // 協力プレイ: ホストが盤面をみんなに配る
}

function spawnHeart() {
  for (let k = 0; k < 30; k++) {
    const h = { x: rand(40, W - 40), y: rand(TOP + 60, FB - 60), r: 11, taken: false };
    const blocked = [...alive(), ...rocks].some(o => Math.hypot(o.x - h.x, o.y - h.y) < o.r + 24)
      || allies.some(a => Math.hypot(a.x - h.x, a.y - h.y) < R + 24);
    if (!blocked) { hearts.push(h); return; }
  }
}

function waveClear() {
  state = "wave";
  if (coop.inBattle && !coop.host && waveIdx === quest.waves.length - 1) return;   // 協力プレイの終わりはホストが決める
  const last = waveIdx === quest.waves.length - 1;
  showBanner(last ? "QUEST CLEAR!" : "WAVE CLEAR", "", "#7dffa0");
  playSe(last ? "clear" : "wave");
  schedule(last ? 80 : 60, () => {
    if (last) {
      if (quest.kind === "coop") { coopSend("end", { clear: true }); coop.inBattle = false; }
      if (quest.kind === "rush") finishRush(true); else finishQuest();
      return;
    }
    if (quest.kind === "rush") healParty(Math.round(maxHp * 0.2), W / 2, FB - 20);   // ボスラッシュは倒すたびに20%回復
    waveIdx++;
    loadWave();
    startTurn();
  });
}

// クリア報酬
function finishQuest() {
  const q = quest, first = !save.cleared[questIdx];
  const best = save.best[questIdx];
  const isBest = best === undefined || turn < best;
  if (isBest) save.best[questIdx] = turn;
  const rank = turn <= q.par ? "S" : turn <= q.par * 1.4 ? "A" : "B";
  const camp = campaign() || { coin: 1, exp: 1, gem: 1 };   // 管理者のキャンペーン倍率
  // 運極のリーダーはコイン1.2倍
  const coin = Math.round(q.coin * (rank === "S" ? 1.5 : rank === "A" ? 1.2 : 1) * camp.coin * (isUnkyoku(save.party[0]) ? 1.2 : 1));
  const crEl = q.crEl || pick(EL_KEYS);
  const crN = q.crN + Math.floor(Math.random() * 3);
  const gem = first ? Math.round(q.gem * camp.gem) : 0;
  const exp = Math.round((q.exp || 30) * camp.exp);
  let drop = null, dropN = 0;
  if (questIdx === IKESAKI_QUEST && first) {
    drop = acquire(LIMITED);                  // 最難関の初回クリアで★6限定キャラ
  } else if (q.kind === "drop") {
    // キャラ集め: 1〜5体（運極の仲間がいると増える）
    dropN = dropCount();
    for (let k = 0; k < dropN; k++) drop = acquire(q.dropFi);
    addStat("dropClears");
  } else if (q.kind === "event") {
    // 降臨: ボスのキャラがドロップ（極の初回クリアは確定）
    save.eventClear[q.id] = (save.eventClear[q.id] || 0) + 1;
    if ((first && q.lv === EVENT_LV.length - 1) || Math.random() < q.dropRate) drop = acquire(q.dropFi);
  } else if (Math.random() < 0.35) {
    const pool = FAM.filter(f => f.rar === 3 && f.el === crEl);
    drop = acquire(pick(pool.length ? pool : FAM.filter(f => f.rar === 3)).idx);
  }
  save.coins += coin;
  save.gems += gem;
  save.cr[crEl] += crN;
  save.cleared[questIdx] = true;
  // ラックボーナス: ラックが高いキャラほど、おまけの報酬が出やすい（運極で30%）
  const luckBonus = [];
  for (const fi of save.party) {
    const lk = (save.box[fi] && save.box[fi].luck) || 0;
    if (!lk || Math.random() >= lk / MAX_LUCK * 0.3) continue;
    const r = Math.random();
    if (r < 0.5) { save.coins += 3000; luckBonus.push("コイン3000"); }
    else if (r < 0.85) { save.cr[crEl] += 3; luckBonus.push(`${EL[crEl].n}の結晶×3`); }
    else { save.gems += 10; luckBonus.push("ジェム10"); }
  }
  if (q.kind === "tower") save.towerMax = Math.max(save.towerMax || 0, q.floor);
  if (q.kind === "abyss") save.abyssMax = Math.max(save.abyssMax || 0, q.floor);
  // 試練: 初めてクリアした段階まで、そのキャラを強化
  let trialUp = null;
  if (q.kind === "trial" && trialTier(q.fi) < q.tier) {
    save.trial = save.trial || {};
    save.trial[q.fi] = q.tier;
    trialUp = { fi: q.fi, tier: q.tier };
    showToast(q.tier >= TRIAL_TIERS
      ? `${FAM[q.fi].name} が真の力に目覚めた! ガード無効・ボス×${SHIN_BOSS_MUL}`
      : `${FAM[q.fi].name} が強化された! 能力×${TRIAL_MUL[q.tier]}${TRIAL_SS[q.tier] ? `・SS-${TRIAL_SS[q.tier]}` : ""}`);
  }
  // 超進化: 初めてクリアすると★7に
  if (q.kind === "super" && save.box[q.fi] && save.box[q.fi].rar < 7) {
    save.box[q.fi].rar = 7;
    trialUp = { fi: q.fi, tier: "super" };
    showBanner("超進化!!", `${displayName(q.fi)}  ★7`, "#fff2a0");
    showToast(`${FAM[q.fi].name} が超進化! ★7・能力+1・Lv上限120`);
    playSe("fanfare");
  }
  addStat("clears");
  if (rank === "S") addStat("srank");
  addSeason(10 + (rank === "S" ? 5 : 0) + (["guerrilla", "coop", "extreme", "super"].includes(q.kind) ? 20 : 0));   // シーズンパス
  const up = addExp(exp);
  if (up.ranks) showToast(`ランクアップ! ランク${save.rank}  ジェム+${up.gems}`);
  persist();
  lastResult = { turn, rank, best: isBest ? turn : best, isBest, coin, gem, crEl, crN, drop, dropN, luckBonus, netRank: undefined,
    exp, kind: q.kind, trialUp };
  thankHelper();
  if (q.kind === "score") scoreFinish(q, lastResult);
  if (q.kind === "coop") addStat("coopClears");
  checkTitles();
  if (q.kind === "story") storyTalk(q, "e");   // 章ボスを倒した時の会話
  hint("clear", "クリア! 手に入れたコインと結晶で、BOXからキャラを強化・進化させよう");
  if (q.kind !== "special") { state = "clear"; return; }
  // ランキングに記録（スペシャルクエストのみ）
  const leader = leaderLabel();
  addLocalRecord(questIdx, turn, leader);
  persist();
  if (onlineRanking()) {
    const res = lastResult, q = questIdx, t = turn;
    (save.name ? Promise.resolve() : askName())
      .then(() => submitScore(q, t, leader))
      .then(r => { res.netRank = r; });
  }
  state = "clear";
}

// ---- 育成 -------------------------------------------------------------
function levelUp(fi, toMax) {
  const u = save.box[fi], cap = MAXLV[u.rar];
  if (u.lv >= cap) { showToast("レベルが上限です。進化させよう!"); return; }
  let n = 0;
  while (u.lv < cap && save.coins >= lvCost(u.lv)) {
    save.coins -= lvCost(u.lv);
    u.lv++;
    n++;
    if (!toMax) break;
  }
  if (!n) { showToast("コインが足りません"); return; }
  addStat("lvups", n);
  burst(180, 170, "#ffe066", 20, 4);
  addText(180, 120, `Lv UP! → ${u.lv}`, "#ffe066", 20);
  persist();
}
function maxCost(fi) {
  const u = save.box[fi], cap = MAXLV[u.rar];
  let c = 0;
  for (let lv = u.lv; lv < cap; lv++) c += lvCost(lv);
  return c;
}
function evolve(fi) {
  const u = save.box[fi], f = FAM[fi];
  if (u.rar >= 6) return;
  if (u.lv < MAXLV[u.rar]) { showToast(`Lv${MAXLV[u.rar]}にすると進化できます`); return; }
  if (save.cr[f.el] < EVO_CR[u.rar]) { showToast(`${EL[f.el].n}の結晶が足りません`); return; }
  if (save.coins < EVO_COIN[u.rar]) { showToast("コインが足りません"); return; }
  save.cr[f.el] -= EVO_CR[u.rar];
  save.coins -= EVO_COIN[u.rar];
  u.rar++;
  addStat("evos");
  persist();
  burst(180, 170, EL[f.el].l, 70, 6);
  burst(180, 170, "#ffffff", 30, 4);
  showBanner("進化成功!", `${displayName(fi)}  ★${u.rar}`, RCOL[u.rar]);
}

// ---- ガチャ -----------------------------------------------------------
// 限定ガチャは3日ごとに入れ替わる。limited: ★6枠で出る限定キャラ（1体につき RATE6 の確率）
const DAY = 86400000;
const GACHA_DAYS = 3;
const ROTATION_START = "2026-10-09";   // この日から3日間はスターダストと灼熱の両方
// 3日サイクルで順番に開催。新しいガチャはここに足せば自動でサイクルに入る
// debut: 初めて開催する回（それより後は「復刻」と表示）
const LIMITED_GACHAS = [
  { key: "star", name: "スターダストガチャ", short: "スターダスト", limited: [LIMITED, LIMITED_JIN], c1: "#ff7ae0", c2: "#7a4aff", debut: 0 },
  { key: "fire", name: "灼熱ガチャ",         short: "灼熱",         limited: [LIMITED_PANI],         c1: "#ff9a5a", c2: "#c0301a", debut: 0 },
  // 限定キャラが全員出る。拍手する猫はここだけ
  { key: "clap", name: "超拍手祭",           short: "超拍手祭",     limited: [...LIMITED_ALL],       c1: "#d6bcff", c2: "#5a2a9a", debut: 3 },
];
// 常設ガチャ: いつでも引ける。★6枠は恒常★6（合計 STD_RATE6）
let STD_RATE6 = 0.01;
const STD_GACHA = { key: "std", name: "常設ガチャ", short: "常設", limited: PERM6, c1: "#7cf0ff", c2: "#1f5fae", std: true };
let gachaBanner = "star";

const dayStart = s => new Date(s + "T00:00:00").getTime();
// 今開催中の限定ガチャ（管理者の予定 → なければ自動ローテーション）
function activeLimitedGachas() {
  const now = Date.now();
  const planned = (CFG.gachaSchedule || []).filter(g => g && (g.name || g.key) && g.from && g.until
    && now >= dayStart(g.from) && now < dayStart(g.until) + DAY).map((g, i) => {
    // key に既存の限定ガチャ（star / fire / clap）を指定すると、その画面・★6キャラのまま期間だけ予定どおりに出す
    const base = LIMITED_GACHAS.find(b => b.key === g.key);
    if (base) return { ...base, name: g.name || base.name, endsAt: dayStart(g.until) + DAY };
    const ids = (g.limited || []).map(n => FAM.find(f => f.name === n)).filter(Boolean).map(f => f.idx);
    return { key: "plan" + i + g.from, name: g.name, short: (g.short || g.name).slice(0, 7), limited: ids,
      c1: g.c1 || "#ffcf4a", c2: g.c2 || "#d6542a", endsAt: dayStart(g.until) + DAY };
  }).filter(g => g.limited.length);
  if (planned.length) return planned;
  // 自動ローテーション: 最初の3日はスターダストと灼熱の両方、そのあとは3日ごとに1つずつ順番に
  const start = dayStart(ROTATION_START), cycle = Math.max(0, Math.floor((now - start) / (GACHA_DAYS * DAY)));
  const endsAt = start + (cycle + 1) * GACHA_DAYS * DAY;
  if (cycle === 0) return LIMITED_GACHAS.filter(g => g.debut === 0).map(g => ({ ...g, endsAt }));
  const g = LIMITED_GACHAS[(cycle - 1) % LIMITED_GACHAS.length];
  return [{ ...g, name: g.name + (cycle > g.debut ? "（復刻）" : ""), endsAt }];
}
const activeGachas = () => [...activeLimitedGachas(), STD_GACHA];
const findGacha = key => activeGachas().find(g => g.key === key);
const rate6Total = g => g.std ? STD_RATE6 : RATE6 * g.limited.length;

function rollOne(guarantee4, g) {
  const r = Math.random(), r6 = rate6Total(g);
  if (r < r6) return pick(g.limited);
  let rar = r < r6 + RATE5 ? 5 : r < r6 + RATE5 + RATE4 ? 4 : 3;
  if (guarantee4 && rar === 3) rar = 4;
  return pick(FAM.filter(f => f.rar === rar && !f.event && !f.drop)).idx;   // 降臨・キャラ集めのキャラはガチャに出ない
}
function pullGacha(n, banner = gachaBanner) {
  const g = findGacha(banner);
  if (!g) { showToast("このガチャは終了しました"); go("gacha"); return; }
  const cost = n === 10 ? GACHA_10 : GACHA_1;
  if (save.gems < cost) { showToast("ジェムが足りません"); return; }
  save.gems -= cost;
  const res = [];
  for (let i = 0; i < n; i++) {
    const guarantee = n === 10 && i === 9 && !res.some(r => FAM[r.fi].rar >= 4);
    res.push(acquire(rollOne(guarantee, g)));
  }
  addStat("pulls", n);
  if (!g.std) save.pity = (save.pity || 0) + n;   // 限定ガチャは天井のカウントが進む
  persist();
  gacha = { res, i: 0, t: 0, opened: false, banner };
  go("gachaAnim");
}
function gachaTap() {
  if (!gacha.opened) {
    if (gacha.t < 30) return;
    gacha.opened = true;
    gacha.t = 0;
    const f = FAM[gacha.res[gacha.i].fi];
    burst(W / 2, 300, RCOL[f.rar], f.rar >= 5 ? 80 : 40, 6);
    playSe(f.rar >= 6 ? "fanfare" : f.rar >= 5 ? "rare" : "gacha");
    return;
  }
  if (gacha.t < 15) return;
  gacha.i++;
  gacha.opened = false;
  gacha.t = 0;
  if (gacha.i >= gacha.res.length) go("gachaResult");
}

// ---- 更新ループ -------------------------------------------------------
function updateBolts() {
  for (const b of bolts) {
    if (!b.target || b.target.dead) {
      const list = alive();
      b.target = list.length ? pick(list) : null;
    }
    b.life--;
    if (!b.target) { b.life = 0; continue; }
    const dx = b.target.x - b.x, dy = b.target.y - b.y, d = Math.hypot(dx, dy) || 1;
    b.vx += (dx / d * 11 - b.vx) * 0.16;
    b.vy += (dy / d * 11 - b.vy) * 0.16;
    b.x += b.vx;
    b.y += b.vy;
    if (d < b.target.r) {
      dmgSrc = b.src;
      damageEnemy(b.target, b.base, b.el, false);
      dmgSrc = null;
      if (b.size > 6) burst(b.x, b.y, b.color, 14, 4);
      b.life = 0;
    }
  }
  bolts = bolts.filter(b => b.life > 0);
}

function updateFx() {
  for (const f of fx) {
    f.life--;
    if (f.kind === "wave") {
      f.y = FB - (FB - TOP + 40) * (1 - f.life / f.max);
      for (const e of alive()) {
        if (!f.hit.has(e.id) && e.y + e.r > f.y) {
          f.hit.add(e.id);
          dmgSrc = f.src;
          damageEnemy(e, f.base, f.el, false);
          dmgSrc = null;
        }
      }
    }
  }
  fx = fx.filter(f => f.life > 0);
}

function update() {
  frameNo++;
  updateHints();
  for (const t of texts) { t.y -= 0.55; t.life--; }
  texts = texts.filter(t => t.life > 0);
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vx *= 0.94; p.vy *= 0.94; p.life--; }
  particles = particles.filter(p => p.life > 0);
  if (banner && --banner.life <= 0) banner = null;
  if (toast && --toast.life <= 0) toast = null;
  if (shake > 0) shake *= 0.85;
  if (shake < 0.3) shake = 0;
  if (gacha) gacha.t++;

  if (!BATTLE.has(state) || state === "clear" || state === "over") return;

  for (const a of allies) { if (a.hurt > 0) a.hurt--; if (a.glow > 0) a.glow--; }
  for (const e of enemies) if (e.flash > 0) e.flash--;
  // 動くブロック
  for (const o of rocks) if (o.block) o.x = Math.max(o.r, Math.min(W - o.r, o.x0 + Math.sin(frameNo * o.spd + o.ph) * o.amp));
  if (quest && quest.kind === "raid") raidPoll();
  // 協力プレイ: 盤面が届いたあとに、先に来ていたショットを撃つ
  if (coop.inBattle && coop.pending && state === "aim" && coop.pending.turn === turn && coop.pending.cur === cur) {
    const p = coop.pending;
    coop.pending = null;
    ssArmed = !!p.ss && allies[cur].ssLeft === 0;
    fire(p.dx, p.dy);
  }
  updateBolts();
  updateFx();
  if (state === "shoot") updateShot();
  enemies = enemies.filter(e => !e.dead);

  const due = events.filter(ev => --ev.t <= 0);
  events = events.filter(ev => ev.t > 0);
  for (const ev of due) ev.fn();
}

// ---- 入力 -------------------------------------------------------------
function toLogical(ev) {
  const r = canvas.getBoundingClientRect();
  return { x: (ev.clientX - r.left) / r.width * W, y: (ev.clientY - r.top) / r.height * H };
}

function computeAim(from, to) {
  const vx = from.x - to.x, vy = from.y - to.y, len = Math.hypot(vx, vy);
  if (len < MIN_DRAG) return null;
  return { dx: vx / len, dy: vy / len };
}

canvas.addEventListener("pointerdown", ev => {
  ev.preventDefault();
  audioUnlock();   // スマホは画面に触れてから音が出せる
  const p = toLogical(ev);
  for (let i = ui.length - 1; i >= 0; i--) {
    const b = ui[i];
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) {
      if (!b.silent) playSe("tap");
      b.onTap();
      return;
    }
  }
  if (state !== "aim") return;
  if (coop.inBattle && !canControl(allies[cur])) { showToast(`${allies[cur].ownerName}の番です`); return; }
  dragging = true;
  dragStart = dragNow = p;
  canvas.setPointerCapture(ev.pointerId);
});

canvas.addEventListener("pointermove", ev => {
  if (dragging) dragNow = toLogical(ev);
});

canvas.addEventListener("pointerup", ev => {
  if (!dragging) return;
  dragging = false;
  const a = computeAim(dragStart, toLogical(ev));
  if (a && state === "aim") {
    if (coop.inBattle) coopSend("shot", { turn, cur, dx: a.dx, dy: a.dy, ss: ssArmed });   // 協力プレイ: みんなに送る
    fire(a.dx, a.dy);
  }
});
canvas.addEventListener("pointercancel", () => { dragging = false; });

// ---- 描画: 部品 ---------------------------------------------------------
function button(x, y, w, h, label, onTap, opt = {}) {
  ui.push({ x, y, w, h, onTap, silent: !!opt.silent });
  if (opt.hidden) return;
  ctx.save();
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, opt.disabled ? "#59607a" : opt.c1 || "#ffcf4a");
  g.addColorStop(1, opt.disabled ? "#3a3f55" : opt.c2 || "#ff8f1f");
  ctx.fillStyle = g;
  roundRect(x, y, w, h, 10);
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.6)";
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = opt.disabled ? "#c4c8d8" : opt.fg || "#3a1c00";
  ctx.font = `bold ${opt.size || 16}px system-ui, sans-serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  if (opt.sub) {
    ctx.fillText(label, x + w / 2, y + h / 2 - 7);
    ctx.font = `bold 11px system-ui, sans-serif`;
    ctx.fillText(opt.sub, x + w / 2, y + h / 2 + 11);
  } else {
    ctx.fillText(label, x + w / 2, y + h / 2 + 1);
  }
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function outlinedText(text, x, y, color, size, stroke = "#000") {
  ctx.font = `900 ${size}px system-ui, sans-serif`;
  ctx.lineWidth = Math.max(3, size / 6);
  ctx.strokeStyle = stroke;
  ctx.strokeText(text, x, y);
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}

function txt(text, x, y, size, color, align = "left", weight = "bold") {
  ctx.font = `${weight} ${size}px system-ui, sans-serif`;
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = "middle";
  ctx.fillText(text, x, y);
}

function starPath(x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
    ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.closePath();
}

function drawStars(n, x, y, s) {
  const w = s * 1.9, sx = x - (n - 1) * w / 2;
  ctx.save();
  for (let i = 0; i < n; i++) {
    starPath(sx + i * w, y, s);
    ctx.fillStyle = n >= 6 ? `hsl(${(frameNo * 3 + i * 50) % 360},90%,70%)` : "#ffd23f";
    ctx.fill();
    ctx.strokeStyle = "#5a3a00";
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  ctx.restore();
}

function rarityStroke(rar, x, y, w, h) {
  if (rar < 6) return RCOL[rar];
  const g = ctx.createLinearGradient(x, y, x + w, y + h);
  for (let i = 0; i <= 5; i++) g.addColorStop(i / 5, `hsl(${(frameNo * 2 + i * 60) % 360},90%,65%)`);
  return g;
}

function gemIcon(x, y, s) {
  ctx.save();
  ctx.fillStyle = "#5ef0ff";
  ctx.beginPath();
  ctx.moveTo(x, y - s); ctx.lineTo(x + s * 0.8, y - s * 0.2); ctx.lineTo(x, y + s);
  ctx.lineTo(x - s * 0.8, y - s * 0.2); ctx.closePath();
  ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.6)";
  ctx.beginPath();
  ctx.moveTo(x, y - s); ctx.lineTo(x + s * 0.3, y - s * 0.2); ctx.lineTo(x - s * 0.3, y - s * 0.2); ctx.closePath();
  ctx.fill();
  ctx.restore();
}
function coinIcon(x, y, s) {
  ctx.save();
  ctx.fillStyle = "#ffcf3f";
  ctx.beginPath(); ctx.arc(x, y, s, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#a87400";
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(x, y, s * 0.65, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}
function crystalIcon(el, x, y, s) {
  ctx.save();
  ctx.fillStyle = EL[el].c;
  ctx.strokeStyle = EL[el].l;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x, y - s); ctx.lineTo(x + s * 0.55, y - s * 0.3); ctx.lineTo(x + s * 0.4, y + s);
  ctx.lineTo(x - s * 0.4, y + s); ctx.lineTo(x - s * 0.55, y - s * 0.3); ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

// キャラ（すべてコードで描くオリジナルデザイン）
// k: { shape, el, acc, eye, rar, evo }
function drawChar(k, x, y, r) {
  if (k.rar >= 7) drawSuperAura(x, y, r);   // 超進化（★7）は金色の光輪と回る光
  if (k.fx) drawSkinFx(k.fx, x, y, r);        // 着せ替え（ゴールド・シャドウ）
  if (k.shape && k.shape !== "blob") { drawCreature(k, x, y, r); return; }
  const c = EL[k.el];
  ctx.save();
  drawAura(k, x, y, r);
  drawAngelWings(k, x, y, r);
  // 頭の飾り（後ろ側）
  switch (k.acc) {
    case "flame":
      for (const [ox, h, col] of [[-0.42, 0.75, "#ff7a2e"], [0, 1.05, "#ff7a2e"], [0.42, 0.75, "#ff7a2e"], [0, 0.7, "#ffd34a"]]) {
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.moveTo(x + (ox - 0.3) * r, y - r * 0.55);
        ctx.quadraticCurveTo(x + (ox - 0.1) * r, y - r * (0.6 + h * 0.6), x + ox * r, y - r * (0.55 + h));
        ctx.quadraticCurveTo(x + (ox + 0.1) * r, y - r * (0.6 + h * 0.6), x + (ox + 0.3) * r, y - r * 0.55);
        ctx.fill();
      }
      break;
    case "fin":
      ctx.fillStyle = c.d;
      ctx.beginPath();
      ctx.moveTo(x - r * 0.45, y - r * 0.75);
      ctx.quadraticCurveTo(x + r * 0.05, y - r * 1.75, x + r * 0.55, y - r * 0.7);
      ctx.fill();
      break;
    case "leaf":
      ctx.strokeStyle = "#2d7a3c";
      ctx.lineWidth = r * 0.12;
      ctx.beginPath(); ctx.moveTo(x, y - r * 0.9); ctx.lineTo(x, y - r * 1.25); ctx.stroke();
      ctx.fillStyle = "#5fd36e";
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.ellipse(x + s * r * 0.3, y - r * 1.25, r * 0.36, r * 0.16, s * -0.5, 0, Math.PI * 2);
        ctx.fill();
      }
      break;
    case "horns":
      ctx.fillStyle = "#f3e9d2";
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(x + s * r * 0.3, y - r * 0.8);
        ctx.quadraticCurveTo(x + s * r * 0.9, y - r * 1.1, x + s * r * 0.85, y - r * 1.55);
        ctx.quadraticCurveTo(x + s * r * 0.75, y - r * 1.0, x + s * r * 0.65, y - r * 0.6);
        ctx.fill();
      }
      break;
    case "ears":
      for (const s of [-1, 1]) {
        ctx.fillStyle = c.c;
        ctx.beginPath();
        ctx.moveTo(x + s * r * 0.2, y - r * 0.85);
        ctx.lineTo(x + s * r * 0.75, y - r * 1.35);
        ctx.lineTo(x + s * r * 0.85, y - r * 0.45);
        ctx.fill();
        ctx.fillStyle = "#ffb3c8";
        ctx.beginPath();
        ctx.moveTo(x + s * r * 0.35, y - r * 0.8);
        ctx.lineTo(x + s * r * 0.7, y - r * 1.15);
        ctx.lineTo(x + s * r * 0.75, y - r * 0.6);
        ctx.fill();
      }
      break;
    case "bunny":
      for (const s of [-1, 1]) {
        ctx.fillStyle = c.c;
        ctx.beginPath(); ctx.ellipse(x + s * r * 0.35, y - r * 1.3, r * 0.2, r * 0.6, s * 0.2, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#ffd0dc";
        ctx.beginPath(); ctx.ellipse(x + s * r * 0.35, y - r * 1.28, r * 0.09, r * 0.42, s * 0.2, 0, Math.PI * 2); ctx.fill();
      }
      break;
    case "antenna":
      ctx.strokeStyle = c.d;
      ctx.lineWidth = Math.max(1.5, r * 0.08);
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(x + s * r * 0.25, y - r * 0.9);
        ctx.quadraticCurveTo(x + s * r * 0.3, y - r * 1.4, x + s * r * 0.6, y - r * 1.5);
        ctx.stroke();
        ctx.fillStyle = c.l;
        ctx.beginPath(); ctx.arc(x + s * r * 0.6, y - r * 1.5, r * 0.15, 0, Math.PI * 2); ctx.fill();
      }
      break;
    case "spikes":
      ctx.fillStyle = c.d;
      for (let i = -2; i <= 2; i++) {
        const a = -Math.PI / 2 + i * 0.42;
        ctx.beginPath();
        ctx.moveTo(x + Math.cos(a - 0.17) * r * 0.9, y + Math.sin(a - 0.17) * r * 0.9);
        ctx.lineTo(x + Math.cos(a) * r * 1.45, y + Math.sin(a) * r * 1.45);
        ctx.lineTo(x + Math.cos(a + 0.17) * r * 0.9, y + Math.sin(a + 0.17) * r * 0.9);
        ctx.fill();
      }
      break;
  }
  // 体（bowlcut は肌色の顔）
  const skin = k.acc === "bowlcut";
  const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
  g.addColorStop(0, skin ? "#fff1e6" : c.l);
  g.addColorStop(1, skin ? "#f2c2a0" : c.c);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.35)";
  ctx.lineWidth = Math.max(1, r * 0.1);
  ctx.stroke();
  // 進化済み: 額の宝石
  if (k.evo) {
    ctx.fillStyle = RCOL[k.rar] === undefined ? "#fff" : (k.rar >= 6 ? `hsl(${(frameNo * 3) % 360},90%,65%)` : RCOL[k.rar]);
    ctx.beginPath();
    ctx.moveTo(x, y - r * 0.72); ctx.lineTo(x + r * 0.12, y - r * 0.56);
    ctx.lineTo(x, y - r * 0.4); ctx.lineTo(x - r * 0.12, y - r * 0.56); ctx.closePath();
    ctx.fill();
  }
  drawFace(k, x, y, r, c.c);
  // 頭の飾り（前側）
  drawFrontAcc(k, x, y, r);
  if (k.rar >= 6 && k.acc !== "hat") drawCrown(x - r * 0.55, y - r * 0.95, r, -0.4);
  ctx.restore();
}

function drawSuperAura(x, y, r) {
  ctx.save();
  const g = ctx.createRadialGradient(x, y, r * 0.6, x, y, r * 1.9);
  g.addColorStop(0, "rgba(255,240,160,0.55)");
  g.addColorStop(1, "rgba(255,200,60,0)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r * 1.9, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = `hsla(${(frameNo * 3) % 360},95%,70%,0.9)`;
  ctx.lineWidth = Math.max(1.5, r * 0.08);
  ctx.beginPath(); ctx.ellipse(x, y - r * 1.25, r * 0.6, r * 0.18, 0, 0, Math.PI * 2); ctx.stroke();
  for (let i = 0; i < 6; i++) {
    const a = frameNo * 0.04 + i * Math.PI / 3;
    ctx.fillStyle = `hsl(${(frameNo * 4 + i * 60) % 360},95%,72%)`;
    ctx.beginPath(); ctx.arc(x + Math.cos(a) * r * 1.45, y + Math.sin(a) * r * 1.2, Math.max(1.2, r * 0.09), 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

// 目と口（lid: 眠そうな目のまぶたの色、noMouth: くちばし等で口を描かない）
function drawFace(k, x, y, r, lid, noMouth = false) {
  const pupil = "#1b1b2a";
  if (k.eye === "smile") {
    // にっこり目と大きな笑顔
    ctx.strokeStyle = pupil;
    ctx.lineWidth = Math.max(1.4, r * 0.08);
    ctx.lineCap = "round";
    for (const s of [-1, 1]) {
      ctx.beginPath(); ctx.arc(x + s * r * 0.36, y + r * 0.04, r * 0.12, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
      ctx.fillStyle = "rgba(255,120,130,0.4)";
      ctx.beginPath(); ctx.ellipse(x + s * r * 0.62, y + r * 0.3, r * 0.14, r * 0.09, 0, 0, Math.PI * 2); ctx.fill();
    }
    if (!noMouth) {
      ctx.fillStyle = "#8a2a2a";
      ctx.beginPath(); ctx.arc(x, y + r * 0.3, r * 0.3, 0, Math.PI); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.fillRect(x - r * 0.24, y + r * 0.3, r * 0.48, r * 0.09);
    }
  } else if (k.eye === "mono") {
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.ellipse(x, y - r * 0.05, r * 0.32, r * 0.3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = pupil;
    ctx.beginPath(); ctx.arc(x, y, r * 0.17, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(x - r * 0.06, y - r * 0.07, r * 0.06, 0, Math.PI * 2); ctx.fill();
  } else {
    for (const s of [-1, 1]) {
      const ex = x + s * r * 0.33, ey = y - r * 0.05;
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.ellipse(ex, ey, r * 0.2, r * 0.25, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = pupil;
      ctx.beginPath(); ctx.arc(ex, ey + r * 0.05, r * 0.12, 0, Math.PI * 2); ctx.fill();
      if (k.eye === "sparkle") {
        ctx.fillStyle = "#fff";
        starPath(ex - r * 0.04, ey, r * 0.08);
        ctx.fill();
      } else {
        ctx.fillStyle = "#fff";
        ctx.beginPath(); ctx.arc(ex - r * 0.04, ey, r * 0.045, 0, Math.PI * 2); ctx.fill();
      }
      if (k.eye === "sleepy") {
        // まぶた
        ctx.fillStyle = lid;
        ctx.beginPath(); ctx.ellipse(ex, ey - r * 0.08, r * 0.23, r * 0.17, 0, Math.PI, Math.PI * 2); ctx.fill();
        ctx.fillRect(ex - r * 0.23, ey - r * 0.1, r * 0.46, r * 0.04);
      }
      if (k.eye === "sharp") {
        ctx.strokeStyle = pupil;
        ctx.lineWidth = Math.max(1.2, r * 0.08);
        ctx.beginPath();
        ctx.moveTo(x + s * r * 0.13, y - r * 0.2);
        ctx.lineTo(x + s * r * 0.55, y - r * 0.33);
        ctx.stroke();
      }
      ctx.fillStyle = "rgba(255,120,150,0.45)";
      ctx.beginPath(); ctx.ellipse(x + s * r * 0.6, y + r * 0.28, r * 0.13, r * 0.08, 0, 0, Math.PI * 2); ctx.fill();
    }
  }
  if (k.eye !== "smile" && !noMouth) {
    ctx.strokeStyle = pupil;
    ctx.lineWidth = Math.max(1.2, r * 0.08);
    ctx.beginPath(); ctx.arc(x, y + r * 0.3, r * 0.16, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  }
}

// 頭の飾り（前側）
function drawFrontAcc(k, x, y, r) {
  const c = EL[k.el];
  switch (k.acc) {
    case "bowlcut": {
      // マッシュルームカット
      ctx.fillStyle = "#2b211c";
      ctx.beginPath();
      ctx.moveTo(x - r * 1.06, y + r * 0.1);
      ctx.lineTo(x - r * 1.06, y - r * 0.3);
      ctx.ellipse(x, y - r * 0.3, r * 1.06, r * 0.9, 0, Math.PI, 0);
      ctx.lineTo(x + r * 1.06, y + r * 0.1);
      ctx.lineTo(x + r * 0.82, y - r * 0.18);
      for (let i = 0; i <= 8; i++) {
        ctx.lineTo(x + r * 0.82 - i * (r * 1.64 / 8), y - r * 0.3 + (i % 2 ? r * 0.07 : 0));
      }
      ctx.lineTo(x - r * 0.82, y - r * 0.18);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.18)";
      ctx.beginPath(); ctx.ellipse(x - r * 0.3, y - r * 0.85, r * 0.35, r * 0.12, -0.3, 0, Math.PI * 2); ctx.fill();
      // 丸メガネ
      ctx.strokeStyle = "#5a4636";
      ctx.lineWidth = Math.max(1.2, r * 0.07);
      for (const s of [-1, 1]) {
        ctx.beginPath(); ctx.arc(x + s * r * 0.36, y, r * 0.25, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.beginPath(); ctx.moveTo(x - r * 0.11, y - r * 0.02); ctx.lineTo(x + r * 0.11, y - r * 0.02); ctx.stroke();
      break;
    }
    case "halo":
      ctx.strokeStyle = "#ffe66b";
      ctx.lineWidth = r * 0.13;
      ctx.beginPath(); ctx.ellipse(x, y - r * 1.15, r * 0.5, r * 0.16, 0, 0, Math.PI * 2); ctx.stroke();
      break;
    case "star":
      starPath(x + r * 0.15, y - r * 1.05, r * 0.42);
      ctx.fillStyle = "#ffe066";
      ctx.fill();
      ctx.strokeStyle = "#a87400";
      ctx.lineWidth = Math.max(1, r * 0.06);
      ctx.stroke();
      break;
    case "bow":
      ctx.fillStyle = "#ff6fa8";
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(x + r * 0.5, y - r * 0.85);
        ctx.lineTo(x + r * 0.5 + s * r * 0.45, y - r * 0.85 - r * 0.28);
        ctx.lineTo(x + r * 0.5 + s * r * 0.45, y - r * 0.85 + r * 0.28);
        ctx.fill();
      }
      ctx.fillStyle = "#ffd0e4";
      ctx.beginPath(); ctx.arc(x + r * 0.5, y - r * 0.85, r * 0.12, 0, Math.PI * 2); ctx.fill();
      break;
    case "hat":
      ctx.fillStyle = "#2a1846";
      ctx.beginPath(); ctx.ellipse(x, y - r * 0.75, r * 0.85, r * 0.18, -0.1, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x - r * 0.5, y - r * 0.8);
      ctx.quadraticCurveTo(x + r * 0.1, y - r * 1.4, x + r * 0.55, y - r * 1.85);
      ctx.lineTo(x + r * 0.5, y - r * 0.85);
      ctx.fill();
      ctx.fillStyle = c.c;
      ctx.fillRect(x - r * 0.48, y - r * 0.95, r * 0.98, r * 0.12);
      break;
  }
}

// ★6の冠（cx, cy が中心、r は持ち主の大きさ）
function drawCrown(cx, cy, r, rot) {
  {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    ctx.fillStyle = "#ffd23f";
    ctx.strokeStyle = "#8a6a00";
    ctx.lineWidth = Math.max(1, r * 0.05);
    const cw = r * 0.55, ch = r * 0.35;
    ctx.beginPath();
    ctx.moveTo(-cw / 2, ch / 2); ctx.lineTo(-cw / 2, -ch / 2); ctx.lineTo(-cw / 4, 0);
    ctx.lineTo(0, -ch / 2 - ch * 0.2); ctx.lineTo(cw / 4, 0); ctx.lineTo(cw / 2, -ch / 2); ctx.lineTo(cw / 2, ch / 2);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }
}

// ★6: 回転するオーラ
function drawAura(k, x, y, r) {
  if (k.rar < 6) return;
  ctx.save();
  ctx.globalAlpha = 0.55;
  ctx.strokeStyle = `hsl(${(frameNo * 3) % 360},90%,70%)`;
  ctx.lineWidth = Math.max(2, r * 0.1);
  ctx.setLineDash([r * 0.3, r * 0.2]);
  ctx.lineDashOffset = -frameNo * 0.8;
  ctx.beginPath(); ctx.arc(x, y, r * 1.35, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

// ★5以上: 天使の翼
function drawAngelWings(k, x, y, r) {
  if (k.rar < 5) return;
  ctx.fillStyle = k.rar >= 6 ? "rgba(255,240,200,0.92)" : "rgba(255,255,255,0.85)";
  for (const s of [-1, 1]) {
    for (let j = 0; j < 3; j++) {
      ctx.beginPath();
      ctx.ellipse(x + s * r * (0.95 + j * 0.12), y - r * (0.15 - j * 0.22), r * (0.55 - j * 0.1), r * 0.18, s * (0.5 - j * 0.35), 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

const SKIN = "#ffdcc4", SKIN_D = "#f0b896";
const HAIR = { fire: "#c2381a", water: "#1d5aa8", wood: "#2f7a36", light: "#e3b93c", dark: "#3b2452" };

function shade(x, y, r, c1, c2) {
  const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r);
  g.addColorStop(0, c1);
  g.addColorStop(1, c2);
  return g;
}

// 人型・獣・鳥・竜・魚（すべてオリジナルデザイン）
function drawCreature(k, x, y, r) {
  ctx.save();
  drawAura(k, x, y, r);
  const winged = k.shape === "bird" || k.shape === "dragon";
  if (!winged) drawAngelWings(k, x, y + r * (k.shape === "human" ? 0.45 : 0.1), k.shape === "human" ? r * 0.85 : r);
  switch (k.shape) {
    case "human":  drawHuman(k, x, y, r); break;
    case "beast":  drawBeast(k, x, y, r); break;
    case "bird":   drawBird(k, x, y, r); break;
    case "dragon": drawDragon(k, x, y, r); break;
    case "fish":   drawFish(k, x, y, r); break;
    case "cat":    drawCat(k, x, y, r); break;
  }
  if (k.rar >= 6) {
    if (k.shape === "human") drawCrown(x + r * 0.32, y - r * 0.98, r, 0.35);
    else drawCrown(x - r * 0.45, y - r * 0.92, r, -0.4);
  }
  ctx.restore();
}

function drawHuman(k, x, y, r) {
  const c = EL[k.el], hair = HAIR[k.el];
  const hx = x, hy = y - r * 0.28, hr = r * 0.6;
  // マント（騎士）
  if (k.acc === "helmet") {
    ctx.fillStyle = c.d;
    ctx.beginPath();
    ctx.moveTo(x - r * 0.45, y + r * 0.15); ctx.lineTo(x + r * 0.45, y + r * 0.15);
    ctx.lineTo(x + r * 0.7, y + r * 1.0); ctx.lineTo(x - r * 0.7, y + r * 1.0);
    ctx.fill();
  }
  // 後ろ髪
  ctx.fillStyle = hair;
  if (k.acc === "long") {
    roundRect(hx - hr * 1.05, hy - hr * 0.3, hr * 2.1, hr * 2.0, hr * 0.5);
    ctx.fill();
  } else if (k.acc === "twin") {
    for (const s of [-1, 1]) {
      ctx.beginPath(); ctx.ellipse(hx + s * hr * 1.15, hy + hr * 0.5, hr * 0.32, hr * 0.85, s * -0.25, 0, Math.PI * 2); ctx.fill();
    }
  }
  // 足
  ctx.fillStyle = "#3a2f2a";
  for (const s of [-1, 1]) { roundRect(x + s * r * 0.22 - r * 0.13, y + r * 0.72, r * 0.26, r * 0.3, r * 0.08); ctx.fill(); }
  // 胴体（服）。fringe は白いシャツ＋紺のインナー
  const shirt = k.acc === "fringe";
  ctx.fillStyle = shirt ? shade(x, y + r * 0.5, r * 0.6, "#ffffff", "#d8dde8") : shade(x, y + r * 0.5, r * 0.6, c.l, c.c);
  ctx.beginPath();
  ctx.moveTo(x - r * 0.32, y + r * 0.2); ctx.lineTo(x + r * 0.32, y + r * 0.2);
  ctx.lineTo(x + r * 0.48, y + r * 0.82); ctx.lineTo(x - r * 0.48, y + r * 0.82);
  ctx.closePath();
  ctx.fill();
  if (shirt) {
    ctx.fillStyle = "#1c2448";
    ctx.beginPath();
    ctx.moveTo(x - r * 0.16, y + r * 0.2); ctx.lineTo(x + r * 0.16, y + r * 0.2); ctx.lineTo(x, y + r * 0.46);
    ctx.fill();
    ctx.strokeStyle = "#b8c0d4";
    ctx.lineWidth = Math.max(1, r * 0.04);
    ctx.beginPath(); ctx.moveTo(x, y + r * 0.46); ctx.lineTo(x, y + r * 0.8); ctx.stroke();
  } else {
    ctx.fillStyle = c.d;
    ctx.fillRect(x - r * 0.46, y + r * 0.55, r * 0.92, r * 0.09);
  }
  // 手と武器
  ctx.fillStyle = SKIN;
  for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(x + s * r * 0.5, y + r * 0.52, r * 0.12, 0, Math.PI * 2); ctx.fill(); }
  if (k.acc === "helmet" || k.acc === "spiky") {
    // 剣
    ctx.save();
    ctx.translate(x + r * 0.55, y + r * 0.5);
    ctx.rotate(-0.5);
    ctx.fillStyle = "#e6ecf5";
    ctx.fillRect(-r * 0.05, -r * 0.85, r * 0.1, r * 0.8);
    ctx.fillStyle = "#c9a227";
    ctx.fillRect(-r * 0.18, -r * 0.08, r * 0.36, r * 0.08);
    ctx.restore();
  } else if (k.acc === "mage" || k.acc === "long") {
    // 杖
    ctx.strokeStyle = "#7a5230";
    ctx.lineWidth = Math.max(1.5, r * 0.08);
    ctx.beginPath(); ctx.moveTo(x - r * 0.55, y + r * 0.95); ctx.lineTo(x - r * 0.55, y - r * 0.1); ctx.stroke();
    ctx.fillStyle = c.l;
    ctx.shadowColor = c.c;
    ctx.shadowBlur = r * 0.5;
    ctx.beginPath(); ctx.arc(x - r * 0.55, y - r * 0.15, r * 0.13, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
  }
  // 顔
  ctx.fillStyle = shade(hx, hy, hr, "#fff3ea", SKIN);
  ctx.beginPath(); ctx.arc(hx, hy, hr, 0, Math.PI * 2); ctx.fill();
  drawFace(k, hx, hy + hr * 0.12, hr * 0.92, SKIN);
  // 前髪・かぶりもの
  switch (k.acc) {
    case "spiky":
      ctx.fillStyle = hair;
      ctx.beginPath();
      ctx.moveTo(hx - hr * 1.0, hy);
      for (let i = 0; i <= 6; i++) {
        const a = Math.PI + i * Math.PI / 6;
        const rr = i % 2 ? hr * 1.45 : hr * 1.0;
        ctx.lineTo(hx + Math.cos(a) * rr, hy - hr * 0.1 + Math.sin(a) * rr);
      }
      ctx.lineTo(hx + hr * 1.0, hy);
      ctx.lineTo(hx + hr * 0.6, hy - hr * 0.35);
      ctx.lineTo(hx + hr * 0.2, hy - hr * 0.2);
      ctx.lineTo(hx - hr * 0.2, hy - hr * 0.4);
      ctx.lineTo(hx - hr * 0.6, hy - hr * 0.2);
      ctx.closePath();
      ctx.fill();
      break;
    case "long":
    case "twin":
      ctx.fillStyle = hair;
      ctx.beginPath();
      ctx.arc(hx, hy - hr * 0.05, hr * 1.04, Math.PI * 1.02, Math.PI * 1.98);
      ctx.quadraticCurveTo(hx + hr * 0.5, hy - hr * 0.55, hx, hy - hr * 0.3);
      ctx.quadraticCurveTo(hx - hr * 0.5, hy - hr * 0.55, hx - hr * 1.02, hy - hr * 0.1);
      ctx.fill();
      if (k.acc === "twin") {
        ctx.fillStyle = "#ff6fa8";
        for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(hx + s * hr * 0.95, hy - hr * 0.3, hr * 0.16, 0, Math.PI * 2); ctx.fill(); }
      } else {
        // エルフ耳
        ctx.fillStyle = SKIN_D;
        for (const s of [-1, 1]) {
          ctx.beginPath();
          ctx.moveTo(hx + s * hr * 0.9, hy - hr * 0.05);
          ctx.lineTo(hx + s * hr * 1.45, hy - hr * 0.45);
          ctx.lineTo(hx + s * hr * 0.95, hy + hr * 0.25);
          ctx.fill();
        }
      }
      break;
    case "helmet":
      ctx.fillStyle = shade(hx, hy - hr * 0.4, hr, "#ffffff", "#9aa6b8");
      ctx.beginPath(); ctx.arc(hx, hy - hr * 0.05, hr * 1.06, Math.PI, 0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#7d889a";
      ctx.fillRect(hx - hr * 1.06, hy - hr * 0.12, hr * 2.12, hr * 0.16);
      ctx.fillStyle = c.c;
      ctx.beginPath();
      ctx.moveTo(hx - hr * 0.1, hy - hr * 1.05);
      ctx.quadraticCurveTo(hx + hr * 0.6, hy - hr * 1.6, hx + hr * 1.0, hy - hr * 0.9);
      ctx.quadraticCurveTo(hx + hr * 0.5, hy - hr * 1.1, hx + hr * 0.1, hy - hr * 0.95);
      ctx.fill();
      break;
    case "fringe": {
      // こげ茶のマッシュ風の髪（前髪が眉の下まで）
      ctx.fillStyle = "#3a2618";
      ctx.beginPath();
      ctx.arc(hx, hy - hr * 0.05, hr * 1.07, Math.PI * 0.95, Math.PI * 2.05);
      ctx.lineTo(hx + hr * 0.92, hy - hr * 0.1);
      for (let i = 0; i <= 8; i++) {
        const px = hx + hr * 0.92 - i * (hr * 1.84 / 8);
        ctx.lineTo(px, hy - hr * (i % 2 ? 0.12 : 0.26));
      }
      ctx.lineTo(hx - hr * 1.02, hy + hr * 0.1);
      ctx.closePath();
      ctx.fill();
      // 毛先のはね
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(hx + s * hr * 0.95, hy - hr * 0.2);
        ctx.lineTo(hx + s * hr * 1.2, hy + hr * 0.15);
        ctx.lineTo(hx + s * hr * 0.85, hy + hr * 0.05);
        ctx.fill();
      }
      ctx.fillStyle = "rgba(255,255,255,0.15)";
      ctx.beginPath(); ctx.ellipse(hx - hr * 0.3, hy - hr * 0.75, hr * 0.38, hr * 0.12, -0.3, 0, Math.PI * 2); ctx.fill();
      break;
    }
    case "headband": {
      // 丸みのある茶色の短髪（ハチマキなし）
      ctx.fillStyle = "#7a4a26";
      ctx.beginPath();
      ctx.arc(hx, hy - hr * 0.05, hr * 1.05, Math.PI * 1.0, Math.PI * 2.0);
      ctx.quadraticCurveTo(hx + hr * 0.7, hy - hr * 0.2, hx + hr * 0.35, hy - hr * 0.42);
      ctx.quadraticCurveTo(hx, hy - hr * 0.25, hx - hr * 0.35, hy - hr * 0.45);
      ctx.quadraticCurveTo(hx - hr * 0.7, hy - hr * 0.2, hx - hr * 1.05, hy - hr * 0.05);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.18)";
      ctx.beginPath(); ctx.ellipse(hx - hr * 0.35, hy - hr * 0.75, hr * 0.35, hr * 0.12, -0.3, 0, Math.PI * 2); ctx.fill();
      break;
    }
    case "hood":
      // 忍者ずきん（目元以外を覆う）
      ctx.fillStyle = "#2a2838";
      ctx.beginPath(); ctx.arc(hx, hy, hr * 1.06, Math.PI * 0.98, Math.PI * 2.02); ctx.fill();
      ctx.fillRect(hx - hr * 1.06, hy + hr * 0.3, hr * 2.12, hr * 0.5);
      ctx.beginPath(); ctx.arc(hx, hy + hr * 0.3, hr * 1.06, 0, Math.PI); ctx.fill();
      ctx.fillStyle = c.c;
      ctx.fillRect(hx - hr * 1.06, hy - hr * 0.42, hr * 2.12, hr * 0.14);
      ctx.beginPath();
      ctx.moveTo(hx + hr * 0.9, hy - hr * 0.4);
      ctx.lineTo(hx + hr * 1.6, hy - hr * 0.6);
      ctx.lineTo(hx + hr * 1.5, hy - hr * 0.2);
      ctx.fill();
      break;
    case "mage":
      ctx.fillStyle = hair;
      ctx.beginPath(); ctx.arc(hx, hy - hr * 0.05, hr * 1.04, Math.PI * 1.05, Math.PI * 1.95); ctx.lineTo(hx, hy - hr * 0.35); ctx.fill();
      ctx.fillStyle = c.d;
      ctx.beginPath(); ctx.ellipse(hx, hy - hr * 0.7, hr * 1.4, hr * 0.28, -0.08, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(hx - hr * 0.75, hy - hr * 0.75);
      ctx.quadraticCurveTo(hx + hr * 0.1, hy - hr * 1.6, hx + hr * 0.9, hy - hr * 2.1);
      ctx.lineTo(hx + hr * 0.75, hy - hr * 0.8);
      ctx.fill();
      ctx.fillStyle = c.l;
      starPath(hx + hr * 0.2, hy - hr * 1.05, hr * 0.2);
      ctx.fill();
      break;
  }
}

function drawBeast(k, x, y, r) {
  const c = EL[k.el];
  const fur = k.el === "light" ? "#fff8e0" : c.c, furL = k.el === "light" ? "#ffffff" : c.l;
  // しっぽ
