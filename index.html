  wood:  { n: "木", c: "#46c46a", l: "#aef0bf", d: "#165a2a", p: ["森精", "翠樹", "大樹神"], w: "翠緑" },
  light: { n: "光", c: "#ffd23f", l: "#fff3b8", d: "#8a6a00", p: ["聖", "光輝", "天光神"], w: "聖光" },
  dark:  { n: "闇", c: "#9b5cff", l: "#d6bcff", d: "#3a1670", p: ["影", "冥夜", "魔神"], w: "冥闇" },
};
const EL_KEYS = Object.keys(EL);
// 有利属性: 火→木→水→火、光⇄闇
const ADV = { fire: "wood", wood: "water", water: "fire", light: "dark", dark: "light" };
function elemMult(atk, def) {
  if (ADV[atk] === def) return 2;
  if (ADV[def] === atk && atk !== "light" && atk !== "dark") return 0.5;
  return 1;
}

// ---- キャラクター ---------------------------------------------------------
// 友情コンボ（他のキャラに触れると発動）

  ["ボルカ",   "fire",  3, "reflect", "horns",   "sharp",   "thunder", "burst"],

  ["ルリハ",   "water", 5, "reflect", "star",    "sharp",   "laser",   "meteor"],
  ["モリノ",   "wood",  3, "pierce",  "leaf",    "sleepy",  "heal",    "burst"],
  ["ツタマル", "wood",  3, "reflect", "spikes",  "round",   "blast",   "needle"],
  ["ソーン",   "wood",  4, "reflect", "leaf",    "round",   "homing",  "needle"],
  ["フローラ", "wood",  4, "pierce",  "bow",     "sparkle", "heal",    "judge"],
  ["コケット", "wood",  4, "reflect", "ears",    "sleepy",  "laser",   "wave"],
  ["ジュカ",   "wood",  5, "reflect", "antenna", "sharp",   "thunder", "meteor"],
  ["ピカリ",   "light", 3, "reflect", "star",    "round",   "thunder", "burst"],
  ["ハロ",     "light", 3, "pierce",  "halo",    "sleepy",  "laser",   "needle"],
  ["ルクス",   "light", 4, "pierce",  "halo",    "round",   "heal",    "judge"],
  ["ソレイユ", "light", 4, "reflect", "spikes",  "sharp",   "blast",   "wave"],
  ["ルミナ",   "light", 4, "pierce",  "bunny",   "round",   "homing",  "judge"],

].map((a, i) => ({ idx: i, name: a[0], el: a[1], rar: a[2], type: a[3], acc: a[4], eye: a[5], combo: a[6], ss: a[7] }));
const STARTERS = [2, 8, 14, 20];   // ブレイズ・マリン・ソーン・ルクス

const RBASE = {
  3: { atk: 1600, hp: 11000, spd: 13.5 },
  4: { atk: 2000, hp: 14000, spd: 14 },
  5: { atk: 2450, hp: 17000, spd: 14.8 },
  6: { atk: 3000, hp: 21000, spd: 15.5 },
};
const MAXLV = { 3: 30, 4: 50, 5: 70, 6: 99 };
const MAX_AWK = 5;                                  // 覚醒（ガチャで被ると上がる）
const EVO_CR = { 3: 5, 4: 12, 5: 25 };              // 進化に必要な結晶
const EVO_COIN = { 3: 2000, 4: 6000, 5: 15000 };    // 進化に必要なコイン
const RCOL = { 3: "#d39a5a", 4: "#d8e0f0", 5: "#ffd23f", 6: "#ff8ae6" };
const lvCost = lv => 20 + lv * 8;

// ---- ガチャ -----------------------------------------------------------
const GACHA_1 = 50, GACHA_10 = 450;
const RATE5 = 0.06, RATE4 = 0.30;

// ---- セーブデータ -------------------------------------------------------
const SAVE_KEY = "mflick-save-v1";
let save = null;

function newSave() {
  const box = {};
  for (const fi of STARTERS) box[fi] = { rar: FAM[fi].rar, lv: 1, awk: 0 };
  const cr = {};
  for (const k of EL_KEYS) cr[k] = 0;
  return { gems: 500, coins: 3000, cr, box, party: [...STARTERS], cleared: {}, best: {}, daily: "" };
}
function loadSave() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (s && s.box && s.party) { save = s; return; }
  } catch (e) { /* 読み込めない環境 */ }
  save = newSave();
}
function persist() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* 保存できない環境 */ }
}
function today() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
}

// ---- ユニット計算 -------------------------------------------------------
const owned = fi => !!save.box[fi];
function unitRar(fi) { return save.box[fi] ? save.box[fi].rar : FAM[fi].rar; }
function displayName(fi) {
  const f = FAM[fi], rar = unitRar(fi);
  return rar > f.rar ? EL[f.el].p[rar - 4] + f.name : f.name;
}
function look(fi) {
  const f = FAM[fi];
  return { el: f.el, acc: f.acc, eye: f.eye, rar: unitRar(fi), evo: unitRar(fi) > f.rar };
}
function unitStats(fi) {
  const f = FAM[fi], u = save.box[fi] || { rar: f.rar, lv: 1, awk: 0 }, b = RBASE[u.rar];
  const v = 1 + (((fi * 37) % 11) - 5) / 100;           // キャラごとの個性
  const lvm = 1 + (u.lv - 1) * 0.012, am = 1 + u.awk * 0.04;
  const tm = f.type === "pierce" ? [1.05, 0.95] : [1, 1];
  return {
    atk: Math.round(b.atk * v * tm[0] * lvm * am),
    hp: Math.round(b.hp * (2 - v) * tm[1] * lvm * am),
    spd: b.spd + (fi % 3) * 0.4,
  };
}
function ssTurns(fi) { return Math.max(4, SS[FAM[fi].ss].turns - (unitRar(fi) - FAM[fi].rar)); }
function ssName(fi) { return EL[FAM[fi].el].w + "の" + SS[FAM[fi].ss].name; }

// キャラ入手（新規 or 覚醒 or コイン変換）
function acquire(fi) {
  const u = save.box[fi];
  if (!u) { save.box[fi] = { rar: FAM[fi].rar, lv: 1, awk: 0 }; return { fi, kind: "new" }; }
  if (u.awk < MAX_AWK) { u.awk++; return { fi, kind: "awk" }; }
  const c = 500 * FAM[fi].rar;
  save.coins += c;
  return { fi, kind: "coin", coins: c };
}

// ---- クエスト ---------------------------------------------------------
let uid = 1;
// weak: 弱点の角度（null で弱点なし）。roam: 毎ターン弱点が移動
function mob(x, y, el, hp, atk, cd, o = {}) {
  return {
    id: uid++, x, y, el, hp, maxHp: hp, atk, cd, maxCd: cd,
    r: o.r || 22, boss: !!o.boss, name: o.name || "",
    weak: o.weak === undefined ? null : o.weak, roam: !!o.roam,
    atkType: o.atkType || "single", flash: 0, dead: false, wob: Math.random() * 6,
  };
}
const boss = (x, y, el, hp, atk, cd, name, o = {}) =>
  mob(x, y, el, hp, atk, cd, { r: 46, boss: true, name, weak: Math.PI / 2, roam: true, atkType: "all", ...o });
const rock = (x, y, r = 13) => ({ x, y, r });
const UP = -Math.PI / 2, DOWN = Math.PI / 2;

// ステージ構成のひな形（m: メイン属性, s: サブ属性）

    () => ({ boss: true, enemies: [

  B: (m, s, b) => [

    () => ({ enemies: [

      mob(60, 300, s, 30000, 4000, 2), mob(300, 300, s, 30000, 4000, 2),
      mob(180, 230, m, 40000, 4500, 4, { r: 28, weak: 0, roam: true }),
    ], rocks: [rock(180, 120), rock(130, 360), rock(230, 360)] }),
    () => ({ boss: true, enemies: [
      boss(180, 165, m, 320000, 12000, 3, b[0]),
      mob(60, 290, m, 30000, 4000, 2), mob(300, 290, m, 30000, 4000, 2),
      mob(180, 330, s, 36000, 4500, 3, { weak: DOWN }),
    ], rocks: [rock(110, 240), rock(250, 240)] }),
  ],
  C: (m, s, b) => [
    () => ({ enemies: [

    ] }),
    () => ({ boss: true, enemies: [
      boss(180, 160, m, 300000, 13000, 3, b[0]),
      mob(60, 320, m, 36000, 4500, 2), mob(300, 320, m, 36000, 4500, 2),
    ], rocks: [rock(120, 260), rock(240, 260), rock(180, 360)] }),
    () => ({ boss: true, enemies: [
      boss(180, 200, m, 480000, 16000, 2, b[1], { r: 54 }),
      mob(60, 110, s, 40000, 5000, 3, { weak: DOWN }), mob(300, 110, s, 40000, 5000, 3, { weak: DOWN }),
    ], rocks: [rock(70, 380), rock(290, 380)] }),
  ],
};

// mul: 敵のHP・攻撃力の倍率。crEl: 報酬の結晶の属性（null はランダム）
const QUESTS = [
  { name: "はじまりの森", sub: "木属性中心 / 火属性が有利", diff: 1, mul: 0.8, par: 12,
    bg: ["#173322", "#0a170f"], coin: 800, gem: 50, crEl: "wood", crN: 3,
    waves: LAYOUTS.A("wood", "water", ["森の番人グロウガ"]) },
  { name: "灼熱の火山", sub: "火属性中心 / 水属性が有利", diff: 2, mul: 1.15, par: 12,
    bg: ["#3a1a12", "#160806"], coin: 1200, gem: 50, crEl: "fire", crN: 3,
    waves: LAYOUTS.A("fire", "wood", ["溶岩竜バルガロス"]) },
  { name: "蒼の海溝", sub: "水属性中心 / 木属性が有利", diff: 3, mul: 1.0, par: 16,
    bg: ["#0f2440", "#060d1c"], coin: 1800, gem: 80, crEl: "water", crN: 4,
    waves: LAYOUTS.B("water", "fire", ["深淵の主ヴォルタク"]) },
  { name: "光の神殿", sub: "光属性中心 / 闇属性が有利", diff: 4, mul: 1.35, par: 16,

    waves: LAYOUTS.B("light", "wood", ["天秤の守護者アストレイ"]) },
  { name: "冥府の塔", sub: "闇属性中心 / 光属性が有利", diff: 5, mul: 1.3, par: 20,
    bg: ["#24133a", "#0c0616"], coin: 3500, gem: 100, crEl: "dark", crN: 5,
    waves: LAYOUTS.C("dark", "light", ["冥王ノクスガルド (I)", "冥王ノクスガルド (II)"]) },
  { name: "極・混沌の玉座", sub: "超高難度 / 光属性が有利", diff: 6, mul: 2.3, par: 20,
    bg: ["#2a0a14", "#0a0206"], coin: 6000, gem: 150, crEl: null, crN: 6,
    waves: LAYOUTS.C("dark", "fire", ["混沌帝カオスレイ (I)", "混沌帝カオスレイ (II)"]) },
];
const questUnlocked = i => i === 0 || !!save.cleared[i - 1];

// ---- 状態 -------------------------------------------------------------
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

// home | quests | gacha | gachaAnim | gachaResult | box | detail | party
// | aim | shoot | enemy | wave | clear | over
let state = "home";
const BATTLE = new Set(["aim", "shoot", "enemy", "wave", "clear", "over"]);
let questIdx = 0, quest = null, waveIdx = 0;
let allies = [], enemies = [], rocks = [], hearts = [];
let hp = 0, maxHp = 0, turn = 1, cur = 0, ssArmed = false;
let shot = null, hitCount = 0;
let bolts = [], fx = [], particles = [], texts = [], events = [];
let banner = null, shake = 0, frameNo = 0, toast = null;
let lastResult = null;
let gacha = null, detailFi = 0;
let ui = [];           // 当たり判定付きボタン（毎フレーム描画時に登録）

let dragging = false, dragStart = null, dragNow = null;

function showToast(text) { toast = { text, life: 90 }; }
function go(s) { state = s; particles = []; texts = []; banner = null; }

// ---- バトル開始 ---------------------------------------------------------
function makeAlly(fi, x, y) {
  const f = FAM[fi], s = unitStats(fi), t = ssTurns(fi);
  return {
    fi, name: displayName(fi), el: f.el, type: f.type, atk: s.atk, hp: s.hp, spd: s.spd,
    combo: f.combo, comboName: COMBO[f.combo].name,
    ss: f.ss, ssName: ssName(fi), ssTurns: t, ssDesc: SS[f.ss].desc, ssLeft: t,
    look: look(fi), x, y, vx: 0, vy: 0, hurt: 0, glow: 0,
  };
}

function startQuest(i) {
  questIdx = i;
  quest = QUESTS[i];
  waveIdx = 0;
  const n = save.party.length;
  allies = save.party.map((fi, k) => makeAlly(fi, W / (n + 1) * (k + 1), 505));
  maxHp = hp = allies.reduce((s, a) => s + a.hp, 0);
  turn = 1;
  cur = 0;
  ssArmed = false;
  shot = null;
  bolts = []; fx = []; particles = []; texts = []; events = [];
  loadWave();
  state = "aim";
}

function loadWave() {
  const w = quest.waves[waveIdx]();
  for (const e of w.enemies) {
    e.hp = e.maxHp = Math.round(e.hp * quest.mul);
    e.atk = Math.round(e.atk * quest.mul);
  }
  enemies = w.enemies;
  rocks = w.rocks || [];
  hearts = [];
  for (const a of allies) resolveOverlap(a);
  const last = waveIdx === quest.waves.length - 1;
  if (w.boss) showBanner(last ? "BOSS BATTLE" : "BOSS 出現", enemies[0].name, "#ff5b6b");
  else showBanner(`WAVE ${waveIdx + 1}`, `${waveIdx + 1} / ${quest.waves.length}`, "#ffd35c");
}

function schedule(t, fn) { events.push({ t, fn }); }
function showBanner(text, sub, color) { banner = { text, sub, color, life: 70, max: 70 }; }
function addText(x, y, text, color, size = 15) {
  texts.push({ x, y, text: String(text), color, size, life: 42 });
}
function burst(x, y, color, n, spd = 3) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * spd + 0.5;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 30, max: 30, color, size: 1.5 + Math.random() * 2.5 });
  }
}
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const alive = () => enemies.filter(e => !e.dead);

// ---- 物理 -------------------------------------------------------------
function overlap(b, cx, cy, r) { return Math.hypot(b.x - cx, b.y - cy) < R + r; }

// 円との衝突と反射。重なっていたら true
function bounce(b, cx, cy, r) {
  const dx = b.x - cx, dy = b.y - cy;
  const d = Math.hypot(dx, dy);
  const min = R + r;
  if (d >= min || d === 0) return false;
  const nx = dx / d, ny = dy / d;
  b.x = cx + nx * min;
  b.y = cy + ny * min;
  const vn = b.vx * nx + b.vy * ny;
  if (vn < 0) { b.vx -= 2 * vn * nx; b.vy -= 2 * vn * ny; }
  return true;
}

function walls(b) {
  if (b.x < R)          { b.x = R;          b.vx = Math.abs(b.vx); }
  if (b.x > W - R)      { b.x = W - R;      b.vx = -Math.abs(b.vx); }
  if (b.y < TOP + R)    { b.y = TOP + R;    b.vy = Math.abs(b.vy); }
  if (b.y > FB - R)     { b.y = FB - R;     b.vy = -Math.abs(b.vy); }
}

// 停止位置が他の物体と重ならないよう押し出す
function resolveOverlap(a) {
  for (let k = 0; k < 12; k++) {
    let moved = false;
    const objs = [...enemies.filter(e => !e.dead), ...rocks, ...allies.filter(o => o !== a).map(o => ({ x: o.x, y: o.y, r: R }))];
    for (const o of objs) {
      const dx = a.x - o.x, dy = a.y - o.y, d = Math.hypot(dx, dy) || 0.01, min = R + o.r + 1;
      if (d < min) { a.x = o.x + dx / d * min; a.y = o.y + dy / d * min; moved = true; }
    }
    a.x = Math.min(W - R, Math.max(R, a.x));
    a.y = Math.min(FB - R, Math.max(TOP + R, a.y));
    if (!moved) break;
  }
}

function segDist(px, py, x1, y1, x2, y2) {
  const vx = x2 - x1, vy = y2 - y1;
  const t = Math.max(0, Math.min(1, ((px - x1) * vx + (py - y1) * vy) / (vx * vx + vy * vy)));
  return Math.hypot(px - (x1 + vx * t), py - (y1 + vy * t));
}

function weakPos(e) {
  return { x: e.x + Math.cos(e.weak) * e.r * 0.62, y: e.y + Math.sin(e.weak) * e.r * 0.62, r: e.r * 0.34 };
}

// ---- ダメージ ---------------------------------------------------------
function damageEnemy(e, base, el, weak) {
  if (e.dead) return;
  const m = elemMult(el, e.el) * (weak ? 3 : 1);
  const dmg = Math.round(base * m * rand(0.92, 1.08));
  e.hp -= dmg;
  e.flash = 6;
  hitCount++;
  const col = m >= 2 ? "#ffe066" : m < 1 ? "#9aa3b8" : "#ffffff";
  addText(e.x + rand(-12, 12), e.y - e.r * 0.3 + rand(-6, 6), dmg.toLocaleString(), col, weak ? 19 : 15);
  if (weak) addText(e.x, e.y - e.r - 16, "弱点!", "#ffef5c", 14);
  burst(e.x, e.y, EL[el].l, weak ? 10 : 5);
  if (e.boss) shake = Math.max(shake, weak ? 5 : 2);
  if (e.hp <= 0) {
    e.hp = 0;
    e.dead = true;
    burst(e.x, e.y, EL[e.el].c, e.boss ? 60 : 24, e.boss ? 6 : 4);
    addText(e.x, e.y, e.boss ? "撃破!!" : "撃破!", "#ffd35c", e.boss ? 24 : 17);
    shake = Math.max(shake, e.boss ? 12 : 4);
  }
}

function damageParty(dmg, x, y) {
  hp = Math.max(0, hp - dmg);
  addText(x, y - 26, "-" + dmg.toLocaleString(), "#ff6b6b", 16);
  shake = Math.max(shake, 6);
  if (hp <= 0) {
    events = [];
    schedule(40, () => { state = "over"; lastResult = null; });
  }
}

function healParty(v, x, y) {
  hp = Math.min(maxHp, hp + v);
  addText(x, y - 26, "+" + v.toLocaleString(), "#7dffa0", 15);
}

function addBolt(x, y, vx, vy, base, el, size = 4) {
  bolts.push({ x, y, vx, vy, target: null, base, el, color: EL[el].l, size, life: 140 });
}

// ---- 友情コンボ ---------------------------------------------------------
function triggerCombo(a) {
  a.glow = 20;
  const col = EL[a.el].l;
  addText(a.x, a.y - 30, a.comboName, col, 13);
  switch (a.combo) {
    case "blast": {
      const rad = 95;
      fx.push({ kind: "ring", x: a.x, y: a.y, r0: 10, r1: rad, life: 22, max: 22, color: EL[a.el].c, w: 8 });
      for (const e of alive()) if (Math.hypot(e.x - a.x, e.y - a.y) < rad + e.r) damageEnemy(e, a.atk * 1.7, a.el, false);
      break;
    }
    case "laser": {
      fx.push({ kind: "line", x1: 0, y1: a.y, x2: W, y2: a.y, w: 10, life: 18, max: 18, color: col });
      fx.push({ kind: "line", x1: a.x, y1: TOP, x2: a.x, y2: FB, w: 10, life: 18, max: 18, color: col });
      for (const e of alive()) {
        if (Math.abs(e.y - a.y) < e.r + 8 || Math.abs(e.x - a.x) < e.r + 8) damageEnemy(e, a.atk * 1.5, a.el, false);
      }
      break;
    }
    case "homing": {
      for (let i = 0; i < 8; i++) {
        const ang = (i / 8) * Math.PI * 2;
        addBolt(a.x, a.y, Math.cos(ang) * 5, Math.sin(ang) * 5, a.atk * 0.45, a.el);
      }
      break;
    }
    case "thunder": {
      // 近い敵へ順に連鎖する雷（最大4体）
      let from = { x: a.x, y: a.y };
      const hit = new Set();
      for (let k = 0; k < 4; k++) {
        const next = alive().filter(e => !hit.has(e))
          .sort((p, q) => Math.hypot(p.x - from.x, p.y - from.y) - Math.hypot(q.x - from.x, q.y - from.y))[0];
        if (!next) break;
        hit.add(next);
        fx.push({ kind: "bolt", x1: from.x, y1: from.y, x2: next.x, y2: next.y, life: 18, max: 18, color: col });
        damageEnemy(next, a.atk * 1.1, a.el, false);
        from = next;
      }
      break;
    }
    case "heal": {
      fx.push({ kind: "ring", x: a.x, y: a.y, r0: 8, r1: 60, life: 24, max: 24, color: "#9dffb0", w: 5 });
      healParty(Math.round(a.hp * 0.15), a.x, a.y);
      break;
    }
  }
}

// ---- ストライクショット -----------------------------------------------------
function judgeLaser(a, dx, dy) {
  let t = Infinity;
  if (dx > 0) t = Math.min(t, (W - a.x) / dx);
  if (dx < 0) t = Math.min(t, -a.x / dx);
  if (dy > 0) t = Math.min(t, (FB - a.y) / dy);
  if (dy < 0) t = Math.min(t, (TOP - a.y) / dy);
  const x2 = a.x + dx * t, y2 = a.y + dy * t;
  fx.push({ kind: "line", x1: a.x, y1: a.y, x2, y2, w: 30, life: 34, max: 34, color: EL[a.el].l });
  for (const e of alive()) {
    if (segDist(e.x, e.y, a.x, a.y, x2, y2) < e.r + 14) damageEnemy(e, a.atk * 8, a.el, false);
  }
  shake = Math.max(shake, 8);
}

// ---- ターン進行 ---------------------------------------------------------
function fire(dx, dy) {
  const a = allies[cur];
  let sp = a.spd;
  shot = { ally: a, cool: new Map(), touched: new Set(), atkMul: 1, stopped: false, needle: 0, needleT: 0, trail: [] };
  hitCount = 0;
  if (ssArmed) {
    ssArmed = false;
    a.ssLeft = a.ssTurns;
    showBanner(a.ssName, "ストライクショット!", EL[a.el].c);
    burst(a.x, a.y, EL[a.el].l, 30, 5);
    switch (a.ss) {
      case "burst":  shot.atkMul = 3; sp *= 1.3; break;
      case "wave":   fx.push({ kind: "wave", y: FB, life: 45, max: 45, hit: new Set(), base: a.atk * 3.5, el: a.el }); break;
      case "needle": shot.needle = 30; break;
      case "judge":  judgeLaser(a, dx, dy); break;
      case "meteor":
        for (let i = 0; i < 8; i++) addBolt(rand(30, W - 30), TOP - 20 - i * 25, 0, 6, a.atk * 2.2, a.el, 9);
        break;
    }
  }
  a.vx = dx * sp;
  a.vy = dy * sp;
  state = "shoot";
}

function updateShot() {
  const s = shot, a = s.ally;
  if (!s.stopped) {
    for (let k = 0; k < SUB; k++) {
      a.x += a.vx / SUB;
      a.y += a.vy / SUB;
      walls(a);
      for (const o of rocks) bounce(a, o.x, o.y, o.r);
      for (const e of enemies) {
        if (e.dead) continue;
        const hit = a.type === "reflect" ? bounce(a, e.x, e.y, e.r) : overlap(a, e.x, e.y, e.r);
        if (hit && !s.cool.has(e.id)) {
          s.cool.set(e.id, a.type === "reflect" ? 6 : 10);
          let weak = false;
          if (e.weak !== null) { const w = weakPos(e); weak = Math.hypot(a.x - w.x, a.y - w.y) < R + w.r; }
          damageEnemy(e, a.atk * s.atkMul, a.el, weak);
        }
      }
      for (const o of allies) {
        if (o !== a && !s.touched.has(o) && overlap(a, o.x, o.y, R)) { s.touched.add(o); triggerCombo(o); }
      }
      for (const h of hearts) {
        if (!h.taken && overlap(a, h.x, h.y, h.r)) {
          h.taken = true;
          healParty(Math.round(maxHp * 0.15), h.x, h.y);
          burst(h.x, h.y, "#ff8fb1", 16);
        }
      }
    }
    hearts = hearts.filter(h => !h.taken);
    for (const [k, v] of s.cool) { if (v <= 1) s.cool.delete(k); else s.cool.set(k, v - 1); }
    a.vx *= FRICTION;
    a.vy *= FRICTION;
    s.trail.push({ x: a.x, y: a.y });
    if (s.trail.length > 12) s.trail.shift();

    if (s.needle > 0 && --s.needleT <= 0 && alive().length) {
      s.needle--;
      s.needleT = 4;
      const ang = Math.random() * Math.PI * 2;
      addBolt(a.x, a.y, Math.cos(ang) * 6, Math.sin(ang) * 6, a.atk * 0.8, a.el);
    }

    if (Math.hypot(a.vx, a.vy) < STOP) {
      s.stopped = true;
      a.vx = a.vy = 0;
      s.trail = [];
      resolveOverlap(a);
    }
  }
  if (s.stopped && !bolts.length && !fx.some(f => f.kind === "wave")) endShot();
}

function endShot() {
  shot = null;
  if (!alive().length) { waveClear(); return; }
  enemyPhase();
}

function enemyPhase() {
  state = "enemy";
  let delay = 12;
  for (const e of alive()) {
    if (--e.cd > 0) continue;
    e.cd = e.maxCd;
    schedule(delay, () => enemyAttack(e));
    delay += 26;
  }
  schedule(delay + 6, startTurn);
}

function enemyAttack(e) {
  if (e.dead || hp <= 0) return;
  e.flash = 10;
  if (e.atkType === "all") {
    fx.push({ kind: "ring", x: e.x, y: e.y, r0: e.r, r1: 560, life: 30, max: 30, color: "#ff4d6d", w: 12 });
    for (const a of allies) a.hurt = 16;
    addText(e.x, e.y + e.r + 12, "全体攻撃", "#ff8b9b", 14);
    damageParty(e.atk, W / 2, FB - 10);
  } else {
    const t = pick(allies);
    fx.push({ kind: "line", x1: e.x, y1: e.y, x2: t.x, y2: t.y, w: 5, life: 16, max: 16, color: "#ff5b6b" });
    t.hurt = 16;
    burst(t.x, t.y, "#ff5b6b", 10);
    damageParty(e.atk, t.x, t.y);
  }
}

function startTurn() {
  if (hp <= 0) return;
  turn++;
  cur = (cur + 1) % allies.length;
  for (const a of allies) a.ssLeft = Math.max(0, a.ssLeft - 1);
  ssArmed = false;
  for (const e of alive()) if (e.roam && e.weak !== null) e.weak = Math.random() * Math.PI * 2;
  if (hearts.length === 0 && Math.random() < 0.3) spawnHeart();
  state = "aim";
}

function spawnHeart() {
  for (let k = 0; k < 30; k++) {
    const h = { x: rand(40, W - 40), y: rand(TOP + 60, FB - 60), r: 11, taken: false };
    const blocked = [...alive(), ...rocks].some(o => Math.hypot(o.x - h.x, o.y - h.y) < o.r + 24)
      || allies.some(a => Math.hypot(a.x - h.x, a.y - h.y) < R + 24);
    if (!blocked) { hearts.push(h); return; }
  }
}

function waveClear() {
  state = "wave";
  const last = waveIdx === quest.waves.length - 1;
  showBanner(last ? "QUEST CLEAR!" : "WAVE CLEAR", "", "#7dffa0");
  schedule(last ? 80 : 60, () => {
    if (last) { finishQuest(); return; }
    waveIdx++;
    loadWave();
    startTurn();
  });
}

// クリア報酬
function finishQuest() {
  const q = quest, first = !save.cleared[questIdx];
  const best = save.best[questIdx];
  const isBest = best === undefined || turn < best;
  if (isBest) save.best[questIdx] = turn;
  const rank = turn <= q.par ? "S" : turn <= q.par * 1.4 ? "A" : "B";
  const coin = Math.round(q.coin * (rank === "S" ? 1.5 : rank === "A" ? 1.2 : 1));
  const crEl = q.crEl || pick(EL_KEYS);
  const crN = q.crN + Math.floor(Math.random() * 3);
  const gem = first ? q.gem : 0;
  let drop = null;
  if (Math.random() < 0.35) {
    const pool = FAM.filter(f => f.rar === 3 && f.el === crEl);
    drop = acquire(pick(pool.length ? pool : FAM.filter(f => f.rar === 3)).idx);
  }
  save.coins += coin;
  save.gems += gem;
  save.cr[crEl] += crN;
  save.cleared[questIdx] = true;
  persist();
  lastResult = { turn, rank, best: isBest ? turn : best, isBest, coin, gem, crEl, crN, drop };
  state = "clear";
}

// ---- 育成 -------------------------------------------------------------
function levelUp(fi, toMax) {
  const u = save.box[fi], cap = MAXLV[u.rar];
  if (u.lv >= cap) { showToast("レベルが上限です。進化させよう!"); return; }
  let n = 0;
  while (u.lv < cap && save.coins >= lvCost(u.lv)) {
    save.coins -= lvCost(u.lv);
    u.lv++;
    n++;
    if (!toMax) break;
  }
  if (!n) { showToast("コインが足りません"); return; }
  burst(180, 170, "#ffe066", 20, 4);
  addText(180, 120, `Lv UP! → ${u.lv}`, "#ffe066", 20);
  persist();
}
function maxCost(fi) {
  const u = save.box[fi], cap = MAXLV[u.rar];
  let c = 0;
  for (let lv = u.lv; lv < cap; lv++) c += lvCost(lv);
  return c;
}
function evolve(fi) {
  const u = save.box[fi], f = FAM[fi];
  if (u.rar >= 6) return;
  if (u.lv < MAXLV[u.rar]) { showToast(`Lv${MAXLV[u.rar]}にすると進化できます`); return; }
  if (save.cr[f.el] < EVO_CR[u.rar]) { showToast(`${EL[f.el].n}の結晶が足りません`); return; }
  if (save.coins < EVO_COIN[u.rar]) { showToast("コインが足りません"); return; }
  save.cr[f.el] -= EVO_CR[u.rar];
  save.coins -= EVO_COIN[u.rar];
  u.rar++;
  persist();
  burst(180, 170, EL[f.el].l, 70, 6);
  burst(180, 170, "#ffffff", 30, 4);
  showBanner("進化成功!", `${displayName(fi)}  ★${u.rar}`, RCOL[u.rar]);
}

// ---- ガチャ -----------------------------------------------------------
function rollOne(guarantee4) {
  const r = Math.random();
  let rar = r < RATE5 ? 5 : r < RATE5 + RATE4 ? 4 : 3;
  if (guarantee4 && rar === 3) rar = 4;
  return pick(FAM.filter(f => f.rar === rar)).idx;
}
function pullGacha(n) {
  const cost = n === 10 ? GACHA_10 : GACHA_1;
  if (save.gems < cost) { showToast("ジェムが足りません"); return; }
  save.gems -= cost;
  const res = [];
  for (let i = 0; i < n; i++) {
    const guarantee = n === 10 && i === 9 && !res.some(r => FAM[r.fi].rar >= 4);
    res.push(acquire(rollOne(guarantee)));
  }
  persist();
  gacha = { res, i: 0, t: 0, opened: false };
  go("gachaAnim");
}
function gachaTap() {
  if (!gacha.opened) {
    if (gacha.t < 30) return;
    gacha.opened = true;
    gacha.t = 0;
    const f = FAM[gacha.res[gacha.i].fi];
    burst(W / 2, 300, RCOL[f.rar], f.rar >= 5 ? 80 : 40, 6);
    return;
  }
  if (gacha.t < 15) return;
  gacha.i++;
  gacha.opened = false;
  gacha.t = 0;
  if (gacha.i >= gacha.res.length) go("gachaResult");
}

// ---- 更新ループ -------------------------------------------------------
function updateBolts() {
  for (const b of bolts) {
    if (!b.target || b.target.dead) {
      const list = alive();
      b.target = list.length ? pick(list) : null;
    }
    b.life--;
    if (!b.target) { b.life = 0; continue; }
    const dx = b.target.x - b.x, dy = b.target.y - b.y, d = Math.hypot(dx, dy) || 1;
    b.vx += (dx / d * 11 - b.vx) * 0.16;
    b.vy += (dy / d * 11 - b.vy) * 0.16;
    b.x += b.vx;
    b.y += b.vy;
    if (d < b.target.r) {
      damageEnemy(b.target, b.base, b.el, false);
      if (b.size > 6) burst(b.x, b.y, b.color, 14, 4);
      b.life = 0;
    }
  }
  bolts = bolts.filter(b => b.life > 0);
}

function updateFx() {
  for (const f of fx) {
    f.life--;
    if (f.kind === "wave") {
      f.y = FB - (FB - TOP + 40) * (1 - f.life / f.max);
      for (const e of alive()) {
        if (!f.hit.has(e.id) && e.y + e.r > f.y) { f.hit.add(e.id); damageEnemy(e, f.base, f.el, false); }
      }
    }
  }
  fx = fx.filter(f => f.life > 0);
}

function update() {
  frameNo++;
  for (const t of texts) { t.y -= 0.55; t.life--; }
  texts = texts.filter(t => t.life > 0);
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vx *= 0.94; p.vy *= 0.94; p.life--; }
  particles = particles.filter(p => p.life > 0);
  if (banner && --banner.life <= 0) banner = null;
  if (toast && --toast.life <= 0) toast = null;
  if (shake > 0) shake *= 0.85;
  if (shake < 0.3) shake = 0;
  if (gacha) gacha.t++;

  if (!BATTLE.has(state) || state === "clear" || state === "over") return;

  for (const a of allies) { if (a.hurt > 0) a.hurt--; if (a.glow > 0) a.glow--; }
  for (const e of enemies) if (e.flash > 0) e.flash--;
  updateBolts();
  updateFx();
  if (state === "shoot") updateShot();
  enemies = enemies.filter(e => !e.dead);

  const due = events.filter(ev => --ev.t <= 0);
  events = events.filter(ev => ev.t > 0);
  for (const ev of due) ev.fn();
}

// ---- 入力 -------------------------------------------------------------
function toLogical(ev) {
  const r = canvas.getBoundingClientRect();
  return { x: (ev.clientX - r.left) / r.width * W, y: (ev.clientY - r.top) / r.height * H };
}

function computeAim(from, to) {
  const vx = from.x - to.x, vy = from.y - to.y, len = Math.hypot(vx, vy);
  if (len < MIN_DRAG) return null;
  return { dx: vx / len, dy: vy / len };
}

canvas.addEventListener("pointerdown", ev => {
  ev.preventDefault();
  const p = toLogical(ev);
  for (let i = ui.length - 1; i >= 0; i--) {
    const b = ui[i];
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { b.onTap(); return; }
  }
  if (state !== "aim") return;
  dragging = true;
  dragStart = dragNow = p;
  canvas.setPointerCapture(ev.pointerId);
});

canvas.addEventListener("pointermove", ev => {
  if (dragging) dragNow = toLogical(ev);
});

canvas.addEventListener("pointerup", ev => {
  if (!dragging) return;
  dragging = false;
  const a = computeAim(dragStart, toLogical(ev));
  if (a && state === "aim") fire(a.dx, a.dy);
});
canvas.addEventListener("pointercancel", () => { dragging = false; });

// ---- 描画: 部品 ---------------------------------------------------------
function button(x, y, w, h, label, onTap, opt = {}) {
  ui.push({ x, y, w, h, onTap });
  if (opt.hidden) return;
  ctx.save();
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, opt.disabled ? "#59607a" : opt.c1 || "#ffcf4a");
  g.addColorStop(1, opt.disabled ? "#3a3f55" : opt.c2 || "#ff8f1f");
  ctx.fillStyle = g;
  roundRect(x, y, w, h, 10);
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.6)";
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = opt.disabled ? "#c4c8d8" : opt.fg || "#3a1c00";
  ctx.font = `bold ${opt.size || 16}px system-ui, sans-serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  if (opt.sub) {
    ctx.fillText(label, x + w / 2, y + h / 2 - 7);
    ctx.font = `bold 11px system-ui, sans-serif`;
    ctx.fillText(opt.sub, x + w / 2, y + h / 2 + 11);
  } else {
    ctx.fillText(label, x + w / 2, y + h / 2 + 1);
  }
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function outlinedText(text, x, y, color, size, stroke = "#000") {
  ctx.font = `900 ${size}px system-ui, sans-serif`;
  ctx.lineWidth = Math.max(3, size / 6);
  ctx.strokeStyle = stroke;
  ctx.strokeText(text, x, y);
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}

function txt(text, x, y, size, color, align = "left", weight = "bold") {
  ctx.font = `${weight} ${size}px system-ui, sans-serif`;
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = "middle";
  ctx.fillText(text, x, y);
}

function starPath(x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
    ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.closePath();
}

function drawStars(n, x, y, s) {
  const w = s * 1.9, sx = x - (n - 1) * w / 2;
  ctx.save();
  for (let i = 0; i < n; i++) {
    starPath(sx + i * w, y, s);
    ctx.fillStyle = n >= 6 ? `hsl(${(frameNo * 3 + i * 50) % 360},90%,70%)` : "#ffd23f";
    ctx.fill();
    ctx.strokeStyle = "#5a3a00";
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  ctx.restore();
}

function rarityStroke(rar, x, y, w, h) {
  if (rar < 6) return RCOL[rar];
  const g = ctx.createLinearGradient(x, y, x + w, y + h);
  for (let i = 0; i <= 5; i++) g.addColorStop(i / 5, `hsl(${(frameNo * 2 + i * 60) % 360},90%,65%)`);
  return g;
}

function gemIcon(x, y, s) {
  ctx.save();
  ctx.fillStyle = "#5ef0ff";
  ctx.beginPath();
  ctx.moveTo(x, y - s); ctx.lineTo(x + s * 0.8, y - s * 0.2); ctx.lineTo(x, y + s);
  ctx.lineTo(x - s * 0.8, y - s * 0.2); ctx.closePath();
  ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.6)";
  ctx.beginPath();
  ctx.moveTo(x, y - s); ctx.lineTo(x + s * 0.3, y - s * 0.2); ctx.lineTo(x - s * 0.3, y - s * 0.2); ctx.closePath();
  ctx.fill();
  ctx.restore();
}
function coinIcon(x, y, s) {
  ctx.save();
  ctx.fillStyle = "#ffcf3f";
  ctx.beginPath(); ctx.arc(x, y, s, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#a87400";
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(x, y, s * 0.65, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}
function crystalIcon(el, x, y, s) {
  ctx.save();
  ctx.fillStyle = EL[el].c;
  ctx.strokeStyle = EL[el].l;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x, y - s); ctx.lineTo(x + s * 0.55, y - s * 0.3); ctx.lineTo(x + s * 0.4, y + s);
  ctx.lineTo(x - s * 0.4, y + s); ctx.lineTo(x - s * 0.55, y - s * 0.3); ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

// キャラ（すべてコードで描くオリジナルデザイン）
// k: { el, acc, eye, rar, evo }
function drawChar(k, x, y, r) {
  const c = EL[k.el];
  ctx.save();
  // ★6: 回転するオーラ
  if (k.rar >= 6) {
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.strokeStyle = `hsl(${(frameNo * 3) % 360},90%,70%)`;
    ctx.lineWidth = Math.max(2, r * 0.1);
    ctx.setLineDash([r * 0.3, r * 0.2]);
    ctx.lineDashOffset = -frameNo * 0.8;
    ctx.beginPath(); ctx.arc(x, y, r * 1.35, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
  // ★5以上: 翼
  if (k.rar >= 5) {
    ctx.fillStyle = k.rar >= 6 ? "rgba(255,240,200,0.92)" : "rgba(255,255,255,0.85)";
    for (const s of [-1, 1]) {
      for (let j = 0; j < 3; j++) {
        ctx.beginPath();
        ctx.ellipse(x + s * r * (0.95 + j * 0.12), y - r * (0.15 - j * 0.22), r * (0.55 - j * 0.1), r * 0.18, s * (0.5 - j * 0.35), 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
  // 頭の飾り（後ろ側）
  switch (k.acc) {
    case "flame":
      for (const [ox, h, col] of [[-0.42, 0.75, "#ff7a2e"], [0, 1.05, "#ff7a2e"], [0.42, 0.75, "#ff7a2e"], [0, 0.7, "#ffd34a"]]) {
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.moveTo(x + (ox - 0.3) * r, y - r * 0.55);
        ctx.quadraticCurveTo(x + (ox - 0.1) * r, y - r * (0.6 + h * 0.6), x + ox * r, y - r * (0.55 + h));
        ctx.quadraticCurveTo(x + (ox + 0.1) * r, y - r * (0.6 + h * 0.6), x + (ox + 0.3) * r, y - r * 0.55);
        ctx.fill();
      }
      break;
    case "fin":
      ctx.fillStyle = c.d;
      ctx.beginPath();
      ctx.moveTo(x - r * 0.45, y - r * 0.75);
      ctx.quadraticCurveTo(x + r * 0.05, y - r * 1.75, x + r * 0.55, y - r * 0.7);
      ctx.fill();
      break;
    case "leaf":
      ctx.strokeStyle = "#2d7a3c";
      ctx.lineWidth = r * 0.12;
      ctx.beginPath(); ctx.moveTo(x, y - r * 0.9); ctx.lineTo(x, y - r * 1.25); ctx.stroke();
      ctx.fillStyle = "#5fd36e";
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.ellipse(x + s * r * 0.3, y - r * 1.25, r * 0.36, r * 0.16, s * -0.5, 0, Math.PI * 2);
        ctx.fill();
      }
      break;
    case "horns":
      ctx.fillStyle = "#f3e9d2";
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(x + s * r * 0.3, y - r * 0.8);
        ctx.quadraticCurveTo(x + s * r * 0.9, y - r * 1.1, x + s * r * 0.85, y - r * 1.55);
        ctx.quadraticCurveTo(x + s * r * 0.75, y - r * 1.0, x + s * r * 0.65, y - r * 0.6);
        ctx.fill();
      }
      break;
    case "ears":
      for (const s of [-1, 1]) {
        ctx.fillStyle = c.c;
        ctx.beginPath();
        ctx.moveTo(x + s * r * 0.2, y - r * 0.85);
        ctx.lineTo(x + s * r * 0.75, y - r * 1.35);
        ctx.lineTo(x + s * r * 0.85, y - r * 0.45);
        ctx.fill();
        ctx.fillStyle = "#ffb3c8";
        ctx.beginPath();
        ctx.moveTo(x + s * r * 0.35, y - r * 0.8);
        ctx.lineTo(x + s * r * 0.7, y - r * 1.15);
        ctx.lineTo(x + s * r * 0.75, y - r * 0.6);
        ctx.fill();
      }
      break;
    case "bunny":
      for (const s of [-1, 1]) {
        ctx.fillStyle = c.c;
        ctx.beginPath(); ctx.ellipse(x + s * r * 0.35, y - r * 1.3, r * 0.2, r * 0.6, s * 0.2, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#ffd0dc";
        ctx.beginPath(); ctx.ellipse(x + s * r * 0.35, y - r * 1.28, r * 0.09, r * 0.42, s * 0.2, 0, Math.PI * 2); ctx.fill();
      }
      break;
    case "antenna":
      ctx.strokeStyle = c.d;
      ctx.lineWidth = Math.max(1.5, r * 0.08);
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(x + s * r * 0.25, y - r * 0.9);
        ctx.quadraticCurveTo(x + s * r * 0.3, y - r * 1.4, x + s * r * 0.6, y - r * 1.5);
        ctx.stroke();
        ctx.fillStyle = c.l;
        ctx.beginPath(); ctx.arc(x + s * r * 0.6, y - r * 1.5, r * 0.15, 0, Math.PI * 2); ctx.fill();
      }
      break;
    case "spikes":
      ctx.fillStyle = c.d;
      for (let i = -2; i <= 2; i++) {
        const a = -Math.PI / 2 + i * 0.42;
        ctx.beginPath();
        ctx.moveTo(x + Math.cos(a - 0.17) * r * 0.9, y + Math.sin(a - 0.17) * r * 0.9);
        ctx.lineTo(x + Math.cos(a) * r * 1.45, y + Math.sin(a) * r * 1.45);
        ctx.lineTo(x + Math.cos(a + 0.17) * r * 0.9, y + Math.sin(a + 0.17) * r * 0.9);
        ctx.fill();
      }
      break;
  }
  // 体
  const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
  g.addColorStop(0, c.l);
  g.addColorStop(1, c.c);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.35)";
  ctx.lineWidth = Math.max(1, r * 0.1);
  ctx.stroke();
  // 進化済み: 額の宝石
  if (k.evo) {
    ctx.fillStyle = RCOL[k.rar] === undefined ? "#fff" : (k.rar >= 6 ? `hsl(${(frameNo * 3) % 360},90%,65%)` : RCOL[k.rar]);
    ctx.beginPath();
    ctx.moveTo(x, y - r * 0.72); ctx.lineTo(x + r * 0.12, y - r * 0.56);
    ctx.lineTo(x, y - r * 0.4); ctx.lineTo(x - r * 0.12, y - r * 0.56); ctx.closePath();
    ctx.fill();
  }
  // 目
  const pupil = "#1b1b2a";
  if (k.eye === "mono") {
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.ellipse(x, y - r * 0.05, r * 0.32, r * 0.3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = pupil;
    ctx.beginPath(); ctx.arc(x, y, r * 0.17, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(x - r * 0.06, y - r * 0.07, r * 0.06, 0, Math.PI * 2); ctx.fill();
  } else {
    for (const s of [-1, 1]) {
      const ex = x + s * r * 0.33, ey = y - r * 0.05;
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.ellipse(ex, ey, r * 0.2, r * 0.25, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = pupil;
      ctx.beginPath(); ctx.arc(ex, ey + r * 0.05, r * 0.12, 0, Math.PI * 2); ctx.fill();
      if (k.eye === "sparkle") {
        ctx.fillStyle = "#fff";
        starPath(ex - r * 0.04, ey, r * 0.08);
        ctx.fill();
      } else {
        ctx.fillStyle = "#fff";
        ctx.beginPath(); ctx.arc(ex - r * 0.04, ey, r * 0.045, 0, Math.PI * 2); ctx.fill();
      }
      if (k.eye === "sleepy") {
        // まぶた
        ctx.fillStyle = c.c;
        ctx.beginPath(); ctx.ellipse(ex, ey - r * 0.08, r * 0.23, r * 0.17, 0, Math.PI, Math.PI * 2); ctx.fill();
        ctx.fillRect(ex - r * 0.23, ey - r * 0.1, r * 0.46, r * 0.04);
      }
      if (k.eye === "sharp") {
        ctx.strokeStyle = pupil;
        ctx.lineWidth = Math.max(1.2, r * 0.08);
        ctx.beginPath();
        ctx.moveTo(x + s * r * 0.13, y - r * 0.2);
        ctx.lineTo(x + s * r * 0.55, y - r * 0.33);
        ctx.stroke();
      }
      ctx.fillStyle = "rgba(255,120,150,0.45)";
      ctx.beginPath(); ctx.ellipse(x + s * r * 0.6, y + r * 0.28, r * 0.13, r * 0.08, 0, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.strokeStyle = pupil;
  ctx.lineWidth = Math.max(1.2, r * 0.08);
  ctx.beginPath(); ctx.arc(x, y + r * 0.3, r * 0.16, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  // 頭の飾り（前側）
  switch (k.acc) {
    case "halo":
      ctx.strokeStyle = "#ffe66b";
      ctx.lineWidth = r * 0.13;
      ctx.beginPath(); ctx.ellipse(x, y - r * 1.15, r * 0.5, r * 0.16, 0, 0, Math.PI * 2); ctx.stroke();
      break;
    case "star":
      starPath(x + r * 0.15, y - r * 1.05, r * 0.42);
      ctx.fillStyle = "#ffe066";
      ctx.fill();
      ctx.strokeStyle = "#a87400";
      ctx.lineWidth = Math.max(1, r * 0.06);
      ctx.stroke();
      break;
    case "bow":
      ctx.fillStyle = "#ff6fa8";
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(x + r * 0.5, y - r * 0.85);
        ctx.lineTo(x + r * 0.5 + s * r * 0.45, y - r * 0.85 - r * 0.28);
        ctx.lineTo(x + r * 0.5 + s * r * 0.45, y - r * 0.85 + r * 0.28);
        ctx.fill();
      }
      ctx.fillStyle = "#ffd0e4";
      ctx.beginPath(); ctx.arc(x + r * 0.5, y - r * 0.85, r * 0.12, 0, Math.PI * 2); ctx.fill();
      break;
    case "hat":
      ctx.fillStyle = "#2a1846";
      ctx.beginPath(); ctx.ellipse(x, y - r * 0.75, r * 0.85, r * 0.18, -0.1, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x - r * 0.5, y - r * 0.8);
      ctx.quadraticCurveTo(x + r * 0.1, y - r * 1.4, x + r * 0.55, y - r * 1.85);
      ctx.lineTo(x + r * 0.5, y - r * 0.85);
      ctx.fill();
      ctx.fillStyle = c.c;
      ctx.fillRect(x - r * 0.48, y - r * 0.95, r * 0.98, r * 0.12);
      break;
  }
  // ★6: 冠
  if (k.rar >= 6 && k.acc !== "hat") {
    ctx.save();
    ctx.translate(x - r * 0.55, y - r * 0.95);
    ctx.rotate(-0.4);
    ctx.fillStyle = "#ffd23f";
    ctx.strokeStyle = "#8a6a00";
    ctx.lineWidth = Math.max(1, r * 0.05);
    const cw = r * 0.55, ch = r * 0.35;
    ctx.beginPath();
    ctx.moveTo(-cw / 2, ch / 2); ctx.lineTo(-cw / 2, -ch / 2); ctx.lineTo(-cw / 4, 0);
    ctx.lineTo(0, -ch / 2 - ch * 0.2); ctx.lineTo(cw / 4, 0); ctx.lineTo(cw / 2, -ch / 2); ctx.lineTo(cw / 2, ch / 2);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

// キャラアイコン（左上 x,y・サイズ s）
function drawIcon(fi, x, y, s, opt = {}) {
  const f = FAM[fi], u = save.box[fi], rar = u ? u.rar : f.rar;
  ctx.save();
  const g = ctx.createLinearGradient(0, y, 0, y + s);
  g.addColorStop(0, u || !opt.silhouette ? EL[f.el].d : "#22263a");
  g.addColorStop(1, "#0b0e22");
  ctx.fillStyle = g;
  roundRect(x, y, s, s, s * 0.15);
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = u || !opt.silhouette ? rarityStroke(rar, x, y, s, s) : "#3a3f55";
  ctx.stroke();
  if (!u && opt.silhouette) {
    txt("?", x + s / 2, y + s / 2, s * 0.45, "#5a6080", "center", "900");
    ctx.restore();
    return;
  }
  ctx.save();
  roundRect(x, y, s, s, s * 0.15);
  ctx.clip();
  drawChar(u ? look(fi) : { el: f.el, acc: f.acc, eye: f.eye, rar, evo: false }, x + s / 2, y + s * 0.56, s * 0.25);
  ctx.restore();
  drawStars(rar, x + s / 2, y + s - 6, s * 0.065);
  if (opt.lv && u) {
    ctx.textAlign = "left";
    outlinedText(`Lv${u.lv}`, x + 3, y + 8, "#fff", 9);
  }
  ctx.restore();
}

function drawEnemy(e) {
  const c = EL[e.el], r = e.r;
  const x = e.x, y = e.y + Math.sin(frameNo * 0.05 + e.wob) * 1.5;
  ctx.save();
  if (e.boss) {
    ctx.fillStyle = c.d;
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(x + s * r * 0.6, y - r * 0.2);
      ctx.lineTo(x + s * r * 1.65, y - r * 0.9);
      ctx.lineTo(x + s * r * 1.45, y - r * 0.2);
      ctx.lineTo(x + s * r * 1.7, y + r * 0.25);
      ctx.lineTo(x + s * r * 0.7, y + r * 0.4);
      ctx.fill();
    }
  }
  ctx.fillStyle = e.boss ? "#f0e6d0" : c.d;
  const hl = e.boss ? 1.55 : 1.3;
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(x + s * r * 0.25, y - r * 0.8);
    ctx.lineTo(x + s * r * 0.65, y - r * hl);
    ctx.lineTo(x + s * r * 0.7, y - r * 0.55);
    ctx.fill();
  }
  ctx.shadowColor = c.c;
  ctx.shadowBlur = e.boss ? 18 : 8;
  const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.4, r * 0.1, x, y, r);
  g.addColorStop(0, c.c);
  g.addColorStop(1, c.d);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  for (const s of [-1, 1]) {
    ctx.fillStyle = "#fff8d6";
    ctx.beginPath(); ctx.ellipse(x + s * r * 0.34, y - r * 0.1, r * 0.2, r * 0.15, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = e.boss ? "#ff2a2a" : "#1a0a0a";
    ctx.beginPath(); ctx.arc(x + s * r * 0.32, y - r * 0.08, r * 0.08, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#140808";
    ctx.lineWidth = Math.max(2, r * 0.08);
    ctx.beginPath();
    ctx.moveTo(x + s * r * 0.12, y - r * 0.24);
    ctx.lineTo(x + s * r * 0.55, y - r * 0.36);
    ctx.stroke();
  }
  ctx.fillStyle = "#1a0a0a";
  ctx.beginPath(); ctx.ellipse(x, y + r * 0.35, r * 0.32, r * 0.13, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#fff";
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(x + s * r * 0.18, y + r * 0.25);
    ctx.lineTo(x + s * r * 0.1, y + r * 0.42);
    ctx.lineTo(x + s * r * 0.02, y + r * 0.25);
    ctx.fill();
  }
  if (e.flash > 0) {
    ctx.globalAlpha = e.flash / 10;
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  if (e.weak !== null) {
    const w = weakPos(e);
    const pulse = 1 + Math.sin(frameNo * 0.2) * 0.15;
    ctx.strokeStyle = "#ffef5c";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(w.x, w.y, w.r * pulse, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "rgba(255,239,92,0.35)";
    ctx.beginPath(); ctx.arc(w.x, w.y, w.r * 0.55 * pulse, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(w.x - w.r * 1.3, w.y); ctx.lineTo(w.x + w.r * 1.3, w.y);
    ctx.moveTo(w.x, w.y - w.r * 1.3); ctx.lineTo(w.x, w.y + w.r * 1.3);
    ctx.stroke();
  }
  if (!e.boss) {
    const bw = r * 2, bx = x - r, by = y + r + 5, ratio = e.hp / e.maxHp;
    ctx.fillStyle = "#000b";
    ctx.fillRect(bx, by, bw, 5);
    ctx.fillStyle = ratio > 0.5 ? "#7ee07e" : ratio > 0.25 ? "#ffd35c" : "#ff6b6b";
    ctx.fillRect(bx, by, bw * ratio, 5);
  }
  const cx = x - r * 0.8, cy = y - r * 0.8;
  ctx.fillStyle = e.cd <= 1 ? "#ff3b4e" : "#fff";
  ctx.beginPath(); ctx.arc(cx, cy, 10, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#000";
  ctx.lineWidth = 1.5;
  ctx.stroke();
  txt(String(e.cd), cx, cy + 1, 13, e.cd <= 1 ? "#fff" : "#111", "center", "900");
  drawElemIcon(e.el, x + r * 0.8, y + r * 0.75, 8);
  ctx.restore();
}

function drawElemIcon(el, x, y, r) {
  ctx.fillStyle = EL[el].c;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 1.5;
  ctx.stroke();
  txt(EL[el].n, x, y + 1, Math.round(r * 1.2), "#fff", "center", "900");
}

function drawHeart(x, y, s) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s / 10, s / 10);
  ctx.fillStyle = "#ff5c8a";
  ctx.shadowColor = "#ff5c8a";
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.moveTo(0, 8);
  ctx.bezierCurveTo(-12, 0, -9, -11, 0, -4);
  ctx.bezierCurveTo(9, -11, 12, 0, 0, 8);
  ctx.fill();
  ctx.restore();
}

// ---- 描画: バトル -------------------------------------------------------
function drawField() {
  const bg = quest.bg;
  const g = ctx.createLinearGradient(0, TOP, 0, FB);
  g.addColorStop(0, bg[0]);
  g.addColorStop(1, bg[1]);
  ctx.fillStyle = g;
  ctx.fillRect(0, TOP, W, FB - TOP);
  ctx.strokeStyle = "rgba(255,255,255,0.05)";
  ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 30) { ctx.beginPath(); ctx.moveTo(x, TOP); ctx.lineTo(x, FB); ctx.stroke(); }
  for (let y = TOP; y <= FB; y += 30) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.strokeStyle = "rgba(255,255,255,0.25)";
  ctx.lineWidth = 2;
  ctx.strokeRect(1, TOP + 1, W - 2, FB - TOP - 2);
}

function drawRocks() {
  for (const o of rocks) {
    const g = ctx.createRadialGradient(o.x - 4, o.y - 4, 2, o.x, o.y, o.r);
    g.addColorStop(0, "#b8bfd8");
    g.addColorStop(1, "#4a5170");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2); ctx.fill();
  }
}

function drawFxUnder() {
  for (const f of fx) {
    if (f.kind !== "wave") continue;
    ctx.save();
    const c = EL[f.el];
    const g = ctx.createLinearGradient(0, f.y - 30, 0, f.y + 60);
    g.addColorStop(0, c.l);
    g.addColorStop(0.3, c.c + "99");
    g.addColorStop(1, c.c + "00");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, f.y + 60);
    for (let x = 0; x <= W; x += 20) ctx.lineTo(x, f.y + Math.sin(x * 0.06 + frameNo * 0.3) * 8);
    ctx.lineTo(W, f.y + 60);
    ctx.fill();
    ctx.restore();
  }
}

function drawFx() {
  for (const f of fx) {
    const t = f.life / f.max;
    ctx.save();
    if (f.kind === "ring") {
      ctx.globalAlpha = t;
      ctx.strokeStyle = f.color;
      ctx.lineWidth = f.w * t + 1;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r0 + (f.r1 - f.r0) * (1 - t), 0, Math.PI * 2); ctx.stroke();
    } else if (f.kind === "line") {
      ctx.globalAlpha = t;
      ctx.lineCap = "round";
      ctx.strokeStyle = f.color;
      ctx.lineWidth = f.w * t + 2;
      ctx.shadowColor = f.color;
      ctx.shadowBlur = 16;
      ctx.beginPath(); ctx.moveTo(f.x1, f.y1); ctx.lineTo(f.x2, f.y2); ctx.stroke();
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = (f.w * t + 2) * 0.35;
      ctx.stroke();
    } else if (f.kind === "bolt") {
      // ジグザグの雷
      ctx.globalAlpha = t;
      ctx.strokeStyle = f.color;
      ctx.shadowColor = f.color;
      ctx.shadowBlur = 12;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(f.x1, f.y1);
      const n = 6, nx = -(f.y2 - f.y1), ny = f.x2 - f.x1, nl = Math.hypot(nx, ny) || 1;
      for (let i = 1; i < n; i++) {
        const o = (i % 2 ? 1 : -1) * 9;
        ctx.lineTo(f.x1 + (f.x2 - f.x1) * i / n + nx / nl * o, f.y1 + (f.y2 - f.y1) * i / n + ny / nl * o);
      }
      ctx.lineTo(f.x2, f.y2);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawAllies() {
  const shooter = shot ? shot.ally : null;
  for (let i = 0; i < allies.length; i++) {
    const a = allies[i];
    if (a === shooter) continue;
    ctx.save();
    if (i === cur && state === "aim") {
      ctx.strokeStyle = ssArmed ? EL[a.el].l : "#ffffff";
      ctx.lineWidth = 3;
      ctx.setLineDash([6, 5]);
      ctx.lineDashOffset = -frameNo * 0.6;
      ctx.beginPath(); ctx.arc(a.x, a.y, R + 7, 0, Math.PI * 2); ctx.stroke();
      if (ssArmed) {
        ctx.setLineDash([]);
        ctx.globalAlpha = 0.35 + Math.sin(frameNo * 0.2) * 0.15;
        ctx.fillStyle = EL[a.el].c;
        ctx.beginPath(); ctx.arc(a.x, a.y, R + 12, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.restore();
    if (a.glow > 0) {
      ctx.save();
      ctx.globalAlpha = a.glow / 20;
      ctx.fillStyle = EL[a.el].l;
      ctx.beginPath(); ctx.arc(a.x, a.y, R + 8, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    const hx = a.hurt > 0 ? Math.sin(a.hurt * 2) * 3 : 0;
    drawChar(a.look, a.x + hx, a.y, R);
    if (a.hurt > 0) {
      ctx.save();
      ctx.globalAlpha = a.hurt / 16 * 0.6;
      ctx.fillStyle = "#ff3b4e";
      ctx.beginPath(); ctx.arc(a.x + hx, a.y, R, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }
  if (shooter) {
    ctx.save();
    shot.trail.forEach((p, k) => {
      ctx.globalAlpha = (k / shot.trail.length) * 0.5;
      ctx.fillStyle = EL[shooter.el].c;
      ctx.beginPath(); ctx.arc(p.x, p.y, R * (k / shot.trail.length), 0, Math.PI * 2); ctx.fill();
    });
    ctx.restore();
    if (shot.atkMul > 1) {
      ctx.save();
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = EL[shooter.el].c;
      ctx.beginPath(); ctx.arc(shooter.x, shooter.y, R + 8 + Math.sin(frameNo) * 2, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    drawChar(shooter.look, shooter.x, shooter.y, R);
  }
}

function drawBolts() {
  for (const b of bolts) {
    ctx.save();
    ctx.fillStyle = b.color;
    ctx.shadowColor = b.color;
    ctx.shadowBlur = b.size > 6 ? 18 : 10;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life / p.max;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawTexts() {
  ctx.save();
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  for (const t of texts) {
    ctx.globalAlpha = Math.min(1, t.life / 14);
    outlinedText(t.text, t.x, t.y, t.color, t.size);
  }
  ctx.restore();
}

// 予測線（壁と岩のみ考慮）
function drawAim() {
  if (!dragging || state !== "aim") return;
  const aim = computeAim(dragStart, dragNow);
  if (!aim) return;
  const a = allies[cur];
  const p = { x: a.x, y: a.y, vx: aim.dx * 6, vy: aim.dy * 6 };
  ctx.save();
  const n = 55;
  for (let i = 0; i < n; i++) {
    p.x += p.vx; p.y += p.vy;
    walls(p);
    for (const o of rocks) bounce(p, o.x, o.y, o.r);
    if (i % 3 === 0) {
      ctx.globalAlpha = 0.9 * (1 - i / n);
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  const ang = Math.atan2(aim.dy, aim.dx);
  ctx.translate(a.x, a.y);
  ctx.rotate(ang);
  ctx.fillStyle = ssArmed ? EL[a.el].l : "#ffd35c";
  ctx.beginPath();
  ctx.moveTo(R + 26, 0);
  ctx.lineTo(R + 8, -10);
  ctx.lineTo(R + 8, 10);
  ctx.fill();
  ctx.restore();
}

function drawPanel() {
  ctx.fillStyle = "#0e1230";
  ctx.fillRect(0, FB, W, H - FB);
  const ratio = hp / maxHp;
  ctx.fillStyle = "#000";
  roundRect(10, FB + 8, W - 20, 14, 7);
  ctx.fill();
  const g = ctx.createLinearGradient(0, FB + 8, 0, FB + 22);
  const hc = ratio > 0.5 ? ["#9dff8a", "#38c43c"] : ratio > 0.2 ? ["#ffe58a", "#e0a020"] : ["#ff9a9a", "#d02a2a"];
  g.addColorStop(0, hc[0]);
  g.addColorStop(1, hc[1]);
  ctx.fillStyle = g;
  if (ratio > 0) { roundRect(10, FB + 8, Math.max(14, (W - 20) * ratio), 14, 7); ctx.fill(); }
  ctx.save();
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  outlinedText(`HP ${hp.toLocaleString()} / ${maxHp.toLocaleString()}`, W / 2, FB + 15.5, "#fff", 11);
  ctx.restore();

  const sw = W / allies.length;
  for (let i = 0; i < allies.length; i++) {
    const a = allies[i], x = sw * (i + 0.5), y = FB + 52;
    ctx.save();
    if (i === cur) {
      ctx.fillStyle = "rgba(255,211,92,0.18)";
      roundRect(x - 40, FB + 28, 80, 58, 10);
      ctx.fill();
      ctx.strokeStyle = "#ffd35c";
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    drawChar(a.look, x - 12, y + 2, 14);
    const ready = a.ssLeft === 0;
    ctx.lineWidth = 3;
    ctx.strokeStyle = "rgba(255,255,255,0.15)";
    ctx.beginPath(); ctx.arc(x - 12, y + 2, 21, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = ready ? EL[a.el].l : "#7f8bd0";
    ctx.beginPath();
    ctx.arc(x - 12, y + 2, 21, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - a.ssLeft / a.ssTurns));
    ctx.stroke();
    txt(a.type === "reflect" ? "反射" : "貫通", x + 13, y - 12, 10, "#e8ecff");
    if (ready) {
      ctx.globalAlpha = 0.7 + Math.sin(frameNo * 0.15) * 0.3;
      ctx.textAlign = "left";
      outlinedText("SS", x + 13, y + 4, EL[a.el].l, 15);
      ctx.globalAlpha = 1;
    } else {
      txt(`あと${a.ssLeft}`, x + 13, y + 4, 11, "#9aa3d8");
    }
    ctx.restore();
    button(x - 40, FB + 28, 80, 58, "", () => {
      if (state === "aim" && i === cur && a.ssLeft === 0) ssArmed = !ssArmed;
    }, { hidden: true });
  }

  if (state === "aim") {
    const a = allies[cur];
    let msg = `${a.name}のターン　引っ張って離すと発射`;
    if (ssArmed) msg = `SS「${a.ssName}」: ${a.ssDesc}`;
    else if (a.ssLeft === 0) msg = `SS使用可能! 下のアイコンをタップ`;
    ctx.fillStyle = "rgba(0,0,0,0.45)";
    ctx.fillRect(0, FB - 22, W, 20);
    txt(msg, W / 2, FB - 12, 12, ssArmed ? EL[a.el].l : "#dfe4ff", "center");
  }
}

function drawBanner() {

  ctx.fillRect(0, y - 34, W, 68);
  ctx.textAlign = "center";

  outlinedText(banner.text, x, y - 6, banner.color, 30);

  ctx.restore();
}

    txt(f.name, x, y + 36, 11, "#fff", "center");
  });
  txt(`提供割合  ★5: ${RATE5 * 100}%  ★4: ${RATE4 * 100}%  ★3: ${Math.round((1 - RATE5 - RATE4) * 100)}%`, W / 2, 350, 11, "#cfd6ff", "center");
  txt("持っているキャラが出ると「覚醒」(最大5) で能力アップ", W / 2, 368, 11, "#cfd6ff", "center");
  button(24, 392, W - 48, 64, "1回ガチャ", () => pullGacha(1),
    { size: 18, sub: `ジェム ${GACHA_1}`, disabled: save.gems < GACHA_1 });
  button(24, 468, W - 48, 72, "10連ガチャ", () => pullGacha(10),
    { size: 20, sub: `ジェム ${GACHA_10}  ★4以上1体確定`, c1: "#ff9ae6", c2: "#c03ad6", fg: "#fff", disabled: save.gems < GACHA_10 });
  drawNav();
}

function drawGachaAnim() {
  ctx.fillStyle = "#06040f";
  ctx.fillRect(0, 0, W, H);
  const r = gacha.res[gacha.i], f = FAM[r.fi], rar = f.rar;
  const cy = 300, t = gacha.t;
  // 光線
  ctx.save();
  const rays = rar >= 5 ? 16 : 8;
  for (let i = 0; i < rays; i++) {
    const a = frameNo * 0.01 + i * Math.PI * 2 / rays;
    ctx.fillStyle = rar >= 5 ? `hsla(${(i * 40 + frameNo * 2) % 360},90%,65%,0.18)` : `rgba(255,255,255,${rar >= 4 ? 0.08 : 0.04})`;
    ctx.beginPath();
    ctx.moveTo(W / 2, cy);
    ctx.lineTo(W / 2 + Math.cos(a) * 500, cy + Math.sin(a) * 500);
    ctx.lineTo(W / 2 + Math.cos(a + 0.12) * 500, cy + Math.sin(a + 0.12) * 500);
    ctx.fill();
  }
  ctx.restore();
  if (!gacha.opened) {
    // タマゴが落ちてきて揺れる（色でレア度を予告）
    const y = Math.min(cy, -60 + t * 14) - (t > 26 && t < 34 ? Math.sin((t - 26) / 8 * Math.PI) * 20 : 0);
    const rot = t > 34 ? Math.sin(t * 0.5) * 0.18 : 0;
    const col = rar >= 5 ? `hsl(${(frameNo * 4) % 360},90%,62%)` : rar >= 4 ? "#d8e0f0" : "#d39a5a";
    ctx.save();
    ctx.translate(W / 2, y + 50);
    ctx.rotate(rot);
    ctx.translate(0, -50);
    ctx.shadowColor = col;
    ctx.shadowBlur = rar >= 4 ? 30 : 12;
    const eg = ctx.createRadialGradient(-14, -20, 4, 0, 0, 60);
    eg.addColorStop(0, "#ffffff");
    eg.addColorStop(1, col);
    ctx.fillStyle = eg;
    ctx.beginPath(); ctx.ellipse(0, 0, 40, 52, 0, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    // 模様（星と水玉）
    ctx.fillStyle = "rgba(255,255,255,0.7)";
    starPath(-12, -18, 9); ctx.fill();
    for (const [px, py, pr] of [[16, -6, 6], [-18, 16, 5], [12, 26, 7]]) {
      ctx.beginPath(); ctx.arc(px, py, pr, 0, Math.PI * 2); ctx.fill();
    }
    // ひび
    if (t > 34) {
      ctx.strokeStyle = "rgba(40,20,0,0.6)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-30, 2); ctx.lineTo(-16, -6); ctx.lineTo(-4, 4); ctx.lineTo(8, -6); ctx.lineTo(20, 3); ctx.lineTo(32, -4);
      ctx.stroke();
    }
    ctx.restore();
    if (t > 30) txt("タップで孵化!", W / 2, 420, 15, `rgba(255,255,255,${0.6 + Math.sin(frameNo * 0.15) * 0.4})`, "center");
  } else {
    if (t < 20) {
      ctx.fillStyle = `rgba(255,255,255,${1 - t / 20})`;
      ctx.fillRect(0, 0, W, H);
    }
    const s = Math.min(1, t / 12);
    drawChar({ el: f.el, acc: f.acc, eye: f.eye, rar, evo: false }, W / 2, cy, 64 * s);
    ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    outlinedText(f.name, W / 2, 420, "#fff", 26);
    ctx.restore();
    drawStars(rar, W / 2, 452, 11);
    drawElemIcon(f.el, W / 2 - 40, 482, 10);
    txt(f.type === "reflect" ? "反射" : "貫通", W / 2 - 24, 482, 13, "#cfd6ff");
    txt(COMBO[f.combo].name, W / 2 + 16, 482, 13, "#cfd6ff");
    const tag = r.kind === "new" ? "NEW!" : r.kind === "awk" ? "覚醒+1!" : `コイン+${r.coins}`;
    ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    outlinedText(tag, W / 2, 200, r.kind === "new" ? "#ff5c8a" : "#ffd35c", 24);
    ctx.restore();
    if (t > 15) txt("タップで次へ", W / 2, 540, 13, "rgba(255,255,255,0.7)", "center");
  }
  drawParticles();
  txt(`${gacha.i + 1} / ${gacha.res.length}`, 16, 24, 13, "#9aa3d8");
  button(0, 0, W, H, "", gachaTap, { hidden: true });
  if (gacha.res.length > 1) button(W - 84, 10, 72, 30, "スキップ", () => go("gachaResult"), { size: 12, c1: "#4a5280", c2: "#2b3158", fg: "#fff" });
}

function drawGachaResult() {
  drawMenuBg("#3a1a5c", "#0c0618");
  drawTopBar();
  header("ガチャ結果", "");
  const res = gacha.res, cols = 5, s = 60, gap = 8;
  const x0 = (W - (cols * s + (cols - 1) * gap)) / 2;
  res.forEach((r, i) => {
    const x = x0 + (i % cols) * (s + gap), y = 100 + Math.floor(i / cols) * (s + 34);
    drawIcon(r.fi, x, y, s);
    const tag = r.kind === "new" ? "NEW" : r.kind === "awk" ? "覚醒+1" : `+${r.coins}`;
    txt(tag, x + s / 2, y + s + 12, 11, r.kind === "new" ? "#ff5c8a" : "#ffd35c", "center");
  });
  const best = Math.max(...res.map(r => FAM[r.fi].rar));
  if (best >= 5) {
    ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    outlinedText("★5 ゲット!!", W / 2, 330, `hsl(${(frameNo * 4) % 360},90%,70%)`, 26);
    ctx.restore();
  }
  button(40, 380, W - 80, 52, "もう一度10連", () => pullGacha(10),
    { size: 16, sub: `ジェム ${GACHA_10}`, c1: "#ff9ae6", c2: "#c03ad6", fg: "#fff", disabled: save.gems < GACHA_10 });
  button(40, 444, W - 80, 44, "BOXを見る", () => go("box"), { c1: "#4a5280", c2: "#2b3158", fg: "#fff" });
  button(40, 500, W - 80, 44, "ガチャに戻る", () => go("gacha"), { c1: "#4a5280", c2: "#2b3158", fg: "#fff" });
  drawNav();
}

// 図鑑グリッド（全30体。未所持はシルエット）
function drawGrid(y0, onTap, opt = {}) {
  const cols = 6, s = 52, gap = 6;
  const x0 = (W - (cols * s + (cols - 1) * gap)) / 2;
  const list = opt.ownedOnly ? FAM.filter(f => owned(f.idx)) : FAM;
  list.forEach((f, i) => {
    const x = x0 + (i % cols) * (s + gap), y = y0 + Math.floor(i / cols) * (s + gap);
    drawIcon(f.idx, x, y, s, { silhouette: true, lv: true });
    if (opt.mark && opt.mark(f.idx)) {
      ctx.save();
      ctx.fillStyle = "rgba(0,0,0,0.5)";
      roundRect(x, y, s, s, s * 0.15);
      ctx.fill();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      outlinedText(opt.mark(f.idx), x + s / 2, y + s / 2, "#ffd35c", 14);
      ctx.restore();
    }
    button(x, y, s, s, "", () => onTap(f.idx), { hidden: true });
  });
}

function drawBox() {
  drawMenuBg("#14203a", "#070b16");
  drawTopBar();
  header("BOX", `図鑑 ${Object.keys(save.box).length} / ${FAM.length}`);
  drawGrid(84, fi => {
    if (!owned(fi)) { showToast("未入手のキャラです。ガチャやクエストで手に入れよう"); return; }
    detailFi = fi;
    go("detail");
  });
  // 結晶
  ctx.fillStyle = "rgba(255,255,255,0.07)";
  roundRect(14, 442, W - 28, 64, 12);
  ctx.fill();
  txt("進化の結晶", 26, 458, 12, "#cfd6ff");
  EL_KEYS.forEach((k, i) => {
    const x = 34 + i * 64;
    crystalIcon(k, x, 486, 10);
    txt(`×${save.cr[k]}`, x + 14, 486, 13, "#fff");
  });
  txt("キャラをタップで強化・進化", W / 2, 528, 12, "#9aa3d8", "center");
  drawNav();
}

function drawParty() {
  drawMenuBg("#14203a", "#070b16");
  drawTopBar();
  header("編成", "タップで入れ替え（4体まで）");
  const s = 66, gap = 14, x0 = (W - (4 * s + 3 * gap)) / 2;
  for (let i = 0; i < 4; i++) {
    const x = x0 + i * (s + gap), y = 86, fi = save.party[i];
    if (fi !== undefined) {
      drawIcon(fi, x, y, s, { lv: true });
      button(x, y, s, s, "", () => {
        if (save.party.length <= 1) { showToast("1体以上必要です"); return; }
        save.party.splice(i, 1);
        persist();
      }, { hidden: true });
    } else {
      ctx.strokeStyle = "rgba(255,255,255,0.3)";
      ctx.setLineDash([5, 4]);
      ctx.lineWidth = 2;
      roundRect(x, y, s, s, 10);
      ctx.stroke();
      ctx.setLineDash([]);
      txt("空き", x + s / 2, y + s / 2, 12, "#9aa3d8", "center");
    }
    txt(i === 0 ? "リーダー" : `${i + 1}番手`, x + s / 2, y + s + 12, 11, i === 0 ? "#ffd35c" : "#cfd6ff", "center");
  }
  const total = save.party.reduce((t, fi) => t + unitStats(fi).hp, 0);
  txt(`合計HP ${total.toLocaleString()}`, W / 2, 190, 13, "#7dffa0", "center");
  drawGrid(208, fi => {
    if (!owned(fi)) { showToast("未入手のキャラです"); return; }
    const k = save.party.indexOf(fi);
    if (k >= 0) {
      if (save.party.length <= 1) { showToast("1体以上必要です"); return; }
      save.party.splice(k, 1);
    } else if (save.party.length >= 4) {
      showToast("4体まで。上の枠をタップして外そう");
      return;
    } else {
      save.party.push(fi);
    }
    persist();
  }, { mark: fi => { const k = save.party.indexOf(fi); return k >= 0 ? (k === 0 ? "L" : String(k + 1)) : ""; } });
  drawNav();
}

function drawDetail() {
  const fi = detailFi, f = FAM[fi], u = save.box[fi], st = unitStats(fi), c = EL[f.el];
  drawMenuBg(c.d, "#070b16");
  drawTopBar();
  button(10, 48, 64, 28, "← 戻る", () => go("box"), { size: 12, c1: "#4a5280", c2: "#2b3158", fg: "#fff" });
  ctx.save();
  ctx.globalAlpha = 0.3;
  ctx.fillStyle = typeof rarityStroke(u.rar, 0, 0, W, H) === "string" ? RCOL[u.rar] : `hsl(${(frameNo * 2) % 360},90%,65%)`;
  ctx.beginPath(); ctx.arc(W / 2, 150, 70 + Math.sin(frameNo * 0.08) * 4, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  drawChar(look(fi), W / 2, 150 + Math.sin(frameNo * 0.05) * 4, 46);
  ctx.save();
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  outlinedText(displayName(fi), W / 2, 228, "#fff", 20);
  ctx.restore();
  drawStars(u.rar, W / 2, 252, 8);
  drawElemIcon(f.el, W / 2 - 46, 274, 9);
  txt(`${f.type === "reflect" ? "反射" : "貫通"}タイプ`, W / 2 - 32, 274, 12, "#cfd6ff");
  txt(`覚醒 ${u.awk}/${MAX_AWK}`, W / 2 + 34, 274, 12, "#ffd35c");

  // ステータス
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  roundRect(14, 292, W - 28, 150, 12);
  ctx.fill();
  const cap = MAXLV[u.rar];
  txt(`Lv ${u.lv} / ${cap}`, 28, 310, 15, u.lv >= cap ? "#ffd35c" : "#fff", "left", "900");
  ctx.fillStyle = "#000";
  ctx.fillRect(140, 306, W - 168, 8);
  ctx.fillStyle = "#5ef0ff";
  ctx.fillRect(140, 306, (W - 168) * (u.lv / cap), 8);
  txt(`ATK ${st.atk.toLocaleString()}`, 28, 334, 13, "#ffb199");
  txt(`HP ${st.hp.toLocaleString()}`, 140, 334, 13, "#9dff8a");
  txt(`SPD ${st.spd.toFixed(1)}`, 252, 334, 13, "#a6d4ff");
  txt(`友情コンボ: ${COMBO[f.combo].name}`, 28, 360, 12, "#fff");
  txt(`SS: ${ssName(fi)}（${ssTurns(fi)}ターン）`, 28, 382, 12, "#fff");
  txt(SS[f.ss].desc, 40, 400, 11, "#cfd6ff");
  if (u.rar < 6) {
    txt(`進化: Lv${cap} + ${c.n}の結晶×${EVO_CR[u.rar]} + コイン${EVO_COIN[u.rar].toLocaleString()}`, 28, 422, 11, "#ffd35c");
  } else {
    txt("最終進化（★6）", 28, 422, 11, "#ff8ae6");
  }
  crystalIcon(f.el, W - 70, 422, 7);
  txt(`×${save.cr[f.el]}`, W - 60, 422, 11, "#fff");

  // ボタン
  const full = u.lv >= cap;
  button(14, 454, (W - 38) / 2, 56, "強化 +1", () => levelUp(fi, false),
    { size: 15, sub: full ? "上限" : `コイン ${lvCost(u.lv)}`, disabled: full || save.coins < lvCost(u.lv), c1: "#7cf0ff", c2: "#2a9fd6", fg: "#06283a" });
  const mc = full ? 0 : maxCost(fi);
  button(24 + (W - 38) / 2, 454, (W - 38) / 2, 56, "まとめて強化", () => levelUp(fi, true),
    { size: 15, sub: full ? "上限" : `最大まで ${mc.toLocaleString()}`, disabled: full || save.coins < lvCost(u.lv), c1: "#7cf0ff", c2: "#2a9fd6", fg: "#06283a" });
  if (u.rar < 6) {
    const can = full && save.cr[f.el] >= EVO_CR[u.rar] && save.coins >= EVO_COIN[u.rar];
    button(14, 518, W - 28, 56, `進化  ★${u.rar} → ★${u.rar + 1}`, () => evolve(fi),
      { size: 17, sub: `→ ${EL[f.el].p[u.rar - 3]}${f.name}`, disabled: !can, c1: "#ffe066", c2: "#ff9a1f" });
  }
  drawParticles();
  drawTexts();
  drawBanner();
}

function drawToast() {
  if (!toast) return;
  ctx.save();
  ctx.globalAlpha = Math.min(1, toast.life / 15);
  ctx.font = "bold 13px system-ui, sans-serif";
  const w = Math.min(W - 20, ctx.measureText(toast.text).width + 32);
  ctx.fillStyle = "rgba(0,0,0,0.85)";
  roundRect((W - w) / 2, H / 2 - 22, w, 44, 12);
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.3)";
  ctx.lineWidth = 1;
  ctx.stroke();
  txt(toast.text, W / 2, H / 2, 13, "#fff", "center");
  ctx.restore();
}

function draw() {
  ui = [];
  switch (state) {
    case "home": drawHome(); break;
    case "quests": drawQuests(); break;
    case "gacha": drawGacha(); break;
    case "gachaAnim": drawGachaAnim(); break;
    case "gachaResult": drawGachaResult(); break;
    case "box": drawBox(); break;
    case "party": drawParty(); break;
    case "detail": drawDetail(); break;
    default: drawBattle();
  }
  drawToast();
}

// ---- 初期化・メインループ ----------------------------------------------
function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  const dpr = window.devicePixelRatio || 1;
  canvas.style.width = W * s + "px";
  canvas.style.height = H * s + "px";
  canvas.width = Math.round(W * s * dpr);
  canvas.height = Math.round(H * s * dpr);
  ctx.setTransform(s * dpr, 0, 0, s * dpr, 0, 0);
}
window.addEventListener("resize", resize);

const STEP = 1000 / 60;
let acc = 0, last = performance.now();
function frame(t) {
  acc += Math.min(t - last, 100);
  last = t;
  while (acc >= STEP) { update(); acc -= STEP; }
  draw();
  requestAnimationFrame(frame);
}

loadSave();
resize();
requestAnimationFrame(t => { last = t; frame(t); });
</script>
