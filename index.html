  const wag = Math.sin(frameNo * 0.12) * 0.15;
  ctx.save();
  ctx.translate(x + r * 0.55, y + r * 0.55);
  ctx.rotate(-0.7 + wag);
  ctx.fillStyle = fur;
  ctx.beginPath(); ctx.ellipse(0, -r * 0.45, r * (k.acc === "bear" ? 0.2 : 0.3), r * (k.acc === "bear" ? 0.2 : 0.6), 0, 0, Math.PI * 2); ctx.fill();
  if (k.acc === "fox") {
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.ellipse(0, -r * 0.9, r * 0.17, r * 0.22, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  // 体
  ctx.fillStyle = shade(x, y + r * 0.5, r * 0.6, furL, fur);
  ctx.beginPath(); ctx.ellipse(x, y + r * 0.55, r * 0.58, r * 0.42, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.55)";
  ctx.beginPath(); ctx.ellipse(x, y + r * 0.62, r * 0.3, r * 0.28, 0, 0, Math.PI * 2); ctx.fill();
  // 前足
  ctx.fillStyle = fur;
  for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(x + s * r * 0.3, y + r * 0.92, r * 0.16, r * 0.1, 0, 0, Math.PI * 2); ctx.fill(); }
  // 耳
  const hx = x, hy = y - r * 0.15, hr = r * 0.66;
  for (const s of [-1, 1]) {
    ctx.fillStyle = fur;
    if (k.acc === "bear") {
      ctx.beginPath(); ctx.arc(hx + s * hr * 0.72, hy - hr * 0.72, hr * 0.32, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ffc9a8";
      ctx.beginPath(); ctx.arc(hx + s * hr * 0.72, hy - hr * 0.72, hr * 0.16, 0, Math.PI * 2); ctx.fill();
    } else {
      const tall = k.acc === "wolf" ? 1.55 : 1.4;
      ctx.beginPath();
      ctx.moveTo(hx + s * hr * 0.25, hy - hr * 0.75);
      ctx.lineTo(hx + s * hr * 0.75, hy - hr * tall);
      ctx.lineTo(hx + s * hr * 0.92, hy - hr * 0.4);
      ctx.fill();
      ctx.fillStyle = k.el === "dark" ? "#6a4a8a" : "#ffd0dc";
      ctx.beginPath();
      ctx.moveTo(hx + s * hr * 0.42, hy - hr * 0.7);
      ctx.lineTo(hx + s * hr * 0.72, hy - hr * (tall - 0.25));
      ctx.lineTo(hx + s * hr * 0.8, hy - hr * 0.5);
      ctx.fill();
    }
  }
  // 頭
  ctx.fillStyle = shade(hx, hy, hr, furL, fur);
  ctx.beginPath(); ctx.arc(hx, hy, hr, 0, Math.PI * 2); ctx.fill();
  // マズル
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  ctx.beginPath(); ctx.ellipse(hx, hy + hr * 0.42, hr * 0.42, hr * 0.3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#2a1c1c";
  ctx.beginPath(); ctx.ellipse(hx, hy + hr * 0.3, hr * 0.12, hr * 0.08, 0, 0, Math.PI * 2); ctx.fill();
  drawFace(k, hx, hy - hr * 0.08, hr * 0.85, fur, true);
  ctx.strokeStyle = "#2a1c1c";
  ctx.lineWidth = Math.max(1, hr * 0.06);
  ctx.beginPath();
  ctx.moveTo(hx, hy + hr * 0.36);
  ctx.quadraticCurveTo(hx - hr * 0.1, hy + hr * 0.52, hx - hr * 0.2, hy + hr * 0.45);
  ctx.moveTo(hx, hy + hr * 0.36);
  ctx.quadraticCurveTo(hx + hr * 0.1, hy + hr * 0.52, hx + hr * 0.2, hy + hr * 0.45);
  ctx.stroke();
  // 額の模様
  ctx.fillStyle = c.d;
  ctx.beginPath();
  ctx.moveTo(hx, hy - hr * 0.95); ctx.lineTo(hx + hr * 0.12, hy - hr * 0.62); ctx.lineTo(hx - hr * 0.12, hy - hr * 0.62);
  ctx.fill();
}

function drawBird(k, x, y, r) {
  const c = EL[k.el];
  const flap = Math.sin(frameNo * 0.18) * 0.35;
  const wingCol = k.rar >= 5 ? "#ffe9a8" : c.d;
  // 翼
  for (const s of [-1, 1]) {
    ctx.save();
    ctx.translate(x + s * r * 0.55, y + r * 0.05);
    ctx.rotate(s * (-0.5 + flap));
    ctx.fillStyle = wingCol;
    ctx.beginPath(); ctx.ellipse(s * r * 0.4, 0, r * 0.55, r * 0.26, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = c.c;
    ctx.beginPath(); ctx.ellipse(s * r * 0.25, r * 0.05, r * 0.35, r * 0.18, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  // 尾羽
  ctx.fillStyle = c.d;
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath(); ctx.ellipse(x + i * r * 0.2, y + r * 0.85, r * 0.12, r * 0.3, i * 0.4, 0, Math.PI * 2); ctx.fill();
  }
  // 冠羽
  ctx.fillStyle = k.acc === "crest" ? c.c : c.d;
  if (k.acc === "crest") {
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath(); ctx.ellipse(x + i * r * 0.18, y - r * 0.85, r * 0.1, r * 0.35, i * 0.35, 0, Math.PI * 2); ctx.fill();
    }
  } else {
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(x + s * r * 0.25, y - r * 0.6);
      ctx.lineTo(x + s * r * 0.55, y - r * 1.05);
      ctx.lineTo(x + s * r * 0.55, y - r * 0.5);
      ctx.fill();
    }
  }
  // 体
  ctx.fillStyle = shade(x, y, r * 0.82, c.l, c.c);
  ctx.beginPath(); ctx.arc(x, y + r * 0.05, r * 0.82, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.6)";
  ctx.beginPath(); ctx.ellipse(x, y + r * 0.4, r * 0.45, r * 0.38, 0, 0, Math.PI * 2); ctx.fill();
  drawFace(k, x, y - r * 0.12, r * 0.78, c.c, true);
  // くちばし
  ctx.fillStyle = "#ffb02e";
  ctx.beginPath();
  ctx.moveTo(x - r * 0.16, y + r * 0.08); ctx.lineTo(x + r * 0.16, y + r * 0.08); ctx.lineTo(x, y + r * 0.3);
  ctx.fill();
  // 足
  ctx.strokeStyle = "#ffb02e";
  ctx.lineWidth = Math.max(1, r * 0.07);
  for (const s of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(x + s * r * 0.25, y + r * 0.82); ctx.lineTo(x + s * r * 0.25, y + r * 1.0); ctx.stroke();
  }
}

function drawDragon(k, x, y, r) {
  const c = EL[k.el];
  const wingCol = k.rar >= 5 ? "#ffe9a8" : c.d;
  const flap = Math.sin(frameNo * 0.1) * 0.15;
  // コウモリ型の翼
  for (const s of [-1, 1]) {
    ctx.save();
    ctx.translate(x + s * r * 0.45, y - r * 0.1);
    ctx.rotate(s * flap);
    ctx.fillStyle = wingCol;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(s * r * 0.75, -r * 0.75);
    ctx.lineTo(s * r * 1.05, -r * 0.2);
    ctx.quadraticCurveTo(s * r * 0.85, -r * 0.05, s * r * 0.8, r * 0.2);
    ctx.quadraticCurveTo(s * r * 0.6, r * 0.05, s * r * 0.5, r * 0.35);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  // しっぽ
  ctx.fillStyle = c.c;
  ctx.beginPath();
  ctx.moveTo(x + r * 0.3, y + r * 0.6);
  ctx.quadraticCurveTo(x + r * 1.0, y + r * 0.9, x + r * 1.05, y + r * 0.35);
  ctx.lineTo(x + r * 0.85, y + r * 0.55);
  ctx.quadraticCurveTo(x + r * 0.7, y + r * 0.55, x + r * 0.4, y + r * 0.35);
  ctx.fill();
  ctx.fillStyle = c.d;
  ctx.beginPath();
  ctx.moveTo(x + r * 1.05, y + r * 0.35); ctx.lineTo(x + r * 1.2, y + r * 0.2); ctx.lineTo(x + r * 0.95, y + r * 0.22);
  ctx.fill();
  // 角
  ctx.fillStyle = "#f3e9d2";
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(x + s * r * 0.3, y - r * 0.6);
    ctx.quadraticCurveTo(x + s * r * 0.55, y - r * 1.1, x + s * r * 0.35, y - r * 1.25);
    ctx.quadraticCurveTo(x + s * r * 0.75, y - r * 0.95, x + s * r * 0.55, y - r * 0.45);
    ctx.fill();
  }
  // 体
  ctx.fillStyle = shade(x, y, r * 0.85, c.l, c.c);
  ctx.beginPath(); ctx.arc(x, y + r * 0.05, r * 0.85, 0, Math.PI * 2); ctx.fill();
  // おなか（しま模様）
  ctx.fillStyle = "#fff1c8";
  ctx.beginPath(); ctx.ellipse(x, y + r * 0.5, r * 0.42, r * 0.36, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "rgba(160,110,40,0.4)";
  ctx.lineWidth = Math.max(1, r * 0.04);
  for (let i = 0; i < 3; i++) {
    ctx.beginPath(); ctx.moveTo(x - r * 0.3, y + r * (0.35 + i * 0.13)); ctx.lineTo(x + r * 0.3, y + r * (0.35 + i * 0.13)); ctx.stroke();
  }
  // 鼻先
  ctx.fillStyle = c.l;
  ctx.beginPath(); ctx.ellipse(x, y + r * 0.12, r * 0.36, r * 0.22, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = c.d;
  for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(x + s * r * 0.11, y + r * 0.1, r * 0.04, 0, Math.PI * 2); ctx.fill(); }
  ctx.strokeStyle = c.d;
  ctx.lineWidth = Math.max(1, r * 0.05);
  ctx.beginPath(); ctx.arc(x, y + r * 0.16, r * 0.18, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
  drawFace(k, x, y - r * 0.32, r * 0.72, c.c, true);
}

// 立ち上がって拍手する黒猫（前足が開いたり閉じたりする）
function drawCat(k, x, y, r) {
  const fur = "#1d1824", furL = "#3a3046";
  const clap = (Math.sin(frameNo * 0.35) + 1) / 2;   // 0=閉じる 1=開く
  // しっぽ
  ctx.strokeStyle = fur;
  ctx.lineWidth = r * 0.16;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(x + r * 0.35, y + r * 0.75);
  ctx.quadraticCurveTo(x + r * 1.05, y + r * 0.7, x + r * 0.95, y + r * 0.05 + Math.sin(frameNo * 0.1) * r * 0.1);
  ctx.stroke();
  // 体（立っている）
  ctx.fillStyle = shade(x, y + r * 0.45, r * 0.6, furL, fur);
  ctx.beginPath(); ctx.ellipse(x, y + r * 0.5, r * 0.46, r * 0.52, 0, 0, Math.PI * 2); ctx.fill();
  // 後ろ足
  for (const s of [-1, 1]) {
    ctx.beginPath(); ctx.ellipse(x + s * r * 0.24, y + r * 0.98, r * 0.17, r * 0.09, 0, 0, Math.PI * 2); ctx.fill();
  }
  // 耳
  const hx = x, hy = y - r * 0.28, hr = r * 0.56;
  for (const s of [-1, 1]) {
    ctx.fillStyle = fur;
    ctx.beginPath();
    ctx.moveTo(hx + s * hr * 0.25, hy - hr * 0.8);
    ctx.lineTo(hx + s * hr * 0.85, hy - hr * 1.45);
    ctx.lineTo(hx + s * hr * 0.95, hy - hr * 0.35);
    ctx.fill();
    ctx.fillStyle = "#5a3a5a";
    ctx.beginPath();
    ctx.moveTo(hx + s * hr * 0.42, hy - hr * 0.75);
    ctx.lineTo(hx + s * hr * 0.8, hy - hr * 1.2);
    ctx.lineTo(hx + s * hr * 0.85, hy - hr * 0.5);
    ctx.fill();
  }
  // 頭
  ctx.fillStyle = shade(hx, hy, hr, furL, fur);
  ctx.beginPath(); ctx.ellipse(hx, hy, hr * 1.02, hr * 0.92, 0, 0, Math.PI * 2); ctx.fill();
  // 黄色い目
  for (const s of [-1, 1]) {
    ctx.fillStyle = "#e8d84a";
    ctx.beginPath(); ctx.ellipse(hx + s * hr * 0.4, hy - hr * 0.15, hr * 0.22, hr * 0.17, s * -0.15, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#0a0a0a";
    ctx.beginPath(); ctx.ellipse(hx + s * hr * 0.4, hy - hr * 0.15, hr * 0.06, hr * 0.15, 0, 0, Math.PI * 2); ctx.fill();
  }
  // 歯を見せた大きな笑顔
  ctx.fillStyle = "#2a0a12";
  ctx.beginPath(); ctx.ellipse(hx, hy + hr * 0.38, hr * 0.42, hr * 0.2, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#f4f0e0";
  ctx.fillRect(hx - hr * 0.36, hy + hr * 0.25, hr * 0.72, hr * 0.14);
  ctx.strokeStyle = "#bdb6a0";
  ctx.lineWidth = Math.max(0.6, r * 0.02);
  for (let i = 1; i < 6; i++) {
    const tx = hx - hr * 0.36 + i * hr * 0.12;
    ctx.beginPath(); ctx.moveTo(tx, hy + hr * 0.25); ctx.lineTo(tx, hy + hr * 0.39); ctx.stroke();
  }
  // 前足（拍手）
  ctx.fillStyle = fur;
  const gap = r * (0.08 + clap * 0.4);
  for (const s of [-1, 1]) {
    ctx.save();
    ctx.translate(x + s * gap, y + r * 0.25);
    ctx.rotate(s * (0.2 + clap * 0.5));
    ctx.beginPath(); ctx.ellipse(0, 0, r * 0.13, r * 0.28, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  if (clap < 0.12) {
    // 手が合わさった瞬間のきらめき
    ctx.strokeStyle = "#ffe066";
    ctx.lineWidth = Math.max(1, r * 0.05);
    for (const a of [-0.6, 0, 0.6]) {
      ctx.beginPath();
      ctx.moveTo(x + Math.sin(a) * r * 0.25, y + r * 0.05 - Math.cos(a) * r * 0.25);
      ctx.lineTo(x + Math.sin(a) * r * 0.4, y + r * 0.05 - Math.cos(a) * r * 0.4);
      ctx.stroke();
    }
  }
}

function drawFish(k, x, y, r) {
  const c = EL[k.el];
  const sway = Math.sin(frameNo * 0.15) * 0.25;
  // 尾びれ
  ctx.save();
  ctx.translate(x + r * 0.75, y);
  ctx.rotate(sway);
  ctx.fillStyle = c.d;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(r * 0.3, -r * 0.2, r * 0.45, -r * 0.6);
  ctx.quadraticCurveTo(r * 0.3, 0, r * 0.45, r * 0.6);
  ctx.quadraticCurveTo(r * 0.3, r * 0.2, 0, 0);
  ctx.fill();
  ctx.restore();
  // 背びれ
  ctx.fillStyle = c.d;
  ctx.beginPath();
  ctx.moveTo(x - r * 0.35, y - r * 0.55);
  ctx.quadraticCurveTo(x, y - r * 1.15, x + r * 0.45, y - r * 0.5);
  ctx.fill();
  // ちょうちん（アンコウ風）
  if (k.acc === "angler") {
    ctx.strokeStyle = c.d;
    ctx.lineWidth = Math.max(1.2, r * 0.06);
    ctx.beginPath(); ctx.moveTo(x - r * 0.4, y - r * 0.6); ctx.quadraticCurveTo(x - r * 0.6, y - r * 1.2, x - r * 1.0, y - r * 0.95); ctx.stroke();
    ctx.fillStyle = "#fff6a8";
    ctx.shadowColor = "#fff6a8";
    ctx.shadowBlur = r * 0.6;
    ctx.beginPath(); ctx.arc(x - r * 1.0, y - r * 0.92, r * 0.14 + Math.sin(frameNo * 0.2) * r * 0.03, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
  }
  // 体
  ctx.fillStyle = shade(x - r * 0.2, y, r * 0.9, c.l, c.c);
  ctx.beginPath(); ctx.ellipse(x, y, r * 0.9, r * 0.68, 0, 0, Math.PI * 2); ctx.fill();
  // うろこ
  ctx.strokeStyle = "rgba(255,255,255,0.35)";
  ctx.lineWidth = Math.max(1, r * 0.04);
  for (let i = 0; i < 3; i++) {
    for (let j = -1; j <= 1; j++) {
      ctx.beginPath(); ctx.arc(x + r * (0.05 + i * 0.22), y + j * r * 0.24, r * 0.12, -0.5 * Math.PI, 0.5 * Math.PI); ctx.stroke();
    }
  }
  // 胸びれ
  ctx.fillStyle = c.l;
  ctx.beginPath(); ctx.ellipse(x - r * 0.05, y + r * 0.28, r * 0.22, r * 0.1, 0.6 + sway, 0, Math.PI * 2); ctx.fill();
  // 目と口（横向き）
  const ex = x - r * 0.45, ey = y - r * 0.12;
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(ex, ey, r * 0.22, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#1b1b2a";
  ctx.beginPath(); ctx.arc(ex - r * 0.03, ey + r * 0.02, r * 0.13, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(ex - r * 0.07, ey - r * 0.04, r * 0.05, 0, Math.PI * 2); ctx.fill();
  if (k.eye === "sleepy") {
    ctx.fillStyle = c.c;
    ctx.beginPath(); ctx.arc(ex, ey, r * 0.24, Math.PI, Math.PI * 2); ctx.fill();
  }
  ctx.strokeStyle = "#1b1b2a";
  ctx.lineWidth = Math.max(1, r * 0.05);
  ctx.beginPath(); ctx.arc(x - r * 0.78, y + r * 0.2, r * 0.1, -0.3 * Math.PI, 0.5 * Math.PI); ctx.stroke();
  ctx.fillStyle = "rgba(255,120,150,0.45)";
  ctx.beginPath(); ctx.ellipse(x - r * 0.3, y + r * 0.2, r * 0.1, r * 0.06, 0, 0, Math.PI * 2); ctx.fill();
}

// キャラアイコン（左上 x,y・サイズ s）
function drawIcon(fi, x, y, s, opt = {}) {
  const f = FAM[fi], u = save.box[fi], rar = u ? u.rar : f.rar;
  ctx.save();
  const g = ctx.createLinearGradient(0, y, 0, y + s);
  g.addColorStop(0, u || !opt.silhouette ? EL[f.el].d : "#22263a");
  g.addColorStop(1, "#0b0e22");
  ctx.fillStyle = g;
  roundRect(x, y, s, s, s * 0.15);
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = u || !opt.silhouette ? rarityStroke(rar, x, y, s, s) : "#3a3f55";
  ctx.stroke();
  if (!u && opt.silhouette) {
    txt("?", x + s / 2, y + s / 2, s * 0.45, "#5a6080", "center", "900");
    ctx.restore();
    return;
  }
  ctx.save();
  roundRect(x, y, s, s, s * 0.15);
  ctx.clip();
  drawChar(u ? look(fi) : { shape: f.shape, el: f.el, acc: f.acc, eye: f.eye, rar, evo: false }, x + s / 2, y + s * 0.56, s * 0.25);
  ctx.restore();
  drawStars(rar, x + s / 2, y + s - 6, s * 0.065);
  // 運極は右上に金色の「極」
  if (u && (u.luck || 0) >= MAX_LUCK) {
    ctx.fillStyle = "#ffd23f";
    ctx.beginPath(); ctx.arc(x + s - 8, y + 8, Math.max(6, s * 0.14), 0, Math.PI * 2); ctx.fill();
    txt("極", x + s - 8, y + 9, Math.max(8, s * 0.17), "#5a2200", "center", "900");
  }
  if (opt.lv && u) {
    ctx.textAlign = "left";
    outlinedText(`Lv${u.lv}`, x + 3, y + 8, "#fff", 9);
  }
  ctx.restore();
}

function drawEnemy(e) {
  const c = EL[e.el], r = e.r;
  const x = e.x, y = e.y + Math.sin(frameNo * 0.05 + e.wob) * 1.5;
  ctx.save();
  if (e.boss) {
    ctx.fillStyle = c.d;
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(x + s * r * 0.6, y - r * 0.2);
      ctx.lineTo(x + s * r * 1.65, y - r * 0.9);
      ctx.lineTo(x + s * r * 1.45, y - r * 0.2);
      ctx.lineTo(x + s * r * 1.7, y + r * 0.25);
      ctx.lineTo(x + s * r * 0.7, y + r * 0.4);
      ctx.fill();
    }
  }
  ctx.fillStyle = e.boss ? "#f0e6d0" : c.d;
  const hl = e.boss ? 1.55 : 1.3;
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(x + s * r * 0.25, y - r * 0.8);
    ctx.lineTo(x + s * r * 0.65, y - r * hl);
    ctx.lineTo(x + s * r * 0.7, y - r * 0.55);
    ctx.fill();
  }
  ctx.shadowColor = c.c;
  ctx.shadowBlur = e.boss ? 18 : 8;
  const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.4, r * 0.1, x, y, r);
  g.addColorStop(0, c.c);
  g.addColorStop(1, c.d);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  for (const s of [-1, 1]) {
    ctx.fillStyle = "#fff8d6";
    ctx.beginPath(); ctx.ellipse(x + s * r * 0.34, y - r * 0.1, r * 0.2, r * 0.15, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = e.boss ? "#ff2a2a" : "#1a0a0a";
    ctx.beginPath(); ctx.arc(x + s * r * 0.32, y - r * 0.08, r * 0.08, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#140808";
    ctx.lineWidth = Math.max(2, r * 0.08);
    ctx.beginPath();
    ctx.moveTo(x + s * r * 0.12, y - r * 0.24);
    ctx.lineTo(x + s * r * 0.55, y - r * 0.36);
    ctx.stroke();
  }
  ctx.fillStyle = "#1a0a0a";
  ctx.beginPath(); ctx.ellipse(x, y + r * 0.35, r * 0.32, r * 0.13, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#fff";
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(x + s * r * 0.18, y + r * 0.25);
    ctx.lineTo(x + s * r * 0.1, y + r * 0.42);
    ctx.lineTo(x + s * r * 0.02, y + r * 0.25);
    ctx.fill();
  }
  if (e.flash > 0) {
    ctx.globalAlpha = e.flash / 10;
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  if (e.kind !== "normal") drawEnemyKind(e, x, y, r);
  // ガード（六角形のバリア）と再生（緑の＋マーク）
  if (e.guard) {
    ctx.save();
    ctx.strokeStyle = "rgba(154,213,255,0.8)";
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.6 + Math.sin(frameNo * 0.1 + e.wob) * 0.2;
    ctx.beginPath();
    for (let i = 0; i <= 6; i++) {
      const a = i * Math.PI / 3 + frameNo * 0.01;
      ctx.lineTo(x + Math.cos(a) * (r + 7), y + Math.sin(a) * (r + 7));
    }
    ctx.stroke();
    ctx.restore();
  }
  if (e.regen) {
    const px = x + r * 0.85, py = y - r * 0.15;
    ctx.fillStyle = "#1e7a3a";
    ctx.beginPath(); ctx.arc(px, py, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#7dffa0";
    ctx.fillRect(px - 4, py - 1.2, 8, 2.4);
    ctx.fillRect(px - 1.2, py - 4, 2.4, 8);
  }
  if (e.weak !== null) {
    const w = weakPos(e);
    const pulse = 1 + Math.sin(frameNo * 0.2) * 0.15;
    ctx.strokeStyle = "#ffef5c";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(w.x, w.y, w.r * pulse, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "rgba(255,239,92,0.35)";
    ctx.beginPath(); ctx.arc(w.x, w.y, w.r * 0.55 * pulse, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(w.x - w.r * 1.3, w.y); ctx.lineTo(w.x + w.r * 1.3, w.y);
    ctx.moveTo(w.x, w.y - w.r * 1.3); ctx.lineTo(w.x, w.y + w.r * 1.3);
    ctx.stroke();
  }
  if (!e.boss) {
    const bw = r * 2, bx = x - r, by = y + r + 5, ratio = e.hp / e.maxHp;
    ctx.fillStyle = "#000b";
    ctx.fillRect(bx, by, bw, 5);
    ctx.fillStyle = ratio > 0.5 ? "#7ee07e" : ratio > 0.25 ? "#ffd35c" : "#ff6b6b";
    ctx.fillRect(bx, by, bw * ratio, 5);
  }
  const cx = x - r * 0.8, cy = y - r * 0.8;
  ctx.fillStyle = e.cd <= 1 ? "#ff3b4e" : "#fff";
  ctx.beginPath(); ctx.arc(cx, cy, 10, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#000";
  ctx.lineWidth = 1.5;
  ctx.stroke();
  txt(String(e.cd), cx, cy + 1, 13, e.cd <= 1 ? "#fff" : "#111", "center", "900");
  drawElemIcon(e.el, x + r * 0.8, y + r * 0.75, 8);
  ctx.restore();
}

// 特殊な敵の見た目
function drawEnemyKind(e, x, y, r) {
  ctx.save();
  switch (e.kind) {
    case "bomb": {
      // 導火線と火花、自爆が近いと赤く点滅
      ctx.strokeStyle = "#5a3a1a";
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(x + r * 0.4, y - r * 0.85); ctx.quadraticCurveTo(x + r * 0.9, y - r * 1.3, x + r * 0.7, y - r * 1.55); ctx.stroke();
      ctx.fillStyle = frameNo % 10 < 5 ? "#ffe066" : "#ff5b3a";
      ctx.beginPath(); ctx.arc(x + r * 0.7, y - r * 1.55, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(30,20,20,0.55)";
      ctx.beginPath(); ctx.arc(x, y + r * 0.1, r * 0.95, Math.PI * 0.15, Math.PI * 0.85); ctx.fill();
      if (e.cd <= 1) {
        ctx.globalAlpha = 0.35 + Math.sin(frameNo * 0.4) * 0.3;
        ctx.fillStyle = "#ff3b3b";
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      }
      break;
    }
    case "healer": {
      ctx.strokeStyle = "rgba(125,255,160,0.7)";
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(x, y - r * 1.15, r * 0.5, r * 0.15, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(x - r * 0.75, y + r * 0.55, 9, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#2ec05a";
      ctx.fillRect(x - r * 0.75 - 6, y + r * 0.55 - 2, 12, 4);
      ctx.fillRect(x - r * 0.75 - 2, y + r * 0.55 - 6, 4, 12);
      break;
    }
    case "shield": {
      // 下側（正面）の盾
      ctx.strokeStyle = "#9ad5ff";
      ctx.lineWidth = 7;
      ctx.shadowColor = "#9ad5ff";
      ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(x, y, r + 6, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();
      ctx.strokeStyle = "#e6f4ff";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, r + 6, Math.PI * 0.2, Math.PI * 0.8); ctx.stroke();
      break;
    }
    case "split": {
      // ぷるぷるのスライム（半透明の膜と小さい泡）
      ctx.globalAlpha = 0.45;
      ctx.fillStyle = "#b6ffb0";
      const w = Math.sin(frameNo * 0.15 + e.wob) * r * 0.08;
      ctx.beginPath(); ctx.ellipse(x, y + r * 0.1, r + 4 + w, r + 2 - w, 0, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 0.9;
      for (const [ox, oy, s] of [[-0.7, -0.6, 0.18], [0.75, -0.4, 0.13], [0.6, 0.7, 0.15]]) {
        ctx.beginPath(); ctx.arc(x + ox * r, y + oy * r, r * s, 0, Math.PI * 2); ctx.fill();
      }
      break;
    }
    case "turret": {
      // 横に伸びる砲身
      ctx.fillStyle = "#6a7290";
      ctx.strokeStyle = "#c8d0ec";
      ctx.lineWidth = 2;
      for (const s of [-1, 1]) {
        roundRect(s < 0 ? x - r - 16 : x + r - 4, y - 5, 20, 10, 3);
        ctx.fill(); ctx.stroke();
      }
      ctx.fillStyle = e.cd <= 1 ? (frameNo % 8 < 4 ? "#ff3b3b" : "#ffe066") : "#ff8b9b";
      for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(x + s * (r + 16), y, 4, 0, Math.PI * 2); ctx.fill(); }
      break;
    }
  }
  ctx.restore();
  txt(ENEMY_KIND_NAME[e.kind], x, y - r - 12, 9, "#fff", "center", "900");
}

function drawElemIcon(el, x, y, r) {
  ctx.fillStyle = EL[el].c;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 1.5;
  ctx.stroke();
  txt(EL[el].n, x, y + 1, Math.round(r * 1.2), "#fff", "center", "900");
}

function drawHeart(x, y, s) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s / 10, s / 10);
  ctx.fillStyle = "#ff5c8a";
  ctx.shadowColor = "#ff5c8a";
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.moveTo(0, 8);
  ctx.bezierCurveTo(-12, 0, -9, -11, 0, -4);
  ctx.bezierCurveTo(9, -11, 12, 0, 0, 8);
  ctx.fill();
  ctx.restore();
}

// ---- 描画: バトル -------------------------------------------------------
function drawField() {
  const bg = quest.bg;
  const g = ctx.createLinearGradient(0, TOP, 0, FB);
  g.addColorStop(0, bg[0]);
  g.addColorStop(1, bg[1]);
  ctx.fillStyle = g;
  ctx.fillRect(0, TOP, W, FB - TOP);
  ctx.strokeStyle = "rgba(255,255,255,0.05)";
  ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 30) { ctx.beginPath(); ctx.moveTo(x, TOP); ctx.lineTo(x, FB); ctx.stroke(); }
  for (let y = TOP; y <= FB; y += 30) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.strokeStyle = "rgba(255,255,255,0.25)";
  ctx.lineWidth = 2;
  ctx.strokeRect(1, TOP + 1, W - 2, FB - TOP - 2);
}

function drawGimmicks() {
  if (!gim) return;
  ctx.save();
  // ダメージウォール（赤く光る壁）
  for (const side of gim.dwall) {
    ctx.strokeStyle = `rgba(255,60,90,${0.6 + Math.sin(frameNo * 0.3) * 0.3})`;
    ctx.lineWidth = 5;
    ctx.shadowColor = "#ff3b5c";
    ctx.shadowBlur = 10;
    ctx.beginPath();
    if (side === "left") { ctx.moveTo(3, TOP); ctx.lineTo(3, FB); }
    if (side === "right") { ctx.moveTo(W - 3, TOP); ctx.lineTo(W - 3, FB); }
    if (side === "top") { ctx.moveTo(0, TOP + 3); ctx.lineTo(W, TOP + 3); }
    ctx.stroke();
    // 電気のギザギザ
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let t = 0; t <= 1; t += 0.04) {
      const j = Math.sin((t * 50 + frameNo * 0.7)) * 4;
      if (side === "left") ctx.lineTo(7 + j, TOP + t * (FB - TOP));
      if (side === "right") ctx.lineTo(W - 7 + j, TOP + t * (FB - TOP));
      if (side === "top") ctx.lineTo(t * W, TOP + 7 + j);
    }
    ctx.stroke();
  }
  ctx.shadowBlur = 0;
  // 重力バリア（紫の円、内向きに回る）
  for (const g of gim.gbars) {
    const gr = ctx.createRadialGradient(g.x, g.y, g.r * 0.4, g.x, g.y, g.r);
    gr.addColorStop(0, "rgba(140,80,255,0)");
    gr.addColorStop(1, "rgba(140,80,255,0.28)");
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(g.x, g.y, g.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(190,150,255,0.7)";
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 6]);
    ctx.lineDashOffset = frameNo * 0.5;
    ctx.beginPath(); ctx.arc(g.x, g.y, g.r, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
  }
  // ワープ（渦）
  for (const w of gim.warps) {
    for (let k = 0; k < 3; k++) {
      ctx.strokeStyle = ["#c58aff", "#7cf0ff", "#ffffff"][k];
      ctx.lineWidth = 2.5 - k * 0.6;
      ctx.beginPath();
      const rot = frameNo * 0.12 + k * 2.1;
      ctx.arc(w.x, w.y, w.r - k * 4, rot, rot + 4.2);
      ctx.stroke();
    }
    ctx.fillStyle = "rgba(197,138,255,0.25)";
    ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, Math.PI * 2); ctx.fill();
  }
  // 地雷
  for (const m of gim.mines) {
    if (m.taken) continue;
    ctx.fillStyle = "#3a1a1a";
    ctx.strokeStyle = "#ff5b3a";
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < 16; i++) {
      const ang = i * Math.PI / 8, rr = i % 2 ? m.r * 0.65 : m.r;
      ctx.lineTo(m.x + Math.cos(ang) * rr, m.y + Math.sin(ang) * rr);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = frameNo % 40 < 20 ? "#ff3b3b" : "#ffb04a";
    ctx.beginPath(); ctx.arc(m.x, m.y, 2.5, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawRocks() {
  for (const o of rocks) {
    if (o.block) {
      // 動くブロック（金属の箱）
      ctx.save();
      ctx.fillStyle = "#6a7290";
      ctx.strokeStyle = "#c8d0ec";
      ctx.lineWidth = 2;
      roundRect(o.x - o.r, o.y - o.r, o.r * 2, o.r * 2, 4);
      ctx.fill(); ctx.stroke();
      ctx.strokeStyle = "rgba(255,255,255,0.35)";
      ctx.beginPath(); ctx.moveTo(o.x - o.r + 4, o.y); ctx.lineTo(o.x + o.r - 4, o.y); ctx.stroke();
      ctx.restore();
      continue;
    }
    const g = ctx.createRadialGradient(o.x - 4, o.y - 4, 2, o.x, o.y, o.r);
    g.addColorStop(0, "#b8bfd8");
    g.addColorStop(1, "#4a5170");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2); ctx.fill();
  }
}

function drawFxUnder() {
  for (const f of fx) {
    if (f.kind !== "wave") continue;
    ctx.save();
    const c = EL[f.el];
    const g = ctx.createLinearGradient(0, f.y - 30, 0, f.y + 60);
    g.addColorStop(0, c.l);
    g.addColorStop(0.3, c.c + "99");
    g.addColorStop(1, c.c + "00");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, f.y + 60);
    for (let x = 0; x <= W; x += 20) ctx.lineTo(x, f.y + Math.sin(x * 0.06 + frameNo * 0.3) * 8);
    ctx.lineTo(W, f.y + 60);
    ctx.fill();
    ctx.restore();
  }
}

function drawFx() {
  for (const f of fx) {
    const t = f.life / f.max;
    ctx.save();
    if (f.kind === "ring") {
      ctx.globalAlpha = t;
      ctx.strokeStyle = f.color;
      ctx.lineWidth = f.w * t + 1;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r0 + (f.r1 - f.r0) * (1 - t), 0, Math.PI * 2); ctx.stroke();
    } else if (f.kind === "line") {
      ctx.globalAlpha = t;
      ctx.lineCap = "round";
      ctx.strokeStyle = f.color;
      ctx.lineWidth = f.w * t + 2;
      ctx.shadowColor = f.color;
      ctx.shadowBlur = 16;
      ctx.beginPath(); ctx.moveTo(f.x1, f.y1); ctx.lineTo(f.x2, f.y2); ctx.stroke();
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = (f.w * t + 2) * 0.35;
      ctx.stroke();
    } else if (f.kind === "smile") {
      // 画面いっぱいの丸メガネと笑顔
      const cx = W / 2, cy = (TOP + FB) / 2 - 20, grow = 0.7 + (1 - t) * 0.5;
      if (t > 0.85) {
        ctx.fillStyle = `rgba(255,240,170,${(t - 0.85) / 0.15 * 0.8})`;
        ctx.fillRect(0, TOP, W, FB - TOP);
      }
      ctx.globalAlpha = Math.min(1, t * 1.5) * 0.85;
      ctx.strokeStyle = "#ffe066";
      ctx.shadowColor = "#ffd23f";
      ctx.shadowBlur = 24;
      ctx.lineWidth = 10 * grow;
      for (const s of [-1, 1]) {
        ctx.beginPath(); ctx.arc(cx + s * 70 * grow, cy, 52 * grow, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.beginPath(); ctx.moveTo(cx - 18 * grow, cy - 4); ctx.lineTo(cx + 18 * grow, cy - 4); ctx.stroke();
      ctx.lineWidth = 12 * grow;
      ctx.beginPath(); ctx.arc(cx, cy + 70 * grow, 80 * grow, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
    } else if (f.kind === "bolt") {
      // ジグザグの雷
      ctx.globalAlpha = t;
      ctx.strokeStyle = f.color;
      ctx.shadowColor = f.color;
      ctx.shadowBlur = 12;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(f.x1, f.y1);
      const n = 6, nx = -(f.y2 - f.y1), ny = f.x2 - f.x1, nl = Math.hypot(nx, ny) || 1;
      for (let i = 1; i < n; i++) {
        const o = (i % 2 ? 1 : -1) * 9;
        ctx.lineTo(f.x1 + (f.x2 - f.x1) * i / n + nx / nl * o, f.y1 + (f.y2 - f.y1) * i / n + ny / nl * o);
      }
      ctx.lineTo(f.x2, f.y2);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawAllies() {
  const shooter = shot ? shot.ally : null;
  for (let i = 0; i < allies.length; i++) {
    const a = allies[i];
    if (a === shooter) continue;
    ctx.save();
    if (i === cur && state === "aim") {
      ctx.strokeStyle = ssArmed ? EL[a.el].l : "#ffffff";
      ctx.lineWidth = 3;
      ctx.setLineDash([6, 5]);
      ctx.lineDashOffset = -frameNo * 0.6;
      ctx.beginPath(); ctx.arc(a.x, a.y, R + 7, 0, Math.PI * 2); ctx.stroke();
      if (ssArmed) {
        ctx.setLineDash([]);
        ctx.globalAlpha = 0.35 + Math.sin(frameNo * 0.2) * 0.15;
        ctx.fillStyle = EL[a.el].c;
        ctx.beginPath(); ctx.arc(a.x, a.y, R + 12, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.restore();
    if (a.shin) drawShinRing(a);
    if (a.rally) {
      // 応援中はオレンジの輪
      ctx.save();
      ctx.strokeStyle = "#ffb04a";
      ctx.lineWidth = 3;
      ctx.globalAlpha = 0.6 + Math.sin(frameNo * 0.3) * 0.3;
      ctx.beginPath(); ctx.arc(a.x, a.y, R + 6, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
    if (a.buff) {
      // 能力アップ中は属性色の光がゆらめく
      ctx.save();
      ctx.globalAlpha = 0.35 + Math.sin(frameNo * 0.25) * 0.15;
      ctx.fillStyle = EL[a.el].c;
      ctx.beginPath(); ctx.arc(a.x, a.y, R + 9 + Math.sin(frameNo * 0.3) * 2, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    if (a.glow > 0) {
      ctx.save();
      ctx.globalAlpha = a.glow / 20;
      ctx.fillStyle = EL[a.el].l;
      ctx.beginPath(); ctx.arc(a.x, a.y, R + 8, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    const hx = a.hurt > 0 ? Math.sin(a.hurt * 2) * 3 : 0;
    drawChar(a.look, a.x + hx, a.y, R);
    if (a.hurt > 0) {
      ctx.save();
      ctx.globalAlpha = a.hurt / 16 * 0.6;
      ctx.fillStyle = "#ff3b4e";
      ctx.beginPath(); ctx.arc(a.x + hx, a.y, R, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }
  if (shooter) {
    ctx.save();
    shot.trail.forEach((p, k) => {
      ctx.globalAlpha = (k / shot.trail.length) * 0.5;
      ctx.fillStyle = EL[shooter.el].c;
      ctx.beginPath(); ctx.arc(p.x, p.y, R * (k / shot.trail.length), 0, Math.PI * 2); ctx.fill();
    });
    ctx.restore();
    if (shot.atkMul > 1) {
      ctx.save();
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = EL[shooter.el].c;
      ctx.beginPath(); ctx.arc(shooter.x, shooter.y, R + 8 + Math.sin(frameNo) * 2, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    if (shooter.shin) drawShinRing(shooter);
    drawChar(shooter.look, shooter.x, shooter.y, R);
  }
}

// 真の力（試練Ⅲクリア）: 回る金色の二重の輪
function drawShinRing(a) {
  ctx.save();
  ctx.strokeStyle = "#ffd35c";
  ctx.shadowColor = "#ffd35c";
  ctx.shadowBlur = 8;
  ctx.lineWidth = 2.5;
  ctx.globalAlpha = 0.75 + Math.sin(frameNo * 0.15) * 0.2;
  const rot = frameNo * 0.05;
  for (let k = 0; k < 3; k++) {
    const s = rot + k * Math.PI * 2 / 3;
    ctx.beginPath(); ctx.arc(a.x, a.y, R + 9, s, s + 1.4); ctx.stroke();
  }
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(a.x, a.y, R + 4, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

function drawBolts() {
  for (const b of bolts) {
    ctx.save();
    ctx.fillStyle = b.color;
    ctx.shadowColor = b.color;
    ctx.shadowBlur = b.size > 6 ? 18 : 10;
    if (b.beam) {
      // レーザー状の弾（進行方向に細長く）
      ctx.strokeStyle = "#bfffd0";
      ctx.lineCap = "round";
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(b.x - b.vx * 3, b.y - b.vy * 3); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 2;
      ctx.stroke();
    } else if (b.star) {
      ctx.fillStyle = `hsl(${(frameNo * 6 + b.x) % 360},95%,72%)`;
      starPath(b.x, b.y, b.size * 1.5);
      ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life / p.max;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawTexts() {
  ctx.save();
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  for (const t of texts) {
    ctx.globalAlpha = Math.min(1, t.life / 14);
    outlinedText(t.text, t.x, t.y, t.color, t.size);
  }
  ctx.restore();
}

// 予測線（壁と岩のみ考慮）
function drawAim() {
  if (!dragging || state !== "aim") return;
  const aim = computeAim(dragStart, dragNow);
  if (!aim) return;
  const a = allies[cur];
  const p = { x: a.x, y: a.y, vx: aim.dx * 6, vy: aim.dy * 6 };
  ctx.save();
  const n = 55;
  for (let i = 0; i < n; i++) {
    p.x += p.vx; p.y += p.vy;
    walls(p);
    for (const o of rocks) bounce(p, o.x, o.y, o.r);
    if (i % 3 === 0) {
      ctx.globalAlpha = 0.9 * (1 - i / n);
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  const ang = Math.atan2(aim.dy, aim.dx);
  ctx.translate(a.x, a.y);
  ctx.rotate(ang);
  ctx.fillStyle = ssArmed ? EL[a.el].l : "#ffd35c";
  ctx.beginPath();
  ctx.moveTo(R + 26, 0);
  ctx.lineTo(R + 8, -10);
  ctx.lineTo(R + 8, 10);
  ctx.fill();
  ctx.restore();
}

function drawPanel() {
  ctx.fillStyle = "#0e1230";
  ctx.fillRect(0, FB, W, H - FB);
  const ratio = hp / maxHp;
  ctx.fillStyle = "#000";
  roundRect(10, FB + 8, W - 20, 14, 7);
  ctx.fill();
  const g = ctx.createLinearGradient(0, FB + 8, 0, FB + 22);
  const hc = ratio > 0.5 ? ["#9dff8a", "#38c43c"] : ratio > 0.2 ? ["#ffe58a", "#e0a020"] : ["#ff9a9a", "#d02a2a"];
  g.addColorStop(0, hc[0]);
  g.addColorStop(1, hc[1]);
  ctx.fillStyle = g;
  if (ratio > 0) { roundRect(10, FB + 8, Math.max(14, (W - 20) * ratio), 14, 7); ctx.fill(); }
  ctx.save();
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  outlinedText(`HP ${hp.toLocaleString()} / ${maxHp.toLocaleString()}`, W / 2, FB + 15.5, "#fff", 11);
  ctx.restore();

  const sw = W / allies.length, hw = Math.min(40, sw / 2 - 2);   // 5体（助っ人あり）の時は少し詰める
  const cx = allies.length > 4 ? 9 : 12, tx0 = allies.length > 4 ? 8 : 13;
  for (let i = 0; i < allies.length; i++) {
    const a = allies[i], x = sw * (i + 0.5), y = FB + 52;
    ctx.save();
    if (i === cur) {
      ctx.fillStyle = "rgba(255,211,92,0.18)";
      roundRect(x - hw, FB + 28, hw * 2, 58, 10);
      ctx.fill();
      ctx.strokeStyle = "#ffd35c";
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    drawChar(a.look, x - cx, y + 2, allies.length > 4 ? 12 : 14);
    if (a.helper) txt("助", x - hw + 7, FB + 35, 9, "#7cf0ff", "center", "900");
    const ready = a.ssLeft === 0;
    ctx.lineWidth = 3;
    ctx.strokeStyle = "rgba(255,255,255,0.15)";
    ctx.beginPath(); ctx.arc(x - cx, y + 2, allies.length > 4 ? 18 : 21, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = ready ? EL[a.el].l : "#7f8bd0";
    ctx.beginPath();
    ctx.arc(x - cx, y + 2, allies.length > 4 ? 18 : 21, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - a.ssLeft / a.ssTurns));
    ctx.stroke();
    txt(a.buff ? `強化 ${a.buff}T` : a.rally ? `応援 ${a.rally}T` : a.clap ? `拍手 ${a.clap}T` : a.type === "reflect" ? "反射" : "貫通",
      x + tx0, y - 12, allies.length > 4 ? 9 : 10, a.buff ? "#bfffd0" : a.rally ? "#ffb04a" : a.clap ? "#d6bcff" : "#e8ecff");
    if (ready) {
      ctx.globalAlpha = 0.7 + Math.sin(frameNo * 0.15) * 0.3;
      ctx.textAlign = "left";
      outlinedText("SS", x + tx0, y + 4, EL[a.el].l, 15);
      ctx.globalAlpha = 1;
    } else {
      txt(`あと${a.ssLeft}`, x + tx0, y + 4, allies.length > 4 ? 9 : 11, "#9aa3d8");
    }
    // ギミック対策の能力（今のWAVEのギミックに合うものは水色）
    // 枠の下に横並び。全部持っていれば「全ギミック対策」
    const gl = waveGims().map(k => GIM[k].abil), ab = a.abil;
    if (ab.length >= ABIL_KEYS.length) {
      txt("全ギミック対策", x, y + 29, 9, gl.some(Boolean) ? "#7cf0ff" : "#ffd35c", "center", "900");
    } else {
      ctx.font = "900 8px system-ui, sans-serif";
      const ws = ab.map(k => ctx.measureText(ABIL[k].s).width);
      let tx = x - (ws.reduce((s, w) => s + w, 0) + (ab.length - 1) * 4) / 2;
      ab.forEach((k, j) => {
        txt(ABIL[k].s, tx, y + 29, 8, gl.includes(k) ? "#7cf0ff" : "#8088b0", "left", "900");
        tx += ws[j] + 4;
      });
    }
    ctx.restore();
    button(x - hw, FB + 28, hw * 2, 58, "", () => {
      if (state === "aim" && i === cur && a.ssLeft === 0 && canControl(a)) ssArmed = !ssArmed;
    }, { hidden: true });
  }

  if (state === "aim") {
    const a = allies[cur];
    let msg = `${a.name}のターン　引っ張って離すと発射`;
    if (ssArmed) msg = `SS「${a.ssName}」: ${a.ssDesc}`;
    else if (a.ssLeft === 0) msg = `SS使用可能! 下のアイコンをタップ`;
    ctx.fillStyle = "rgba(0,0,0,0.45)";
    ctx.fillRect(0, FB - 22, W, 20);
    txt(msg, W / 2, FB - 12, 12, ssArmed ? EL[a.el].l : "#dfe4ff", "center");
  }
}

      let net = "";
      if (onlineRanking()) net = r.netRank === undefined ? "  ランキング送信中…" : r.netRank === null ? "  (ランキング送信失敗)" : `  全国 ${r.netRank}位!`;
      txt((r.isBest ? "ベスト記録更新!" : `ベスト ${r.best}ターン`) + net, W / 2, 262, 13, "#cfd6ff", "center");
    }
    // 報酬
    ctx.fillStyle = "rgba(255,255,255,0.08)";
    roundRect(40, 285, W - 80, r.drop ? 150 : 100, 12);
    ctx.fill();
    txt("獲得報酬", W / 2, 302, 13, "#ffd35c", "center");
    coinIcon(110, 328, 8);
    txt(`${r.coin.toLocaleString()}`, 124, 328, 14, "#fff");
    crystalIcon(r.crEl, 220, 328, 9);
    txt(`${EL[r.crEl].n}の結晶 ×${r.crN}`, 234, 328, 13, "#fff");
    if (r.gem) { gemIcon(110, 356, 9); txt(`${r.gem} (初回クリア)`, 124, 356, 13, "#fff"); }
    txt(`EXP +${r.exp}`, 234, 356, 13, "#ffd35c");
    if (r.drop) {
      drawIcon(r.drop.fi, 70, 372, 52);
      if (r.dropN > 1) {
        // キャラ集め: まとめて何体か
        const u = save.box[r.drop.fi];
        txt(`${FAM[r.drop.fi].name} ×${r.dropN}体 ゲット!`, 132, 390, 13, "#fff");
        txt(isUnkyoku(r.drop.fi) ? "運極!" : u.awk < MAX_AWK ? `覚醒 ${u.awk}/${MAX_AWK}` : `ラック ${u.luck || 0}/${MAX_LUCK}`, 132, 410, 12, "#ffd35c");
      } else {
        txt(`${FAM[r.drop.fi].name} をゲット!`, 132, 390, 13, "#fff");
        txt(acquireTag(r.drop), 132, 410, 12, "#ffd35c");
      }
    }
    if (r.luckBonus && r.luckBonus.length) {
      txt(`ラックボーナス: ${r.luckBonus.join("・")}`, W / 2, 276, 11, "#9dff8a", "center");
    }
  } else {
    outlinedText("全滅…", W / 2, 220, "#ff6b6b", 40);
    txt(`WAVE ${waveIdx + 1} / ${quest.waves.length}  ・  ${turn}ターン`, W / 2, 270, 14, "#cfd6ff", "center");
    txt("BOXでキャラを強化・進化しよう!", W / 2, 300, 13, "#ffd35c", "center");
  }
  ctx.restore();
  // ストーリー・塔は「次へ」で続けて遊べる
  let next = null;
  if (state === "clear" && quest.kind === "story") {
    const n = Number(questIdx.slice(1)) + 1;
    if (n < STORY_COUNT) next = "s" + n;
  } else if (state === "clear" && quest.kind === "tower") {
    next = "t" + (quest.floor + 1);
  } else if (state === "clear" && quest.kind === "trial") {
    if (quest.tier < TRIAL_TIERS) next = `x${quest.fi}_${quest.tier + 1}`;
    else if (canSuper(quest.fi)) next = "v" + quest.fi;

    next = "u" + (quest.floor + 1);
  } else if (state === "clear" && quest.kind === "typed" && quest.idx + 1 < TYPE_STAGES) {
    next = typeId(quest.ptype, quest.idx + 1);
  } else if (state === "clear" && quest.kind === "extreme" && quest.idx + 1 < EXTREME.length) {
    next = "h" + (quest.idx + 1);
  }
  if (next) {
    button(60, 444, W - 120, 46,
      quest.kind === "trial" ? (quest.tier < TRIAL_TIERS ? `次の試練（${TRIAL_ROMAN[quest.tier + 1]}）へ` : "超進化に挑戦!") : quest.floor ? `${quest.floor + 1}階へ` : "次のステージへ",

      { size: 16, c1: "#ff9a5a", c2: "#d64a2a", fg: "#fff" });

  const y0 = next ? 498 : 456;
  if (quest.kind === "coop") button(60, y0, W - 120, next ? 40 : 48, "部屋にもどる", () => go("coop"), { c1: "#ff9a5a", c2: "#d64a2a", fg: "#fff" });
  else button(60, y0, W - 120, next ? 40 : 48, state === "clear" ? "もう一度" : "リトライ", () => startQuest(questIdx));
  button(60, y0 + (next ? 48 : 60), W - 120, next ? 40 : 48, questHome() === "event" ? "イベントへ" : "クエスト選択", () => go(questHome()), { c1: "#4a5280", c2: "#2b3158", fg: "#fff" });
}

// ---- ボスラッシュ: ボスだけを次々に倒し、何体倒せたかを競う（毎週入れ替わり、全30体） ----------------
const RUSH_WAVES = 30, RUSH_WEEK_OFFSET = 50000;   // オンラインのランキングは event_scores の week に 50000 を足して保存
function rushQuest(wk) {
  const waves = [];
  for (let k = 0; k < RUSH_WAVES; k++) {
    waves.push(() => {
      const m = EL_KEYS[(wk + k) % 5], s = ADV_BY[ADV_BY[m]] || EL_KEYS[(k + 1) % 5];
      const gims = k >= 4 && k % 3 === 0 ? [GIM_KEYS[(wk + k) % GIM_KEYS.length]] : [];
      return genWave(seeded(880000 + wk * 100 + k), m, s, k >= 10 ? 2 : 1, 1.5 * Math.pow(1.17, k),
        { name: `${k + 1}体目 ${EL[m].w}の${BOSS_TITLE[k % BOSS_TITLE.length]}`, hpMul: 1, r: 50, cd: 2 }, k >= 15, gims);
    });
  }
  return {
    id: "b" + wk, kind: "rush", week: wk, name: `ボスラッシュ 第${wk + 1}週`, sub: "ボスを何体倒せるか", boss: true,
    diff: 8, mul: 1, par: 999, bg: ["#3a0606", "#0a0000"], coin: 0, gem: 0, crEl: null, crN: 0, exp: 0, waves, gims: [],
  };
}
function rushState() {
  const wk = weekIdx();
  if (!save.rush || save.rush.week !== wk) save.rush = { week: wk, best: 0, rec: [] };
  return save.rush;
}
const rushScore = (bosses, t) => bosses * 1000 + Math.max(0, 999 - t);
let rushDone = true;
function finishRush(all) {
  if (rushDone) return;
  rushDone = true;
  events = [];
  shot = null;
  const bosses = all ? RUSH_WAVES : waveIdx, st = rushState(), prev = st.best;
  const newBest = bosses > prev;
  if (newBest) st.best = bosses;
  addSeason(15);
  const gem = newBest ? (bosses - prev) * 10 : 0;   // 自己ベストを更新した分だけジェム
  const coin = bosses * 3000;
  const crEl = pick(EL_KEYS), crN = Math.floor(bosses / 2);
  save.gems += gem;
  save.coins += coin;
  save.cr[crEl] += crN;
  const leader = leaderLabel();
  st.rec = (st.rec || []).concat({ name: save.name || "あなた", score: rushScore(bosses, turn), leader, at: Date.now() })
    .sort((a, b) => b.score - a.score).slice(0, 10);
  addStat("clears");
  persist();
  thankHelper();
  lastResult = { kind: "rush", bosses, best: st.best, newBest, gem, coin, crEl, crN, turn };
  if (onlineRanking() && bosses > 0) {
    const res = lastResult;
    (save.name ? Promise.resolve() : askName())
      .then(() => submitEventScore(RUSH_WEEK_OFFSET + st.week, rushScore(bosses, turn), leader))
      .then(r => { res.netRank = r; });
  }
  checkTitles();
  state = "clear";
  playSe("clear");
}

function drawTowerPanel(abyss = false) {
  const best = (abyss ? save.abyssMax : save.towerMax) || 0, next = best + 1;
  const q = abyss ? abyssFloor(next) : towerFloor(next);
  const locked = abyss && (save.towerMax || 0) < ABYSS_UNLOCK;
  // 塔のイラスト（深淵の塔は赤黒く、下に向かって伸びる）
  ctx.save();
  const tx = W / 2, base = 380;
  for (let i = 0; i < 6; i++) {
    const w = 120 - i * 14, y = base - i * 36;
    ctx.fillStyle = abyss ? (i % 2 ? "#4a1030" : "#5e1a3c") : (i % 2 ? "#3a3470" : "#4a4290");
    ctx.fillRect(tx - w / 2, y - 34, w, 34);
    ctx.fillStyle = abyss ? "#ff4d6d" : "#ffd35c";
    ctx.globalAlpha = 0.6 + Math.sin(frameNo * 0.08 + i) * 0.3;
    ctx.fillRect(tx - 6, y - 24, 12, 14);
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = abyss ? "#9b5cff" : "#ff6b8b";
  ctx.beginPath(); ctx.moveTo(tx, base - 6 * 36 - 34); ctx.lineTo(tx - 30, base - 5 * 36 - 34); ctx.lineTo(tx + 30, base - 5 * 36 - 34); ctx.fill();
  ctx.restore();
  drawTowerToggle();
  ctx.save();
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  outlinedText(`最高到達 ${best}階`, W / 2, 156, abyss ? "#ff9ab8" : "#ffd35c", 20);
  ctx.restore();
  if (locked) {
    txt("無限の塔より強い敵が待つ、もう一つの塔", W / 2, 400, 12, "#cfd6ff", "center", "normal");
    txt(`無限の塔を${ABYSS_UNLOCK}階までクリアすると挑戦できます`, W / 2, 430, 13, "#ff9ab8", "center");
    txt(`（いま ${save.towerMax || 0}階）`, W / 2, 452, 12, "#9aa3d8", "center", "normal");

// ---- シーズンパス（30日ごと。遊ぶとポイント、150ポイントごとに報酬。全30段階、無料） ---------------
const SEASON_DAYS = 30, SEASON_TIERS = 30, SEASON_PTS = 150;
const seasonId = () => Math.max(0, Math.floor((Date.now() - dayStart(EVENT_START)) / (SEASON_DAYS * DAY)));
const seasonEnds = () => dayStart(EVENT_START) + (seasonId() + 1) * SEASON_DAYS * DAY;
function seasonState() {
  const id = seasonId();
  if (!save.season || save.season.id !== id) save.season = { id, pts: 0, claimed: 0 };
  return save.season;
}
const seasonTier = () => Math.min(SEASON_TIERS, Math.floor(seasonState().pts / SEASON_PTS));
function addSeason(p) { seasonState().pts += p; }
function seasonReward(t) {
  if (t === SEASON_TIERS) return { gems: 500, tickets: 3, emblems: 2 };
  if (t % 10 === 0) return { gems: 200, tickets: 2, emblems: 1 };
  if (t % 5 === 0) return { tickets: 1, coins: 20000 };
  return [{ gems: 30 }, { coins: 10000 }, { cr: 3 }, { emblems: 1 }][t % 4];
}
const seasonRewardText = r => [r.gems && `ジェム${r.gems}`, r.coins && `コイン${r.coins / 10000}万`, r.cr && `結晶×${r.cr}`,
  r.tickets && `着せ替え券${r.tickets}`, r.emblems && `紋章${r.emblems}`].filter(Boolean).join(" ");
function claimSeason() {
  const st = seasonState(), to = seasonTier();
  if (st.claimed >= to) return;
  const got = [];
  for (let t = st.claimed + 1; t <= to; t++) {
    const r = seasonReward(t);
    if (r.gems) save.gems += r.gems;
    if (r.coins) save.coins += r.coins;
    if (r.cr) for (const k of EL_KEYS) save.cr[k] += r.cr;
    if (r.tickets) save.skinTickets = (save.skinTickets || 0) + r.tickets;
    for (let i = 0; i < (r.emblems || 0); i++) { const k = pick(EMBLEM_KEYS); save.emblems[k] = (save.emblems[k] || 0) + 1; got.push(EMBLEMS[k].s); }
  }
  st.claimed = to;
  save.seasonMax = Math.max(save.seasonMax || 0, to);
  persist();
  playSe("fanfare");
  showToast(`シーズン報酬を受け取りました${got.length ? `（紋章: ${got.join("・")}）` : ""}`);
}
function drawSeason() {

// Supabase の team_members 表（名前ごとに一番新しい行がその人のチーム。抜ける時は team を空で登録）
const TEAM_MAX = 10;
let teamInfo = { status: "idle", members: {}, rank: [], at: 0 };
const isMate = name => !!save.team && (teamInfo.members[save.team] || []).includes(name);
async function fetchTeams() {
  if (!onlineRanking()) { teamInfo.status = "offline"; return; }
  teamInfo.status = "loading";
  try {
    const rows = await sbGet("team_members?select=team,name&order=id.desc&limit=3000");
    const latest = new Map();
    for (const r of rows) if (!latest.has(r.name)) latest.set(r.name, r.team);
    const members = {};
    for (const [name, team] of latest) if (team) (members[team] = members[team] || []).push(name);
    const raid = await sbGet(`raid_top?select=name,dmg&raid=eq.${raidId()}&limit=2000`).catch(() => []);
    const sc = await sbGet(`event_scores?select=name,score&week=eq.${weekIdx()}&order=score.desc&limit=3000`).catch(() => []);
    const raidOf = new Map(raid.map(r => [r.name, Number(r.dmg)]));
    const bestSc = new Map();
    for (const r of sc) if (!bestSc.has(r.name)) bestSc.set(r.name, Number(r.score));
    const rank = Object.entries(members).map(([team, names]) => {
      const rd = names.reduce((s, n) => s + (raidOf.get(n) || 0), 0), scs = names.reduce((s, n) => s + (bestSc.get(n) || 0), 0);
      return { team, n: names.length, raid: rd, score: scs, pt: Math.round(rd / 1000) + scs };   // レイド1000ダメージ＝1pt
    }).sort((a, b) => b.pt - a.pt);
    teamInfo = { status: "ok", members, rank, at: Date.now() };
    // ほかの端末でチームを変えた時などはサーバーに合わせる
    if (save.name && latest.has(save.name) && latest.get(save.name) !== save.team) { save.team = latest.get(save.name); persist(); }
  } catch (e) {
    teamInfo.status = "error";

  }
}

// ---- 協力プレイ（リアルタイム。2〜4人で同じステージを順番に弾く） ------------------------------
// Supabase の Realtime（broadcast）で部屋ごとにメッセージを送り合う。表は使わない
// ホストが毎ターンのはじめに盤面をみんなに配り、それぞれのキャラは持ち主だけが操作する
const COOP_LV = [
  { n: "初級", mul: 1.5, gem: 30,  diff: 4, gims: ["warp"] },
  { n: "中級", mul: 4,   gem: 60,  diff: 6, gims: ["mine", "dwall"] },
  { n: "上級", mul: 10,  gem: 100, diff: 8, gims: ["dwall", "gbar", "block"], hard: true },
  { n: "超級", mul: 24,  gem: 200, diff: 11, gims: ["warp", "mine", "gbar"], hard: true },
];
function coopQuest(lv) {
  const L = COOP_LV[lv], m = EL_KEYS[(lv * 3 + 1) % 5], s = ADV_BY[ADV_BY[m]] || EL_KEYS[(lv + 2) % 5];
  const seed = w => seeded(610000 + lv * 10 + w);
  const waves = [
    () => genWave(seed(0), m, s, 5, L.mul, null, !!L.hard, L.gims),
    () => genWave(seed(1), m, s, 6, L.mul, null, !!L.hard, L.gims),
    () => genWave(seed(2), m, s, 3, L.mul, { name: "協力ボス", hpMul: 2.6, r: 56, cd: 2 }, !!L.hard, L.gims),
  ];
  return {
    id: "c" + lv, kind: "coop", lv, name: `協力クエスト【${L.n}】`, sub: `${EL[m].n}属性 / ${EL[ADV_BY[m]].n}属性が有利`,
    boss: true, diff: L.diff, mul: 1, par: 12, bg: ["#2a1a0a", "#0a0602"], coin: 10000 * (lv + 1), gem: L.gem,
    crEl: m, crN: 5 + lv * 4, exp: 150 + lv * 100, waves, gims: L.gims,
  };
}
const coop = { ws: null, room: "", topic: "", id: Math.random().toString(36).slice(2, 10), host: false, hostId: "",
  members: [], status: "off", inBattle: false, ref: 1, hb: 0, beat: 0, seen: {}, lv: 0, pending: null, full: false };
function coopUnits() {
  return save.party.slice(0, 4).map(fi => {
    const u = save.box[fi];
    return { fi: Number(fi), rar: u.rar, lv: u.lv, awk: u.awk, luck: u.luck || 0, trial: trialTier(fi), em: emblemOf(fi), sk: skinOf(fi) };
  });
}
const coopMe = () => ({ id: coop.id, name: (save.name || "ゲスト").slice(0, 12), units: coopUnits() });
// その手番のキャラを自分が動かせるか（抜けた人のキャラはホストが動かす）
const canControl = a => !coop.inBattle || a.owner === coop.id || (coop.host && !coop.members.some(m => m.id === a.owner));
function coopConnect(room, host) {
  if (!onlineRanking()) { showToast("協力プレイはオンラインの時だけ遊べます"); return; }
  coopLeave();
  const url = RANKING.url.replace(/^http/, "ws") + `/realtime/v1/websocket?apikey=${encodeURIComponent(RANKING.key)}&vsn=1.0.0`;
  Object.assign(coop, { room, topic: `realtime:mflick-coop-${room}`, host, hostId: host ? coop.id : "", status: "connecting",
    members: host ? [coopMe()] : [], seen: {}, lv: 0, pending: null, full: false, inBattle: false });
  const ws = new WebSocket(url);
  coop.ws = ws;
  ws.onopen = () => ws.send(JSON.stringify({ topic: coop.topic, event: "phx_join", payload: { config: { broadcast: { self: false } } }, ref: String(coop.ref++) }));
  ws.onmessage = m => {
    let d;
    try { d = JSON.parse(m.data); } catch (e) { return; }
    if (d.event === "phx_reply" && d.topic === coop.topic && coop.status === "connecting") {
      coop.status = d.payload && d.payload.status === "ok" ? "on" : "error";
      coopHello();
    }
    if (d.event === "broadcast" && d.payload) coopOnMessage(d.payload.event, d.payload.payload || {});
  };
  ws.onclose = () => { if (coop.ws === ws) { coop.status = "off"; coop.ws = null; if (coop.inBattle) coopAbort("通信が切れました"); } };
  ws.onerror = () => { coop.status = "error"; };
  clearInterval(coop.hb);
  coop.hb = setInterval(coopTick, 3000);
}
function coopLeave() {
  if (coop.ws) {
    coopSend("bye", {});
    const ws = coop.ws;
    coop.ws = null;
    setTimeout(() => { try { ws.close(); } catch (e) { /* もう閉じている */ } }, 200);
  }
  clearInterval(coop.hb);
  Object.assign(coop, { status: "off", room: "", members: [], inBattle: false, host: false, hostId: "", pending: null });
}
function coopSend(event, payload) {
  if (!coop.ws || coop.ws.readyState !== 1 || coop.status !== "on") return;
  coop.ws.send(JSON.stringify({ topic: coop.topic, event: "broadcast", payload: { type: "broadcast", event, payload: { ...payload, id: coop.id } }, ref: String(coop.ref++) }));
}
function coopHello() {
  coopSend("hello", { name: coopMe().name, units: coopUnits(), host: coop.host });
  if (coop.host) coopSend("lobby", { members: coop.members, lv: coop.lv, hostId: coop.id, inBattle: coop.inBattle });
}
function coopTick() {
  if (!coop.ws) return;
  if (++coop.beat % 8 === 0 && coop.ws.readyState === 1) {
    coop.ws.send(JSON.stringify({ topic: "phoenix", event: "heartbeat", payload: {}, ref: String(coop.ref++) }));   // サーバーとの接続を保つ
  }
  if (!coop.inBattle) coopHello(); else coopSend("ping", {});
  const now = Date.now();
  if (coop.host) {
    // 15秒返事がない人は抜けたことにする（その人のキャラはホストが動かす）
    const before = coop.members.length;
    coop.members = coop.members.filter(m => m.id === coop.id || now - (coop.seen[m.id] || now) < 15000);
    if (coop.members.length !== before && !coop.inBattle) coopHello();
  } else if (coop.hostId && now - (coop.seen[coop.hostId] || now) > 15000) {
    coopAbort("ホストとの通信が切れました");
    coopLeave();
  }
}
function coopOnMessage(ev, p) {
  if (p.id) coop.seen[p.id] = Date.now();
  if (ev === "hello" && coop.host) {
    const m = coop.members.find(x => x.id === p.id), info = { id: p.id, name: String(p.name || "ゲスト").slice(0, 12), units: (p.units || []).slice(0, 4) };
    if (!m && !coop.inBattle && coop.members.length < 4) { coop.members.push(info); coopHello(); }
    else if (m && !coop.inBattle) Object.assign(m, info);
  }
  if (ev === "lobby" && !coop.host) {
    coop.hostId = p.hostId;
    coop.members = p.members || [];
    coop.lv = p.lv || 0;
    coop.full = coop.members.length >= 4 && !coop.members.some(m => m.id === coop.id);
  }
  if (ev === "start" && !coop.host && (p.members || []).some(m => m.id === coop.id)) coopBegin(p.lv, p.members);
  if (ev === "state" && !coop.host && coop.inBattle) coopApply(p);
  if (ev === "shot" && coop.inBattle) coopRecvShot(p);
  if (ev === "end" && !coop.host && coop.inBattle) coopEnd(p.clear);
  if (ev === "bye") {
    if (!coop.host && p.id === coop.hostId) { coopAbort("ホストが部屋を閉じました"); coopLeave(); }
    else if (coop.host) { coop.members = coop.members.filter(m => m.id !== p.id); if (!coop.inBattle) coopHello(); }
  }
}
// バトル開始（全員）: 4枠を順番に分ける（2人なら2体ずつ、3人なら最初の人が2体）
function coopBegin(lv, members) {
  const q = coopQuest(lv), n = members.length, slots = [];
  for (let i = 0; i < 4; i++) {
    const m = members[i % n], u = m.units[Math.floor(i / n)];
    if (u && FAM[u.fi] && RBASE[u.rar]) slots.push({ m, u });
  }
  if (!slots.length) return;
  coop.members = members;
  coop.inBattle = true;
  coop.pending = null;
  questIdx = q.id;
  quest = q;
  waveIdx = 0;
  allies = slots.map(({ m, u }, k) => {
    const a = makeHelperAlly({ ...u, name: m.name }, W / (slots.length + 1) * (k + 1), 505);
    applyEmblem(a, u.fi, u.em);
    a.look = applySkin(a.look, u.fi, u.sk || "");
    a.helper = false;
    a.owner = m.id;
    a.ownerName = m.name;
    a.name = m.id === coop.id ? displayName(u.fi) : `${m.name}の${FAM[u.fi].name}`;
    return a;
  });
  maxHp = hp = allies.reduce((s, a) => s + a.hp, 0);

function coopSendState() {

    turn, cur, hp, maxHp, waveIdx, hearts, rocks, gim,
    allies: allies.map(a => ({ x: a.x, y: a.y, atk: a.atk, spd: a.spd, ssLeft: a.ssLeft, buff: a.buff || 0, buffHp: a.buffHp || 0, rally: a.rally || 0, clap: a.clap || 0 })),
    enemies: enemies.filter(e => !e.dead),
  });
}
function coopApply(s) {
  turn = s.turn; cur = s.cur; hp = s.hp; maxHp = s.maxHp; waveIdx = s.waveIdx;
  enemies = s.enemies || [];
  rocks = s.rocks || [];

  hearts = s.hearts || [];

}

}

function acquirePreview(fi) {

// ---- 超拍手祭の豪華なバナー（提灯・花火・紙吹雪・金の額縁・スポットライト） ------------
function drawFestivalBanner(B) {
  const bx = 14, by = 82, bw = W - 28, bh = 250;
  ctx.save();
  // 夜空のグラデーション
  const bgG = ctx.createLinearGradient(0, by, 0, by + bh);
  bgG.addColorStop(0, "#2a0a3a");
  bgG.addColorStop(0.55, "#6a1450");
  bgG.addColorStop(1, "#c0303a");
  ctx.fillStyle = bgG;
  roundRect(bx, by, bw, bh, 16);
  ctx.fill();
  ctx.clip();
  // 花火（場所と色は時間ごとに切り替わる）
  for (let k = 0; k < 3; k++) {
    const period = 90, t = (frameNo + k * 30) % period, n = Math.floor((frameNo + k * 30) / period);
    const rnd = seeded(n * 31 + k * 7);
    const fx0 = bx + 30 + rnd() * (bw - 60), fy0 = by + 40 + rnd() * 90, hue = Math.floor(rnd() * 360);
    const prog = t / period, rad = 10 + prog * 55;
    ctx.globalAlpha = Math.max(0, 1 - prog);
    for (let i = 0; i < 16; i++) {
      const a = i / 16 * Math.PI * 2;
      ctx.fillStyle = `hsl(${hue + i * 6},100%,70%)`;
      ctx.beginPath(); ctx.arc(fx0 + Math.cos(a) * rad, fy0 + Math.sin(a) * rad, 2.2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  // スポットライト（猫を照らす）
  const spot = ctx.createRadialGradient(W / 2, by + 150, 10, W / 2, by + 150, 120);
  spot.addColorStop(0, "rgba(255,240,170,0.55)");
  spot.addColorStop(1, "rgba(255,240,170,0)");
  ctx.fillStyle = spot;
  ctx.beginPath();
  ctx.moveTo(W / 2 - 18, by);
  ctx.lineTo(W / 2 + 18, by);
  ctx.lineTo(W / 2 + 95, by + 215);
  ctx.lineTo(W / 2 - 95, by + 215);
  ctx.closePath();
  ctx.fill();
  // 紙吹雪
  for (let i = 0; i < 46; i++) {
    const sx = bx + ((i * 73 + Math.sin(frameNo * 0.02 + i) * 14) % bw + bw) % bw;
    const sy = by + ((i * 41 + frameNo * (0.6 + (i % 4) * 0.25)) % bh);
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(frameNo * 0.05 + i);
    ctx.fillStyle = ["#ffd35c", "#ff6b8b", "#7cf0ff", "#9dff8a", "#d6bcff", "#ffffff"][i % 6];
    ctx.fillRect(-3, -1.5, 6, 3);
    ctx.restore();
  }
  // 提灯（ひもにつるされて少しゆれる）
  ctx.strokeStyle = "#3a1a0a";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(bx, by + 18);
  ctx.quadraticCurveTo(W / 2, by + 34, bx + bw, by + 18);
  ctx.stroke();
  const lanterns = 6;
  for (let i = 0; i < lanterns; i++) {
    const lx = bx + 26 + i * (bw - 52) / (lanterns - 1);
    const sag = Math.sin((i / (lanterns - 1)) * Math.PI) * 14;
    const ly = by + 34 + sag, sw = Math.sin(frameNo * 0.05 + i) * 0.12;
    ctx.save();
    ctx.translate(lx, ly - 12 + sag * 0);
    ctx.rotate(sw);
    // 光
    const glow = ctx.createRadialGradient(0, 12, 2, 0, 12, 22);
    glow.addColorStop(0, "rgba(255,200,90,0.6)");
    glow.addColorStop(1, "rgba(255,200,90,0)");
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(0, 12, 22, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#2a1208";
    ctx.fillRect(-5, 0, 10, 3);
    ctx.fillRect(-5, 21, 10, 3);
    ctx.fillStyle = i % 2 ? "#e8323a" : "#ff6a2a";
    ctx.beginPath(); ctx.ellipse(0, 12, 9, 10, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(90,20,10,0.5)";
    ctx.lineWidth = 1;
    for (const dy of [-5, 0, 5]) {
      ctx.beginPath(); ctx.ellipse(0, 12 + dy, 9 * Math.sqrt(1 - (dy / 10) ** 2), 1.2, 0, 0, Math.PI * 2); ctx.stroke();
    }

  ctx.restore();
  // 金の額縁（二重線＋四隅の飾り）

  frameG.addColorStop(0.5, "#d4a020");
  frameG.addColorStop(1, "#fff3b0");
  ctx.strokeStyle = frameG;
  ctx.lineWidth = 5;
  roundRect(bx, by, bw, bh, 16);
  ctx.stroke();
  ctx.lineWidth = 1.5;
  roundRect(bx + 6, by + 6, bw - 12, bh - 12, 12);
  ctx.stroke();
  ctx.fillStyle = "#ffd35c";
  for (const [cx, cy] of [[bx + 8, by + 8], [bx + bw - 8, by + 8], [bx + 8, by + bh - 8], [bx + bw - 8, by + bh - 8]]) {
    starPath(cx, cy, 7 + Math.sin(frameNo * 0.12 + cx) * 1.5);

  ctx.restore();
  // タイトル（金色＋光る）
  ctx.save();
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  const pulse = 1 + Math.sin(frameNo * 0.08) * 0.04;
  ctx.translate(W / 2, by + 74);
  ctx.scale(pulse, pulse);
  ctx.shadowColor = "#ffcf4a";
  ctx.shadowBlur = 18;
  const tg = ctx.createLinearGradient(0, -16, 0, 16);
  tg.addColorStop(0, "#fffbe0");
  tg.addColorStop(0.5, "#ffd35c");
  tg.addColorStop(1, "#e8890c");
  ctx.font = "900 30px system-ui, sans-serif";
  ctx.lineWidth = 7;
  ctx.strokeStyle = "#7a0a20";
  ctx.strokeText(B.name, 0, 0);
  ctx.shadowBlur = 0;
  ctx.fillStyle = tg;
  ctx.fillText(B.name, 0, 0);
  ctx.restore();
  ctx.save();
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  outlinedText("★6限定キャラ 全員集合!", W / 2, by + 100, "#fff", 13, "#7a0a20");

  // ★6キャラ: 猫を真ん中に大きく、ほかの限定キャラを左右に
  const lims = B.limited.map(fi => FAM[fi]);
  const cat = lims.find(f => f.idx === LIMITED_CAT), others = lims.filter(f => f.idx !== LIMITED_CAT);
  others.forEach((lf, i) => {

    // パチパチ（拍手の音がふわっと浮かぶ）
    for (let i = 0; i < 3; i++) {

      outlinedText("パチパチ", px, py, "#ffe066", 10, "#5a1800");
    }
    ctx.restore();
  }
}

function drawGachaAnim() {
  ctx.fillStyle = "#06040f";
  ctx.fillRect(0, 0, W, H);
  const r = gacha.res[gacha.i], f = FAM[r.fi], rar = f.rar;
  const cy = 300, t = gacha.t;
  // 光線
  ctx.save();
  const rays = rar >= 5 ? 16 : 8;
  for (let i = 0; i < rays; i++) {
    const a = frameNo * 0.01 + i * Math.PI * 2 / rays;
    ctx.fillStyle = rar >= 5 ? `hsla(${(i * 40 + frameNo * 2) % 360},90%,65%,0.18)` : `rgba(255,255,255,${rar >= 4 ? 0.08 : 0.04})`;
    ctx.beginPath();
    ctx.moveTo(W / 2, cy);
    ctx.lineTo(W / 2 + Math.cos(a) * 500, cy + Math.sin(a) * 500);
    ctx.lineTo(W / 2 + Math.cos(a + 0.12) * 500, cy + Math.sin(a + 0.12) * 500);
    ctx.fill();
  }
  ctx.restore();
  if (!gacha.opened) {
    // タマゴが落ちてきて揺れる（色でレア度を予告）
    const y = Math.min(cy, -60 + t * 14) - (t > 26 && t < 34 ? Math.sin((t - 26) / 8 * Math.PI) * 20 : 0);
    const rot = t > 34 ? Math.sin(t * 0.5) * 0.18 : 0;
    const col = rar >= 5 ? `hsl(${(frameNo * 4) % 360},90%,62%)` : rar >= 4 ? "#d8e0f0" : "#d39a5a";
    ctx.save();
    ctx.translate(W / 2, y + 50);
    ctx.rotate(rot);
    ctx.translate(0, -50);
    ctx.shadowColor = col;
    ctx.shadowBlur = rar >= 4 ? 30 : 12;
    const eg = ctx.createRadialGradient(-14, -20, 4, 0, 0, 60);
    eg.addColorStop(0, "#ffffff");
    eg.addColorStop(1, col);
    ctx.fillStyle = eg;
    ctx.beginPath(); ctx.ellipse(0, 0, 40, 52, 0, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    // 模様（星と水玉）
    ctx.fillStyle = "rgba(255,255,255,0.7)";
    starPath(-12, -18, 9); ctx.fill();
    for (const [px, py, pr] of [[16, -6, 6], [-18, 16, 5], [12, 26, 7]]) {
      ctx.beginPath(); ctx.arc(px, py, pr, 0, Math.PI * 2); ctx.fill();
    }
    // ひび
    if (t > 34) {
      ctx.strokeStyle = "rgba(40,20,0,0.6)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-30, 2); ctx.lineTo(-16, -6); ctx.lineTo(-4, 4); ctx.lineTo(8, -6); ctx.lineTo(20, 3); ctx.lineTo(32, -4);
      ctx.stroke();
    }
    ctx.restore();
    if (t > 30) txt("タップで孵化!", W / 2, 420, 15, `rgba(255,255,255,${0.6 + Math.sin(frameNo * 0.15) * 0.4})`, "center");
  } else {
    if (t < 20) {
      ctx.fillStyle = `rgba(255,255,255,${1 - t / 20})`;
      ctx.fillRect(0, 0, W, H);
    }
    const s = Math.min(1, t / 12);
    drawChar({ shape: f.shape, el: f.el, acc: f.acc, eye: f.eye, rar, evo: false }, W / 2, cy, 64 * s);
    ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    outlinedText(f.name, W / 2, 420, "#fff", 26);
    ctx.restore();
    drawStars(rar, W / 2, 452, 11);
    drawElemIcon(f.el, W / 2 - 40, 482, 10);
    txt(f.type === "reflect" ? "反射" : "貫通", W / 2 - 24, 482, 13, "#cfd6ff");
    txt(COMBO[f.combo].name, W / 2 + 16, 482, 13, "#cfd6ff");
    const tag = acquireTag(r);
    ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    outlinedText(tag, W / 2, 200, r.kind === "new" ? "#ff5c8a" : "#ffd35c", 24);
    ctx.restore();
    if (t > 15) txt("タップで次へ", W / 2, 540, 13, "rgba(255,255,255,0.7)", "center");
  }
  drawParticles();
  txt(`${gacha.i + 1} / ${gacha.res.length}`, 16, 24, 13, "#9aa3d8");
  button(0, 0, W, H, "", gachaTap, { hidden: true });

let gridEl = "all", gridPage = 0;
const GRID_PAGE = 30;
function drawGrid(y0, onTap, opt = {}) {
  const cols = 6, s = 52, gap = 6;
  const x0 = (W - (cols * s + (cols - 1) * gap)) / 2;
  const tabs = ["all", ...EL_KEYS], tw = (W - 28) / tabs.length;
  tabs.forEach((t, i) => {
    const tx = 14 + i * tw, active = gridEl === t;
    ctx.fillStyle = active ? (t === "all" ? "#ffd35c" : EL[t].c) : "rgba(255,255,255,0.08)";
    roundRect(tx + 2, y0, tw - 4, 26, 8);
    ctx.fill();
    txt(t === "all" ? "全て" : EL[t].n, tx + tw / 2, y0 + 13, 12, active ? "#1a1030" : "#cfd6ff", "center");
    button(tx, y0, tw, 26, "", () => { gridEl = t; gridPage = 0; }, { hidden: true });
  });
  const all = ORDER.filter(fi => gridEl === "all" || FAM[fi].el === gridEl);
  const pages = Math.max(1, Math.ceil(all.length / GRID_PAGE));
  if (gridPage >= pages) gridPage = pages - 1;
  const gy = y0 + 34;
  if (pages > 1) {
    const py = gy + 5 * (s + gap) + 2;
    button(x0, py, 70, 26, "◀ 前", () => { gridPage = (gridPage + pages - 1) % pages; }, { size: 12, c1: "#4a5280", c2: "#2b3158", fg: "#fff" });
    button(W - x0 - 70, py, 70, 26, "次 ▶", () => { gridPage = (gridPage + 1) % pages; }, { size: 12, c1: "#4a5280", c2: "#2b3158", fg: "#fff" });
    txt(`${gridPage + 1} / ${pages}`, W / 2, py + 13, 13, "#fff", "center");
  }
  const list = all.slice(gridPage * GRID_PAGE, (gridPage + 1) * GRID_PAGE).map(fi => FAM[fi]);
  list.forEach((f, i) => {
    const x = x0 + (i % cols) * (s + gap), y = gy + Math.floor(i / cols) * (s + gap);
    drawIcon(f.idx, x, y, s, { silhouette: true, lv: true });
    // 編成できないキャラは暗く
    if (opt.dim && owned(f.idx) && opt.dim(f.idx)) {
      ctx.save();
      ctx.fillStyle = "rgba(0,0,0,0.6)";
      roundRect(x, y, s, s, s * 0.15);
      ctx.fill();
      ctx.restore();
    }
    // ギミック対策のバッジ（下に水色の帯）
    const bd = opt.badge && owned(f.idx) ? opt.badge(f.idx) : "";
    if (bd) {
      ctx.save();
      ctx.fillStyle = "rgba(20,120,160,0.92)";
      roundRect(x + 1, y + s - 15, s - 2, 14, 4);
      ctx.fill();
      ctx.restore();
      txt(bd, x + s / 2, y + s - 8, 8, "#fff", "center", "900");
    }
    if (opt.mark && opt.mark(f.idx)) {
      ctx.save();
      ctx.fillStyle = "rgba(0,0,0,0.5)";
      roundRect(x, y, s, s, s * 0.15);
      ctx.fill();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      outlinedText(opt.mark(f.idx), x + s / 2, y + s / 2, "#ffd35c", 14);
      ctx.restore();
    }
    button(x, y, s, s, "", () => onTap(f.idx), { hidden: true });
  });
}

// ---- 管理者設定（config.json。admin.html で作成） -----------------------------
// お知らせ・メンテナンス・キャンペーン・ガチャ・デイリーボーナス・初期アイテム・難易度・キャラ調整
let CFG = {};
const DAILY_BONUS = { gems: 50, coins: 1000 };
const cfgNum = (v, lo, hi, d) => v === undefined || v === null || v === "" || !Number.isFinite(Number(v))
  ? d : Math.max(lo, Math.min(hi, Number(v)));

async function loadConfig() {
  try {
    const res = await fetch("config.json?t=" + Date.now(), { cache: "no-store" });
    CFG = res.ok ? (await res.json()) || {} : {};
  } catch (e) {
    CFG = {};
  }
  applyConfig();
}

function applyConfig() {
  // ガチャ（確率の合計が100%を超える設定は無視）
  const g = CFG.gacha || {};
  GACHA_1 = cfgNum(g.price1, 0, 1e6, 50);
  GACHA_10 = cfgNum(g.price10, 0, 1e7, 450);
  const r6 = cfgNum(g.rate6, 0, 0.5, 0.01), r5 = cfgNum(g.rate5, 0, 1, 0.06), r4 = cfgNum(g.rate4, 0, 1, 0.30);
  // ★6枠のキャラ: limited = スターダストガチャ、limited2 = 灼熱ガチャ（自動ローテーション用）
  const toIds = list => (Array.isArray(list) ? list : []).map(n => FAM.find(f => f.name === n)).filter(Boolean).map(f => f.idx);
  const lim1 = toIds(g.limited).length ? toIds(g.limited) : [LIMITED, LIMITED_JIN];
  const lim2 = toIds(g.limited2).length ? toIds(g.limited2) : [LIMITED_PANI];
  if (r6 * Math.max(lim1.length, lim2.length, LIMITED_ALL.length) + r5 + r4 <= 1) {
    RATE6 = r6; RATE5 = r5; RATE4 = r4;
    LIMITED_GACHAS[0].limited = lim1;
    LIMITED_GACHAS[1].limited = lim2;
  }
  // 常設ガチャの★6（恒常★6全体の合計確率）
  STD_RATE6 = cfgNum(g.stdRate6, 0, 0.3, 0.01);
  // オンライン（全国ランキング・スコアアタック・協力レイド）: Supabase の URL と anon キー
  const on = CFG.online || {};
  // URL は末尾の「/rest/v1/」付きで貼られても動くようにする
  if (on.url && on.key) { RANKING.url = String(on.url).trim().replace(/\/+$/, "").replace(/\/rest\/v1$/, ""); RANKING.key = String(on.key).trim(); }
  // デイリーボーナス
  const d = CFG.daily || {};
  DAILY_BONUS.gems = cfgNum(d.gems, 0, 1e6, 50);
  DAILY_BONUS.coins = cfgNum(d.coins, 0, 1e8, 1000);
  // キャラ調整（能力の倍率）
  FAM.forEach((f, i) => { f.boost = BASE_BOOST[i]; });
  for (const [name, b] of Object.entries(CFG.charBoost || {})) {
    const f = FAM.find(x => x.name === name);
    if (f) f.boost = cfgNum(b, 0.1, 100, BASE_BOOST[f.idx]);
  }
  // 新しく始めた人の初期アイテム（最初の1回だけ）
  if (save && save.starterPending) {
    const s = CFG.starter || {};
    save.gems = cfgNum(s.gems, 0, 1e9, save.gems);
    save.coins = cfgNum(s.coins, 0, 1e10, save.coins);
    delete save.starterPending;
    persist();
  }
}

const cfgDifficulty = () => cfgNum(CFG.difficulty, 0.1, 100, 1);
// メンテナンス中か（URLに ?test=1 を付けると管理者は遊べる）
const maintenanceOn = () => !!(CFG.maintenance && CFG.maintenance.on) && !/[?&]test=1/.test(location.search);

// 期間中のキャンペーン（なければ null）
function campaign() {
  const c = CFG.campaign;
  if (!c || !c.title) return null;
  const now = Date.now();
  if (c.from && now < new Date(c.from + "T00:00:00").getTime()) return null;
  if (c.until && now > new Date(c.until + "T23:59:59").getTime()) return null;
  return { title: c.title, coin: cfgNum(c.coinMul, 1, 100, 1), exp: cfgNum(c.expMul, 1, 100, 1), gem: cfgNum(c.gemMul, 1, 100, 1) };

function wrapText(text, maxW, size) {
  ctx.font = `normal ${size}px system-ui, sans-serif`;
  const lines = [];
  for (const para of String(text).split("\n")) {
    let line = "";
    for (const ch of para) {
      if (ctx.measureText(line + ch).width > maxW) { lines.push(line); line = ch; } else line += ch;
    }
    lines.push(line);
  }
  return lines;
}

let gifts = [];
async function loadGifts() {
  try {
    const res = await fetch("gifts.json?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) return;
    const data = await res.json();
    const now = Date.now();
    gifts = (Array.isArray(data.gifts) ? data.gifts : []).filter(g => g && g.id && g.title
      && (!g.from || now >= new Date(g.from + "T00:00:00").getTime())
      && (!g.until || now <= new Date(g.until + "T23:59:59").getTime()));
  } catch (e) { /* オフライン等 */ }
}
const unclaimed = () => gifts.filter(g => !(save.claimed || []).includes(g.id));
const giftNum = (v, max) => Math.max(0, Math.min(max, Math.floor(Number(v) || 0)));

function claimGift(g) {
  save.claimed = save.claimed || [];
  if (save.claimed.includes(g.id)) return;
  save.gems += giftNum(g.gems, 100000);
  save.coins += giftNum(g.coins, 100000);
  const cr = giftNum(g.crystals, 999);
  for (const k of EL_KEYS) save.cr[k] += cr;
  save.claimed.push(g.id);
  persist();
}

function giftText(g) {
  const parts = [];
  if (giftNum(g.gems, 100000)) parts.push(`ジェム${giftNum(g.gems, 100000)}`);
  if (giftNum(g.coins, 100000)) parts.push(`コイン${giftNum(g.coins, 100000)}`);
  if (giftNum(g.crystals, 999)) parts.push(`結晶 各${giftNum(g.crystals, 999)}`);
  return parts.join(" + ");
}

// ---- データ引き継ぎコード ---------------------------------------------------
// 形式: MF1Z-<圧縮データ(base64url)>-<チェック用の値>（圧縮できない環境では MF1-）
function codeCheck(s) {
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h.toString(36);
}
function toB64url(bytes) {
  let bin = "";
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function fromB64url(s) {
  const bin = atob(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4));
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function pipeBytes(bytes, stream) {
  return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer());
}
async function encodeSave() {
  let bytes = new TextEncoder().encode(JSON.stringify(save)), tag = "MF1";
  if (window.CompressionStream) {
    bytes = await pipeBytes(bytes, new CompressionStream("deflate-raw"));
    tag = "MF1Z";
  }
  const body = toB64url(bytes);
  return `${tag}-${body}-${codeCheck(body)}`;
}
async function decodeSave(code) {
  const m = code.replace(/\s+/g, "").match(/^(MF1Z?)-([A-Za-z0-9_-]+)-([a-z0-9]+)$/);
  if (!m) throw new Error("引き継ぎコードの形ではありません");
  if (codeCheck(m[2]) !== m[3]) throw new Error("コードが途中で切れているか、間違っています");
  let bytes = fromB64url(m[2]);
  if (m[1] === "MF1Z") {
    if (!window.DecompressionStream) throw new Error("このブラウザでは読み込めません。新しいブラウザで試してください");
    bytes = await pipeBytes(bytes, new DecompressionStream("deflate-raw"));
  }
  const s = JSON.parse(new TextDecoder().decode(bytes));
  if (!s || !s.box || !s.party) throw new Error("セーブデータが入っていません");
  return normalizeSave(s);
}

function openCodeBox(title, text, readOnly, note, mainLabel, onMain) {
  const box = document.getElementById("codeBox"), area = document.getElementById("codeText");
  document.getElementById("codeTitle").textContent = title;
  area.value = text;
  area.readOnly = readOnly;
  area.placeholder = readOnly ? "" : "ここに引き継ぎコードを貼り付け";
  setCodeNote(note);
  const main = document.getElementById("codeMain");
  main.textContent = mainLabel;
  main.onclick = onMain;

// オンラインランキング（Supabase）。url と key（anon public キー）を入れると全国ランキングになる。
// 空のままなら「この端末の記録」だけを表示する。設定方法は README を参照。
const RANKING = { url: "", key: "" };
const onlineRanking = () => !!(RANKING.url && RANKING.key);
let rankQuest = 0, rankCache = {};   // { [クエスト番号]: { status: "loading"|"ok"|"error", rows } }

function localRecords(q) { return (save.records && save.records[q]) || []; }
function addLocalRecord(q, turns, leader) {
  save.records = save.records || {};
  const list = save.records[q] = save.records[q] || [];
  list.push({ name: save.name || "あなた", turns, leader, at: Date.now() });
  list.sort((a, b) => a.turns - b.turns || a.at - b.at);
  list.length = Math.min(list.length, 10);
}

function rankHeaders(extra = {}) {
  return { apikey: RANKING.key, Authorization: `Bearer ${RANKING.key}`, ...extra };
}
async function fetchRanking(q) {
  if (!onlineRanking()) return;
  rankCache[q] = { status: "loading", rows: [] };
  try {
    const res = await fetch(`${RANKING.url}/rest/v1/scores?select=name,turns,leader,created_at&quest=eq.${q}&order=turns.asc,created_at.asc&limit=15`,
      { headers: rankHeaders() });
    if (!res.ok) throw new Error(String(res.status));
    rankCache[q] = { status: "ok", rows: await res.json() };
  } catch (e) {
    rankCache[q] = { status: "error", rows: [] };
  }
}
// 送信して順位（自分より少ないターンの記録数 + 1）を返す。失敗時は null
async function submitScore(q, turns, leader) {
  if (!onlineRanking() || !save.name) return null;
  try {
    const res = await fetch(`${RANKING.url}/rest/v1/scores`, {
      method: "POST",
      headers: rankHeaders({ "Content-Type": "application/json", Prefer: "return=minimal" }),
      body: JSON.stringify({ name: save.name, quest: q, turns, leader }),
    });
    if (!res.ok) throw new Error(String(res.status));
    delete rankCache[q];
    const cnt = await fetch(`${RANKING.url}/rest/v1/scores?select=id&quest=eq.${q}&turns=lt.${turns}`,
      { headers: rankHeaders({ Prefer: "count=exact", Range: "0-0" }) });
    const total = Number((cnt.headers.get("content-range") || "").split("/")[1]);
    return Number.isFinite(total) ? total + 1 : null;
  } catch (e) {
    return null;
  }
}
