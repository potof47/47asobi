function resize() {

const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
  Space: 'jump', KeyJ: 'atk', KeyZ: 'atk', KeyK: 'spec', KeyX: 'spec', KeyU: 'smash', KeyV: 'smash', KeyL: 'shield', KeyC: 'shield', ShiftLeft: 'shield', ShiftRight: 'shield' };
const keysDown = new Set(), edge = {};
let touchMode = false;
const tp = new Map();
let stickO = null, stickV = { x: 0, y: 0 };
const TB = [
  { n: 'jump', x: 888, y: 335, r: 42, l: 'ジャンプ' }, { n: 'smash', x: 786, y: 370, r: 38, l: 'スマッシュ' },
  { n: 'atk', x: 884, y: 444, r: 46, l: 'こうげき' }, { n: 'spec', x: 782, y: 470, r: 38, l: 'ひっさつ' }, { n: 'shield', x: 690, y: 484, r: 32, l: 'ガード' }
];
function held(n) {
  for (const k of keysDown) if (KEYMAP[k] === n) return true;
  if (touchMode) {
    if (stickO) { if (n === 'left') return stickV.x < -.4; if (n === 'right') return stickV.x > .4; if (n === 'up') return stickV.y < -.5; if (n === 'down') return stickV.y > .5; }
    for (const v of tp.values()) if (v.kind === 'btn' && v.name === n) return true;
  }
  return false;
}
addEventListener('keydown', e => {
  unlockAudio();
  if (e.code in KEYMAP) { e.preventDefault(); if (!e.repeat) edge[KEYMAP[e.code]] = true; }
  keysDown.add(e.code);
  if (e.repeat) return;
  if (e.code === 'Escape' || e.code === 'KeyP') { if (scene === 'battle' && !G.demo && !G.over) G.paused = !G.paused; }
  if (e.code === 'Enter') { if (scene === 'title') goSelect(); else if (scene === 'select') startGame(); else if (scene === 'result') startGame(); }
});
addEventListener('keyup', e => keysDown.delete(e.code));
addEventListener('blur', () => { keysDown.clear(); tp.clear(); stickO = null; stickV = { x: 0, y: 0 }; });
const ui = [];
function toLogical(e) { return { x: (e.clientX - offX) / scale, y: (e.clientY - offY) / scale }; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); unlockAudio();
  const p = toLogical(e);
  if (e.pointerType === 'touch') touchMode = true;
  // メニュー・ボタン
  for (let i = ui.length - 1; i >= 0; i--) {
    const b = ui[i];
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { b.fn(); return; }
  }
  if (scene === 'battle' && !G.demo && !G.paused && e.pointerType === 'touch') {
    if (p.x < 440) { tp.set(e.pointerId, { kind: 'stick' }); stickO = { x: p.x, y: p.y }; stickV = { x: 0, y: 0 }; }
    else {
      let best = null, bd = 1e9;
      for (const b of TB) { const d = Math.hypot(p.x - b.x, p.y - b.y); if (d < b.r + 20 && d < bd) { best = b; bd = d; } }
      if (best) { tp.set(e.pointerId, { kind: 'btn', name: best.n }); edge[best.n] = true; }
    }
  }
}, { passive: false });
cv.addEventListener('pointermove', e => {
  const v = tp.get(e.pointerId);
  if (v && v.kind === 'stick') {
    const p = toLogical(e), dx = p.x - stickO.x, dy = p.y - stickO.y, R = 62;
    const d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / R);
    stickV = { x: dx / d * k * (k > .2 ? 1.25 : 0), y: dy / d * k * (k > .2 ? 1.25 : 0) };
    stickV.x = clamp(stickV.x, -1, 1); stickV.y = clamp(stickV.y, -1, 1);
    // 指がはなれすぎたら基準点を追いかける
    if (d > R * 1.6) { stickO.x += dx / d * (d - R * 1.6); stickO.y += dy / d * (d - R * 1.6); }
  }
});
function pUp(e) {
  const v = tp.get(e.pointerId);
  if (v && v.kind === 'stick') { stickO = null; stickV = { x: 0, y: 0 }; }
  tp.delete(e.pointerId);
}
cv.addEventListener('pointerup', pUp); cv.addEventListener('pointercancel', pUp);
cv.addEventListener('contextmenu', e => e.preventDefault());

let AC = null, muted = false, noiseBuf = null;
function unlockAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f0, f1, d, type = 'square', v = .07, delay = 0) {
  if (muted || !AC || (G && G.demo)) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), gn = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + d);
  gn.gain.setValueAtTime(v, t); gn.gain.exponentialRampToValueAtTime(.001, t + d);
  o.connect(gn).connect(AC.destination); o.start(t); o.stop(t + d + .02);
}
function noise(d, v = .1, fc = 2500) {
  if (muted || !AC || (G && G.demo)) return;
  if (!noiseBuf) { noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const a = noiseBuf.getChannelData(0); for (let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1; }
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), gn = AC.createGain(), t = AC.currentTime;
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = fc;
  gn.gain.setValueAtTime(v, t); gn.gain.exponentialRampToValueAtTime(.001, t + d);
  s.connect(f).connect(gn).connect(AC.destination); s.start(t); s.stop(t + d + .02);

      g.strokeStyle = '#999'; g.lineWidth = 3; g.beginPath(); g.moveTo(0, -14); g.quadraticCurveTo(6, -22, 10, -20); g.stroke(); g.fillStyle = '#ffd23f'; star(10, -20, 4);
      g.fillStyle = 'rgba(255,255,255,.35)'; circ(-5, -5, 4); g.fill();
    }
    g.restore();
  }
}
function drawProjs() {
  for (const p of G.projs) {
    g.save(); g.translate(p.x, p.y);
    const gr = g.createRadialGradient(0, 0, 1, 0, 0, p.r * 1.8); gr.addColorStop(0, '#fff'); gr.addColorStop(.4, p.col); gr.addColorStop(1, hexA(p.col, 0));
    g.fillStyle = gr; circ(0, 0, p.r * 1.8); g.fill();
    g.fillStyle = '#fff'; circ(0, 0, p.r * .55); g.fill();
    g.restore();
  }
}
function drawParticles() {
  for (const p of G.parts) {
    const k = p.life / p.max;
    if (p.k === 't') { g.globalAlpha = Math.min(1, k * 2); txt(p.text, p.x, p.y, p.sz, p.col, 'center', '#000', 4); g.globalAlpha = 1; continue; }
    g.globalAlpha = k;
    if (p.k === 'r') { g.strokeStyle = p.col; g.lineWidth = 4 * k + 1; circ(p.x, p.y, p.sz * (1 - k) + 6); g.stroke(); }
    else { g.fillStyle = p.col; circ(p.x, p.y, p.sz * (p.k === 's' ? k + .3 : 1)); g.fill(); }
    g.globalAlpha = 1;
  }
}

function drawWorld() {
  const cam = G.cam, shk = G.shake;
  drawBG(G.st, cam);
  g.save();
  g.translate(W / 2 + (shk ? rnd(-shk, shk) : 0), H * .6 + (shk ? rnd(-shk, shk) : 0)); g.scale(cam.z, cam.z); g.translate(-cam.x, -cam.y);
  drawStage(G.st); drawItems();
  for (const f of G.fs) drawHitboxes(f);
  drawProjs();
  for (const f of G.fs) drawFighter(f);
  drawParticles();
  g.restore();
}
function pctColor(p) { return p < 40 ? '#ffffff' : p < 90 ? '#ffe9a0' : p < 140 ? '#ffb347' : p < 200 ? '#ff6a3a' : '#d81818'; }
function drawHUD() {

      txt('%', x + 124 + ps.length * 8 + 14, y + 48, 14, pctColor(f.pct), 'left', '#000', 3);

}
function drawTouchUI() {

  const kx = o.x + stickV.x * 50, ky = o.y + stickV.y * 50; g.globalAlpha = stickO ? .85 : .35; g.fillStyle = '#cfe8ff'; circ(kx, ky, 26); g.fill();
  for (const b of TB) {

    g.fillStyle = on ? '#ffe36a' : '#ffffff'; circ(b.x, b.y, b.r); g.globalAlpha = on ? .6 : .2; g.fill(); g.globalAlpha = on ? .95 : .55; g.strokeStyle = '#fff'; g.lineWidth = 3; g.stroke();
    g.globalAlpha = .95; txt(b.l, b.x, b.y, b.r > 40 ? 15 : 12, '#fff', 'center', '#000', 3);
  }

}

function drawBattle() {
  drawWorld();
  if (!G.demo) {
    drawHUD();
    // 一時停止ボタン
    button(900, 14, 48, 40, 'Ⅱ', () => { if (!G.over) G.paused = true; }, { size: 20 });

      g.save(); g.globalAlpha = a;
      const by = 190, bh = 150, gr = g.createLinearGradient(0, by, W, by); gr.addColorStop(0, hexA(ct.col, .0)); gr.addColorStop(.2, hexA(ct.col, .85)); gr.addColorStop(.8, hexA(ct.col, .85)); gr.addColorStop(1, hexA(ct.col, 0));

}

// =====================================================================
//  メニュー
// =====================================================================
function goTitle() { scene = 'title'; newMatch({ demo: true, stage: (Math.random() * STAGES.length) | 0, stocks: 2, items: true, lv: 3 }); showHow = false; }
function goSelect() { scene = 'select'; }
function startGame() {
  unlockAudio(); bgmOn();
  newMatch({ p1: cfg.p1, stage: cfg.stage, cpus: cfg.cpus, lv: cfg.lv, stocks: cfg.stocks, items: cfg.items });
  scene = 'battle';
  for (const k in edge) delete edge[k]; tp.clear(); stickO = null; stickV = { x: 0, y: 0 };
}
let showHow = false;
function drawTitle() {
  drawWorld();
  g.fillStyle = 'rgba(6,10,36,.55)'; g.fillRect(0, 0, W, H);
  const t = performance.now() / 1000;
  g.save(); g.translate(W / 2, 128 + Math.sin(t * 2) * 4);
  txt('大乱闘', 0, -20, 104, '#ffe14a', 'center', '#b32d00', 16);
  txt('スマッシュファイターズ', 0, 62, 46, '#ffffff', 'center', '#1d3fa8', 10);
  g.restore();
  g.save(); g.translate(W / 2, 258); g.rotate(-.04); g.scale(1 + Math.sin(t * 4) * .03, 1 + Math.sin(t * 4) * .03);
  txt('SPECIAL', 0, 0, 52, '#ff4a6a', 'center', '#fff', 8); g.restore();
  button(W / 2 - 150, 318, 300, 66, 'ひとりで乱闘！', goSelect, { primary: 1, size: 28 });
  button(W / 2 - 150, 396, 300, 46, 'あそびかた', () => { showHow = true; });
  button(W / 2 - 150, 452, 300, 42, muted ? '♪ 音：OFF' : '♪ 音：ON', () => { muted = !muted; });
  txt('キャラ・絵・音はすべてオリジナル', W / 2, 516, 13, 'rgba(255,255,255,.6)');
  if (showHow) drawHow();
}
function drawHow() {
  ui.length = 0;
  g.fillStyle = 'rgba(0,0,10,.88)'; g.fillRect(0, 0, W, H);
  txt('あそびかた', W / 2, 44, 36, '#ffe14a', 'center', '#000', 6);
  const L = [
    ['ルール', 'ダメージ%をためて相手をふっとばし、画面の外に出したらKO。ストックが0になったら脱落、最後まで残った人の勝ち！'],
    ['キーボード', '移動：← → / A D　ジャンプ：Space（空中でもう1回）　こうげき：J / Z　スマッシュ：U / V　ひっさつ：K / X　ガード：L / C / Shift'],
    ['', '↑↓＋こうげき／ひっさつで技が変わる。ガード＋方向でよけ、空中ガードでエアダッジ。ポーズ：Esc'],
    ['タッチ', '左側をなぞって移動、右のボタンで ジャンプ・こうげき・スマッシュ・ひっさつ・ガード'],
    ['ふち', '足場のふちに近づくとつかまれる。ジャンプ・上入力・こうげきでよじのぼり、下で手を離す'],
    ['アイテム', 'トマト＝ダメージ回復　P＝パワーアップ　ボム＝こうげきで爆発　スマッシュボール＝3回当てると「ひっさつワザ」が使える！'],
    ['足場', '下を押すとうす板の足場をすり抜けられる。上必殺ワザは空中で1回だけ']
  ];
  let y = 98;
  for (const [h, b] of L) {
    if (h) txt(h, 50, y, 20, '#7fe0ff', 'left');
    wrapText(b, 170, y, 740, 18, 24, '#fff');
    y += 24 * Math.ceil(b.length / 38) + 18;
  }
  button(W / 2 - 100, 470, 200, 50, 'とじる', () => { showHow = false; }, { primary: 1 });
}
function wrapText(s, x, y, maxW, size, lh, col) {
  g.font = `bold ${size}px ${FONT}`; g.textAlign = 'left'; g.textBaseline = 'middle'; g.fillStyle = col;
  let line = '', yy = y;
  for (const ch of s) { if (g.measureText(line + ch).width > maxW) { g.fillText(line, x, yy); line = ch; yy += lh; } else line += ch; }
  g.fillText(line, x, yy);
}
function pips(x, y, n, col) { for (let i = 0; i < 5; i++) { g.fillStyle = i < n ? col : 'rgba(255,255,255,.18)'; rr(x + i * 13, y, 10, 7, 2); g.fill(); } }
function drawSelect() {
  const t = performance.now() / 1000;
  const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#1a2a6a'); gr.addColorStop(1, '#0a1030'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  g.fillStyle = 'rgba(255,255,255,.05)'; for (let i = 0; i < 10; i++) { const x = ((i * 130 + t * 20) % (W + 100)) - 50; g.beginPath(); g.moveTo(x, 0); g.lineTo(x + 60, 0); g.lineTo(x - 120, H); g.lineTo(x - 180, H); g.fill(); }
  txt('キャラクターをえらぼう', 30, 34, 26, '#fff', 'left', '#000', 5);
  CHARS.forEach((c, i) => {
    const x = 30 + (i % 3) * 184, y = 64 + ((i / 3) | 0) * 186, w = 174, h = 176, sel = cfg.p1 === i;
    ui.push({ x, y, w, h, fn: () => { cfg.p1 = i; sfx.select(); } });
    const gg = g.createLinearGradient(0, y, 0, y + h); gg.addColorStop(0, hexA(c.col, sel ? .75 : .38)); gg.addColorStop(1, 'rgba(10,14,40,.9)');
    g.fillStyle = gg; rr(x, y, w, h, 14); g.fill(); g.lineWidth = sel ? 5 : 2; g.strokeStyle = sel ? '#ffe14a' : '#5a68b8'; g.stroke();
    g.save(); g.translate(x + w / 2, y + 100); g.scale(1.45, 1.45); drawChar(c, { ph: t * 4 * (sel ? 1 : 0), moving: sel, atk: sel && ((t * 1.2) % 3 < .5) ? ((t * 1.2) % 3) / .5 : -1 }); g.restore();
    txt(c.name, x + w / 2, y + 112, 20, '#fff', 'center', '#000', 4);
    txt(c.sub, x + w / 2, y + 132, 12, 'rgba(255,255,255,.8)');
    // ステータス
    g.font = `bold 10px ${FONT}`; g.textAlign = 'left';
    const st3 = [['パワー', c.stat[0], '#ff7a5a'], ['スピード', c.stat[1], '#7fe08a'], ['おもさ', c.stat[2], '#7fb8ff']];
    st3.forEach((s, k) => { /* 3列を1行に */ });
    const bx = x + 8; g.fillStyle = '#fff'; g.fillText('力', bx, y + 152); pips(bx + 12, y + 148, c.stat[0], '#ff7a5a');
    g.fillStyle = '#fff'; g.fillText('速', bx + 84, y + 152); pips(bx + 96, y + 148, c.stat[1], '#7fe08a'); // 2列
    g.fillStyle = '#fff'; g.fillText('重', bx, y + 168); pips(bx + 12, y + 164, c.stat[2], '#7fb8ff');
    if (sel) txt('1P', x + 18, y + 14, 14, '#ff5a5a', 'center', '#fff', 4);
  });
  txt('ステージ', 30, 446, 18, '#7fe0ff', 'left');
  STAGES.forEach((s, i) => {
    const x = 30 + i * 184;
    button(x, 460, 174, 56, '', () => { cfg.stage = i; }, { sel: cfg.stage === i });
    txt(s.name, x + 87, 478, 16, '#fff'); txt(s.sub, x + 87, 500, 11, 'rgba(255,255,255,.75)');
  });
  // 右パネル
  g.fillStyle = 'rgba(8,12,34,.7)'; rr(600, 60, 332, 346, 14); g.fill(); g.strokeStyle = '#5a68b8'; g.lineWidth = 2; g.stroke();
  const rows = [
    ['CPUの数', [['1', 1], ['2', 2], ['3', 3]], 'cpus'], ['CPUのつよさ', [['よわい', 1], ['ふつう', 2], ['つよい', 3]], 'lv'],
    ['ストック', [['1', 1], ['2', 2], ['3', 3], ['5', 5]], 'stocks'], ['アイテム', [['あり', true], ['なし', false]], 'items']
  ];
  rows.forEach((r, i) => {
    const y = 72 + i * 82;
    txt(r[0], 620, y + 8, 17, '#ffe14a', 'left');
    const n = r[1].length, bw = Math.floor((292 - (n - 1) * 8) / n);
    r[1].forEach((o, k) => button(620 + k * (bw + 8), y + 26, bw, 38, o[0], () => { cfg[r[2]] = o[1]; }, { sel: cfg[r[2]] === o[1], size: 17 }));
  });
  button(600, 420, 332, 62, 'たたかう！', startGame, { primary: 1, size: 30 });
  button(600, 492, 120, 36, 'もどる', goTitle, { size: 15 });
}
function drawResult() {
  const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#2a1a6a'); gr.addColorStop(1, '#0a1030'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  const t = performance.now() / 1000;
  g.fillStyle = 'rgba(255,255,255,.06)'; for (let i = 0; i < 12; i++) { g.beginPath(); g.moveTo(W / 2, 200); const a = i * .5236 + t * .1; g.lineTo(W / 2 + Math.cos(a) * 900, 200 + Math.sin(a) * 900); g.lineTo(W / 2 + Math.cos(a + .13) * 900, 200 + Math.sin(a + .13) * 900); g.fill(); }
  const win = G.winner, mine = win && win.human;
  txt(mine ? 'YOU WIN!' : win && win.human === false && G.fs[0].out ? 'GAME OVER' : 'ゲーム終了', W / 2, 54, 58, mine ? '#ffe14a' : '#9fb4ff', 'center', '#000', 10);
  if (win) {
    g.save(); g.translate(150, 360); g.scale(3.4, 3.4); drawChar(win.c, { ph: 0, atk: -1 }); g.restore();
    txt(win.c.name + ' の勝ち！', 150, 400, 24, '#fff', 'center', '#000', 5);
  }
  const order = G.rank.slice().reverse();
  order.forEach((f, i) => {
    const y = 118 + i * 74, x = 340;
    g.fillStyle = i === 0 ? 'rgba(255,225,74,.28)' : 'rgba(255,255,255,.1)'; rr(x, y, 560, 64, 12); g.fill(); g.strokeStyle = i === 0 ? '#ffe14a' : '#5a68b8'; g.lineWidth = 2; g.stroke();
    txt((i + 1) + '位', x + 40, y + 32, 28, i === 0 ? '#ffe14a' : '#fff', 'center', '#000', 5);
    g.save(); g.translate(x + 100, y + 58); g.scale(.85, .85); drawChar(f.c, { ph: 0 }); g.restore();
    const tg = TAGS[f.id % 4];
    txt(tg.t, x + 150, y + 22, 14, tg.c, 'left', '#000', 3); txt(f.c.name, x + 150, y + 44, 20, '#fff', 'left');
    txt('撃墜 ' + f.kos, x + 400, y + 32, 22, '#fff', 'left');
  });
  button(340, 440, 180, 56, 'もう一度', startGame, { primary: 1, size: 22 });
  button(530, 440, 180, 56, 'キャラせんたく', goSelect, { size: 18 });
  button(720, 440, 180, 56, 'タイトル', goTitle, { size: 18 });
}

// =====================================================================
//  メインループ
// =====================================================================
let last = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  acc += Math.min(100, now - last); last = now;
  let steps = 0;
  while (acc >= 1000 / 60 && steps < 4) {
    acc -= 1000 / 60; steps++;
    if (scene === 'battle' || scene === 'title') stepBattle();
  }
  if (steps === 4) acc = 0;
  ui.length = 0;
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.fillStyle = '#000'; g.fillRect(0, 0, cv.width, cv.height);
  g.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * offX, dpr * offY);
  g.save(); g.beginPath(); g.rect(0, 0, W, H); g.clip();
  if (scene === 'title') drawTitle();
  else if (scene === 'select') drawSelect();
  else if (scene === 'battle') drawBattle();
  else if (scene === 'result') drawResult();
  g.restore();
}
goTitle();
requestAnimationFrame(frame);
window.__dbg = { get G() { return G; }, cfg, CHARS, startGame, stepBattle, setScene(s) { scene = s; }, get scene() { return scene; } };
</script>
