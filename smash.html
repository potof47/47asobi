<script>
'use strict';
// =====================================================================
//  大乱闘スマッシュファイターズ SPECIAL
//  ダメージ%をためて場外へふっとばす対戦アクション。
//  キャラ・絵・音・声はすべてコードで作ったオリジナル（画像・音声ファイルなし）
// =====================================================================
const W = 960, H = 540;
const cv = document.getElementById('c');
let g = cv.getContext('2d');
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const MAXF = 16; // プレイヤー枠の最大人数
const MAXNPC = 100; // 追加できるNPCの最大人数
const sgn = v => v > 0 ? 1 : v < 0 ? -1 : 0;
const lerp = (a, b, t) => a + (b - a) * t;
const pick = a => a[(Math.random() * a.length) | 0];
const TAU = Math.PI * 2;
const FONT = "'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',system-ui,sans-serif";

let scale = 1, offX = 0, offY = 0, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = innerWidth, h = innerHeight;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  scale = Math.min(w / W, h / H);
  offX = (w - W * scale) / 2; offY = (h - H * scale) / 2;
}
addEventListener('resize', resize); resize();

// ---------------------------------------------------------------------
//  入力（キーボード・タッチ・ゲームパッド）
// ---------------------------------------------------------------------
const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
  Space: 'jump', KeyJ: 'atk', KeyZ: 'atk', KeyK: 'spec', KeyX: 'spec', KeyU: 'smash', KeyV: 'smash',
  KeyL: 'shield', KeyC: 'shield', ShiftLeft: 'shield', ShiftRight: 'shield', KeyI: 'grab', KeyB: 'grab', KeyT: 'taunt'
};
// 2人で1つのキーボードを使うとき（左：1P／右：2P）
const DUO = [
  { KeyA: 'left', KeyD: 'right', KeyW: 'up', KeyS: 'down', Space: 'jump', KeyF: 'atk', KeyG: 'spec', KeyT: 'smash', KeyR: 'shield', KeyE: 'grab', KeyQ: 'taunt' },
  { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', KeyJ: 'jump', KeyK: 'atk', KeyL: 'spec', KeyO: 'smash', KeyI: 'shield', KeyU: 'grab', KeyP: 'taunt' }
];
let duo = false;
const keysDown = new Set(), edgeP = [{}, {}], edge = edgeP[0];
let touchMode = false;
const tp = new Map();
let stickO = null, stickV = { x: 0, y: 0 };
const TB = [
  { n: 'jump', x: 890, y: 334, r: 40, l: 'ジャンプ' }, { n: 'smash', x: 790, y: 370, r: 36, l: 'スマッシュ' },
  { n: 'atk', x: 884, y: 444, r: 46, l: 'こうげき' }, { n: 'spec', x: 784, y: 474, r: 38, l: 'ひっさつ' },
  { n: 'shield', x: 692, y: 490, r: 30, l: 'ガード' }, { n: 'grab', x: 694, y: 414, r: 28, l: 'つかみ' }
];
function held(n, pi = 0) {
  if (duo) { for (const k of keysDown) if (DUO[pi][k] === n) return true; }
  else if (pi === 0) for (const k of keysDown) if (KEYMAP[k] === n) return true;
  if (pi === 0 && touchMode) {
    if (stickO) { if (n === 'left') return stickV.x < -.4; if (n === 'right') return stickV.x > .4; if (n === 'up') return stickV.y < -.5; if (n === 'down') return stickV.y > .5; }
    for (const v of tp.values()) if (v.kind === 'btn' && v.name === n) return true;
  }
  if (gps[pi].held[n]) return true;
  return false;
}
addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  unlockAudio();
  if (typeof keyInput === 'function' && keyInput(e)) { e.preventDefault(); return; }
  const inBattle = scene === 'battle' && G && !G.demo;
  if (duo && inBattle) {
    for (let i = 0; i < 2; i++) { const n = DUO[i][e.code]; if (n) { e.preventDefault(); if (!e.repeat) { edgeP[i][n] = true; if (n === 'up' && cfg.tapJump) edgeP[i].tjump = true; } } }
  } else {
    if (e.code in KEYMAP || e.code === 'Space') e.preventDefault();
    if (e.code in KEYMAP && !e.repeat) {
      edge[KEYMAP[e.code]] = true;
      if ((e.code === 'ArrowUp' || e.code === 'KeyW') && cfg.tapJump) edge.tjump = true;
    }
  }
  keysDown.add(e.code);
  if (e.repeat) return;
  if (e.code === 'Escape' || (e.code === 'KeyP' && !duo)) togglePause();
  if (e.code === 'Enter') menuEnter();
});
addEventListener('keyup', e => keysDown.delete(e.code));
addEventListener('blur', () => { keysDown.clear(); tp.clear(); stickO = null; stickV = { x: 0, y: 0 }; });
const ui = [];
function toLogical(e) { return { x: (e.clientX - offX) / scale, y: (e.clientY - offY) / scale }; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); unlockAudio();
  const p = toLogical(e);
  if (e.pointerType === 'touch') touchMode = true;
  for (let i = ui.length - 1; i >= 0; i--) {
    const b = ui[i];
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { b.fn(); return; }
  }
  if (scene === 'battle' && G && !G.demo && !G.paused && e.pointerType === 'touch') {
    if (p.x < 440) { tp.set(e.pointerId, { kind: 'stick' }); stickO = { x: p.x, y: p.y }; stickV = { x: 0, y: 0 }; }
    else {
      let best = null, bd = 1e9;
      for (const b of TB) { const d = Math.hypot(p.x - b.x, p.y - b.y); if (d < b.r + 18 && d < bd) { best = b; bd = d; } }
      if (best) { tp.set(e.pointerId, { kind: 'btn', name: best.n }); edge[best.n] = true; }
    }
  }
}, { passive: false });
cv.addEventListener('pointermove', e => {
  const v = tp.get(e.pointerId);
  if (v && v.kind === 'stick') {
    const p = toLogical(e), dx = p.x - stickO.x, dy = p.y - stickO.y, R = 58;
    const d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / R);
    const old = stickV.y;
    stickV = { x: clamp(dx / d * k * (k > .2 ? 1.25 : 0), -1, 1), y: clamp(dy / d * k * (k > .2 ? 1.25 : 0), -1, 1) };
    // 上にはじいたらジャンプ（タップジャンプ）
    if (cfg.tapJump && old > -.6 && stickV.y <= -.6) edge.tjump = true;
    if (d > R * 1.6) { stickO.x += dx / d * (d - R * 1.6); stickO.y += dy / d * (d - R * 1.6); }
  }
});
function pUp(e) {
  const v = tp.get(e.pointerId);
  if (v && v.kind === 'stick') { stickO = null; stickV = { x: 0, y: 0 }; }
  tp.delete(e.pointerId);
}
cv.addEventListener('pointerup', pUp); cv.addEventListener('pointercancel', pUp);
cv.addEventListener('contextmenu', e => e.preventDefault());

// ゲームパッド（2台まで。1台目＝1P、2台目＝2P）
const mkPad = () => ({ held: {}, prev: {}, ax: 0, ay: 0, rx: 0, ry: 0, on: false, prevStart: false, rsPrev: false, smashDir: null });
const gps = [mkPad(), mkPad()], gp = gps[0];
const GPMAP = { 0: 'atk', 1: 'spec', 2: 'jump', 3: 'jump', 4: 'shield', 5: 'grab', 6: 'shield', 7: 'shield' };
function pollPad() {
  const pads = navigator.getGamepads ? [...navigator.getGamepads()].filter(x => x && x.connected) : [];
  for (let i = 0; i < 2; i++) {
    const q = gps[i], p = pads[i];
    q.held = {}; q.on = !!p;
    if (!p) continue;
    const E = edgeP[duo ? i : 0];
    for (const b in GPMAP) if (p.buttons[b] && p.buttons[b].pressed) q.held[GPMAP[b]] = true;
    q.ax = Math.abs(p.axes[0]) > .25 ? p.axes[0] : 0; q.ay = Math.abs(p.axes[1]) > .25 ? p.axes[1] : 0;
    if (p.buttons[14] && p.buttons[14].pressed) q.ax = -1; if (p.buttons[15] && p.buttons[15].pressed) q.ax = 1;
    if (p.buttons[12] && p.buttons[12].pressed) q.ay = -1; if (p.buttons[13] && p.buttons[13].pressed) q.ay = 1;
    q.rx = p.axes[2] || 0; q.ry = p.axes[3] || 0;
    if (duo || i === 0) {
      for (const n of ['atk', 'spec', 'jump', 'shield', 'grab']) { if (q.held[n] && !q.prev[n]) E[n] = true; }
      const rs = Math.hypot(q.rx, q.ry) > .7;
      if (rs && !q.rsPrev) { E.smash = true; q.smashDir = { x: Math.abs(q.rx) > .5 ? sgn(q.rx) : 0, y: Math.abs(q.ry) > .5 ? sgn(q.ry) : 0 }; }
      q.rsPrev = rs; q.held.smash = rs;
      const st = p.buttons[9] && p.buttons[9].pressed; if (st && !q.prevStart) { if (scene === 'battle') togglePause(); else menuEnter(); } q.prevStart = st;
    }
    q.prev = { ...q.held };
  }
}

// ---------------------------------------------------------------------
//  サウンド（その場で合成）・実況
// ---------------------------------------------------------------------
let AC = null, muted = false, noiseBuf = null, master = null;
function unlockAudio() {
  if (!AC) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = .8; master.connect(AC.destination); } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
function quiet() { return muted || !AC || (G && G.demo && scene === 'title'); }
function tone(f0, f1, d, type = 'square', v = .07, delay = 0, at = 0) {
  if (quiet()) return;
  const t = at || AC.currentTime + delay, o = AC.createOscillator(), gn = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + d);
  gn.gain.setValueAtTime(v, t); gn.gain.exponentialRampToValueAtTime(.001, t + d);
  o.connect(gn).connect(master); o.start(t); o.stop(t + d + .02);
}
function noise(d, v = .1, fc = 2500, delay = 0, type = 'lowpass', at = 0) {
  if (quiet()) return;
  if (!noiseBuf) { noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const a = noiseBuf.getChannelData(0); for (let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1; }
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), gn = AC.createGain(), t = at || AC.currentTime + delay;
  s.buffer = noiseBuf; f.type = type; f.frequency.value = fc;
  gn.gain.setValueAtTime(v, t); gn.gain.exponentialRampToValueAtTime(.001, t + d);
  s.connect(f).connect(gn).connect(master); s.start(t, Math.random() * .5); s.stop(t + d + .02);
}
const sfx = {
  hit(d, fx) {
    noise(.08, .1 + Math.min(.22, d * .012), 3200); tone(200, 60, .12, 'sawtooth', .08);
    if (fx === 'elec') { tone(1800, 300, .15, 'sawtooth', .04); noise(.12, .08, 6000, 0, 'highpass'); }
    if (fx === 'fire') noise(.25, .08, 900);
    if (fx === 'ice') { tone(2400, 1800, .12, 'triangle', .05); tone(3200, 2600, .1, 'triangle', .04, .04); }
    if (fx === 'slash') noise(.06, .1, 8000, 0, 'highpass');
    if (d > 13) { tone(100, 35, .35, 'square', .1); noise(.3, .18, 1100); }
  },
  swing(big) { noise(big ? .14 : .07, big ? .07 : .04, 5000, 0, 'highpass'); },
  jump() { tone(320, 660, .1, 'square', .035); },
  djump() { tone(440, 900, .12, 'triangle', .05); },
  land() { noise(.05, .04, 900); },
  shield() { tone(520, 380, .08, 'triangle', .06); },
  dodge() { noise(.1, .04, 6000, 0, 'highpass'); },
  item() { tone(660, 1320, .12, 'square', .05); tone(990, 1980, .15, 'square', .04, .07); },
  heal() { [523, 659, 784, 1046].forEach((f, i) => tone(f, f, .12, 'triangle', .06, i * .06)); },
  ko() { noise(.7, .22, 1000); tone(240, 40, .7, 'sawtooth', .12); tone(1400, 200, .4, 'square', .05); noise(1.2, .06, 3000, .25); },
  star() { [1568, 2093, 2637].forEach((f, i) => tone(f, f * 1.01, .2, 'triangle', .06, i * .08)); },
  screen() { noise(.3, .2, 600); tone(150, 60, .4, 'square', .1); },
  go() { tone(523, 523, .14, 'square', .07); tone(784, 784, .32, 'square', .07, .12); },
  beep() { tone(880, 880, .08, 'square', .05); },
  fs() { tone(200, 1600, .5, 'sawtooth', .08); noise(.5, .12, 4000); tone(100, 300, .8, 'square', .06, .2); },
  select() { tone(700, 900, .05, 'square', .035); },
  back() { tone(500, 350, .07, 'square', .035); },
  charge() { tone(300, 600, .06, 'triangle', .03); },
  grab() { noise(.05, .08, 2000); tone(300, 200, .06, 'square', .05); },
  throw_() { noise(.1, .08, 3000); tone(400, 150, .12, 'square', .05); },
  counter() { tone(1200, 1200, .05, 'square', .06); tone(1800, 1800, .15, 'square', .05, .05); noise(.1, .08, 7000, 0, 'highpass'); },
  reflect() { tone(1600, 2400, .1, 'triangle', .06); },
  boom() { noise(.6, .3, 700); tone(120, 30, .6, 'square', .14); },
  homerun() { tone(1800, 1700, .05, 'square', .08); noise(.06, .2, 9000, 0, 'highpass'); tone(90, 30, .6, 'square', .12); },
  crate() { noise(.15, .12, 1800); tone(300, 120, .12, 'square', .06); },
  alarm() { for (let i = 0; i < 3; i++) { tone(880, 660, .18, 'square', .05, i * .25); } },
  freeze() { tone(3000, 1200, .25, 'triangle', .05); },
  sleep() { tone(660, 440, .3, 'sine', .05); tone(440, 330, .3, 'sine', .05, .25); },
  ball() { tone(800, 1600, .08, 'square', .05); },
  cancel() { tone(900, 1500, .06, 'triangle', .05); }
};
// BGM（ステージごとに曲がかわる）
const BGMS = [
  { tempo: 150, ch: [[220, 261.6, 329.6], [174.6, 220, 261.6], [261.6, 329.6, 392], [196, 246.9, 293.7]], mel: [2, -1, 1, 0, 2, -1, 1, 2, 0, -1, 2, 1, 0, 1, -1, 2] },
  { tempo: 128, ch: [[146.8, 174.6, 220], [130.8, 164.8, 196], [116.5, 146.8, 174.6], [130.8, 164.8, 196]], mel: [0, -1, 2, -1, 1, 2, -1, 0, 2, -1, 1, -1, 0, 1, 2, -1] },
  { tempo: 138, ch: [[196, 246.9, 293.7], [164.8, 196, 246.9], [174.6, 220, 261.6], [196, 246.9, 293.7]], mel: [2, 1, 0, -1, 2, 1, 2, -1, 0, 1, 2, 1, 0, -1, 1, -1] },
  { tempo: 160, ch: [[164.8, 196, 246.9], [164.8, 196, 246.9], [146.8, 174.6, 220], [155.6, 196, 233.1]], mel: [0, 0, 2, -1, 0, 1, -1, 2, 0, 0, 2, -1, 1, 1, 2, -1] },
  { tempo: 120, ch: [[110, 130.8, 164.8], [116.5, 146.8, 174.6], [98, 123.5, 146.8], [103.8, 130.8, 155.6]], mel: [0, -1, -1, 2, 1, -1, 0, -1, 2, -1, 1, 0, -1, 2, 1, 0] },
  { tempo: 112, ch: [[261.6, 329.6, 392], [220, 261.6, 329.6], [174.6, 220, 261.6], [196, 246.9, 293.7]], mel: [2, -1, 1, -1, 0, -1, 1, -1, 2, -1, 1, -1, 2, 1, 0, -1] }
];
let bgmNo = -1, bgmNext = 0, bgmStep = 0;
function bgmTick() {
  if (!AC || muted || bgmNo < 0) return;
  if (scene === 'battle' && G && G.paused) { bgmNext = AC.currentTime + .05; return; }
  const B = BGMS[bgmNo], dt = 60 / B.tempo / 2;
  if (bgmNext < AC.currentTime) bgmNext = AC.currentTime + .05;
  while (bgmNext < AC.currentTime + .12) {
    const s = bgmStep++, ch = B.ch[(s >> 4) & 3], at = bgmNext;
    const m = B.mel[s & 15];
    if (m >= 0) tone(ch[m] * 2, ch[m] * 2 * .998, dt * 1.6, 'square', .018, 0, at);
    if ((s & 1) === 0) tone(ch[0] / 2, ch[0] / 2 * .99, dt * 1.8, 'triangle', .06, 0, at);
    if ((s & 3) === 1) tone(ch[(s >> 2) % 3], ch[(s >> 2) % 3], dt, 'square', .01, 0, at);
    if ((s & 7) === 0) tone(110, 40, .12, 'sine', .12, 0, at);
    if ((s & 7) === 4) noise(.08, .05, 2500, 0, 'lowpass', at);
    if (s & 1) noise(.03, .012, 8000, 0, 'highpass', at);
    bgmNext += dt;
  }
}
function setBgm(n) { if (bgmNo !== n) { bgmNo = n; bgmStep = 0; } }
// 実況（ブラウザの読み上げ）
function say(s) {
  if (muted || !('speechSynthesis' in window) || (G && G.demo && scene === 'title')) return;
  try {
    const u = new SpeechSynthesisUtterance(s); u.lang = 'ja-JP'; u.rate = 1.08; u.pitch = .55; u.volume = 1;
    const v = speechSynthesis.getVoices().find(v => /ja/i.test(v.lang)); if (v) u.voice = v;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) { }
}

// ---------------------------------------------------------------------
//  技の型（アーキタイプ）
// ---------------------------------------------------------------------
// t=全体F on/off=判定F dmg=ダメージ kb/ks=ふっとび(基本/%ぶん) ang=角度 hx,hy=判定中心(前/足もとから) w,h=大きさ
// k=動きの種類 fx=属性 rel=相手の位置で左右 back=後ろ charge=ため可 next=連続 rapid=連打 land=着地スキ

  jab2:   { t: 18, on: 3, off: 6, dmg: 3, kb: 2.5, ks: .04, ang: 40, hx: 28, hy: -30, w: 36, h: 22, k: 'punch2', next: 'jab3' },
  jab3:   { t: 28, on: 5, off: 9, dmg: 5, kb: 4, ks: .09, ang: 38, hx: 30, hy: -26, w: 46, h: 28, k: 'kick' },

  dtilt:  { t: 18, on: 5, off: 8, dmg: 6, kb: 3, ks: .07, ang: 75, hx: 34, hy: -8, w: 54, h: 18, k: 'sweep' },
  fsmash: { t: 46, on: 16, off: 20, dmg: 16, kb: 7, ks: .19, ang: 36, hx: 42, hy: -32, w: 66, h: 40, k: 'punch', charge: 1 },
  usmash: { t: 46, on: 13, off: 20, dmg: 15, kb: 6.5, ks: .18, ang: 88, rel: 1, hx: 0, hy: -74, w: 66, h: 60, k: 'uppercut', charge: 1 },
  dsmash: { t: 44, on: 11, off: 17, dmg: 14, kb: 6, ks: .17, ang: 28, rel: 1, hx: 0, hy: -12, w: 118, h: 26, k: 'split', charge: 1 },
  nair:   { t: 28, on: 4, off: 16, dmg: 8, kb: 3.8, ks: .09, ang: 45, rel: 1, hx: 0, hy: -28, w: 62, h: 56, land: 10, k: 'spin' },

  uair:   { t: 26, on: 5, off: 11, dmg: 8, kb: 4.5, ks: .11, ang: 85, rel: 1, hx: 0, hy: -66, w: 62, h: 48, land: 11, k: 'flip' },
  dair:   { t: 36, on: 11, off: 16, dmg: 10, kb: 4, ks: .10, ang: 270, rel: 1, hx: 0, hy: -2, w: 40, h: 40, land: 18, k: 'stomp' },
  grab:   { t: 30, on: 6, off: 9, grab: 1, hx: 28, hy: -30, w: 36, h: 32, k: 'grab' }
};
const ARCH = {
  brawl: {},

// 人数が多いときは足場全体にまんべんなく並べる
function spawnX(st, i, n) {
  if ((n <= st.spawn.length && !st.huge) || st.hrs) return st.spawn[i % st.spawn.length];
  const ps = st.plats.filter(p => p.t === 'solid' && !p.field && !p.wall), tot = ps.reduce((a, p) => a + (p.x2 - p.x1 - 60), 0);
  let d = (i + .5) / n * tot;
  for (const p of ps) { const w = p.x2 - p.x1 - 60; if (d <= w) return p.x1 + 30 + d; d -= w; }
  return 0;
}

function startGame() {

    const list = [{ ci: cfg.slots[0].c < 0 ? randChar([]) : cfg.slots[0].c, human: true, stocks: 99, alt: cfg.slots[0].alt }];
    list.push({ ci: cfg.slots[1].c < 0 ? randChar(list) : cfg.slots[1].c, lv: [0, 1, 3][cfg.trMode], stocks: 99, alt: cfg.slots[1].alt });
    newMatch({ list, stage, rule: 'stock', items: 0, training: true });
  } else {
    const list = [];
    cfg.slots.slice(0, cfg.n).forEach((s, i) => {
      if (i > 0 && s.type === 'off') return;
      const p2 = i > 0 && s.type === 'p2';
      list.push({ ci: s.c < 0 ? randChar(list) : s.c, human: i === 0 || p2, pi: p2 ? 1 : 0, lv: cfg.lv, stocks: cfg.rule === 'stock' ? cfg.stocks : 99, team: cfg.team ? s.team % cfg.team : i, alt: s.alt || 0 });

    newMatch({ list, stage, rule: cfg.rule, time: cfg.time, items: cfg.items, team: cfg.team, special: cfg.special });

function recordMatch() {

function keyInput(e) {

  if (/^Digit\d$|^Numpad\d$/.test(e.code)) { if (NET.code.length < 4) NET.code += e.code.slice(-1); return true; }

  return false;
}
