<script>
'use strict';
// =====================================================================
//  大乱闘スマッシュファイターズ SPECIAL
//  ダメージ%をためて場外へふっとばす対戦アクション。
//  キャラ・絵・音・声はすべてコードで作ったオリジナル（画像・音声ファイルなし）
// =====================================================================
const W = 960, H = 540;
const cv = document.getElementById('c'), g = cv.getContext('2d');
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const sgn = v => v > 0 ? 1 : v < 0 ? -1 : 0;
const lerp = (a, b, t) => a + (b - a) * t;
const pick = a => a[(Math.random() * a.length) | 0];
const TAU = Math.PI * 2;
const FONT = "'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',system-ui,sans-serif";

let scale = 1, offX = 0, offY = 0, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = innerWidth, h = innerHeight;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  scale = Math.min(w / W, h / H);
  offX = (w - W * scale) / 2; offY = (h - H * scale) / 2;
}
addEventListener('resize', resize); resize();

// ---------------------------------------------------------------------
//  入力（キーボード・タッチ・ゲームパッド）
// ---------------------------------------------------------------------
const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
  Space: 'jump', KeyJ: 'atk', KeyZ: 'atk', KeyK: 'spec', KeyX: 'spec', KeyU: 'smash', KeyV: 'smash',
  KeyL: 'shield', KeyC: 'shield', ShiftLeft: 'shield', ShiftRight: 'shield', KeyI: 'grab', KeyB: 'grab', KeyT: 'taunt'
};
const keysDown = new Set(), edge = {};
let touchMode = false;
const tp = new Map();
let stickO = null, stickV = { x: 0, y: 0 };
const TB = [
  { n: 'jump', x: 890, y: 334, r: 40, l: 'ジャンプ' }, { n: 'smash', x: 790, y: 370, r: 36, l: 'スマッシュ' },
  { n: 'atk', x: 884, y: 444, r: 46, l: 'こうげき' }, { n: 'spec', x: 784, y: 474, r: 38, l: 'ひっさつ' },
  { n: 'shield', x: 692, y: 490, r: 30, l: 'ガード' }, { n: 'grab', x: 694, y: 414, r: 28, l: 'つかみ' }
];
function held(n) {
  for (const k of keysDown) if (KEYMAP[k] === n) return true;
  if (touchMode) {
    if (stickO) { if (n === 'left') return stickV.x < -.4; if (n === 'right') return stickV.x > .4; if (n === 'up') return stickV.y < -.5; if (n === 'down') return stickV.y > .5; }
    for (const v of tp.values()) if (v.kind === 'btn' && v.name === n) return true;
  }
  if (gp.held[n]) return true;
  return false;
}
addEventListener('keydown', e => {
  unlockAudio();
  if (e.code in KEYMAP || e.code === 'Space') e.preventDefault();
  if (e.code in KEYMAP && !e.repeat) {
    edge[KEYMAP[e.code]] = true;
    if ((e.code === 'ArrowUp' || e.code === 'KeyW') && cfg.tapJump) edge.tjump = true;
  }
  keysDown.add(e.code);
  if (e.repeat) return;
  if (e.code === 'Escape' || e.code === 'KeyP') togglePause();
  if (e.code === 'Enter') menuEnter();
});
addEventListener('keyup', e => keysDown.delete(e.code));
addEventListener('blur', () => { keysDown.clear(); tp.clear(); stickO = null; stickV = { x: 0, y: 0 }; });
const ui = [];
function toLogical(e) { return { x: (e.clientX - offX) / scale, y: (e.clientY - offY) / scale }; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); unlockAudio();
  const p = toLogical(e);
  if (e.pointerType === 'touch') touchMode = true;
  for (let i = ui.length - 1; i >= 0; i--) {
    const b = ui[i];
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { b.fn(); return; }
  }
  if (scene === 'battle' && G && !G.demo && !G.paused && e.pointerType === 'touch') {
    if (p.x < 440) { tp.set(e.pointerId, { kind: 'stick' }); stickO = { x: p.x, y: p.y }; stickV = { x: 0, y: 0 }; }
    else {
      let best = null, bd = 1e9;
      for (const b of TB) { const d = Math.hypot(p.x - b.x, p.y - b.y); if (d < b.r + 18 && d < bd) { best = b; bd = d; } }
      if (best) { tp.set(e.pointerId, { kind: 'btn', name: best.n }); edge[best.n] = true; }
    }
  }
}, { passive: false });
cv.addEventListener('pointermove', e => {
  const v = tp.get(e.pointerId);
  if (v && v.kind === 'stick') {
    const p = toLogical(e), dx = p.x - stickO.x, dy = p.y - stickO.y, R = 58;
    const d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / R);
    const old = stickV.y;
    stickV = { x: clamp(dx / d * k * (k > .2 ? 1.25 : 0), -1, 1), y: clamp(dy / d * k * (k > .2 ? 1.25 : 0), -1, 1) };
    // 上にはじいたらジャンプ（タップジャンプ）
    if (cfg.tapJump && old > -.6 && stickV.y <= -.6) edge.tjump = true;
    if (d > R * 1.6) { stickO.x += dx / d * (d - R * 1.6); stickO.y += dy / d * (d - R * 1.6); }
  }
});
function pUp(e) {
  const v = tp.get(e.pointerId);
  if (v && v.kind === 'stick') { stickO = null; stickV = { x: 0, y: 0 }; }
  tp.delete(e.pointerId);
}
cv.addEventListener('pointerup', pUp); cv.addEventListener('pointercancel', pUp);
cv.addEventListener('contextmenu', e => e.preventDefault());

// ゲームパッド
const gp = { held: {}, prev: {}, ax: 0, ay: 0, rx: 0, ry: 0, on: false, prevStart: false, rsPrev: false };
const GPMAP = { 0: 'atk', 1: 'spec', 2: 'jump', 3: 'jump', 4: 'shield', 5: 'grab', 6: 'shield', 7: 'shield' };
function pollPad() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  const p = pads && [...pads].find(x => x && x.connected);
  gp.held = {}; gp.on = !!p;
  if (!p) return;
  for (const i in GPMAP) if (p.buttons[i] && p.buttons[i].pressed) gp.held[GPMAP[i]] = true;
  gp.ax = Math.abs(p.axes[0]) > .25 ? p.axes[0] : 0; gp.ay = Math.abs(p.axes[1]) > .25 ? p.axes[1] : 0;
  if (p.buttons[14] && p.buttons[14].pressed) gp.ax = -1; if (p.buttons[15] && p.buttons[15].pressed) gp.ax = 1;
  if (p.buttons[12] && p.buttons[12].pressed) gp.ay = -1; if (p.buttons[13] && p.buttons[13].pressed) gp.ay = 1;
  gp.rx = p.axes[2] || 0; gp.ry = p.axes[3] || 0;
  for (const n of ['atk', 'spec', 'jump', 'shield', 'grab']) { if (gp.held[n] && !gp.prev[n]) edge[n] = true; }
  const rs = Math.hypot(gp.rx, gp.ry) > .7;
  if (rs && !gp.rsPrev) { edge.smash = true; gp.smashDir = { x: Math.abs(gp.rx) > .5 ? sgn(gp.rx) : 0, y: Math.abs(gp.ry) > .5 ? sgn(gp.ry) : 0 }; }
  gp.rsPrev = rs; gp.held.smash = rs;
  const st = p.buttons[9] && p.buttons[9].pressed; if (st && !gp.prevStart) { if (scene === 'battle') togglePause(); else menuEnter(); } gp.prevStart = st;
  gp.prev = { ...gp.held };
}

// ---------------------------------------------------------------------
//  サウンド（その場で合成）・実況
// ---------------------------------------------------------------------
let AC = null, muted = false, noiseBuf = null, master = null;
function unlockAudio() {
  if (!AC) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = .8; master.connect(AC.destination); } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
function quiet() { return muted || !AC || (G && G.demo && scene === 'title'); }
function tone(f0, f1, d, type = 'square', v = .07, delay = 0, at = 0) {
  if (quiet()) return;
  const t = at || AC.currentTime + delay, o = AC.createOscillator(), gn = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + d);
  gn.gain.setValueAtTime(v, t); gn.gain.exponentialRampToValueAtTime(.001, t + d);
  o.connect(gn).connect(master); o.start(t); o.stop(t + d + .02);
}
function noise(d, v = .1, fc = 2500, delay = 0, type = 'lowpass', at = 0) {
  if (quiet()) return;
  if (!noiseBuf) { noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const a = noiseBuf.getChannelData(0); for (let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1; }
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), gn = AC.createGain(), t = at || AC.currentTime + delay;
  s.buffer = noiseBuf; f.type = type; f.frequency.value = fc;
  gn.gain.setValueAtTime(v, t); gn.gain.exponentialRampToValueAtTime(.001, t + d);
  s.connect(f).connect(gn).connect(master); s.start(t, Math.random() * .5); s.stop(t + d + .02);
}
const sfx = {
  hit(d, fx) {
    noise(.08, .1 + Math.min(.22, d * .012), 3200); tone(200, 60, .12, 'sawtooth', .08);
    if (fx === 'elec') { tone(1800, 300, .15, 'sawtooth', .04); noise(.12, .08, 6000, 0, 'highpass'); }
    if (fx === 'fire') noise(.25, .08, 900);
    if (fx === 'ice') { tone(2400, 1800, .12, 'triangle', .05); tone(3200, 2600, .1, 'triangle', .04, .04); }
    if (fx === 'slash') noise(.06, .1, 8000, 0, 'highpass');
    if (d > 13) { tone(100, 35, .35, 'square', .1); noise(.3, .18, 1100); }
  },
  swing(big) { noise(big ? .14 : .07, big ? .07 : .04, 5000, 0, 'highpass'); },
  jump() { tone(320, 660, .1, 'square', .035); },
  djump() { tone(440, 900, .12, 'triangle', .05); },
  land() { noise(.05, .04, 900); },
  shield() { tone(520, 380, .08, 'triangle', .06); },
  dodge() { noise(.1, .04, 6000, 0, 'highpass'); },
  item() { tone(660, 1320, .12, 'square', .05); tone(990, 1980, .15, 'square', .04, .07); },
  heal() { [523, 659, 784, 1046].forEach((f, i) => tone(f, f, .12, 'triangle', .06, i * .06)); },
  ko() { noise(.7, .22, 1000); tone(240, 40, .7, 'sawtooth', .12); tone(1400, 200, .4, 'square', .05); noise(1.2, .06, 3000, .25); },
  star() { [1568, 2093, 2637].forEach((f, i) => tone(f, f * 1.01, .2, 'triangle', .06, i * .08)); },
  screen() { noise(.3, .2, 600); tone(150, 60, .4, 'square', .1); },
  go() { tone(523, 523, .14, 'square', .07); tone(784, 784, .32, 'square', .07, .12); },
  beep() { tone(880, 880, .08, 'square', .05); },
  fs() { tone(200, 1600, .5, 'sawtooth', .08); noise(.5, .12, 4000); tone(100, 300, .8, 'square', .06, .2); },
  select() { tone(700, 900, .05, 'square', .035); },
  back() { tone(500, 350, .07, 'square', .035); },
  charge() { tone(300, 600, .06, 'triangle', .03); },
  grab() { noise(.05, .08, 2000); tone(300, 200, .06, 'square', .05); },
  throw_() { noise(.1, .08, 3000); tone(400, 150, .12, 'square', .05); },
  counter() { tone(1200, 1200, .05, 'square', .06); tone(1800, 1800, .15, 'square', .05, .05); noise(.1, .08, 7000, 0, 'highpass'); },
  reflect() { tone(1600, 2400, .1, 'triangle', .06); },
  boom() { noise(.6, .3, 700); tone(120, 30, .6, 'square', .14); },
  homerun() { tone(1800, 1700, .05, 'square', .08); noise(.06, .2, 9000, 0, 'highpass'); tone(90, 30, .6, 'square', .12); },
  crate() { noise(.15, .12, 1800); tone(300, 120, .12, 'square', .06); },
  alarm() { for (let i = 0; i < 3; i++) { tone(880, 660, .18, 'square', .05, i * .25); } },
  freeze() { tone(3000, 1200, .25, 'triangle', .05); },
  sleep() { tone(660, 440, .3, 'sine', .05); tone(440, 330, .3, 'sine', .05, .25); },
  ball() { tone(800, 1600, .08, 'square', .05); }
};
// BGM（ステージごとに曲がかわる）
const BGMS = [
  { tempo: 150, ch: [[220, 261.6, 329.6], [174.6, 220, 261.6], [261.6, 329.6, 392], [196, 246.9, 293.7]], mel: [2, -1, 1, 0, 2, -1, 1, 2, 0, -1, 2, 1, 0, 1, -1, 2] },
  { tempo: 128, ch: [[146.8, 174.6, 220], [130.8, 164.8, 196], [116.5, 146.8, 174.6], [130.8, 164.8, 196]], mel: [0, -1, 2, -1, 1, 2, -1, 0, 2, -1, 1, -1, 0, 1, 2, -1] },
  { tempo: 138, ch: [[196, 246.9, 293.7], [164.8, 196, 246.9], [174.6, 220, 261.6], [196, 246.9, 293.7]], mel: [2, 1, 0, -1, 2, 1, 2, -1, 0, 1, 2, 1, 0, -1, 1, -1] },
  { tempo: 160, ch: [[164.8, 196, 246.9], [164.8, 196, 246.9], [146.8, 174.6, 220], [155.6, 196, 233.1]], mel: [0, 0, 2, -1, 0, 1, -1, 2, 0, 0, 2, -1, 1, 1, 2, -1] },
  { tempo: 120, ch: [[110, 130.8, 164.8], [116.5, 146.8, 174.6], [98, 123.5, 146.8], [103.8, 130.8, 155.6]], mel: [0, -1, -1, 2, 1, -1, 0, -1, 2, -1, 1, 0, -1, 2, 1, 0] },
  { tempo: 112, ch: [[261.6, 329.6, 392], [220, 261.6, 329.6], [174.6, 220, 261.6], [196, 246.9, 293.7]], mel: [2, -1, 1, -1, 0, -1, 1, -1, 2, -1, 1, -1, 2, 1, 0, -1] }
];
let bgmNo = -1, bgmNext = 0, bgmStep = 0;
function bgmTick() {
  if (!AC || muted || bgmNo < 0) return;
  if (scene === 'battle' && G && G.paused) { bgmNext = AC.currentTime + .05; return; }
  const B = BGMS[bgmNo], dt = 60 / B.tempo / 2;
  if (bgmNext < AC.currentTime) bgmNext = AC.currentTime + .05;
  while (bgmNext < AC.currentTime + .12) {
    const s = bgmStep++, ch = B.ch[(s >> 4) & 3], at = bgmNext;
    const m = B.mel[s & 15];
    if (m >= 0) tone(ch[m] * 2, ch[m] * 2 * .998, dt * 1.6, 'square', .018, 0, at);
    if ((s & 1) === 0) tone(ch[0] / 2, ch[0] / 2 * .99, dt * 1.8, 'triangle', .06, 0, at);
    if ((s & 3) === 1) tone(ch[(s >> 2) % 3], ch[(s >> 2) % 3], dt, 'square', .01, 0, at);
    if ((s & 7) === 0) tone(110, 40, .12, 'sine', .12, 0, at);
    if ((s & 7) === 4) noise(.08, .05, 2500, 0, 'lowpass', at);
    if (s & 1) noise(.03, .012, 8000, 0, 'highpass', at);
    bgmNext += dt;
  }
}
function setBgm(n) { if (bgmNo !== n) { bgmNo = n; bgmStep = 0; } }
// 実況（ブラウザの読み上げ）
function say(s) {
  if (muted || !('speechSynthesis' in window) || (G && G.demo && scene === 'title')) return;
  try {
    const u = new SpeechSynthesisUtterance(s); u.lang = 'ja-JP'; u.rate = 1.08; u.pitch = .55; u.volume = 1;
    const v = speechSynthesis.getVoices().find(v => /ja/i.test(v.lang)); if (v) u.voice = v;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) { }
}

function buildMoves(c) {
  const T = ARCH[c.arch] || {};
  const m = {};
  for (const k in B0) m[k] = { ...B0[k], ...(T[k] || {}) };
  for (const k in T) if (!m[k]) m[k] = { ...T[k] };
  for (const k in (c.m || {})) m[k] = { ...(m[k] || {}), ...c.m[k] };
  m.nsp = { ...c.sp.n, sp: 1 }; m.ssp = { ...c.sp.s, sp: 1 }; m.usp = { ...c.sp.u, sp: 1 }; m.dsp = { ...c.sp.d, sp: 1 };
  m.fs = buildFS(c);
  m.counterHit = { t: 32, on: 4, off: 10, dmg: 9, kb: 7, ks: .18, ang: 40, hx: 32, hy: -30, w: 76, h: 56, k: c.arch === 'sword' ? 'slash' : 'kick', vis: 'counter' };
  m.throwF = { t: 22, k: 'throwF' }; m.throwB = { t: 24, k: 'throwB' }; m.throwU = { t: 24, k: 'throwU' }; m.throwD = { t: 24, k: 'throwD' };
  m.taunt = { t: 70, k: 'taunt' };
  for (const k in m) finishMove(m[k], k, c);
  return m;
}
function finishMove(v, key, c) {
  v.key = key;
  if (!v.fx) v.fx = c.fx;
  if (!v.k) v.k = 'punch';
  if (v.on === undefined) v.on = 999; if (v.off === undefined) v.off = v.on + 1;
  if (v.ex) v.ex = v.ex.map(e => ({ rel: v.rel, back: v.back, fx: v.fx, freeze: v.freeze, vis: v.vis, sweep: v.sweep, ...e }));
  v.hbs = (v.w ? [v] : []).concat(v.ex || []);
  for (const h of v.hbs) { if (h.on === undefined) h.on = v.on; if (h.off === undefined) h.off = v.off; }
}
function buildFS(c) {
  const fs = c.fs, fx = fs.fx || c.fx;
  const base = { name: fs.name, fs: 1, nog: 1, t: 116, on: 36, off: 84, k: 'cast', fx, fsType: fs.type, heal: fs.heal, dark: fs.dark, vis: fs.vis, freeze: fs.freeze };
  const fin = { on: 86, off: 90, dmg: 14, kb: 13, ks: .24, ang: 45 };
  const w = fs.w, h = fs.h, hy = fs.hy;
  switch (fs.type) {
    case 'beam': { const ww = w || 820, hh = h || 140, yy = hy || -60;
      return { ...base, k: 'beam', vis: 'fsbeam', multi: 5, dmg: 3, kb: 1, ks: 0, ang: 70, hx: ww / 2 + 30, hy: yy, w: ww, h: hh, ex: [{ ...fin, ang: 38, hx: ww / 2 + 30, hy: yy, w: ww, h: hh + 40 }] }; }
    case 'aura': { const ww = w || 460, hh = h || 280, yy = hy || -70;
      return { ...base, k: 'castUp', vis: 'fsaura', multi: 5, dmg: 3, kb: 1.2, ks: 0, ang: 90, rel: 1, hx: 0, hy: yy, w: ww, h: hh, ex: [{ ...fin, rel: 1, ang: 60, hx: 0, hy: yy, w: ww + 60, h: hh + 40 }] }; }
    case 'quake':
      return { ...base, k: 'stomp', vis: fs.vis || 'fsquake', multi: 7, dmg: 3.5, kb: 1, ks: 0, ang: 80, rel: 1, hx: 0, hy: -40, w: 1000, h: 100, ex: [{ ...fin, rel: 1, ang: 60, hx: 0, hy: -100, w: 1050, h: 300 }] };
    case 'rush':
      return { ...base, k: 'dash', vis: 'fsrush', dvx: 13, multi: 4, dmg: 2.6, kb: 1.4, ks: 0, ang: 60, hx: 30, hy: -40, w: 130, h: 120, ex: [{ ...fin, ang: 42, hx: 0, hy: -50, w: 260, h: 200, rel: 1 }] };
    case 'meteor':
      return { ...base, k: 'castUp', vis: 'fsmeteor', meteor: { shape: fs.shape || 'meteor', fx } };
    case 'stampede':
      return { ...base, k: 'cast', vis: 'fsstampede', shape: fs.shape, sweep: 900, multi: 7, dmg: 4, kb: 4.5, ks: .07, ang: 55, hx: 0, hy: -70, w: 220, h: 220 };

  }
}

  const stage = cfg.stage < 0 ? (Math.random() * STAGES.length) | 0 : cfg.stage;
  if (cfg.mode === 'training') {
    const list = [{ ci: cfg.slots[0].c < 0 ? randChar([]) : cfg.slots[0].c, human: true, stocks: 99 }];
    list.push({ ci: cfg.slots[1].c < 0 ? randChar(list) : cfg.slots[1].c, lv: [0, 1, 3][cfg.trMode], stocks: 99 });
    newMatch({ list, stage, rule: 'stock', items: 0, training: true });
  } else {
    const list = [];
    cfg.slots.forEach((s, i) => { if (i > 0 && !s.on) return; list.push({ ci: s.c < 0 ? randChar(list) : s.c, human: i === 0, lv: cfg.lv, stocks: cfg.rule === 'stock' ? cfg.stocks : 99 }); });
    newMatch({ list, stage, rule: cfg.rule, time: cfg.time, items: cfg.items });
  }
  scene = 'battle'; resetTouch(); saveCfg();
}
function resetTouch() { clearEdges(); tp.clear(); stickO = null; stickV = { x: 0, y: 0 }; }
function afterMatch() {
  if (G.toSudden) {
    const o = G.o, list = G.toSudden.map(f => ({ ci: f.ci, human: f.human, lv: f.lv, stocks: 1, pct: 300 }));
    newMatch({ ...o, list, rule: 'stock', items: 0, sudden: true }); say('サドンデス！'); return;
  }
  if (G.classic) {
    const win = G.winner && G.winner.human;
    if (win) { CL.round++; if (CL.round >= CL_PLAN.length) { scene = 'classicClear'; say('コングラチュレーション！'); } else { prepRound(); scene = 'classicIntro'; } }
    else scene = 'classicLose';
    return;
  }
  scene = 'result';
  if (G.result && G.result[0]) say('勝者、' + G.result[0].c.name + '！');
}

// =====================================================================
//  勝ちぬき
// =====================================================================
const CL_PLAN = [
  { foes: 1, lv: 1, title: 'ウォーミングアップ' }, { foes: 2, lv: 2, title: '2対1でバトル！' }, { foes: 1, lv: 3, title: 'つよいライバル' },
  { foes: 3, lv: 2, title: '大乱闘！' }, { foes: 1, lv: 3, metal: 1, title: 'メタルファイター' }, { foes: 1, lv: 4, boss: 2.1, stage: 1, title: 'ラスボス：ギガファイター' }
];
let CL = null;
function startClassic() { const ci = cfg.slots[0].c < 0 ? randChar([]) : cfg.slots[0].c; CL = { ci, round: 0, foes: [], stage: 0 }; prepRound(); scene = 'classicIntro'; setBgm(5); }
function prepRound() {
  const pl = CL_PLAN[CL.round], used = [{ ci: CL.ci }];
  CL.foes = [];
  for (let i = 0; i < pl.foes; i++) { const ci = randChar(used); used.push({ ci }); CL.foes.push(ci); }
  CL.stage = pl.stage !== undefined ? pl.stage : (Math.random() * STAGES.length) | 0;
}
function startRound() {
  const pl = CL_PLAN[CL.round];
  newMatch({ list: [{ ci: CL.ci, human: true, stocks: 2 }].concat(CL.foes.map(ci => ({ ci, lv: pl.lv, stocks: pl.boss ? 2 : 1, metal: pl.metal, boss: pl.boss }))), stage: CL.stage, rule: 'stock', items: pl.boss ? 0 : 1, classic: true });
  scene = 'battle'; resetTouch();
}
function drawClassicIntro() {
  menuBG('#3a1a5a', '#0a0a20');
  const pl = CL_PLAN[CL.round], t = performance.now() / 16;
  txt('勝ちぬき  ROUND ' + (CL.round + 1) + ' / ' + CL_PLAN.length, W / 2, 50, 30, '#ffe14a', 'center', '#000', 6);
  txt(pl.title, W / 2, 92, 22, '#fff', 'center', '#000', 5);
  for (let i = 0; i < CL_PLAN.length; i++) { circ(W / 2 - 100 + i * 40, 128, 12); fs_(i < CL.round ? '#ffe14a' : i === CL.round ? '#ff6a6a' : '#3a3a5a', 2); if (i === CL_PLAN.length - 1) txt('★', W / 2 - 100 + i * 40, 128, 12, '#fff'); }
  const me = CHARS[CL.ci];
  g.save(); g.translate(200, 400); g.scale(2.8, 2.8); drawChar(me, portraitPose(t, 0)); g.restore();
  txt(me.name, 200, 432, 24, '#fff', 'center', '#000', 5);
  txt('VS', W / 2, 300, 80, '#ff4a6a', 'center', '#fff', 8);
  CL.foes.forEach((ci, i) => {
    const c = CHARS[ci], n = CL.foes.length, x = 640 + (i - (n - 1) / 2) * 140 + 80, sc = pl.boss ? 3.1 : n > 1 ? 1.8 : 2.6;
    g.save(); g.translate(x, 400); g.scale(-sc, sc); if (pl.metal) g.filter = 'grayscale(1) brightness(1.3)'; drawChar(c, portraitPose(t, i + 1)); g.filter = 'none'; g.restore();
    txt((pl.metal ? 'メタル' : pl.boss ? 'ギガ' : '') + c.name, x, 432, 18, '#fff', 'center', '#000', 4);
  });
  txt('ステージ：' + STAGES[CL.stage].name, W / 2, 462, 15, 'rgba(255,255,255,.8)');
  button(W / 2 - 150, 478, 190, 50, 'たたかう！', startRound, { primary: 1, size: 22 });
  button(W / 2 + 50, 482, 110, 42, 'やめる', goTitle, { size: 16, back: 1 });
}
function drawClassicEnd(clear) {
  menuBG(clear ? '#5a3a10' : '#3a0a1a', '#0a0a20');
  const t = performance.now() / 16, me = CHARS[CL.ci];
  if (clear) for (let i = 0; i < 40; i++) { g.fillStyle = `hsl(${i * 37 % 360},90%,60%)`; const x = (i * 97 + t * (1 + i % 3)) % W, y = (i * 53 + t * (2 + i % 4)) % H; g.save(); g.translate(x, y); g.rotate(t * .05 + i); g.fillRect(-4, -2, 8, 4); g.restore(); }
  txt(clear ? 'CONGRATULATIONS!' : 'まけちゃった…', W / 2, 70, clear ? 52 : 44, clear ? '#ffe14a' : '#ff8aa0', 'center', '#000', 8);
  if (clear) txt('勝ちぬき 全' + CL_PLAN.length + 'ラウンド クリア！', W / 2, 124, 24, '#fff', 'center', '#000', 5);
  else txt('ROUND ' + (CL.round + 1) + ' でやられた', W / 2, 124, 22, '#fff', 'center', '#000', 5);
  g.save(); g.translate(W / 2, 400); g.scale(3.6, 3.6); drawChar(me, clear ? attackPose('taunt', (t * .01) % 1, idlePose(t)) : { ...idlePose(t), eyes: 'x', sq: .9, lean: .3 }); g.restore();
  if (clear) { button(W / 2 - 160, 460, 320, 54, 'タイトルへ', goTitle, { primary: 1 }); }
  else { button(W / 2 - 230, 460, 220, 54, 'つづける', () => { prepRound(); scene = 'classicIntro'; }, { primary: 1 }); button(W / 2 + 10, 460, 220, 54, 'あきらめる', goTitle, { back: 1 }); }
}

// =====================================================================
//  結果
// =====================================================================
function drawResult() {
  const t = performance.now() / 16, res = G.result || G.fs, win = res[0];
  menuBG(win ? shade(win.c.col, -.55) : '#2a1a6a', '#0a1030');
  g.fillStyle = 'rgba(255,255,255,.06)'; for (let i = 0; i < 12; i++) { g.beginPath(); g.moveTo(170, 260); const a = i * .5236 + t * .003; g.lineTo(170 + Math.cos(a) * 900, 260 + Math.sin(a) * 900); g.lineTo(170 + Math.cos(a + .13) * 900, 260 + Math.sin(a + .13) * 900); g.fill(); }
  for (let i = 0; i < 30; i++) { g.fillStyle = `hsl(${i * 47 % 360},90%,60%)`; const x = (i * 97 + t * (1 + i % 3)) % W, y = (i * 53 + t * (1.5 + i % 4)) % H; g.save(); g.translate(x, y); g.rotate(t * .05 + i); g.fillRect(-4, -2, 8, 4); g.restore(); }
  const mine = win && win.human;
  txt(mine ? 'YOU WIN!' : (win ? win.c.name + ' の勝ち！' : 'ゲーム終了'), W / 2, 46, mine ? 54 : 42, mine ? '#ffe14a' : '#ffffff', 'center', '#000', 9);
  if (win) {
    g.save(); g.translate(170, 400); g.scale(3.4, 3.4); drawChar(win.c, attackPose('taunt', (t * .012) % 1, idlePose(t))); g.restore();
    g.save(); g.translate(170, 452); txt('“' + win.c.quote + '”', 0, 0, 15, '#fff', 'center', '#000', 4); g.restore();
  }
  res.forEach((f, i) => {
    const y = 96 + i * 78, x = 340;
    g.fillStyle = i === 0 ? 'rgba(255,225,74,.28)' : 'rgba(255,255,255,.1)'; rr(x, y, 590, 68, 12); g.fill(); g.strokeStyle = i === 0 ? '#ffe14a' : '#5a68b8'; g.lineWidth = 2; g.stroke();
    txt((i + 1) + '位', x + 38, y + 34, 26, i === 0 ? '#ffe14a' : '#fff', 'center', '#000', 5);
    g.save(); g.beginPath(); rr(x + 70, y + 4, 60, 60, 8); g.clip(); g.translate(x + 100, y + 70); drawChar(f.c, idlePose(t)); g.restore();
    const tg = TAGS[f.id % 4];
    txt(f.human ? '1P' : 'CPU', x + 142, y + 20, 13, tg.c, 'left', '#000', 3); txt(f.c.name, x + 142, y + 46, 20, '#fff', 'left', '#000', 3);
    txt('撃墜 ' + f.kos, x + 300, y + 22, 16, '#fff', 'left'); txt('落下 ' + f.falls, x + 300, y + 46, 16, '#ccd', 'left');
    txt('与ダメ ' + Math.round(f.dmgDone) + '%', x + 420, y + 22, 15, '#ffd2a0', 'left');
    if (G.rule === 'time') txt('スコア ' + (f.score > 0 ? '+' : '') + f.score, x + 420, y + 46, 15, '#7dff9a', 'left');
  });
  button(340, 444 + Math.max(0, 4 - res.length) * 0, 190, 54, 'もう一度', startGame, { primary: 1, size: 22 });
  button(540, 444, 190, 54, 'キャラせんたく', () => goSelect('vs'), { size: 18 });
  button(740, 444, 190, 54, 'タイトル', goTitle, { size: 18, back: 1 });
}

// =====================================================================
//  メインループ
// =====================================================================
function menuEnter() {
  if (scene === 'title') { if (showHow) showHow = false; else goSelect('vs'); }
  else if (scene === 'select') { if (cfg.showRules) cfg.showRules = false; else selectNext(); }
  else if (scene === 'stage') startGame();
  else if (scene === 'result') startGame();
  else if (scene === 'classicIntro') startRound();
  else if (scene === 'classicLose') { prepRound(); scene = 'classicIntro'; }
  else if (scene === 'classicClear') goTitle();
}
let last = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  pollPad(); bgmTick();
  acc += Math.min(100, now - last); last = now;
  let steps = 0;
  while (acc >= 1000 / 60 && steps < 4) {
    acc -= 1000 / 60; steps++;
    if (scene === 'battle' || scene === 'title') stepBattle();
  }
  if (steps === 4) acc = 0;
  if (scene !== 'battle' && scene !== 'title') clearEdges();
  ui.length = 0;
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.fillStyle = '#000'; g.fillRect(0, 0, cv.width, cv.height);
  g.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * offX, dpr * offY);
  g.save(); g.beginPath(); g.rect(0, 0, W, H); g.clip();
  try {
    if (scene === 'title') drawTitle();
    else if (scene === 'select') drawSelect();
    else if (scene === 'stage') drawStageSelect();
    else if (scene === 'battle') drawBattle();
    else if (scene === 'result') drawResult();
    else if (scene === 'classicIntro') drawClassicIntro();
    else if (scene === 'classicClear') drawClassicEnd(true);
    else if (scene === 'classicLose') drawClassicEnd(false);
  } catch (e) { console.error(e); }
  g.restore();
  if (innerHeight > innerWidth * 1.15 && offY > 40) {
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.font = `bold ${Math.round(Math.min(18, innerWidth / 22))}px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#ffe14a';
    g.fillText('📱 よこ向きにすると大きく遊べるよ', innerWidth / 2, offY / 2);
  }
}
goTitle();
requestAnimationFrame(frame);
window.__dbg = { get G() { return G; }, cfg, CHARS, STAGES, startGame, stepBattle, startDemo, newMatch, spawnItem, setScene(s) { scene = s; }, get scene() { return scene; }, get CL() { return CL; }, startClassic, afterMatch };
</script>
